<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Latín UNTREF</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#e8e7dd; --surface:#f6f5ef; --surface-raised:#ffffff; --ink:#1e211d; --ink-muted:#5b5f56;
    --rule:#c9c4b3; --accent:#3c6e72; --accent-strong:#294b4e; --accent-ink:#f6f5ef;
    --bg-oblig:#dfe9d8; --text-oblig:#33502a;
    --bg-opt:#eceae0; --text-opt:#5b5f56;
    --shadow: 0 1px 2px rgba(30,33,29,.06), 0 6px 16px rgba(30,33,29,.06);
    --radius-card: 12px; --radius-chip: 999px;
    --serif: 'Literata', 'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,'Times New Roman',serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181a; --surface:#1d2224; --surface-raised:#242a2c; --ink:#e7e4d9; --ink-muted:#9ca39b;
      --rule:#333a38; --accent:#6fb3ac; --accent-strong:#8fc9c2; --accent-ink:#0f1516;
      --bg-oblig:#22331d; --text-oblig:#a8caa0;
      --bg-opt:#282e2a; --text-opt:#9ca39b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--serif);
    line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  @media (max-width: 820px){
    body::before{
      content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:url('img/fondo-indice.jpg') center top / cover no-repeat;
      opacity:.5;
    }
  }
  .page{ max-width:560px; margin:0 auto; padding:1.25rem 1rem 4rem; }

  .tools{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:.6rem; margin-bottom:1.5rem; }
  .tool-btn{
    display:flex; align-items:center; justify-content:center; text-align:center;
    background:var(--surface-raised); border:1px solid var(--rule); border-radius:var(--radius-card);
    color:var(--ink); text-decoration:none; font-size:.92rem; font-weight:500;
    padding:.85rem .5rem; min-height:44px; box-shadow:var(--shadow);
    font-family:inherit; cursor:pointer;
  }
  .tool-btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .tool-btn--2l{ line-height:1.35; }

  .progreso-panel{
    background:var(--surface-raised); border:1px solid var(--rule); border-radius:var(--radius-card);
    padding:1.1rem 1.2rem; box-shadow:var(--shadow); margin-bottom:1.5rem;
  }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:.85rem; }
  .panel-head .block-label{ margin:0; }
  .close-panel{
    font-family:inherit; cursor:pointer; font-size:.8rem; font-weight:700; text-decoration:none;
    padding:.4rem .85rem; border-radius:999px; border:none; flex:none;
    background:#c1611f; color:#fff8f0; box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .close-panel:hover{ background:#a8531a; }
  @media (prefers-color-scheme: dark){
    .close-panel{ background:#e2914f; color:#1c1006; }
    .close-panel:hover{ background:#eda765; }
  }
  :root[data-theme="dark"] .close-panel{ background:#e2914f; color:#1c1006; }
  :root[data-theme="light"] .close-panel{ background:#c1611f; color:#fff8f0; }
  .progreso-form{ display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.85rem; }
  .progreso-form input{
    flex:1 1 200px; font-family:var(--serif); font-size:.95rem; padding:.6rem .75rem;
    border-radius:8px; border:1px solid var(--rule); background:var(--bg); color:var(--ink);
  }
  .progreso-form button{
    font-family:inherit; cursor:pointer; border:none; border-radius:8px; padding:.6rem 1.1rem;
    font-size:.92rem; font-weight:600; background:var(--accent); color:var(--accent-ink);
  }
  .progreso-form button:hover{ background:var(--accent-strong); }
  .progreso-form button:disabled{ opacity:.5; cursor:not-allowed; }
  .progreso-form textarea{
    flex:1 1 100%; font-family:var(--serif); font-size:.95rem; padding:.6rem .75rem;
    border-radius:8px; border:1px solid var(--rule); background:var(--bg); color:var(--ink);
    resize:vertical; min-height:4.5rem;
  }
  .progreso-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.4rem; }
  .progreso-item{
    display:flex; align-items:center; gap:.6rem; font-size:.94rem; padding:.5rem .65rem;
    border-radius:8px; background:var(--bg-opt);
  }
  .progreso-item.ok{ background:var(--bg-oblig); }
  .progreso-check{
    flex:none; width:1.4rem; height:1.4rem; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:.85rem; font-weight:700;
    background:var(--surface-raised); color:var(--ink-muted);
  }
  .progreso-item.ok .progreso-check{ background:var(--accent); color:var(--accent-ink); }
  .progreso-summary{ margin:.75rem 0 0; font-size:.9rem; color:var(--ink-muted); }

  .week-card{
    background:var(--surface-raised); border:2px solid var(--accent); border-radius:var(--radius-card);
    padding:1.1rem 1.2rem; box-shadow:var(--shadow); margin-bottom:1.5rem;
  }
  .week-card__head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
  .week-card__title{ font-size:1.1rem; font-weight:600; margin:0; }
  .week-badge{
    background:var(--accent); color:var(--accent-ink); font-size:.78rem; font-weight:500;
    padding:.25rem .7rem; border-radius:var(--radius-chip);
  }

  .block{ margin-bottom:1rem; }
  .block-label{
    font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-muted); margin:0 0 .5rem;
  }
  .reading-link{
    display:flex; align-items:baseline; gap:.5rem; text-decoration:none; color:var(--ink);
    font-size:.96rem; padding:.35rem 0;
  }
  .reading-link:hover{ color:var(--accent-strong); }
  .reading-tag{
    flex:none; font-size:.68rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--accent-strong); background:var(--bg-opt); padding:.15rem .5rem; border-radius:var(--radius-chip);
  }

  .frases-btn{
    display:flex; align-items:center; justify-content:center; gap:.5rem;
    background:var(--accent); color:var(--accent-ink); text-decoration:none;
    font-size:.98rem; font-weight:600; padding:.75rem; border-radius:var(--radius-card);
    margin-bottom:1rem; min-height:44px;
  }
  .frases-btn:hover{ background:var(--accent-strong); }

  .frases-analizadas-btn{
    display:flex; align-items:center; justify-content:center; gap:.5rem;
    background:#c1611f; color:#fff8f0; text-decoration:none;
    font-size:.98rem; font-weight:600; padding:.75rem; border-radius:var(--radius-card);
    margin-bottom:1rem; min-height:44px;
  }
  .frases-analizadas-btn:hover{ background:#a8531a; }
  @media (prefers-color-scheme: dark){
    .frases-analizadas-btn{ background:#e2914f; color:#1c1006; }
    .frases-analizadas-btn:hover{ background:#eda765; }
  }
  :root[data-theme="dark"] .frases-analizadas-btn{ background:#e2914f; color:#1c1006; }
  :root[data-theme="light"] .frases-analizadas-btn{ background:#c1611f; color:#fff8f0; }

  .clase-en-vivo-btn{
    display:flex; align-items:center; justify-content:center; gap:.5rem;
    background:#8a3a3a; color:#fdf3f1; text-decoration:none;
    font-size:.98rem; font-weight:600; padding:.75rem; border-radius:var(--radius-card);
    margin-bottom:1rem; min-height:44px;
  }
  .clase-en-vivo-btn:hover{ background:#733030; }
  @media (prefers-color-scheme: dark){
    .clase-en-vivo-btn{ background:#d98f8f; color:#241010; }
    .clase-en-vivo-btn:hover{ background:#e3a5a5; }
  }
  :root[data-theme="dark"] .clase-en-vivo-btn{ background:#d98f8f; color:#241010; }
  :root[data-theme="light"] .clase-en-vivo-btn{ background:#8a3a3a; color:#fdf3f1; }

  .activity-list{ display:flex; flex-direction:column; gap:.5rem; }
  .activity-row{
    display:flex; align-items:center; justify-content:space-between; gap:.75rem;
    background:var(--surface); text-decoration:none; color:var(--ink);
    font-size:.94rem; padding:.7rem .85rem; border-radius:var(--radius-card); min-height:44px;
  }
  .activity-row:hover{ color:var(--accent-strong); }
  .badge{
    flex:none; font-size:.72rem; font-weight:600; padding:.2rem .6rem; border-radius:var(--radius-chip);
    white-space:nowrap;
  }
  .badge-oblig{ background:var(--bg-oblig); color:var(--text-oblig); }
  .badge-opt{ background:var(--bg-opt); color:var(--text-opt); }

  .archive{ margin-top:1.5rem; }
  .archive-label{
    font-size:.8rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-muted); margin:0 0 .75rem;
  }
  .archive-empty{ color:var(--ink-muted); font-size:.9rem; }
  details.archive-week{
    background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius-card);
    padding:.75rem 1rem; margin-bottom:.6rem;
  }
  details.archive-week > summary{
    cursor:pointer; font-weight:600; font-size:.98rem; list-style:none;
  }
  details.archive-week > summary::-webkit-details-marker{ display:none; }
  details.archive-week[open] > summary{ margin-bottom:.75rem; }

  .status-msg{ color:var(--ink-muted); font-size:.95rem; padding:1rem 0; }
  .status-msg--error{ color:#a3402f; }

  /* Imagen interactiva: segunda vía opcional de reencuentro con el vocabulario de la semana */
  .img-interactiva__trigger{
    display:block; width:100%; padding:0; margin:0; border:2px solid var(--accent); border-radius:var(--radius-card);
    background:none; cursor:pointer; overflow:hidden; box-shadow:var(--shadow);
  }
  .img-interactiva__trigger:hover{ border-color:var(--accent-strong); }
  .img-interactiva__img{ display:block; width:100%; height:150px; object-fit:cover; }
  .img-interactiva.open .img-interactiva__trigger{ border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .img-interactiva.open .img-interactiva__img{ height:auto; object-fit:contain; background:var(--surface); }
  .img-interactiva__body{
    margin-top:-1px; background:var(--surface); border:2px solid var(--accent); border-top:none;
    border-radius:0 0 var(--radius-card) var(--radius-card); padding:1rem 1.1rem;
  }
  .img-interactiva__credito{ margin:0 0 .7rem; font-size:.8rem; color:var(--ink-muted); font-style:italic; }
  .img-interactiva__body .ii-text{ font-family:var(--serif); font-size:1.05rem; line-height:2; }
  .img-interactiva__body .rtoken{
    font-family:inherit; font-size:inherit; color:inherit; background:none;
    border:1.5px solid transparent; border-radius:6px; padding:.05rem .3rem; cursor:pointer;
    text-decoration:underline dotted var(--rule); text-underline-offset:3px;
  }
  .img-interactiva__body .rtoken:hover{ border-color:var(--accent); }
  .img-interactiva__body .rtoken.open{ border-color:var(--accent); background:var(--accent); color:var(--accent-ink); text-decoration:none; }
  .img-interactiva__body .gloss-panel{
    margin-top:.7rem; padding:.7rem .9rem; background:var(--surface-raised); border:1px solid var(--rule);
    border-radius:8px; font-size:.92rem; display:flex; flex-wrap:wrap; gap:.4rem; align-items:baseline;
  }
  .img-interactiva__body .gloss-panel .gp-word{ font-family:var(--serif); font-style:italic; }
  .img-interactiva__body .gloss-panel .gp-arrow{ color:var(--ink-muted); }
  .img-interactiva__body .gloss-panel .gp-mean{ font-weight:600; }
</style>
</head>

<script>
var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTyxn94gNJMIyOeKRxBf4ffSWBCq-BQUQ8ozFmad2-JjyrUpZF1Ggtburcehiw3SbLwowBXcU1_ffrN/pub?gid=0&single=true&output=csv";

function escapeHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function parseCSV(text){
  var rows = [], row = [], field = "", inQuotes = false;
  for (var i = 0; i < text.length; i++){
    var c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\r'){ /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.length > 1 || r[0] !== ""; });
}

function rowsToRecords(rows){
  if (!rows.length) return [];
  var headers = rows[0].map(function(h){ return h.trim(); });
  return rows.slice(1)
    .filter(function(r){ return r.some(function(c){ return c.trim() !== ""; }); })
    .map(function(r){
      var rec = {};
      headers.forEach(function(h, i){ rec[h] = (r[i] || "").trim(); });
      return rec;
    });
}

// ---------- Imagen interactiva ----------
// Banco de imágenes de la semana: se elige UNA al azar en cada carga de página. Sin corrección,
// sin envío a Sheets — es solo una vía opcional de reencuentro con el vocabulario. Cada palabra
// de "frase" es tocable y muestra su traducción en "gloss" (clave = palabra en minúscula sin
// puntuación). Al sumar una semana nueva, agregar acá las imágenes de esa semana (y sacar las
// anteriores si ya no corresponden).
var IMAGENES_INTERACTIVAS = [
  {
    img: "img/imagen-interactiva/dido-eneas-encuentro.jpg",
    alt: "Nathaniel Dance-Holland, El encuentro de Dido y Eneas (1766)",
    credito: "N. Dance-Holland (1766) — El encuentro de Dido y Eneas",
    frase: ["Dido", "convivium", "parat", "et", "Troianos", "ad", "mensam", "invitat."],
    gloss: {
      dido: "Dido: reina de Cartago",
      convivium: "convivium,-i: banquete",
      parat: "paro: preparar",
      et: "y",
      troianos: "Troianus,-a,-um: troyano (aquí: a los troyanos)",
      ad: "a, hacia",
      mensam: "mensa,-ae: mesa",
      invitat: "invito: invitar"
    }
  },
  {
    img: "img/imagen-interactiva/dido-eneas-banquete.jpg",
    alt: "François de Troy, El banquete de Dido y Eneas, con Cupido disfrazado de Ascanio (1704)",
    credito: "F. de Troy (1704) — El banquete de Dido y Eneas, con Cupido disfrazado de Ascanio",
    frase: ["Cupido", "interea", "formam", "Ascanii", "sumit;", "Dido", "hoc", "nescit."],
    gloss: {
      cupido: "Cupido,-inis: dios del amor, hijo de Venus",
      interea: "mientras tanto",
      formam: "forma,-ae: forma, apariencia",
      ascanii: "Ascanius,-i: Ascanio, hijo de Eneas (genitivo)",
      sumit: "sumo: tomar, adoptar",
      dido: "Dido: reina de Cartago",
      hoc: "esto",
      nescit: "nescio: no saber"
    }
  },
  {
    img: "img/imagen-interactiva/quos-ego-neptuno.jpg",
    alt: "Giovanni Antonio da Brescia (según Marcantonio Raimondi y Rafael), Quos ego – Neptuno calma la tempestad (s. XVI)",
    credito: "G.A. da Brescia (s. XVI, según Raimondi/Rafael) — Quos ego: Neptuno calma la tempestad",
    frase: ["Neptunus", "ventos", "videt;", "iratus", "statim", "undas", "placat."],
    gloss: {
      neptunus: "Neptuno: dios del mar",
      ventos: "ventus,-i: viento",
      videt: "video: ver",
      iratus: "iratus,-a,-um: enojado",
      statim: "inmediatamente",
      undas: "unda,-ae: ola",
      placat: "placo: calmar, aplacar"
    }
  }
];
var iiPick = IMAGENES_INTERACTIVAS.length
  ? IMAGENES_INTERACTIVAS[Math.floor(Math.random() * IMAGENES_INTERACTIVAS.length)]
  : null;

function renderIIText(pick, host){
  var p = document.createElement("p");
  p.className = "ii-text";
  var panel = document.createElement("div");
  panel.className = "gloss-panel";
  panel.style.display = "none";
  pick.frase.forEach(function(word){
    var key = word.toLowerCase().replace(/[.,;:!?"“”]/g, "");
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "rtoken";
    btn.textContent = word + " ";
    btn.addEventListener("click", function(){
      Array.from(host.querySelectorAll(".rtoken")).forEach(function(s){ s.classList.remove("open"); });
      btn.classList.add("open");
      panel.style.display = "flex";
      var mean = pick.gloss[key] || "—";
      panel.innerHTML = '<span class="gp-word">' + escapeHtml(word.replace(/[.,;:!?"“”]/g, "")) +
        '</span><span class="gp-arrow">→</span><span class="gp-mean">' + escapeHtml(mean) + '</span>';
    });
    p.appendChild(btn);
  });
  host.appendChild(p);
  host.appendChild(panel);
}

function wireImagenInteractiva(pick){
  var toggle = document.getElementById("ii-toggle");
  var wrap = document.getElementById("ii-wrap");
  var body = document.getElementById("ii-body");
  var textHost = document.getElementById("ii-text");
  if (!toggle) return;
  var rendered = false;
  toggle.addEventListener("click", function(){
    var open = wrap.classList.toggle("open");
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    body.hidden = !open;
    if (open && !rendered){
      renderIIText(pick, textHost);
      rendered = true;
    }
  });
}

function groupBySemana(records){
  var map = {};
  records.forEach(function(rec){
    var s = rec["Semana"];
    if (!map[s]) map[s] = [];
    map[s].push(rec);
  });
  return map;
}

function renderWeekBody(items, isActual){
  var lecturas = items.filter(function(i){ return i.Tipo === "Lectura fuente" || i.Tipo === "Lectura bibliográfica"; });
  var frases = items.filter(function(i){ return i.Tipo === "Frases"; });
  var actividades = items.filter(function(i){ return i.Tipo === "Actividad"; });

  var html = "";

  if (lecturas.length){
    html += '<div class="block"><p class="block-label">Lecturas</p>';
    lecturas.forEach(function(l){
      var tag = l.Tipo === "Lectura fuente" ? "Fuente" : "Bibliografía";
      html += '<a class="reading-link" href="' + escapeHtml(l.Link) + '" target="_blank" rel="noopener">' +
        '<span class="reading-tag">' + tag + '</span><span>' + escapeHtml(l["Título"]) + '</span></a>';
    });
    html += '</div>';
  }

  frases.forEach(function(f){
    html += '<a class="frases-btn" href="' + escapeHtml(f.Link) + '" target="_blank" rel="noopener">' +
      escapeHtml(f["Título"] || "Frases de la semana") + '</a>';
  });

  if (actividades.length){
    html += '<div class="block"><p class="block-label">Actividades interactivas</p><div class="activity-list">';
    actividades.forEach(function(a){
      var estado = (a.Estado || "").trim();
      var esOblig = estado.toLowerCase() === "obligatoria";
      html += '<a class="activity-row" href="' + escapeHtml(a.Link) + '" target="_blank" rel="noopener">' +
        '<span>' + escapeHtml(a["Título"]) + '</span>' +
        '<span class="badge ' + (esOblig ? "badge-oblig" : "badge-opt") + '">' + escapeHtml(estado || "—") + '</span></a>';
    });
    if (isActual && iiPick){
      html += '<div class="img-interactiva" id="ii-wrap">' +
        '<button type="button" class="img-interactiva__trigger" id="ii-toggle" aria-expanded="false">' +
          '<img class="img-interactiva__img" src="' + escapeHtml(iiPick.img) + '" alt="' + escapeHtml(iiPick.alt) + '" loading="lazy" />' +
        '</button>' +
        '<div class="img-interactiva__body" id="ii-body" hidden>' +
          '<p class="img-interactiva__credito">' + escapeHtml(iiPick.credito) + '</p>' +
          '<div id="ii-text"></div>' +
        '</div>' +
      '</div>';
    }
    html += '</div></div>';
  }

  return html;
}

fetch(CSV_URL)
  .then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  })
  .then(function(text){
    var records = rowsToRecords(parseCSV(text));
    var bySemana = groupBySemana(records);
    var semanas = Object.keys(bySemana).sort(function(a, b){ return Number(b) - Number(a); });

    var actualEl = document.getElementById("semana-actual");
    var archivoEl = document.getElementById("archivo-lista");

    var semanaActual = semanas.filter(function(s){
      return bySemana[s].some(function(r){ return (r["Semana actual"] || "").trim().toUpperCase() === "SI"; });
    })[0];

    if (!semanaActual){
      actualEl.innerHTML = '<p class="status-msg">Todavía no hay una semana marcada como actual.</p>';
    } else {
      actualEl.innerHTML =
        '<div class="week-card__head"><p class="week-card__title">Esta semana</p>' +
        '<span class="week-badge">Semana ' + escapeHtml(semanaActual) + '</span></div>' +
        renderWeekBody(bySemana[semanaActual], true);
      if (iiPick) wireImagenInteractiva(iiPick);
    }

    var anteriores = semanas.filter(function(s){ return s !== semanaActual; });
    if (!anteriores.length){
      archivoEl.innerHTML = '<p class="archive-empty">Todavía no hay semanas anteriores.</p>';
    } else {
      archivoEl.innerHTML = anteriores.map(function(s){
        return '<details class="archive-week"><summary>Semana ' + escapeHtml(s) + '</summary>' +
          renderWeekBody(bySemana[s], false) + '</details>';
      }).join("");
    }
  })
  .catch(function(err){
    document.getElementById("semana-actual").innerHTML =
      '<p class="status-msg status-msg--error">No se pudo cargar el contenido de la semana. Probá recargar la página.</p>';
    document.getElementById("archivo-lista").innerHTML = "";
  });

var btnProgreso = document.getElementById("btn-progreso");
var progresoPanel = document.getElementById("progreso-panel");
var progresoEmail = document.getElementById("progreso-email");
var progresoResultado = document.getElementById("progreso-resultado");

btnProgreso.addEventListener("click", function(){
  progresoPanel.hidden = !progresoPanel.hidden;
  if (!progresoPanel.hidden) progresoEmail.focus();
});
document.getElementById("btn-cerrar-progreso").addEventListener("click", function(){
  progresoPanel.hidden = true;
});

function consultarProgreso(){
  var email = progresoEmail.value.trim();
  if (!email || email.indexOf("@") < 1){
    progresoResultado.innerHTML = '<p class="status-msg status-msg--error">Ingresá un email válido.</p>';
    return;
  }
  progresoResultado.innerHTML = '<p class="status-msg">Consultando…</p>';
  fetch(PROGRESO_URL + "?email=" + encodeURIComponent(email))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!data.ok){
        progresoResultado.innerHTML = '<p class="status-msg status-msg--error">No se pudo consultar. Probá de nuevo.</p>';
        return;
      }
      var hechas = data.actividades || [];
      var html = '<ul class="progreso-list">';
      ACTIVIDADES_PROGRESO.forEach(function(act){
        var ok = hechas.indexOf(act.valor) > -1;
        html += '<li class="progreso-item' + (ok ? " ok" : "") + '">' +
          '<span class="progreso-check">' + (ok ? "✓" : "—") + '</span>' +
          '<span>' + escapeHtml(act.texto) + '</span></li>';
      });
      html += '</ul><p class="progreso-summary">' + hechas.length + ' de ' + ACTIVIDADES_PROGRESO.length + ' actividades hechas.</p>';
      progresoResultado.innerHTML = html;
    })
    .catch(function(){
      progresoResultado.innerHTML = '<p class="status-msg status-msg--error">No se pudo consultar (revisá tu conexión).</p>';
    });
}

document.getElementById("progreso-consultar").addEventListener("click", consultarProgreso);
progresoEmail.addEventListener("keydown", function(ev){ if (ev.key === "Enter") consultarProgreso(); });

// ---------- Preguntas/Propuestas ----------
// Envía por POST al mismo Apps Script que usan las actividades — cae en la hoja "Preguntas y
// sugerencias espontáneas" (no en Feedback, para no mezclar consultas espontáneas con la
// evaluación de cada actividad puntual).
var btnConsulta = document.getElementById("btn-consulta");
var consultaPanel = document.getElementById("consulta-panel");
var consultaEmail = document.getElementById("consulta-email");
var consultaTexto = document.getElementById("consulta-texto");
var consultaEnviar = document.getElementById("consulta-enviar");
var consultaResultado = document.getElementById("consulta-resultado");
var consultaSendInFlight = false;

btnConsulta.addEventListener("click", function(){
  consultaPanel.hidden = !consultaPanel.hidden;
  if (!consultaPanel.hidden) consultaEmail.focus();
});
document.getElementById("btn-cerrar-consulta").addEventListener("click", function(){
  consultaPanel.hidden = true;
});

function checkConsultaListo(){
  var emailOk = consultaEmail.value.trim().indexOf("@") > 0;
  var textoOk = consultaTexto.value.trim().length > 0;
  consultaEnviar.disabled = !(emailOk && textoOk);
}
consultaEmail.addEventListener("input", checkConsultaListo);
consultaTexto.addEventListener("input", checkConsultaListo);

consultaEnviar.addEventListener("click", function(){
  if (consultaSendInFlight) return;
  var email = consultaEmail.value.trim();
  var consulta = consultaTexto.value.trim();
  if (!email || email.indexOf("@") < 1 || !consulta) return;

  consultaSendInFlight = true;
  consultaEnviar.disabled = true;
  consultaResultado.innerHTML = '<p class="status-msg">Enviando…</p>';
  fetch(PROGRESO_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ actividad: "Preguntas y sugerencias espontáneas", email: email, consulta: consulta })
  }).then(function(){
    consultaResultado.innerHTML = '<p class="status-msg">Enviado. ¡Gracias!</p>';
    consultaTexto.value = "";
  }).catch(function(){
    consultaResultado.innerHTML = '<p class="status-msg status-msg--error">No se pudo enviar (revisá tu conexión). Podés reintentar con "Enviar".</p>';
    consultaSendInFlight = false;
    consultaEnviar.disabled = false;
  });
});
</script>
