<!doctype html>
<html lang="es"><head><meta charset="utf-8">

<title>Eneida IX y X · Pantallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap">
<style>
  :root{--f-body:'Bitter',Georgia,serif; --f-lat:'Bitter',Georgia,serif; --f-label:'Bitter',Georgia,serif; --label-w:600;}
  *{box-sizing:border-box;} [hidden]{display:none!important;}
  html,body{margin:0;} body{font-family:var(--f-body);}
  button,select{font:inherit;}
  .rlive{color:var(--rsoft);}
  .l{display:flex; gap:.5em; align-items:baseline;}
  .vn{font-style:normal; font-family:var(--f-label); font-weight:var(--label-w); font-size:.5em; color:var(--soft); width:2.4em; flex:none; text-align:right; letter-spacing:.03em; font-variant-numeric:tabular-nums;}
  .lt{flex:1; min-width:0;}
  .w{border-radius:.15em; padding:0 .06em; margin:0 -.06em;}
  body.brush .w{cursor:pointer;}
  body.brush .w:hover{outline:2px dashed var(--line); outline-offset:1px;}
  .c-y{background:var(--mk-y); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-y-e);}
  .c-r{background:var(--mk-r); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-r-e);}
  .c-b{background:var(--mk-b); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-b-e);}
  .c-g{background:var(--mk-g); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-g-e);}
  mark{border-radius:.15em; padding:0 .05em;}
  .body a,.w.lk{color:inherit; text-decoration-line:underline; text-decoration-color:var(--accent); text-decoration-thickness:.09em; text-underline-offset:.16em; cursor:pointer;}
  .body s,.body strike,.body del,.w.fs{text-decoration-line:line-through; text-decoration-thickness:.07em;}
  .w.lk.fs{text-decoration-line:underline line-through;}
  .body u,.w.u{text-decoration-line:underline; text-decoration-thickness:.09em; text-underline-offset:.2em; text-decoration-skip-ink:none;}
  .w.u.fs{text-decoration-line:underline line-through;}
  .u-y{text-decoration-color:var(--ul-y)!important;} .u-r{text-decoration-color:var(--ul-r)!important;} .u-b{text-decoration-color:var(--ul-b)!important;}
  .u-g{text-decoration-color:var(--ul-g)!important;} .u-k{text-decoration-color:var(--ul-k)!important;}
  .us-double{text-decoration-style:double; text-decoration-thickness:.07em;} .us-wavy{text-decoration-style:wavy; text-decoration-thickness:.06em;} .us-dotted{text-decoration-style:dotted; text-decoration-thickness:.12em;}
  .body b,.body strong,.w.fb{font-weight:700;}

  body.lector{
    --rbg:#FFFEFB; --rsurface:#F4EFE5; --rink:#2A2016; --rsoft:#5C4F3B; --rline:#DDD3C0; --raccent:#B32F2F; --raccent-ink:#FFFFFF;
    --rlive:#2E7D32; --rfree:#A15C00; --roff:#7A6E5C;
    --mk-y:#FFC000; --mk-r:#FF5E4D; --mk-b:#4F8DFF; --mk-g:#2FBF4F; --mk-ink:#2A2016;
    --mk-y-e:#B07F00; --mk-r-e:#B8231A; --mk-b-e:#1A4FC4; --mk-g-e:#137A2E;
    --ul-y:#E0A800; --ul-r:#E0342A; --ul-b:#1F5FE0; --ul-g:#1E9E3A; --ul-k:#2A2016; --accent:#B32F2F;
    background:var(--rbg); color:var(--rink); color-scheme:light;
  }
  body.lector[data-rtheme="dark"]{
    --rbg:#121110; --rsurface:#1F1D1A; --rink:#F3EFE8; --rsoft:#BDB5A8; --rline:#3D3833; --raccent:#FFD54A; --raccent-ink:#000000;
    --rlive:#5BD86B; --rfree:#FFB547; --roff:#9C948A;
    --mk-y:#FFE000; --mk-r:#FF6E5E; --mk-b:#6CB4FF; --mk-g:#4BE36B; --mk-ink:#000000;
    --mk-y-e:transparent; --mk-r-e:transparent; --mk-b-e:transparent; --mk-g-e:transparent;
    --ul-y:#FFE000; --ul-r:#FF6E5E; --ul-b:#6CB4FF; --ul-g:#4BE36B; --ul-k:#F3EFE8; --accent:#FFD54A;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark){
    body.lector:not([data-rtheme="light"]){
      --rbg:#121110; --rsurface:#1F1D1A; --rink:#F3EFE8; --rsoft:#BDB5A8; --rline:#3D3833; --raccent:#FFD54A; --raccent-ink:#000000;
      --rlive:#5BD86B; --rfree:#FFB547; --roff:#9C948A;
      --mk-y:#FFE000; --mk-r:#FF6E5E; --mk-b:#6CB4FF; --mk-g:#4BE36B; --mk-ink:#000000;
      --mk-y-e:transparent; --mk-r-e:transparent; --mk-b-e:transparent; --mk-g-e:transparent;
      --ul-y:#FFE000; --ul-r:#FF6E5E; --ul-b:#6CB4FF; --ul-g:#4BE36B; --ul-k:#F3EFE8; --accent:#FFD54A;
      color-scheme:dark;
    }
  }
  #lector{min-height:100dvh; display:flex; flex-direction:column; background:var(--rbg); color:var(--rink); font-family:var(--f-body); -webkit-text-size-adjust:100%;}
  #lector button{font-family:var(--f-body); cursor:pointer; -webkit-tap-highlight-color:transparent;}
  #lector button:focus-visible,#lector select:focus-visible{outline:3px solid var(--raccent); outline-offset:2px;}
  .rtop{position:sticky; top:0; z-index:5; background:var(--rbg); border-bottom:1px solid var(--rline); padding:8px 16px 8px;}
  .rrow{display:flex; align-items:center; gap:10px; min-width:0;}
  .rclase{flex:1; min-width:0; font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rref{flex:none; font-weight:600; font-size:17px; background:var(--rsurface); color:var(--rink); border:1px solid var(--rline); border-radius:20px; padding:6px 14px; min-height:42px; font-variant-numeric:tabular-nums;}
  .rsub{margin-top:6px; font-size:13px; color:var(--rsoft);}
  .rlive{display:flex; align-items:center; gap:7px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rlive i{width:9px; height:9px; border-radius:50%; background:var(--roff); flex:none;}
  .rlive[data-s="live"] i{background:var(--rlive); box-shadow:0 0 0 3px color-mix(in srgb, var(--rlive) 28%, transparent);}
  .rlive[data-s="free"] i{background:var(--rfree);}
  .rpos{font-variant-numeric:tabular-nums; flex:none;}
  .rtools{display:flex; gap:4px; flex:none;}
  .rtools button{font-weight:600; font-size:14px; min-width:40px; height:36px; padding:0 8px; border-radius:18px; border:1px solid var(--rline); background:transparent; color:var(--rink);}
  .rnote{display:flex; align-items:center; gap:10px; margin-top:8px; padding:8px 10px; background:var(--rsurface); border-left:3px solid var(--rfree); font-size:14px; line-height:1.35;}
  .rnote button{margin-left:auto; flex:none; font-weight:600; font-size:14px; min-height:40px; padding:0 14px; border-radius:20px; border:none; background:var(--raccent); color:var(--raccent-ink);}
  .rmain{flex:1; width:100%; max-width:1100px; margin:0 auto; padding:18px 16px calc(100px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:22px;}
  .rlat{font-size:var(--rfs,21px); line-height:1.55; max-width:calc(21em + 2.6em); overflow-wrap:break-word;}
  .rlat .l{gap:.45em;}
  .rlat .vn{font-family:var(--f-body); font-weight:600; font-size:.55em; width:2.3em; color:var(--rsoft); letter-spacing:0;}
  .rlat .lt{padding-left:1.2em; text-indent:-1.2em;}
  .rpanel{border-top:1px solid var(--rline);}
  .rtabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;}
  .rtabs::-webkit-scrollbar{display:none;}
  .rtabs button{flex:none; font-weight:600; font-size:15px; background:none; border:none; border-bottom:3px solid transparent; color:var(--rsoft); padding:10px 12px; min-height:46px; max-width:75vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rtabs button[aria-selected="true"]{color:var(--rink); border-bottom-color:var(--raccent);}
  .rtab{font-size:17px; line-height:1.55; padding:12px 2px; overflow-wrap:break-word;}
  .rtab ul,.rtab ol{margin:0; padding-left:1.2em;} .rtab li{margin:.3em 0;} .rtab li::marker{color:var(--raccent);}
  .rtab p,.rtab div{margin:0;}
  .rtab .rg{padding:.4em 0; border-bottom:1px solid var(--rline);} .rtab .rg:last-child{border-bottom:none;}
  .rtab b,.rtab strong{font-weight:700;}
  .rtab a{color:inherit; text-decoration-line:underline; text-decoration-color:var(--raccent); text-underline-offset:.16em;}
  .rtab u{text-decoration-thickness:.09em; text-underline-offset:.2em; text-decoration-skip-ink:none;}
  .rtab s,.rtab strike,.rtab del{text-decoration-thickness:.07em;}
  .rmsg{padding:56px 16px; text-align:center; font-size:17px; line-height:1.5; color:var(--rsoft); max-width:460px; margin:0 auto;}
  .rnav{position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; gap:10px; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--rbg); border-top:1px solid var(--rline);}
  .rnav button{flex:1; min-height:52px; font-weight:600; font-size:17px; border-radius:26px; border:1px solid var(--rline); background:var(--rsurface); color:var(--rink);}
  .rnav #rNext{background:var(--raccent); color:var(--raccent-ink); border-color:var(--raccent);}
  .rnav button:disabled{opacity:.4; cursor:default;}
  .rsheet{position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center;}
  .rsheet-in{background:var(--rbg); color:var(--rink); width:100%; max-width:640px; max-height:82dvh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));}
  .rsheet-head{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px;}
  .rsheet-head .rlbl{margin:0; font-size:13px; color:var(--rsoft); width:100%;}
  .rsheet-head select{flex:1; min-width:0; font:16px var(--f-body); padding:8px; min-height:44px; background:var(--rsurface); color:var(--rink); border:1px solid var(--rline); border-radius:8px;}
  .rsheet-head button{font-weight:600; font-size:15px; min-height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--rline); background:transparent; color:var(--rink); margin-left:auto;}
  #rList{list-style:none; margin:0; padding:0;}
  #rList button{width:100%; text-align:left; display:flex; gap:10px; align-items:baseline; padding:12px 10px; min-height:50px; background:none; border:none; border-left:4px solid transparent; color:var(--rink); font-size:16px;}
  #rList button .rr{font-weight:600; flex:none; font-variant-numeric:tabular-nums;}
  #rList button .rw{color:var(--rsoft); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; min-width:0;}
  #rList button[aria-current="true"]{border-left-color:var(--raccent); background:var(--rsurface);}
  @media (min-width:701px){
    .rmain{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); align-items:start; gap:36px; padding-top:24px;}
    .rpanel{border-top:none; border-left:1px solid var(--rline); padding-left:24px; position:sticky; top:110px; max-height:calc(100dvh - 210px); overflow:auto;}
    .rnav{justify-content:center;} .rnav button{flex:0 1 260px;}
  }
</style></head>
<body class="lector">
<div id="lector">
  <header class="rtop">
    <div class="rrow">
      <span class="rclase" id="rClase">Cargando…</span>
      <button class="rref" id="rRef" aria-haspopup="dialog">—</button>
    </div>
    <div class="rrow rsub">
      <span class="rlive" id="rLive"></span>
      <span class="rpos" id="rPos"></span>
      <span class="rtools">
        <button id="rMinus" aria-label="Letra más chica">A−</button>
        <button id="rPlus" aria-label="Letra más grande">A+</button>
        <button id="rThemeBtn" aria-label="Cambiar entre tema claro y oscuro">◐</button>
      </span>
    </div>
    <div class="rnote" id="rNote" hidden></div>
  </header>
  <main class="rmain" id="rMain">
    <section class="rlat" id="rLat" lang="la" aria-label="Texto latino"></section>
    <section class="rpanel" id="rPanel" hidden>
      <div class="rtabs" role="tablist" id="rTabs"></div>
      <div class="rtab" id="rTab" role="tabpanel"></div>
    </section>
  </main>
  <p class="rmsg" id="rMsg" hidden></p>
  <nav class="rnav" aria-label="Pasajes">
    <button id="rPrev">◀ Anterior</button>
    <button id="rNext">Siguiente ▶</button>
  </nav>
  <div class="rsheet" id="rSheet" hidden role="dialog" aria-label="Pasajes de la clase">
    <div class="rsheet-in">
      <div class="rsheet-head">
        <p class="rlbl" id="rSheetLbl">Clase</p>
        <select id="rSel" aria-label="Elegir clase"></select>
        <button id="rSheetClose">Cerrar</button>
      </div>
      <ol id="rList"></ol>
    </div>
  </div>
</div>

<script>
const DATA = {"clase": "Eneida IX y X", "pasajes": [{"id": "a9-59-66", "ref": "9.59-66", "lines": ["Ac veluti pleno lupus insidiatus ovili", "cum fremit ad caulas, ventos perpessus et imbris,", "nocte super media; tuti sub matribus agni", "balatum exercent, ille asper et improbus ira", "saevit in absentis, collecta fatigat edendi", "ex longo rabies et siccae sanguine fauces:", "haud aliter Rutulo muros et castra tuenti", "ignescunt irae, duris dolor ossibus ardet."], "trans": "Como lobo que acecha<div>un aprisco repleto aullando ante las bardas,</div><div>azotado de vientos y aguaceros a media noche.</div><div>Balan y balan los corderos seguros al amparo de sus madres.</div><div>El rabioso, acuciado de coraje, se enfurece viendo la presa lejos de su alcance</div><div>y el hambre reprimida largo tiempo y sus fauces resecas,</div><div>sedientas de sangre le torturan,</div><div>así se abrasa en ira el rútulo mirando muros y campamento;</div><div>arden de indignación sus férreos huesos.</div><div><br></div>", "gloss": "<div><b>absēns, -entis</b>: ausente</div><div><b>agnus, -ī, m.</b>: cordero</div><div><b>ardeō, -ēs, -ēre, arsī, arsum</b>: arder</div><div><b>asper, aspera, asperum</b>: áspero, feroz</div><div><b>balātus, -ūs, m.</b>: balido</div><div><b>dolor, -ōris, m.</b>: dolor</div><div><b>dūrus, -a, -um</b>: duro</div><div><b>et</b>: y</div><div><b>exerceō, -ēs, -ēre, exercuī, exercitum</b>: ejercitar; hacer oír</div><div><b>ignēscō, -is, -ere</b>: inflamarse, encenderse</div><div><b>ille, illa, illud</b>: aquel, aquella, aquello</div><div><b>improbus, -a, -um</b>: malvado, feroz</div><div><b>in (prep. + acus.)</b>: contra</div><div><b>īra, -ae, f.</b>: ira</div><div><b>māter, mātris, f.</b>: madre</div><div><b>os, ossis, n.</b>: hueso</div><div><b>saeviō, -īs, -īre, saeviī, saevītum</b>: enfurecerse</div><div><b>sub (prep. + abl.)</b>: bajo, al amparo de</div><div><b>tūtus, -a, -um</b>: seguro, protegido</div>", "notes": "<div>El lobo de este símil no mata a nadie: los corderos están a salvo. ¿Qué es entonces lo que se compara con Turno? Buscá en el latín las palabras de hambre y las de ira y decidí cuál pesa más.</div><div>↔ 10.723-729 (el león de Mezencio, que sí come).</div><ul><li><i>Ac veluti… haud aliter</i>: «y como… no de otro modo». Todo lo del medio es el lobo; solo los dos últimos versos son Turno.</li><li><i>ira</i> aparece dos veces: <i>ira</i> (62, ablativo: «por la ira») e <i>irae</i> (66, nominativo plural, sujeto de <i>ignescunt</i>).</li><li><i>in absentis</i> = <i>absentes</i>, acusativo plural: se enfurece «contra los que no tiene a su alcance».</li></ul>", "hl": {}, "fx": {"17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b"}, "ul": {"0": "r", "1": "r", "14": "b", "19": "b", "39": "b", "41": "r", "42": "r", "51": "b", "52": "b"}, "lk": {}}, {"id": "a9-77-79", "ref": "9.77-79", "lines": ["Quis deus, o musae, tam saeva incendia Teucris", "avertit? Tantos ratibus quis depulit ignes?", "Dicite. Prisca fides facto, sed fama perennis."], "trans": "¿Qué dios —decidme, Musas— desvió de los teucros incendio tan atroz?<div>¿Quién resguardó las naves de tan voraces llamas?</div><div>Es una historia de los viejos tiempos, pero su fama durará por siempre.</div><div><br></div>", "gloss": "<div><b>āvertō, -is, -ere, āvertī, āversum</b>: apartar</div><div><b>dēpellō, -is, -ere, dēpulī, dēpulsum</b>: rechazar, alejar</div><div><b>deus, -ī, m.</b>: dios</div><div><b>dīcō, -is, -ere, dīxī, dictum</b>: decir</div><div><b>factum, -ī, n.</b>: hecho</div><div><b>fāma, -ae, f.</b>: fama</div><div><b>fidēs, -eī, f.</b>: fe, credibilidad</div><div><b>ignis, -is, m.</b>: fuego</div><div><b>incendium, -iī, n.</b>: incendio</div><div><b>Mūsa, -ae, f.</b>: musa</div><div><b>ō</b>: ¡oh!</div><div><b>perennis, -e</b>: eterno, duradero</div><div><b>prīscus, -a, -um</b>: antiguo</div><div><b>quis, quid</b>: ¿quién?, ¿qué?</div><div><b>ratis, -is, f.</b>: balsa, nave</div><div><b>saevus, -a, -um</b>: cruel, feroz</div><div><b>sed</b>: pero</div><div><b>tam</b>: tan</div><div><b>tantus, -a, -um</b>: tan grande</div><div><b>Teucrī, -ōrum, m. pl.</b>: los teucros, los troyanos</div>", "notes": "<div>El narrador pide ayuda a las Musas y enseguida aclara algo sobre lo que va a contar. ¿Dice que es verdad, que es mentira, o esquiva la pregunta? Apoyate en <i>fides</i> y <i>fama</i>.</div><div>↔ 10.791-793 (otra vez <i>fides</i> y el paso del tiempo).</div><ul><li><i>Prisca fides facto, sed fama perennis</i>: no hay verbo; se sobrentiende <i>est</i>. Literal: «antigua [es] la creencia en el hecho, pero la fama, perenne».</li><li><i>avertit… depulit</i>: dos perfectos. El narrador pregunta lo que se supone que sabe.</li><li><i>Dicite</i>: imperativo plural; <i>o musae</i>, vocativo.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b"}, "ul": {"8": "g", "10": "b", "12": "g", "13": "b", "15": "r", "16": "r", "17": "r", "18": "r", "19": "r", "20": "r"}, "lk": {}}, {"id": "a9-115-122", "ref": "9.116-122", "lines": ["[...] Vos ite solutae,", "ite deae pelagi: genetrix iubet. Et sua quaeque", "continuo puppes abrumpunt vincula ripis", "delphinumque modo demersis aequora rostris", "ima petunt. Hinc virgineae (mirabile monstrum)", "quot prius aeratae steterant ad litora prorae", "reddunt se totidem facies pontoque feruntur."], "trans": "Marchad libres vosotras; ea, diosas del mar. Vuestra madre os lo manda».<div>Al punto cada nave arranca sus amarras de la orilla</div><div>y sumergiendo su espolón se hunden como delfines en el fondo.</div><div>Entonces —maravilla el <mark class=\"c-y\">portento</mark>—</div><div>cuantas proas de bronce había atadas antes a la orilla, otras tantas afloran</div><div>trocadas en figura de muchachas y van nadando por las ondas.</div><div><br></div>", "gloss": "<div><b>abrumpō, -is, -ere, abrūpī, abruptum</b>: romper, soltar</div><div><b>aequor, -oris, n.</b>: mar, superficie del mar</div><div><b>continuō (adv.)</b>: enseguida</div><div><b>dea, -ae, f.</b>: diosa</div><div><b>delphīn, -īnis, m.</b>: delfín</div><div><b>dēmergō, -is, -ere, dēmersī, dēmersum</b>: hundir, sumergir</div><div><b>eō, īs, īre, iī, itum</b>: ir</div><div><b>et</b>: y</div><div><b>genetrix, -īcis, f.</b>: madre</div><div><b>īmus, -a, -um</b>: lo más profundo</div><div><b>iubeō, -ēs, -ēre, iussī, iussum</b>: ordenar</div><div><b>modo</b>: a la manera de</div><div><b>pelagus, -ī, n.</b>: mar, alta mar</div><div><b>petō, -is, -ere, petīvī, petītum</b>: dirigirse a, buscar</div><div><b>puppis, -is, f.</b>: popa; nave</div><div><b>-que</b>: y</div><div><b>quisque, quaeque, quidque</b>: cada uno</div><div><b>rīpa, -ae, f.</b>: orilla</div><div><b>rōstrum, -ī, n.</b>: hocico; espolón de la nave</div><div><b>solvō, -is, -ere, solvī, solūtum</b>: soltar, desatar</div><div><b>suus, -a, -um</b>: suyo, propio</div><div><b>vinculum, -ī, n.</b>: atadura, amarra</div><div><b>vōs, vestrum</b>: ustedes</div>", "notes": "<div>En medio del prodigio Virgilio abre un paréntesis: <i>(mirabile monstrum)</i>. ¿Quién habla ahí y a quién? ¿Te ayuda a creerlo o te avisa que es difícil de creer?</div><div>↔ 10.636-642 (el mismo paréntesis, con otro prodigio) y 10.228-235 (las ninfas cuentan esto mismo).</div><ul><li><i>ite… ite</i>: imperativo de <i>eo</i>. La diosa ordena y las naves obedecen en presente: <i>abrumpunt, petunt, reddunt se</i>.</li><li><i>delphinum modo</i>: «a la manera de los delfines»; <i>delphinum</i> es genitivo plural.</li><li><i>quot… totidem</i>: «cuantas proas… otras tantas figuras». El número se conserva; la forma cambia.</li></ul>", "hl": {"27": "y"}, "fx": {"1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b"}, "ul": {"7": "b", "13": "b", "17": "b", "20": "b", "26": "r", "27": "r", "33": "b"}, "lk": {}}, {"id": "a9-128-131", "ref": "9.128-132", "lines": ["Troianos haec monstra petunt, his Iuppiter ipse", "auxilium solitum eripuit, non tela neque ignes", "exspectans Rutulos. Ergo maria invia Teucris", "nec spes ulla fugae: rerum pars altera adempta est.", "Terra autem in nostris manibus [...]"], "trans": "Estos portentos van contra los teucros.<div>El mismo Júpiter les arrebata el auxilio habitual.</div><div>No tienen que esperar a los dardos ni al fuego de los rútulos.</div><div>Se les cierra hasta el mar. Ya no les queda ni siquiera esperanza de huida.</div><div>Tienen perdida la mitad del mundo, la otra, la tierra, está en nuestro poder.</div><div><br></div>", "gloss": "<div><b>autem</b>: en cambio</div><div><b>auxilium, -iī, n.</b>: ayuda, auxilio</div><div><b>ēripiō, -is, -ere, ēripuī, ēreptum</b>: arrebatar, quitar</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>in (prep. + abl.)</b>: en</div><div><b>ipse, ipsa, ipsum</b>: él mismo, ella misma</div><div><b>Iuppiter, Iovis, m.</b>: Júpiter</div><div><b>manus, -ūs, f.</b>: mano</div><div><b>mōnstrum, -ī, n.</b>: prodigio</div><div><b>noster, nostra, nostrum</b>: nuestro</div><div><b>petō, -is, -ere, petīvī, petītum</b>: atacar, buscar</div><div><b>solitus, -a, -um</b>: acostumbrado, habitual</div><div><b>terra, -ae, f.</b>: tierra</div><div><b>Troiānus, -a, -um</b>: troyano</div>", "notes": "<div>Turno acaba de ver el mismo prodigio que vos. ¿Qué entiende él y qué sabés vos que él no sabe? Señalá las palabras con las que convierte un milagro a favor de los troyanos en una señal en su contra.</div><div>↔ 10.501-505 (<i>nescia mens hominum</i>).</div><ul><li><i>Troianos haec monstra petunt</i>: <i>Troianos</i> es acusativo (objeto); el sujeto es <i>haec monstra</i>. <i>Peto</i> acá es «atacar».</li><li><i>his… eripuit</i>: perfecto de <i>eripio</i>; <i>his</i>, «a ellos»: según Turno, Júpiter les quitó la ayuda.</li><li><i>in nostris manibus</i>: Turno pasa de «ellos» a «nosotros».</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b"}, "ul": {"0": "r", "1": "r", "2": "r", "3": "r", "5": "b", "9": "g", "13": "b", "25": "b"}, "lk": {}}, {"id": "a9-176-183", "ref": "9.176-183", "lines": ["Nisus erat portae custos, acerrimus armis,", "Hyrtacides, comitem Aeneae quem miserat Ida", "venatrix iaculo celerem levibusque sagittis;", "it iuxta comes Euryalus, quo pulchrior alter", "non fuit Aeneadum Troiana neque induit arma,", "ora puer prima signans intonsa iuventa.", "His amor unus erat, pariterque in bella ruebant:", "tum quoque communi portam statione tenebant."], "trans": "<div>Tenía encomendada la guarda de una puerta Niso, guerrero intrépido,</div><div>hijo de Hírtaco. El Ida cazadero se lo había mandado por compañero a Eneas,</div><div>raudo como era en disparar venablos y saetas voladoras.</div><div>Junto a él estaba allí su <b>camarada</b> <b>Euríalo</b>, el <b>más</b> <b>bello</b> entre cuantos Enéadas</div><div>vistieron armadura troyana. Ornaba todavía sus mejillas intactas</div><div>la flor del primer bozo adolescente. Uno y otro vivían con un alma.</div><div>Juntos los dos corrían al combate.</div><div>Juntos también entonces montaban guardia ante la misma puerta.</div><div><br></div>", "gloss": "<div><b>ācer, ācris, ācre (sup. ācerrimus)</b>: fuerte, aguerrido</div><div><b>Aeneadae, -ārum, m. pl. (gen. Aeneadum)</b>: los enéadas, los compañeros de Eneas</div><div><b>alter, -era, -erum</b>: otro</div><div><b>amor, -ōris, m.</b>: amor</div><div><b>arma, -ōrum, n. pl.</b>: armas</div><div><b>bellum, -ī, n.</b>: guerra</div><div><b>comes, -itis, m.</b>: compañero</div><div><b>commūnis, -e</b>: común, compartido</div><div><b>custōs, -ōdis, m.</b>: guardián</div><div><b>eō, īs, īre, iī, itum</b>: ir</div><div><b>Euryalus, -ī, m.</b>: Euríalo</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>in (prep. + acus.)</b>: hacia, a</div><div><b>induō, -is, -ere, induī, indūtum</b>: vestir, ponerse</div><div><b>iuxtā (adv.)</b>: al lado, junto</div><div><b>neque</b>: y no, ni</div><div><b>Nīsus, -ī, m.</b>: Niso</div><div><b>nōn</b>: no</div><div><b>pariter</b>: a la par, juntos</div><div><b>porta, -ae, f.</b>: puerta</div><div><b>pulcher, -chra, -chrum</b>: hermoso</div><div><b>-que</b>: y</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>quoque</b>: también</div><div><b>ruō, -is, -ere, ruī</b>: precipitarse</div><div><b>statiō, -ōnis, f.</b>: puesto de guardia</div><div><b>sum, es, esse, fuī</b>: ser, estar</div><div><b>teneō, -ēs, -ēre, tenuī, tentum</b>: tener, ocupar</div><div><b>Troiānus, -a, -um</b>: troyano</div><div><b>tum (adv.)</b>: entonces</div><div><b>ūnus, -a, -um</b>: uno, único</div>", "notes": "<div>Antes de que hablen, el narrador presenta a Niso por sus armas y a Euríalo por su cara. ¿Qué palabra latina los junta al final y de qué tipo de vínculo habla? Defendé tu lectura con el latín, no con la traducción.</div><div>↔ 10.390-396 (otra pareja inseparable: los gemelos).</div><ul><li><i>His amor unus erat</i>: <i>his</i>, dativo plural, «para ellos»: «tenían un solo amor». Echave-Sustaeta traduce «vivían con un alma»: ¿dice lo mismo?</li><li><i>quo pulchrior alter non fuit</i>: comparativo: «más hermoso que el cual no hubo otro».</li><li><i>erat, ruebant, tenebant</i>: imperfectos: lo que pasaba siempre, antes de que algo se rompa.</li></ul>", "hl": {"22": "y", "32": "y"}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b"}, "ul": {"3": "b", "19": "b", "25": "g", "29": "g", "37": "r", "38": "r", "39": "r", "40": "r", "49": "b"}, "lk": {}}, {"id": "a9-184-187", "ref": "9.184-191", "lines": ["Nisus ait: Dine hunc ardorem mentibus addunt,", "Euryale, an sua cuique deus fit dira cupido?", "Aut pugnam aut aliquid iamdudum invadere magnum", "mens agitat mihi nec placida contenta quietest.", "Cernis, quae Rutulos habeat fiducia rerum.", "Lumina rara micant; somno vinoque soluti", "procubuere; silent late loca: percipe porro,", "quid dubitem et quae nunc animo sententia surgat."], "trans": "Niso prorrumpe: «¿Son los dioses, Euríalo,<div>los que infunden en nuestros corazones este ardor</div><div>o cada uno hace un dios de su ardoroso deseo?</div><div>Hace ya tiempo que me bulle en el <mark class=\"c-y\">alma</mark></div><div>un afán de luchar o emprender algo grande.</div><div>No me resigno a esta apacible calma.</div><div>Tú <mark class=\"c-y\">ves</mark> qué confianza en su fortuna tienen puesta los rútulos.</div><div>Apenas parpadea alguna que otra luz.</div><div>Relajados por el sueño y el vino se han tendido de bruces por el suelo.</div><div>Reina el silencio a lo ancho y a lo largo. Oye lo que medito,</div><div>la idea que me acude a la mente.</div><div><br></div>", "gloss": "<div><b>addō, -is, -ere, addidī, additum</b>: añadir, infundir</div><div><b>agitō, -ās, -āre, -āvī, -ātum</b>: agitar</div><div><b>aiō, ais, ait</b>: decir</div><div><b>aliquis, aliquid</b>: alguien, algo</div><div><b>an</b>: o acaso</div><div><b>ardor, -ōris, m.</b>: ardor, pasión</div><div><b>aut</b>: o</div><div><b>contentus, -a, -um</b>: contento, satisfecho</div><div><b>cupīdō, -inis, f.</b>: deseo</div><div><b>deus, -ī, m.</b>: dios</div><div><b>dīrus, -a, -um</b>: terrible</div><div><b>ego, meī</b>: yo</div><div><b>Euryalus, -ī, m.</b>: Euríalo</div><div><b>fīō, fīs, fierī, factus sum</b>: hacerse, convertirse</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>iamdūdum</b>: desde hace rato</div><div><b>invādō, -is, -ere, invāsī, invāsum</b>: atacar; emprender</div><div><b>lātē (adv.)</b>: a lo ancho</div><div><b>locus, -ī, m. (pl. loca)</b>: lugar</div><div><b>lūmen, -inis, n.</b>: luz</div><div><b>magnus, -a, -um</b>: grande</div><div><b>mēns, mentis, f.</b>: mente</div><div><b>micō, -ās, -āre, micuī</b>: brillar</div><div><b>-ne</b>: partícula interrogativa</div><div><b>nec</b>: y no, ni</div><div><b>Nīsus, -ī, m.</b>: Niso</div><div><b>percipiō, -is, -ere, percēpī, perceptum</b>: percibir, entender</div><div><b>placidus, -a, -um</b>: tranquilo</div><div><b>porrō (adv.)</b>: además, ahora</div><div><b>prōcumbō, -is, -ere, prōcubuī, prōcubitum</b>: echarse, tenderse</div><div><b>pugna, -ae, f.</b>: lucha, combate</div><div><b>-que</b>: y</div><div><b>quiēs, -ētis, f.</b>: descanso, calma</div><div><b>quisque, quaeque, quidque</b>: cada uno</div><div><b>rārus, -a, -um</b>: escaso</div><div><b>sileō, -ēs, -ēre, siluī</b>: estar en silencio</div><div><b>solvō, -is, -ere, solvī, solūtum</b>: soltar, aflojar</div><div><b>somnus, -ī, m.</b>: sueño</div><div><b>sum, es, esse, fuī</b>: ser, estar</div><div><b>suus, -a, -um</b>: suyo, propio</div><div><b>vīnum, -ī, n.</b>: vino</div>", "notes": "<div>Niso no sabe de dónde le viene el deseo: ¿de un dios o de él mismo? Reescribí su pregunta con tus palabras y decidí: ¿el poema la contesta en algún momento de estos dos libros?</div><div>↔ 10.465-472 (Júpiter responde a otra pregunta sin salida).</div><ul><li><i>Dine… an…?</i>: <i>di</i> (dioses) + <i>-ne</i> interrogativo; <i>an</i> introduce la segunda opción.</li><li><i>sua cuique deus fit dira cupido</i>: «a cada cual su propio deseo terrible se le vuelve dios». El sujeto es <i>cupido</i>; <i>deus</i>, lo que resulta.</li><li><i>mens agitat mihi</i>: <i>mihi</i>, dativo: no dice «yo quiero» sino «la mente me agita».</li></ul>", "hl": {"16": "y", "22": "y"}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b"}, "ul": {"4": "b", "5": "b", "8": "r", "9": "r", "10": "r", "11": "r", "12": "r", "13": "r", "14": "r", "22": "b", "35": "b", "41": "g"}, "lk": {}}, {"id": "nmuojo9vb345", "ref": "9.287-294", "lines": ["Hanc ego nunc ignaram huius quodcumque pericli est", "inque salutatam linquo: nox et tua testis", "dextera, quod nequeam lacrumas perferre parentis", "at tu, oro, solare inopem et succurre relictae.", "Hanc sine me spem ferre tui: audentior ibo", "in casus omnis. Percussa mente dedere", "Dardanidae lacrimas; ante omnis pulcher Iulus,", "atque animum patriae strinxit pietatis imago."], "trans": "Y ahora la dejo sin que sepa de este riesgo,<div>el que sea, y sin decirle adiós.</div><div>Que la noche y tu diestra me sirvan de testigos.</div><div>No sería capaz de soportar sus lágrimas.</div><div>Consuela tú a la pobre, te lo pido, y ampárala si queda abandonada.</div><div>Déjame que me lleve esta esperanza en ti;</div><div>afrontaré así más animoso cualquier trance».</div><div>Conmueve el corazón de los Dardánidas que dan suelta a su llanto</div><div>y más que todos el hermoso Julo. Le angustia el alma</div><div>la imagen de su propio amor filial.</div><div><br></div>", "gloss": "<div><b>animus, -ī, m.</b>: ánimo</div><div><b>ante (prep. + acus.)</b>: delante de, antes que</div><div><b>atque</b>: y</div><div><b>Dardanidae, -ārum, m. pl.</b>: los dardánidas, los troyanos</div><div><b>dextera, -ae, f.</b>: mano derecha</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>ego, meī</b>: yo</div><div><b>et</b>: y</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>ignārus, -a, -um</b>: que no sabe, ignorante</div><div><b>imāgō, -inis, f.</b>: imagen</div><div><b>īnsalūtātus, -a, -um (aquí partido: in-que salutatam)</b>: sin despedirse</div><div><b>Iūlus, -ī, m.</b>: Iulo</div><div><b>lacrima, -ae, f.</b>: lágrima</div><div><b>linquō, -is, -ere, līquī</b>: dejar, abandonar</div><div><b>mēns, mentis, f.</b>: mente</div><div><b>nox, noctis, f.</b>: noche</div><div><b>nunc</b>: ahora</div><div><b>omnis, -e</b>: todo</div><div><b>patrius, -a, -um</b>: paterno</div><div><b>percutiō, -is, -ere, percussī, percussum</b>: golpear, conmover</div><div><b>perīculum, -ī, n. (gen. pericli)</b>: peligro</div><div><b>pietās, -ātis, f.</b>: piedad</div><div><b>pulcher, -chra, -chrum</b>: hermoso</div><div><b>-que</b>: y</div><div><b>quīcumque, quaecumque, quodcumque</b>: cualquiera que</div><div><b>stringō, -is, -ere, strīnxī, strictum</b>: apretar, conmover</div><div><b>sum, es, esse, fuī</b>: ser, estar</div><div><b>testis, -is, m./f.</b>: testigo</div><div><b>tuus, -a, -um</b>: tuyo</div>", "notes": "<div>Euríalo pide por su madre y el que más llora es Julo. ¿Por qué justo él? La respuesta está en una sola palabra del último verso.</div><div>↔ 10.821-826 (casi el mismo verso, en otra cabeza).</div><ul><li><i>patriae pietatis imago</i>: <i>patriae</i> no es «patria» sino el adjetivo <i>patrius</i>, «hacia el padre»: la imagen del amor filial.</li><li><i>strinxit</i>: perfecto de <i>stringo</i>, «apretó». En 10.824 el verbo es otro: <i>subiit</i>.</li><li><i>solare… succurre</i>: imperativos. <i>Hanc… linquo</i>: <i>hanc</i> es la madre, que no se nombra.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b"}, "ul": {"11": "b", "20": "b", "41": "b", "42": "g", "49": "r", "50": "r", "51": "r", "52": "r", "53": "r", "54": "r"}, "lk": {}}, {"id": "a9-337-341", "ref": "9.339-343", "lines": ["Impastus ceu plena leo per ovilia turbans", "(suadet enim vesana fames) manditque trahitque", "molle pecus mutumque metu, fremit ore cruento:", "nec minor Euryali caedes; incensus et ipse", "perfurit ac multam in medio sine nomine plebem"], "trans": "Como león ayuno —le acucia su hambre ciega— siembra la confusión en un aprisco<div>lleno de ovejas y desgarra y devora a sus débiles presas mudas de miedo y ruge</div><div>no menor estrago causa Euríalo. También él encendido, su fauce ensangrentada,</div><div>arrebatado de furor, da en medio de un tropel de guerreros oscuros</div><div><br></div>", "gloss": "<div><b>ac</b>: y</div><div><b>caedēs, -is, f.</b>: matanza</div><div><b>cruentus, -a, -um</b>: ensangrentado</div><div><b>enim</b>: pues</div><div><b>et</b>: y</div><div><b>Euryalus, -ī, m.</b>: Euríalo</div><div><b>famēs, -is, f.</b>: hambre</div><div><b>fremō, -is, -ere, fremuī, fremitum</b>: rugir</div><div><b>in (prep. + abl.)</b>: en</div><div><b>incendō, -is, -ere, incendī, incēnsum</b>: encender, inflamar</div><div><b>ipse, ipsa, ipsum</b>: él mismo, ella misma</div><div><b>mandō, -is, -ere, mandī, mānsum</b>: masticar, devorar</div><div><b>medius, -a, -um</b>: medio</div><div><b>metus, -ūs, m.</b>: miedo</div><div><b>minor, minus</b>: menor</div><div><b>mollis, -e</b>: blando, tierno</div><div><b>multus, -a, -um</b>: mucho, numeroso</div><div><b>mūtus, -a, -um</b>: mudo</div><div><b>nec</b>: y no, ni</div><div><b>nōmen, -inis, n.</b>: nombre</div><div><b>ōs, ōris, n.</b>: boca</div><div><b>pecus, -oris, n.</b>: ganado, rebaño</div><div><b>perfurō, -is, -ere</b>: enfurecerse</div><div><b>plēbs, plēbis, f.</b>: plebe, gente común</div><div><b>-que</b>: y</div><div><b>sine (prep. + abl.)</b>: sin</div><div><b>suādeō, -ēs, -ēre, suāsī, suāsum</b>: empujar, aconsejar</div><div><b>trahō, -is, -ere, trāxī, tractum</b>: arrastrar</div><div><b>vēsānus, -a, -um</b>: furioso</div>", "notes": "<div>El león del símil y Euríalo comparten una boca ensangrentada. ¿Dónde termina el león y dónde empieza Euríalo? Marcá el punto exacto en el latín y decí si el corte es limpio.</div><div>↔ 10.723-729 (el mismo paréntesis, palabra por palabra).</div><ul><li><i>ceu</i>, «como», abre el símil; <i>nec minor Euryali caedes</i> lo cierra: «y no es menor la matanza de Euríalo».</li><li><i>(suadet enim vesana fames)</i>: «pues lo empuja un hambre loca». El león tiene excusa: ¿y Euríalo?</li><li><i>manditque trahitque</i>: «y muerde y arrastra». <i>sine nomine plebem</i>: a los que mata ni se los nombra.</li></ul>", "hl": {}, "fx": {"7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b"}, "ul": {"3": "b", "7": "r", "8": "r", "9": "r", "10": "r", "18": "b", "23": "b", "33": "b", "34": "b"}, "lk": {}}, {"id": "a9-349-350", "ref": "9.349-350", "lines": ["Purpuream vomit ille animam et cum sanguine mixta", "vina refert moriens; hic furto fervidus instat."], "trans": "Y Reto arroja a bocanadas su purpúrea vida y expirando<div>despide olas de sangre envuelta en vino. Euríalo prosigue enardecido</div><div>su furtivo estrago.<br><mark class=\"c-y\">REVISAR TRADUCCIÓN!</mark></div>", "gloss": "<div><b>anima, -ae, f.</b>: alma, aliento vital</div><div><b>cum (prep. + abl.)</b>: con</div><div><b>et</b>: y</div><div><b>fervidus, -a, -um</b>: ardiente</div><div><b>fūrtum, -ī, n.</b>: robo, acción furtiva</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>ille, illa, illud</b>: aquel, aquella, aquello</div><div><b>īnstō, -ās, -āre, īnstitī</b>: acosar, insistir</div><div><b>misceō, -ēs, -ēre, miscuī, mixtum</b>: mezclar</div><div><b>morior, -eris, morī, mortuus sum</b>: morir</div><div><b>purpureus, -a, -um</b>: purpúreo, rojo</div><div><b>referō, refers, referre, rettulī, relātum</b>: devolver, echar</div><div><b>sanguis, -inis, m.</b>: sangre</div><div><b>vīnum, -ī, n.</b>: vino</div><div><b>vomō, -is, -ere, vomuī, vomitum</b>: vomitar</div>", "notes": "<div>Reto muere vomitando tres cosas mezcladas. ¿Cuáles son, y cuál de las tres no es un líquido? ¿Qué le pasa a la idea de «alma» cuando se la puede vomitar?</div><div>↔ 10.346-349 (Dríope: voz, alma y sangre).</div><ul><li><i>purpuream… animam</i>: adjetivo y sustantivo separados por el verbo; el color de la sangre se le pasa al alma.</li><li><i>cum sanguine mixta vina</i>: «vinos mezclados con sangre»: lo mataron borracho y dormido.</li><li><i>ille… hic</i>: «aquel» (el que muere) y «este» (Euríalo, que sigue): dos pronombres para separarlos.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b"}, "ul": {"0": "r", "1": "r", "2": "r", "3": "r", "6": "b"}, "lk": {}}, {"id": "a9-354-356", "ref": "9.354-356", "lines": ["sensit enim nimia caede atque cupidine ferri:", "Absistamus, ait, nam lux inimica propinquat.", "Poenarum exhaustum satis est, via facta per hostis."], "trans": "&nbsp;pues ya se iba dejando arrebatar<div>del furor desmedido de matanza: «Cesemos ya. Se acerca la funesta luz del día.</div><div>Ya nos hemos tomado venganza suficiente.</div><div>Está franco el camino a través del enemigo».</div>", "gloss": "<div><b>factus, -a, -um</b>: hecho, abierto</div><div><b>hostis, -is, m.</b>: enemigo</div><div><b>inimīcus, -a, -um</b>: enemigo, hostil</div><div><b>lūx, lūcis, f.</b>: luz</div><div><b>nam</b>: pues</div><div><b>per (prep. + acus.)</b>: a través de</div><div><b>propinquō, -ās, -āre, -āvī, -ātum</b>: acercarse</div><div><b>via, -ae, f.</b>: camino</div>", "notes": "<div>Niso frena a Euríalo. ¿Lo frena porque matar está mal o por otra razón? Compará la razón que da Niso en su discurso con la que da el narrador en el primer verso.</div><div>↔ 10.495-500 y 10.501-505 (Turno, que no frena).</div><ul><li><i>nimia caede atque cupidine</i>: ablativos: «por demasiada matanza y deseo». <i>Cupido</i> es la palabra de 9.185.</li><li><i>sensit… ferri</i>: «sintió que [Euríalo] era arrastrado»: <i>ferri</i> es pasivo: algo lo lleva.</li><li><i>Absistamus</i>: «paremos»: Niso se incluye.</li></ul>", "hl": {}, "fx": {"9": "b", "10": "b", "11": "b", "12": "b", "17": "b", "18": "b", "19": "b", "20": "b"}, "ul": {"0": "g", "2": "r", "3": "r", "4": "r", "5": "r", "10": "b", "20": "b"}, "lk": {}}, {"id": "a9-390-393", "ref": "9.390-392", "lines": ["Euryale infelix, qua te regione reliqui?", "Quave sequar, rursus perplexum iter omne revolvens", "fallacis silvae? [...]"], "trans": "«¡Infortunado Euríalo! ¿En dónde te he dejado? ¿Por dónde iré en tu busca<div>desandando la senda enmarañada de este bosque traidor?»</div><div><br></div>", "gloss": "<div><b>Euryalus, -ī, m.</b>: Euríalo</div><div><b>īnfēlīx, -īcis</b>: desdichado</div><div><b>quī, quae, quod (interrog.)</b>: ¿qué?, ¿cuál?</div><div><b>regiō, -ōnis, f.</b>: región, lugar</div><div><b>relinquō, -is, -ere, relīquī, relictum</b>: dejar, abandonar</div><div><b>tū, tuī</b>: tú, vos</div>", "notes": "<div>Niso habla solo en el bosque. ¿A quién le hace las preguntas y quién podría contestarlas? Fijate en qué persona están los verbos.</div><div>↔ 10.666-671 (Turno, también perdido y preguntando).</div><ul><li><i>Euryale infelix</i>: vocativo; Euríalo no está.</li><li><i>reliqui</i>: perfecto de <i>relinquo</i>, 1.ª persona: «te dejé». La pregunta es también una confesión.</li><li><i>qua… quave</i>: «por dónde… o por dónde»; <i>sequar</i>: «¿te seguiré?».</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b"}, "ul": {"0": "r", "1": "r", "2": "r", "3": "r", "4": "r", "5": "r"}, "lk": {}}, {"id": "a9-427-430", "ref": "9.427-430", "lines": ["Me me, adsum qui feci, in me convertite ferrum,", "O Rutuli, mea fraus omnis; nihil iste nec ausus", "nec potuit, caelum hoc et conscia sidera testor,", "tantum infelicem nimium dilexit amicum."], "trans": "&nbsp;«Contra mí, contra mí. Aquí estoy yo, el culpable.<div>Volved contra mí, rútulos, las armas. Toda la culpa es mía.</div><div>Ése ni se ha atrevido ni ha podido hacer nada.</div><div>Invoco por testigos a ese cielo, a esas estrellas</div><div>que saben la verdad.</div><div>Él no ha hecho más que amar en exceso a un amigo infortunado».</div>", "gloss": "<div><b>adsum, ades, adesse, adfuī</b>: estar presente</div><div><b>amīcus, -ī, m.</b>: amigo</div><div><b>audeō, -ēs, -ēre, ausus sum</b>: atreverse</div><div><b>caelum, -ī, n.</b>: cielo</div><div><b>cōnscius, -a, -um</b>: cómplice, testigo</div><div><b>convertō, -is, -ere, convertī, conversum</b>: volver, dirigir</div><div><b>dīligō, -is, -ere, dīlēxī, dīlēctum</b>: amar, querer</div><div><b>ego, meī</b>: yo</div><div><b>et</b>: y</div><div><b>faciō, -is, -ere, fēcī, factum</b>: hacer</div><div><b>ferrum, -ī, n.</b>: hierro, espada</div><div><b>fraus, fraudis, f.</b>: engaño</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>in (prep. + acus.)</b>: contra</div><div><b>īnfēlīx, -īcis</b>: desdichado</div><div><b>iste, ista, istud</b>: ese</div><div><b>meus, -a, -um</b>: mío</div><div><b>nec</b>: y no, ni</div><div><b>nihil</b>: nada</div><div><b>nimium (adv.)</b>: demasiado</div><div><b>ō</b>: ¡oh!</div><div><b>omnis, -e</b>: todo</div><div><b>possum, potes, posse, potuī</b>: poder</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>Rutulī, -ōrum, m. pl.</b>: los rútulos</div><div><b>sīdus, -eris, n.</b>: astro, estrella</div><div><b>tantum (adv.)</b>: solamente</div><div><b>testor, -āris, -ārī, testātus sum</b>: poner por testigo</div>", "notes": "<div>Contá los <i>me</i>, <i>mea</i>, <i>in me</i> de los dos primeros versos. ¿Qué busca Niso con esa insistencia, y con qué palabras define al final lo que hizo Euríalo? ¿Es una defensa o una declaración?</div><div>↔ 10.441-443 (Turno también dice «yo solo», para otra cosa).</div><ul><li><i>Me, me… in me</i>: acusativos sin verbo: la frase arranca antes de armarse.</li><li><i>convertite</i>: imperativo plural; <i>O Rutuli</i>, vocativo.</li><li><i>nimium dilexit</i>: perfecto de <i>diligo</i>, «amó demasiado». <i>Nimium</i> retoma el exceso de 9.354 (<i>nimia caede</i>).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b"}, "ul": {"0": "r", "1": "r", "2": "r", "3": "r", "4": "r", "12": "b", "19": "g", "24": "b", "26": "r", "27": "r", "28": "r", "29": "r", "30": "r"}, "lk": {}}, {"id": "a9-433-437", "ref": "9.433-437", "lines": ["Volvitur Euryalus leto, pulchrosque per artus", "it cruor, inque umeros cervix conlapsa recumbit:", "purpureus veluti cum flos succisus aratro", "languescit moriens lassove papavera collo", "demisere caput, pluvia cum forte gravantur."], "trans": "Rueda a la muerte Euríalo: por sus hermosos miembros<div>La sangre va fluyendo y el cuello desmayado se rinde sobre el pecho</div><div>como la purpúrea flor segada por la reja del arado,</div><div>que al morir, languidece, o las amapolas, fatigado su tallo,</div><div>inclinan su cabeza bajo el peso de una racha de lluvia.</div><div><br></div>", "gloss": "<div><b>arātrum, -ī, n.</b>: arado</div><div><b>artus, -ūs, m.</b>: miembro (del cuerpo)</div><div><b>caput, -itis, n.</b>: cabeza</div><div><b>cervīx, -īcis, f.</b>: cuello, nuca</div><div><b>collum, -ī, n.</b>: cuello</div><div><b>conlābor, -eris, -ī, conlāpsus sum</b>: caer, desplomarse</div><div><b>cruor, -ōris, m.</b>: sangre derramada</div><div><b>cum (conj.)</b>: cuando</div><div><b>dēmittō, -is, -ere, dēmīsī, dēmissum</b>: bajar, dejar caer</div><div><b>eō, īs, īre, iī, itum</b>: ir, correr</div><div><b>Euryalus, -ī, m.</b>: Euríalo</div><div><b>flōs, flōris, m.</b>: flor</div><div><b>forte (adv.)</b>: por casualidad</div><div><b>gravō, -ās, -āre, -āvī, -ātum</b>: cargar, pesar sobre</div><div><b>in (prep. + acus.)</b>: sobre, hacia</div><div><b>languēscō, -is, -ere, languī</b>: languidecer, marchitarse</div><div><b>lassus, -a, -um</b>: cansado</div><div><b>lētum, -ī, n.</b>: muerte</div><div><b>morior, -eris, morī, mortuus sum</b>: morir</div><div><b>papāver, -eris, n.</b>: amapola</div><div><b>per (prep. + acus.)</b>: por</div><div><b>pluvia, -ae, f.</b>: lluvia</div><div><b>pulcher, -chra, -chrum</b>: hermoso</div><div><b>purpureus, -a, -um</b>: purpúreo, rojo</div><div><b>-que</b>: y</div><div><b>recumbō, -is, -ere, recubuī</b>: recostarse, caer</div><div><b>succīdō, -is, -ere, succīdī, succīsum</b>: cortar por abajo</div><div><b>umerus, -ī, m.</b>: hombro</div><div><b>-ve</b>: o</div><div><b>velutī</b>: como</div><div><b>volvō, -is, -ere, volvī, volūtum (volvitur: rueda)</b>: hacer rodar</div>", "notes": "<div>Para contar una muerte violenta Virgilio elige dos flores. ¿Qué tienen en común el arado y la lluvia, y en qué se diferencian? ¿Cuál de las dos se parece más a lo que le pasó a Euríalo?</div><div>↔ 10.486-489 (Palante muere sin símil).</div><ul><li><i>veluti cum…</i>: «como cuando»: abre el símil, que es doble (<i>flos… papavera</i>).</li><li><i>pulchros per artus it cruor</i>: «la sangre va por los hermosos miembros». El adjetivo de 9.179 (<i>pulchrior</i>) vuelve en el cadáver.</li><li><i>moriens</i>: participio presente, «muriendo». Está también en 9.350 y en 10.489.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b"}, "ul": {"7": "b", "10": "b", "13": "r", "14": "r", "15": "r", "16": "r", "17": "r", "18": "r", "24": "g", "25": "b"}, "lk": {}}, {"id": "a9-444-449", "ref": "9.441-449", "lines": ["[...]Instat non setius ac rotat ensem", "fulmineum, donec Rutuli clamantis in ore", "condidit adverso et moriens animam abstulit hosti.", "Tum super exanimum sese proiecit amicum", "confossus placidaque ibi demum morte quievit.", "Fortunati ambo! Siquid mea carmina possunt,", "nulla dies umquam memori vos eximet aevo,", "dum domus Aeneae Capitoli immobile saxum", "accolet imperiumque pater Romanus habebit."], "trans": "Pero él no cede en su coraje; gira que gira en derredor el rayo de su espada<div>hasta que al fin de frente se la entierra en la boca del rútulo</div><div>que prorrumpía en gritos y así al morir arranca la vida a su enemigo.&nbsp;</div><div>Y acribillado a heridas se desploma sobre el cuerpo sin vida de su amigo</div><div>y allí al fin halla paz en el dulce sosiego de la muerte.</div><div>¡Pareja afortunada! Si algo pueden mis versos,</div><div>ningún día borrará vuestros nombres</div><div>del recuerdo del tiempo mientras more el linaje de Eneas</div><div>en la firme roca del Capitolio</div><div>y siga el Padre de Roma manteniendo su poder.</div><div><br></div>", "gloss": "<div><b>ac</b>: y</div><div><b>adversus, -a, -um</b>: de frente</div><div><b>aevum, -ī, n.</b>: tiempo, época</div><div><b>ambō, -ae, -ō</b>: ambos</div><div><b>amīcus, -ī, m.</b>: amigo</div><div><b>anima, -ae, f.</b>: alma, aliento vital</div><div><b>auferō, aufers, auferre, abstulī, ablātum</b>: quitar, arrebatar</div><div><b>carmen, -inis, n.</b>: canto, poema</div><div><b>clāmō, -ās, -āre, -āvī, -ātum</b>: gritar</div><div><b>condō, -is, -ere, condidī, conditum</b>: hundir, clavar</div><div><b>cōnfodiō, -is, -ere, cōnfōdī, cōnfossum</b>: atravesar</div><div><b>dēmum (adv.)</b>: por fin</div><div><b>diēs, -ēī, m./f.</b>: día</div><div><b>dōnec</b>: hasta que</div><div><b>ēnsis, -is, m.</b>: espada</div><div><b>et</b>: y</div><div><b>exanimis, -e</b>: sin vida</div><div><b>eximō, -is, -ere, exēmī, exēmptum</b>: sacar, quitar</div><div><b>fortūnātus, -a, -um</b>: afortunado</div><div><b>fulmineus, -a, -um</b>: fulminante, como un rayo</div><div><b>hostis, -is, m.</b>: enemigo</div><div><b>ibi (adv.)</b>: allí</div><div><b>in (prep. + abl.)</b>: en</div><div><b>memor, -oris</b>: que recuerda</div><div><b>meus, -a, -um</b>: mío</div><div><b>morior, -eris, morī, mortuus sum</b>: morir</div><div><b>mors, mortis, f.</b>: muerte</div><div><b>nōn</b>: no</div><div><b>nūllus, -a, -um</b>: ninguno</div><div><b>ōs, ōris, n.</b>: boca</div><div><b>placidus, -a, -um</b>: tranquilo, sereno</div><div><b>possum, potes, posse, potuī</b>: poder</div><div><b>prōiciō, -is, -ere, prōiēcī, prōiectum</b>: arrojar; (con sē) echarse</div><div><b>-que</b>: y</div><div><b>quiēscō, -is, -ere, quiēvī, quiētum</b>: descansar</div><div><b>rotō, -ās, -āre, -āvī, -ātum</b>: hacer girar, blandir</div><div><b>Rutulus, -ī, m.</b>: rútulo</div><div><b>sē, suī</b>: se, a sí mismo</div><div><b>sētius (adv.)</b>: menos (nōn sētius: igualmente)</div><div><b>sīquid (sī quid)</b>: si en algo</div><div><b>super (prep. + acus.)</b>: sobre, encima de</div><div><b>tum (adv.)</b>: entonces</div><div><b>umquam</b>: alguna vez, jamás</div><div><b>vōs, vestrum</b>: ustedes</div>", "notes": "<div>En el verso 446 el relato se interrumpe y habla otro. ¿Quién dice <i>mea carmina</i> y qué promete? Leé las condiciones con cuidado: ¿hasta cuándo vale la promesa?</div><div>↔ 10.791-793 (la misma promesa, con otra condición).</div><ul><li><i>Fortunati ambo!</i>: exclamación dirigida a ellos; <i>vos</i> (447) lo confirma.</li><li><i>Siquid mea carmina possunt</i>: «si algo pueden mis versos»: una promesa con «si».</li><li><i>dum… accolet… habebit</i>: futuros: «mientras habite… y tenga». La memoria dura lo que dure Roma.</li></ul>", "hl": {}, "fx": {"1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b"}, "ul": {"5": "b", "11": "b", "12": "g", "17": "g", "23": "g", "29": "b", "30": "g", "31": "r", "32": "r", "33": "r", "34": "r", "35": "r", "36": "r", "38": "b"}, "lk": {}}, {"id": "a9-465-472", "ref": "9.465-472", "lines": ["Quin ipsa arrectis (visu miserabile) in hastis", "praefigunt capita et multo clamore sequuntur", "Euryali et Nisi.", "Aeneadae duri murorum in parte sinistra", "opposuere aciem, nam dextera cingitur amni,", "ingentisque tenent fossas et turribus altis", "stant maesti; simul ora virum praefixa movebant,", "nota nimis miseris atroque fluentia tabo."], "trans": "Aún más: en sus enhiestas picas —apena contemplarlo—<div>enclavan las cabezas de Euríalo y de Niso y con grandes gritos van siguiéndolas.</div><div>Los tenaces Enéadas han montado su frente en el costado izquierdo de los muros,</div><div>pues el derecho lo rodea el río. Guardan sus anchos fosos</div><div>y están firmes en lo alto de sus torres con el rostro sombrío.</div><div>Les conmueven el alma las cabezas de los suyos clavadas en la punta de las picas</div><div>—de sobra conocidas por los infortunados— que van manando sangre corrompida.</div>", "gloss": "<div><b>arrigō, -is, -ere, arrēxī, arrēctum</b>: levantar, erguir</div><div><b>caput, -itis, n.</b>: cabeza</div><div><b>clāmor, -ōris, m.</b>: grito</div><div><b>et</b>: y</div><div><b>Euryalus, -ī, m.</b>: Euríalo</div><div><b>hasta, -ae, f.</b>: lanza</div><div><b>in (prep. + abl.)</b>: en</div><div><b>ipse, ipsa, ipsum</b>: él mismo, ella misma</div><div><b>miserābilis, -e</b>: digno de lástima</div><div><b>multus, -a, -um</b>: mucho</div><div><b>Nīsus, -ī, m.</b>: Niso</div><div><b>praefīgō, -is, -ere, praefīxī, praefīxum</b>: clavar en la punta</div><div><b>quīn</b>: más aún</div><div><b>sequor, -eris, sequī, secūtus sum</b>: seguir</div><div><b>vīsus, -ūs, m. (vīsū miserābile: penoso de ver)</b>: vista</div>", "notes": "<div>El paréntesis <i>(visu miserabile)</i> le dice al lector cómo mirar. ¿Quiénes más miran en este pasaje y qué hacen con lo que ven? ¿Por qué no hacen nada?</div><div>↔ 10.755-759 (ahora los que miran son los dioses) y 10.515-520.</div><ul><li><i>praefigunt… sequuntur</i>: el sujeto son los rútulos; <i>Euryali et Nisi</i>, genitivos, llegan recién en el verso siguiente.</li><li><i>stant maesti</i>: «están de pie, tristes»: un verbo de quietud para los troyanos.</li><li><i>nota nimis miseris</i>: «demasiado conocidas para los desdichados»; <i>miseris</i>, dativo.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b"}, "ul": {"3": "r", "4": "r", "8": "b", "11": "b", "20": "b", "22": "g", "27": "b", "32": "b"}, "lk": {}}, {"id": "a9-481-484", "ref": "9.481-484", "lines": ["Hunc ego te, Euryale, aspicio? Tune illa senectae", "sera meae requies, potuisti linquere solam,", "crudelis? Nec te, sub tanta pericula missum,", "adfari extremum miserae data copia matri?"], "trans": "«¡Euríalo! ¿Eres tú lo que estoy viendo? Pero tú, aquel tardío consuelo de mis años,<div>¿has podido, cruel, dejarme sola? Al mandarte a tan grandes peligros</div><div>ni siquiera ha logrado darte el último adiós tu pobre madre.</div>", "gloss": "<div><b>aspiciō, -is, -ere, aspexī, aspectum</b>: mirar, ver</div><div><b>crūdēlis, -e</b>: cruel</div><div><b>ego, meī</b>: yo</div><div><b>Euryalus, -ī, m.</b>: Euríalo</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>ille, illa, illud</b>: aquel, aquella, aquello</div><div><b>linquō, -is, -ere, līquī</b>: dejar, abandonar</div><div><b>meus, -a, -um</b>: mío</div><div><b>-ne</b>: partícula interrogativa</div><div><b>possum, potes, posse, potuī</b>: poder</div><div><b>requiēs, -ētis, f.</b>: descanso, consuelo</div><div><b>senecta, -ae, f.</b>: vejez</div><div><b>sērus, -a, -um</b>: tardío</div><div><b>sōlus, -a, -um</b>: solo</div><div><b>tū, tuī</b>: tú, vos</div>", "notes": "<div>La madre le habla a Euríalo como si pudiera contestarle. Seguí en el latín, de la primera a la última, todas las palabras con que lo nombra o lo señala. ¿En qué se convierte el hijo a lo largo de cuatro versos?</div><div>↔ 10.846-852 (Mezencio ante el cadáver de Lauso).</div><ul><li>Es un apóstrofe: le habla a un «tú» que ya no puede responder, como en las <i>Heroidas</i>. La madre le reprocha al hijo (<i>crudelis</i>).</li><li><i>Hunc ego te… aspicio?</i>: <i>hunc</i> y <i>te</i> son el mismo acusativo. Literal: «¿a este te veo?», es decir, «¿esto sos vos?».</li><li><i>Tune… potuisti</i>: <i>tu</i> + <i>-ne</i> interrogativo; <i>potuisti</i>, perfecto de <i>possum</i>. <i>Euryale</i>, vocativo.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b"}, "ul": {"5": "r", "6": "r", "7": "r", "8": "r", "9": "r", "10": "r", "11": "g", "26": "b"}, "lk": {}}, {"id": "a9-485-489", "ref": "9.485-489", "lines": ["Heu, terra ignota canibus data praeda Latinis", "alitibusque iaces, nec te, tua funera mater", "produxi pressive oculos aut volnera lavi,", "veste tegens, tibi quam noctes festina diesque", "urgebam et tela curas solabar anilis."], "trans": "¡Ay! Yaces en tierra extraña echado como presa a los perros<div>y a las aves del Lacio. Y yo, tu madre, no he ido</div><div>a llevarte a la pira ni he cerrado tus ojos, ni he lavado tus heridas</div><div>ni ha podido cubrirte ese vestido que de día y de noche,</div><div>desalada, para ti apresuraba, con lo que en el telar</div><div>iba aliviando mis afanes de anciana.&nbsp;</div>", "gloss": "<div><b>āles, -itis, m./f.</b>: ave</div><div><b>canis, -is, m./f.</b>: perro</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>heu</b>: ¡ay!</div><div><b>iaceō, -ēs, -ēre, iacuī</b>: yacer</div><div><b>ignōtus, -a, -um</b>: desconocido</div><div><b>Latīnus, -a, -um</b>: latino</div><div><b>praeda, -ae, f.</b>: presa</div><div><b>-que</b>: y</div><div><b>terra, -ae, f.</b>: tierra</div>", "notes": "<div>La madre enumera lo que no pudo hacer por el cuerpo. Ordená los gestos: ¿cuál es el último y qué objeto aparece ahí? ¿Qué cambia cuando sabés que ese objeto era para un vivo?</div><div>↔ 10.815-820 (otra tela, hecha por otra madre) y 10.779-782 (morir en tierra ajena).</div><ul><li><i>nec… produxi pressive… aut… lavi</i>: tres perfectos en 1.ª persona, los tres negados.</li><li><i>terra ignota</i>: ablativo, «en tierra desconocida»; <i>canibus… alitibusque</i>, dativos: «dado como presa a los perros y a las aves».</li><li><i>tibi quam… urgebam</i>: imperfecto: lo que venía haciendo «de noche y de día» para él.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b"}, "ul": {"3": "b", "7": "b", "9": "r", "10": "r", "11": "r", "12": "r", "13": "r", "14": "r", "15": "g", "18": "b", "19": "g", "20": "b", "24": "b"}, "lk": {}}, {"id": "a9-493-499", "ref": "9.493-499", "lines": ["Figite me, siqua est pietas, in me omnia tela", "conicite, o Rutuli, me primam absumite ferro:", "aut tu, magne pater divom, miserere tuoque", "invisum hoc detrude caput sub Tartara telo,", "quando aliter nequeo crudelem abrumpere vitam.", "Hoc fletu concussi animi, maestusque per omnis", "it gemitus: torpent infractae ad proelia vires."], "trans": "&nbsp;¡Heridme a mí, si os queda un resto de piedad,<div>arrojad, rútulos, contra mí todos los dardos,</div><div>aniquiladme a mí con vuestro hierro</div><div>antes que a ningún otro. O ten piedad de mí, tú, padre de los dioses poderoso,</div><div>y precipita esta odiosa cabeza con tu rayo en el Tártaro, pues no puedo romper</div><div>de otro modo los lazos de esta vida tan cruel!</div><div>[Este llanto estremeció los ánimos y un gemido de tristeza corre por todos: quebradas, las fuerzas se entumecen para el combate. — vv. 498-499, traducción propia, no de Echave-Sustaeta]</div>", "gloss": "<div><b>absūmō, -is, -ere, absūmpsī, absūmptum</b>: matar, consumir</div><div><b>ad (prep. + acus.)</b>: para, hacia</div><div><b>animus, -ī, m.</b>: ánimo</div><div><b>concutiō, -is, -ere, concussī, concussum</b>: sacudir, conmover</div><div><b>coniciō, -is, -ere, coniēcī, coniectum</b>: arrojar</div><div><b>ego, meī</b>: yo</div><div><b>eō, īs, īre, iī, itum</b>: ir, correr</div><div><b>ferrum, -ī, n.</b>: hierro, espada</div><div><b>fīgō, -is, -ere, fīxī, fīxum</b>: atravesar</div><div><b>flētus, -ūs, m.</b>: llanto</div><div><b>gemitus, -ūs, m.</b>: gemido</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>in (prep. + acus.)</b>: contra</div><div><b>īnfringō, -is, -ere, īnfrēgī, īnfrāctum</b>: quebrar</div><div><b>maestus, -a, -um</b>: triste</div><div><b>ō</b>: ¡oh!</div><div><b>omnis, -e</b>: todo</div><div><b>per (prep. + acus.)</b>: por, a través de</div><div><b>pietās, -ātis, f.</b>: piedad</div><div><b>prīmus, -a, -um</b>: primero</div><div><b>proelium, -iī, n.</b>: combate</div><div><b>-que</b>: y</div><div><b>quis, qua, quid (indef.)</b>: alguno, alguna</div><div><b>Rutulī, -ōrum, m. pl.</b>: los rútulos</div><div><b>sī</b>: si</div><div><b>sum, es, esse, fuī</b>: ser, haber</div><div><b>tēlum, -ī, n.</b>: dardo, arma arrojadiza</div><div><b>torpeō, -ēs, -ēre</b>: entumecerse, paralizarse</div><div><b>vīs, f. (pl. vīrēs)</b>: fuerza</div>", "notes": "<div>La madre usa la palabra <i>pietas</i> para pedir que la maten. ¿Qué significa <i>pietas</i> ahí? Después leé los dos últimos versos: ¿qué efecto tiene su discurso y por qué eso es un problema militar?</div><div>↔ 10.901-908 (Mezencio también le pide algo al enemigo antes de morir).</div><ul><li><i>Figite… conicite… absumite</i>: tres imperativos plurales a los rútulos; después <i>miserere… detrude</i>, en singular, a Júpiter.</li><li><i>me primam</i>: «a mí primera», en femenino: se pone delante de todos.</li><li><i>torpent… vires</i>: «las fuerzas se entumecen»: el sujeto es <i>vires</i>.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b"}, "ul": {"2": "r", "3": "r", "4": "r", "19": "b", "26": "b", "45": "r", "46": "r", "47": "r", "48": "r", "49": "r"}, "lk": {}}, {"id": "a9-614-620", "ref": "9.614-620", "lines": ["Vobis picta croco et fulgenti murice vestis,", "desidiae cordi, iuvat indulgere choreis,", "et tunicae manicas et habent redimicula mitrae.", "O vere Phrygiae, neque enim Phryges, ite per alta", "Dindyma ubi adsuetis biforem dat tibia cantum!", "Tympana vos buxusque vocat Berecyntia Matris", "Idaeae sinite arma viris et cedite ferro."], "trans": "Vosotros os vestís de bordado azafrán y de brillante púrpura.<div>Hace vuestras delicias la indolencia. Os agrada entregaros a la danza.</div><div>Alargáis vuestras túnicas con mangas, ornáis vuestros turbantes con cintillos.</div><div>¡Ea, mujeres frigias, pues no sois hombres frigios,</div><div>volveos a las cumbres de Díndima,</div><div>donde tan bien sabéis del doble son que emite vuestra flauta!</div><div>¡Os están llamando los timbales y el berecintio boj de la Madre del Ida!</div><div>¡Dejadles a los hombres las armas, renunciad a las espadas!»</div>", "gloss": "<div><b>altus, -a, -um (alta, n. pl.: las alturas)</b>: alto</div><div><b>arma, -ōrum, n. pl.</b>: armas</div><div><b>Berecyntius, -a, -um</b>: del Berecinto</div><div><b>buxus, -ī, f.</b>: boj; flauta de boj</div><div><b>cēdō, -is, -ere, cessī, cessum</b>: retirarse, ceder ante</div><div><b>Dindyma, -ōrum, n. pl.</b>: el Díndimo (monte)</div><div><b>enim</b>: pues</div><div><b>eō, īs, īre, iī, itum</b>: ir</div><div><b>et</b>: y</div><div><b>ferrum, -ī, n.</b>: hierro, espada</div><div><b>Īdaeus, -a, -um</b>: del Ida</div><div><b>māter, mātris, f.</b>: madre</div><div><b>neque</b>: y no, ni</div><div><b>ō</b>: ¡oh!</div><div><b>per (prep. + acus.)</b>: por</div><div><b>Phrygius, -a, -um</b>: frigio</div><div><b>Phryx, Phrygis, m.</b>: frigio</div><div><b>-que</b>: y</div><div><b>sinō, -is, -ere, sīvī, situm</b>: dejar, permitir</div><div><b>tympanum, -ī, n.</b>: pandero</div><div><b>vērē (adv.)</b>: verdaderamente</div><div><b>vir, virī, m.</b>: hombre, varón</div><div><b>vocō, -ās, -āre, -āvī, -ātum</b>: llamar</div><div><b>vōs, vestrum</b>: ustedes</div>", "notes": "<div>Numano insulta a los troyanos con ropa, con música y con una desinencia. Encontrá la palabra en la que cambia el género de los insultados. ¿Qué idea de «varón» defiende, y qué personaje del libro IX no entraría en ella?</div><div>↔ sin par en el libro X; dentro del IX, 9.176-183 (Euríalo, el más hermoso).</div><ul><li><i>O vere Phrygiae, neque enim Phryges</i>: <i>Phrygiae</i> es femenino plural; <i>Phryges</i>, masculino: «frigias, que no frigios».</li><li><i>Vobis… vestis</i>: <i>vobis</i>, dativo: «ustedes tienen ropa…». Es el mismo dativo de <i>his amor unus erat</i> (9.182).</li><li><i>ite… sinite… cedite</i>: imperativos; <i>viris</i>, dativo: «dejen las armas a los varones».</li></ul>", "hl": {}, "fx": {"19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b"}, "ul": {"5": "b", "19": "r", "20": "r", "21": "r", "22": "r", "23": "r", "24": "r", "40": "b"}, "lk": {}}, {"id": "a9-774-777", "ref": "9.774-777", "lines": ["et Clytium Aeoliden et amicum Crethea Musis,", "Crethea Musarum comitem, cui carmina semper", "et citharae cordi numerosque intendere nervis.", "Semper equos atque arma virum pugnasque canebat."], "trans": "Y a Clicio, hijo de Eolo, a Creteo, delicia de las musas, el que hacía a las musas compañía.<div>Tenía su amor puesto en los versos y las cítaras y en templar los tonos en las cuerdas.</div><div>Siempre cantaba cantos de corceles y de armas y de héroes y batallas.</div>", "gloss": "<div><b>arma, -ōrum, n. pl.</b>: armas</div><div><b>atque</b>: y</div><div><b>canō, -is, -ere, cecinī, cantum</b>: cantar</div><div><b>equus, -ī, m.</b>: caballo</div><div><b>pugna, -ae, f.</b>: combate</div><div><b>-que</b>: y</div><div><b>semper</b>: siempre</div><div><b>vir, virī, m. (gen. pl. virum)</b>: hombre</div>", "notes": "<div>Entre los muertos de Turno hay un poeta. ¿Qué cantaba Creteo? Compará su repertorio con las primeras palabras de la <i>Eneida</i> y sacá una conclusión sobre quién acaba de morir.</div><div>↔ 10.198-203 (Mantua: otro lugar donde el poeta se asoma).</div><ul><li><i>Crethea… Crethea</i>: el nombre repetido, en acusativo (forma griega): es objeto de un verbo anterior, «mató a…».</li><li><i>cui… cordi</i>: «a quien le eran queridos» los cantos y las cítaras; <i>cui</i>, dativo del relativo.</li><li><i>canebat</i>: imperfecto: «cantaba siempre». <i>arma virum</i>: ¿te suena?</li></ul>", "hl": {}, "fx": {"19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b"}, "ul": {"11": "b", "19": "r", "20": "r", "21": "r", "22": "r", "23": "r", "24": "r", "25": "r"}, "lk": {}}, {"id": "a10-198-203", "ref": "10.198-203", "lines": ["Ille etiam patriis agmen ciet Ocnus ab oris,", "fatidicae Mantus et Tusci filius amnis,", "qui muros matrisque dedit tibi, Mantua, nomen,", "Mantua, dives avis; sed non genus omnibus unum:", "gens illi triplex, populi sub gente quaterni,", "ipsa caput populis, Tusco de sanguine vires."], "trans": "También llama a las armas a su hueste de las riberas de su tierra patria<div>el célebre Ocno, el hijo de la adivina Manto y del río toscano,</div><div>el que te ha dado Mantua con tus muros, el nombre de tu madre,</div><div>Mantua, la bien dotada de ascendientes, pero no todos ellos de un linaje,</div><div>pues las razas son tres, dividida cada una en cuatro pueblos.</div><div>Es ella la cabeza, pero el vigor le viene de su sangre toscana.</div>", "gloss": "", "notes": "<div>En pleno catálogo de guerreros el narrador le habla a una ciudad. ¿A cuál, cuántas veces la nombra y por qué justo a esa? (Pista: averiguá dónde nació Virgilio.)</div><div>↔ 9.774-777 (Creteo, el poeta que muere en el poema).</div><ul><li><i>tibi, Mantua… Mantua</i>: vocativo repetido; <i>tibi</i>, dativo: «te dio a vos».</li><li><i>dedit</i>: perfecto de <i>do</i>: Ocno le dio a la ciudad los muros y el nombre de su madre, Manto.</li><li><i>non genus omnibus unum</i>: «no todos tienen un solo origen»; <i>omnibus</i>, dativo; falta <i>est</i>.</li></ul>", "hl": {}, "fx": {}, "ul": {"3": "b", "13": "b", "16": "b", "17": "g", "18": "r", "19": "r", "20": "r", "21": "r", "22": "r", "23": "r", "26": "b", "34": "b", "37": "b", "41": "b"}, "lk": {}}, {"id": "a10-228-235", "ref": "10.228-235", "lines": ["tum sic ignarum adloquitur: Vigilasne, deum gens,", "Aenea? Vigila et velis immitte rudentis.", "Nos sumus, Idaeae sacro de vertice pinus,", "nunc pelagi nymphae, classis tua. Perfidus ut nos", "praecipitis ferro Rutulus flammaque premebat,", "rupimus invitae tua vincula teque per aequor", "quaerimus. Hanc Genetrix faciem miserata refecit", "et dedit esse deas aevumque agitare sub undis."], "trans": "«Pero, ¿velas tú, Eneas, vástago divino?<div>Vela y suelta las jarcias a las lonas. Somos tus naves, pinos un día</div><div>de la cumbre sagrada del monte Ida, ahora ninfas marinas.</div><div>Cuando el rútulo traidor nos acosaba a hierro y fuego</div><div>por arrumbarnos de cabeza, rompimos contrariadas las amarras</div><div>con que tú nos ataste y vamos por el mar en busca tuya.</div><div>Se apiadó de nosotras la gran Madre y nos dio esta traza que ves</div><div>y nos hizo la merced de ser diosas y de poder morar bajo las olas.</div>", "gloss": "<div><b>aequor, -oris, n.</b>: mar</div><div><b>aevum, -ī, n.</b>: vida, tiempo</div><div><b>agitō, -ās, -āre, -āvī, -ātum</b>: pasar (la vida)</div><div><b>classis, -is, f.</b>: flota</div><div><b>dē (prep. + abl.)</b>: de, desde</div><div><b>dea, -ae, f.</b>: diosa</div><div><b>dō, dās, dare, dedī, datum</b>: dar; conceder</div><div><b>et</b>: y</div><div><b>faciēs, -ēī, f.</b>: aspecto, forma</div><div><b>genetrix, -īcis, f.</b>: madre</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>Īdaeus, -a, -um</b>: del Ida</div><div><b>invītus, -a, -um</b>: contra su voluntad</div><div><b>misereor, -ērī, miseritus sum</b>: compadecerse</div><div><b>nōs, nostrum</b>: nosotros</div><div><b>nunc</b>: ahora</div><div><b>nympha, -ae, f.</b>: ninfa</div><div><b>pelagus, -ī, n.</b>: mar</div><div><b>per (prep. + acus.)</b>: por</div><div><b>pīnus, -ūs, f.</b>: pino</div><div><b>quaerō, -is, -ere, quaesīvī, quaesītum</b>: buscar</div><div><b>-que</b>: y</div><div><b>reficiō, -is, -ere, refēcī, refectum</b>: rehacer</div><div><b>rumpō, -is, -ere, rūpī, ruptum</b>: romper</div><div><b>sacer, sacra, sacrum</b>: sagrado</div><div><b>sub (prep. + abl.)</b>: bajo</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>tū, tuī</b>: tú, vos</div><div><b>tuus, -a, -um</b>: tuyo</div><div><b>unda, -ae, f.</b>: ola, agua</div><div><b>vertex, -icis, m.</b>: cima</div><div><b>vinculum, -ī, n.</b>: atadura, amarra</div>", "notes": "<div>Las ninfas cuentan en primera persona lo que en el libro IX contó el narrador. ¿Qué agregan sobre cómo lo vivieron? Una sola palabra latina lo dice.</div><div>↔ 9.116-122 (la metamorfosis, vista de afuera).</div><ul><li><i>rupimus invitae tua vincula</i>: perfecto, 1.ª plural; <i>invitae</i>, «contra nuestra voluntad». En 9.118 el verbo era <i>abrumpunt</i>.</li><li><i>Vigilasne…? Vigila</i>: <i>-ne</i> interrogativo y enseguida el imperativo del mismo verbo.</li><li><i>Nos sumus… pinus, nunc… nymphae</i>: lo que eran y lo que son, en la misma frase.</li></ul>", "hl": {}, "fx": {"13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b"}, "ul": {"18": "b", "23": "b", "33": "r", "34": "r", "35": "r", "36": "r", "39": "b", "45": "g", "47": "g"}, "lk": {}}, {"id": "a10-346-349", "ref": "10.346-349", "lines": ["advenit et rigida Dryopem ferit eminus hasta", "sub mentum graviter pressa pariterque loquentis", "vocem animamque rapit traiecto gutture; at ille", "fronte ferit terram et crassum vomit ore cruorem."], "trans": "Avanza [...] y hiere desde lejos<div>con su erizada jabalina a Dríope y se la clava debajo del mentón</div><div>y le horada la garganta y le corta mientras habla la voz al tiempo que la vida.</div><div>Él golpea de frente la tierra y borbotea espesa sangre.</div>", "gloss": "<div><b>adveniō, -īs, -īre, advēnī, adventum</b>: llegar</div><div><b>crassus, -a, -um</b>: espeso</div><div><b>cruor, -ōris, m.</b>: sangre derramada</div><div><b>Dryops, -opis, m.</b>: Dríope</div><div><b>ēminus (adv.)</b>: de lejos</div><div><b>et</b>: y</div><div><b>feriō, -īs, -īre</b>: golpear, herir</div><div><b>frōns, frontis, f.</b>: frente</div><div><b>hasta, -ae, f.</b>: lanza</div><div><b>ille, illa, illud</b>: aquel; él</div><div><b>mentum, -ī, n.</b>: mentón</div><div><b>ōs, ōris, n.</b>: boca</div><div><b>rigidus, -a, -um</b>: rígido, duro</div><div><b>sub (prep. + acus.)</b>: bajo</div><div><b>terra, -ae, f.</b>: tierra</div><div><b>vomō, -is, -ere, vomuī, vomitum</b>: vomitar</div>", "notes": "<div>La lanza le entra a Dríope mientras habla. ¿Qué dos cosas le quita un mismo verbo? ¿Qué dice eso sobre dónde está el alma?</div><div>↔ 9.349-350 (Reto vomita el alma).</div><ul><li><i>vocem animamque rapit</i>: un verbo, dos objetos unidos por <i>-que</i>.</li><li><i>loquentis</i>: participio presente en genitivo: «del que estaba hablando».</li><li><i>vomit ore cruorem</i>: el verbo de 9.349 (<i>vomit… animam</i>). Allá el alma, acá la sangre.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b"}, "ul": {"13": "r", "14": "r", "15": "r", "17": "b", "20": "b", "26": "b", "27": "b"}, "lk": {}}, {"id": "a10-390-396", "ref": "10.390-396", "lines": ["Vos etiam, gemini, Rutulis cecidistis in agris,", "Daucia, Laride Thymberque, simillima proles,", "indiscreta suis gratusque parentibus error;", "at nunc dura dedit vobis discrimina Pallas:", "nam tibi, Thymbre, caput Evandrius abstulit ensis;", "te decisa suum, Laride, dextera quaerit", "semianimesque micant digiti ferrumque retractant."], "trans": "También vosotros dos, Larides y Timbro, los mellizos de Dauco,<div>caísteis en los campos de los rútulos. No hubo dos más iguales.</div><div>Os confundían vuestros mismos padres y su perplejidad les daba gozo.</div><div>Pero Palante sí que os diferencia. Y bien cruel por cierto,</div><div>que a ti, Timbro, la espada de Evandro te cercena la cabeza,</div><div>a ti, Larides, la diestra, que separa de un tajo, continúa buscándote,</div><div>y te vibran los dedos medio muertos y tratan de volver a asir la espada.</div>", "gloss": "<div><b>ager, agrī, m.</b>: campo</div><div><b>at</b>: pero</div><div><b>auferō, aufers, auferre, abstulī, ablātum</b>: quitar, llevarse</div><div><b>cadō, -is, -ere, cecidī, cāsum</b>: caer</div><div><b>caput, -itis, n.</b>: cabeza</div><div><b>Daucius, -a, -um</b>: de Dauco</div><div><b>dēcīdō, -is, -ere, dēcīdī, dēcīsum</b>: cortar</div><div><b>dextera, -ae, f.</b>: mano derecha</div><div><b>digitus, -ī, m.</b>: dedo</div><div><b>discrīmen, -inis, n.</b>: diferencia</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>dūrus, -a, -um</b>: duro, cruel</div><div><b>ēnsis, -is, m.</b>: espada</div><div><b>error, -ōris, m.</b>: confusión</div><div><b>etiam</b>: también</div><div><b>Ēvandrius, -a, -um</b>: de Evandro</div><div><b>ferrum, -ī, n.</b>: hierro, espada</div><div><b>geminus, -a, -um</b>: gemelo</div><div><b>grātus, -a, -um</b>: grato, querido</div><div><b>in (prep. + abl.)</b>: en</div><div><b>indiscrētus, -a, -um</b>: indistinguible</div><div><b>Larīdēs, -ae, m. (voc. Larīde)</b>: Larides</div><div><b>micō, -ās, -āre, micuī</b>: agitarse, temblar</div><div><b>nam</b>: pues</div><div><b>nunc</b>: ahora</div><div><b>Pallās, -antis, m.</b>: Palante</div><div><b>parēns, -entis, m./f.</b>: padre, madre</div><div><b>prōlēs, -is, f.</b>: descendencia, hijos</div><div><b>quaerō, -is, -ere, quaesīvī, quaesītum</b>: buscar</div><div><b>-que</b>: y</div><div><b>retractō, -ās, -āre, -āvī, -ātum</b>: volver a tomar</div><div><b>Rutulus, -a, -um</b>: rútulo</div><div><b>sēmianimis, -e</b>: medio muerto</div><div><b>similis, -e (sup. simillimus)</b>: parecido</div><div><b>suus, -a, -um</b>: suyo, propio</div><div><b>Thymber, -brī, m.</b>: Timbro</div><div><b>tū, tuī</b>: tú, vos</div><div><b>vōs, vestrum</b>: ustedes</div>", "notes": "<div>Los padres no podían distinguir a los gemelos; Palante sí. ¿Cómo los distingue? ¿Por qué el narrador les habla de «vos» mientras los despedaza: qué efecto produce?</div><div>↔ 9.176-183 (Niso y Euríalo, la otra pareja inseparable).</div><ul><li><i>Vos… cecidistis</i>: perfecto de <i>cado</i>
