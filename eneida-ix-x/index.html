, 2.ª plural: el narrador se dirige a los muertos. <i>Laride, Thymbre</i>: vocativos.</li><li><i>gratus… error</i>, «un error grato» para los padres; <i>dura… discrimina</i>, «duras diferencias»: los dos adjetivos se contestan.</li><li><i>te… dextera quaerit</i>: «tu mano te busca»: el sujeto es la mano cortada.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b"}, "ul": {"4": "g", "11": "b", "12": "r", "13": "r", "14": "r", "15": "r", "16": "r", "18": "r", "19": "r", "20": "r", "21": "r", "22": "r", "23": "r", "27": "b", "29": "g", "30": "b"}, "lk": {}}, {"id": "a10-441-443", "ref": "10.441-443", "lines": ["Ut vidit socios: Tempus desistere pugnae;", "solus ego in Pallanta feror, soli mihi Pallas", "debetur; cuperem ipse parens spectator adesset."], "trans": "cuando avista a los suyos: «Es tiempo de interrumpir la lucha», prorrumpe.<br>«Yo solo me enfrento con Palante. Soy yo solo quien tiene derecho a él.<br>Quisiera que su padre estuviera aquí presente»", "gloss": "<div><b>dēbeō, -ēs, -ēre, dēbuī, dēbitum</b>: deber</div><div><b>dēsistō, -is, -ere, dēstitī</b>: dejar de (+ dat.)</div><div><b>ego, meī</b>: yo</div><div><b>ferō, fers, ferre, tulī, lātum (feror: me lanzo)</b>: llevar</div><div><b>in (prep. + acus.)</b>: contra</div><div><b>Pallās, -antis, m. (acus. Pallanta)</b>: Palante</div><div><b>pugna, -ae, f.</b>: combate</div><div><b>socius, -iī, m.</b>: compañero</div><div><b>sōlus, -a, -um</b>: solo</div><div><b>tempus, -oris, n.</b>: momento, tiempo</div><div><b>ut (+ indic.)</b>: cuando</div><div><b>videō, -ēs, -ēre, vīdī, vīsum</b>: ver</div>", "notes": "<div>Turno dice «solo» dos veces en un verso. ¿Qué reclama para sí y qué desea en el último verso? ¿Quién más, en estos dos libros, ve morir a un hijo?</div><div>↔ 9.427-430 (Niso: <i>me, me</i>) y 9.481-484 (la madre que sí ve).</div><ul><li><i>solus ego… soli mihi</i>: el mismo adjetivo en nominativo y en dativo.</li><li><i>Pallas debetur</i>: «Palante se me debe»: lo trata como una deuda.</li><li><i>cuperem… adesset</i>: «querría que estuviera presente»: un deseo, no un hecho.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b"}, "ul": {"1": "g", "3": "b", "6": "r", "7": "r", "8": "r", "9": "r", "10": "r", "11": "r", "12": "r", "13": "r", "14": "r", "17": "b"}, "lk": {}}, {"id": "a10-465-472", "ref": "10.465-472", "lines": ["corde premit gemitum lacrimasque effundit inanis.", "Tum Genitor natum dictis adfatur amicis:", "Stat sua cuique dies, breve et inreparabile tempus", "omnibus est vitae: sed famam extendere factis,", "hoc virtutis opus. Troiae sub moenibus altis", "tot nati cecidere deum; quin occidit una", "Sarpedon, mea progenies. Etiam sua Turnum", "fata vocant, metasque dati pervenit ad aevi."], "trans": "Oyó Alcides al joven y en lo hondo de su pecho ahoga un triste gemido<div>y da suelta a su impotente llanto. En esto le habla a Alcides</div><div>su padre omnipotente con palabras de afecto: «Fijado le está el día a&nbsp;cada cual.</div><div>El plazo de la vida es breve para todos y no es dado reponerlo.</div><div>Pero extender la fama con las obras, esa sí que es empresa de valía.</div><div>Bajo los altos muros de Troya sucumbieron muchos hijos de dioses.</div><div>Cayó allí Sarpedón, el hijo de mi sangre.</div><div>También a Turno le está llamando su hado.</div><div>Ya ha llegado a la meta señalada a su vida»</div>", "gloss": "<div><b>ad (prep. + acus.)</b>: a, hasta</div><div><b>aevum, -ī, n.</b>: vida, tiempo de vida</div><div><b>altus, -a, -um</b>: alto</div><div><b>brevis, -e</b>: breve</div><div><b>cadō, -is, -ere, cecidī, cāsum</b>: caer</div><div><b>deus, -ī, m. (gen. pl. deum)</b>: dios</div><div><b>diēs, -ēī, m./f.</b>: día</div><div><b>dō, dās, dare, dedī, datum (datī: concedido)</b>: dar</div><div><b>et</b>: y</div><div><b>etiam</b>: también</div><div><b>extendō, -is, -ere, extendī, extentum</b>: extender</div><div><b>factum, -ī, n.</b>: hecho</div><div><b>fāma, -ae, f.</b>: fama</div><div><b>fātum, -ī, n.</b>: destino</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>inreparābilis, -e</b>: irrecuperable</div><div><b>mēta, -ae, f.</b>: meta, término</div><div><b>moenia, -ium, n. pl.</b>: murallas</div><div><b>nātus, -ī, m.</b>: hijo</div><div><b>omnis, -e</b>: todo</div><div><b>opus, -eris, n.</b>: obra, tarea</div><div><b>perveniō, -īs, -īre, pervēnī, perventum</b>: llegar</div><div><b>-que</b>: y</div><div><b>quisque, quaeque, quidque</b>: cada uno</div><div><b>sed</b>: pero</div><div><b>stō, stās, stāre, stetī, statum</b>: estar fijado</div><div><b>sub (prep. + abl.)</b>: bajo, al pie de</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>suus, -a, -um</b>: suyo, propio</div><div><b>tempus, -oris, n.</b>: tiempo</div><div><b>tot</b>: tantos</div><div><b>Troia, -ae, f.</b>: Troya</div><div><b>Turnus, -ī, m.</b>: Turno</div><div><b>virtūs, -ūtis, f.</b>: valor</div><div><b>vīta, -ae, f.</b>: vida</div><div><b>vocō, -ās, -āre, -āvī, -ātum</b>: llamar</div>", "notes": "<div>Hércules llora y Júpiter lo consuela con una frase que parece un refrán. Traducila palabra por palabra. ¿Consuela? ¿Qué ofrece a cambio de la muerte, y a quién le sirve esa oferta?</div><div>↔ 9.184-191 (la pregunta de Niso) y 9.441-449 (la fama que promete el narrador).</div><ul><li><i>Stat sua cuique dies</i>: «a cada cual le está fijado su día»; <i>cuique</i>, dativo, como en 9.185 (<i>sua cuique… cupido</i>).</li><li><i>famam extendere factis, hoc virtutis opus</i>: falta <i>est</i>: «extender la fama con hechos: esa [es] la tarea del valor».</li><li><i>cecidere</i> (= <i>ceciderunt</i>), <i>occidit</i>: perfectos: los hijos de dioses que ya cayeron.</li></ul>", "hl": {}, "fx": {"12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b"}, "ul": {"0": "b", "12": "r", "13": "r", "14": "r", "15": "r", "19": "b", "28": "b", "29": "b", "32": "b", "36": "g", "39": "g", "41": "b"}, "lk": {}}, {"id": "a10-486-489", "ref": "10.486-489", "lines": ["Ille rapit calidum frustra de volnere telum:", "una eademque via sanguis animusque sequuntur.", "Corruit in volnus, sonitum super arma dedere", "et terram hostilem moriens petit ore cruento."], "trans": "Palante arranca en vano el hierro de la herida cálida todavía.<div>Por una misma vía se le escapa la sangre con el alma. <br>Se derrueca de bruces sobre la herida. Suenan las armas con estruendo en su caída</div><div>y al expirar golpea la tierra hostil su boca ensangrentada.</div>", "gloss": "<div><b>animus, -ī, m.</b>: alma, vida</div><div><b>arma, -ōrum, n. pl.</b>: armas</div><div><b>calidus, -a, -um</b>: caliente</div><div><b>corruō, -is, -ere, corruī</b>: desplomarse</div><div><b>cruentus, -a, -um</b>: ensangrentado</div><div><b>dē (prep. + abl.)</b>: de, desde</div><div><b>dō, dās, dare, dedī, datum (sonitum dare: resonar)</b>: dar</div><div><b>et</b>: y</div><div><b>frūstrā (adv.)</b>: en vano</div><div><b>hostīlis, -e</b>: enemigo</div><div><b>īdem, eadem, idem</b>: mismo</div><div><b>ille, illa, illud</b>: aquel; él</div><div><b>in (prep. + acus.)</b>: sobre</div><div><b>morior, -eris, morī, mortuus sum</b>: morir</div><div><b>ōs, ōris, n.</b>: boca</div><div><b>petō, -is, -ere, petīvī, petītum</b>: buscar, dirigirse a</div><div><b>-que</b>: y</div><div><b>rapiō, -is, -ere, rapuī, raptum</b>: arrancar</div><div><b>sanguis, -inis, m.</b>: sangre</div><div><b>sequor, -eris, sequī, secūtus sum</b>: seguir</div><div><b>sonitus, -ūs, m.</b>: ruido</div><div><b>super (adv.)</b>: encima</div><div><b>tēlum, -ī, n.</b>: dardo, arma arrojadiza</div><div><b>terra, -ae, f.</b>: tierra</div><div><b>ūnus, -a, -um</b>: uno, único</div><div><b>via, -ae, f.</b>: camino</div><div><b>vulnus (volnus), -eris, n.</b>: herida</div>", "notes": "<div>Palante muere sin símil, sin flor. ¿Qué pone Virgilio en lugar de la comparación? Buscá el verso que dice por dónde salen la sangre y el alma y decidí si para el texto son dos cosas o una.</div><div>↔ 9.433-437 (Euríalo y las flores) y 9.349-350.</div><ul><li><i>una eademque via</i>: ablativo, «por un solo y mismo camino»; <i>sanguis animusque</i>, dos sujetos con verbo en plural (<i>sequuntur</i>).</li><li><i>moriens</i>: el mismo participio de 9.436 y 9.350.</li><li><i>ore cruento</i>: «con la boca ensangrentada». Las mismas palabras de 9.341, dichas del león.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b"}, "ul": {"5": "b", "7": "r", "8": "r", "9": "r", "10": "r", "11": "r", "12": "r", "13": "g", "15": "b", "19": "g", "25": "b"}, "lk": {}}, {"id": "a10-495-500", "ref": "10.495-500", "lines": ["[...] Et laevo pressit pede talia fatus", "exanimem, rapiens immania pondera baltei", "impressumque nefas, una sub nocte iugali", "caesa manus iuvenum foede thalamique cruenti,", "quae Clonus Eurytides multo caelaverat auro;", "quo nunc Turnus ovat spolio gaudetque potitus."], "trans": "Y planta el pie izquierdo sobre el cuerpo ya exánime<div>y le arranca el enorme tahalí con la escena de horror grabada en él:</div><div>aquel tropel de mozos degollados en vergonzoso crimen la noche de sus bodas</div><div>y los sangrientos tálamos que Clono, hijo de Éurito, había cincelado</div><div>en gruesas chapas de oro. Turno exulta de gozo ante el trofeo.</div>", "gloss": "<div><b>et</b>: y</div><div><b>exanimis, -e</b>: sin vida</div><div><b>for, fārī, fātus sum</b>: hablar, decir</div><div><b>gaudeō, -ēs, -ēre, gāvīsus sum</b>: alegrarse</div><div><b>laevus, -a, -um</b>: izquierdo</div><div><b>nunc</b>: ahora</div><div><b>ovō, -ās, -āre</b>: exultar</div><div><b>pēs, pedis, m.</b>: pie</div><div><b>potior, -īrī, potītus sum</b>: apoderarse de (+ abl.)</div><div><b>premō, -is, -ere, pressī, pressum</b>: apretar, pisar</div><div><b>-que</b>: y</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>spolium, -iī, n.</b>: despojo</div><div><b>tālis, -e</b>: tal</div><div><b>Turnus, -ī, m.</b>: Turno</div>", "notes": "<div>Turno le saca al muerto un cinturón con una escena grabada. ¿Qué escena? ¿Por qué un trofeo con jóvenes asesinados en su noche de bodas es mala señal para quien se lo pone?</div><div>↔ 9.354-356 (Niso sí supo decir «basta»).</div><ul><li><i>impressum nefas</i>: «el crimen grabado»; <i>nefas</i> es lo que no debe hacerse.</li><li><i>ovat… gaudet</i>: presentes: Turno «exulta y goza»; <i>potitus</i>, «tras apoderarse».</li><li><i>pressit</i>: perfecto de <i>premo</i>: «pisó» al muerto con el pie izquierdo.</li></ul>", "hl": {}, "fx": {"1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b"}, "ul": {"3": "g", "4": "b", "10": "b", "12": "r", "13": "r", "16": "b"}, "lk": {}}, {"id": "a10-501-505", "ref": "10.501-505", "lines": ["Nescia mens hominum fati sortisque futurae", "et servare modum, rebus sublata secundis!", "Turno tempus erit, magno cum optaverit emptum", "intactum Pallanta et cum spolia ista diemque", "oderit. [...]"], "trans": "¡Oh, mente de los hombres, que no sabe del hado<div>ni la suerte futura ni sabe de mesura si les alza el favor de la fortuna!</div><div>¡Tiempo vendrá en que Turno pagaría a alto precio no haber puesto</div><div>sus manos en Palante y odiará estos despojos y este día!</div>", "gloss": "<div><b>et</b>: y</div><div><b>fātum, -ī, n.</b>: destino</div><div><b>futūrus, -a, -um</b>: futuro</div><div><b>homō, -inis, m.</b>: ser humano</div><div><b>mēns, mentis, f.</b>: mente</div><div><b>modus, -ī, m.</b>: medida</div><div><b>nescius, -a, -um</b>: que no sabe, ignorante</div><div><b>-que</b>: y</div><div><b>rēs, reī, f.</b>: cosa; situación</div><div><b>secundus, -a, -um</b>: favorable</div><div><b>servō, -ās, -āre, -āvī, -ātum</b>: guardar, conservar</div><div><b>sors, sortis, f.</b>: suerte</div><div><b>tollō, -is, -ere, sustulī, sublātum</b>: levantar; envanecer</div>", "notes": "<div>El narrador interrumpe otra vez, pero ahora no promete memoria: advierte. ¿Qué dos cosas no sabe la mente humana, según el primer verso y medio? ¿En cuál falla Turno acá, y en cuál había fallado en 9.128?</div><div>↔ 9.128-132 (Turno lee mal el prodigio) y 9.354-356.</div><ul><li><i>Nescia mens hominum…!</i>: exclamación sin verbo: «¡ignorante la mente de los hombres…!».</li><li><i>servare modum</i>: «guardar la medida».</li><li><i>tempus erit, cum… oderit</i>: «habrá un tiempo en que… odiará»: el narrador ya conoce el final.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b"}, "ul": {"0": "r", "1": "r", "2": "r", "3": "r", "4": "r", "5": "r", "13": "b"}, "lk": {}}, {"id": "a10-515-520", "ref": "10.515-520", "lines": ["[...] Pallas, Euander, in ipsis", "omnia sunt oculis, mensae, quas advena primas", "tunc adiit, dextraeque datae. Sulmone creatos", "quattuor hic iuvenes, totidem, quos educat Ufens,", "viventis rapit, inferias quos immolet umbris", "captivoque rogi perfundat sanguine flammas."], "trans": "<div>Palante, Evandro, todo se le va presentando ante los ojos:</div><div>las mesas que le dieron acogida cuando llegó de fuera,</div><div>las diestras que estrechó en señal de alianza.</div><div>En esto a cuatro mozos hijos de Sulmón y a otros cuatro</div><div>que fue criando Ufente los atrapa allí vivos.</div><div>Quiere inmolarlos todos como ofrenda</div><div>a la sombra de Palante e ir regando de sangre cautiva las llamas de la pira.</div>", "gloss": "<div><b>adeō, -īs, -īre, adiī, aditum</b>: acercarse a</div><div><b>advena, -ae, m.</b>: extranjero, recién llegado</div><div><b>dextra, -ae, f.</b>: mano derecha</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>Euander, -drī, m.</b>: Evandro</div><div><b>in (prep. + abl.)</b>: en</div><div><b>ipse, ipsa, ipsum</b>: mismo</div><div><b>mēnsa, -ae, f.</b>: mesa</div><div><b>oculus, -ī, m.</b>: ojo</div><div><b>omnis, -e</b>: todo</div><div><b>Pallās, -antis, m.</b>: Palante</div><div><b>prīmus, -a, -um</b>: primero</div><div><b>-que</b>: y</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>sum, es, esse, fuī</b>: ser, estar</div><div><b>tunc</b>: entonces</div>", "notes": "<div>Eneas recuerda una mesa y un apretón de manos, y acto seguido captura vivos a ocho jóvenes. ¿Para qué los quiere? ¿Esto es <i>pietas</i> o <i>furor</i>? Elegí y defendelo con palabras del texto.</div><div>↔ 9.465-472 (la brutalidad del otro bando).</div><ul><li><i>in ipsis omnia sunt oculis</i>: «todo está ante sus mismos ojos»: Palante, Evandro, las mesas, las diestras.</li><li><i>viventis rapit</i>: «los arrebata vivos»; <i>viventis</i> = <i>viventes</i>, acusativo plural.</li><li><i>dextrae datae</i>: «las manos derechas dadas»: el pacto con Evandro.</li></ul>", "hl": {}, "fx": {"1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b"}, "ul": {"1": "b", "13": "g", "20": "b", "27": "r", "28": "r", "29": "r", "30": "r", "34": "b"}, "lk": {}}, {"id": "a10-636-642", "ref": "10.636-642", "lines": ["Tum dea nube cava tenuem sine viribus umbram", "in faciem Aeneae, visu mirabile monstrum,", "Dardaniis ornat telis clipeumque iubasque", "divini adsimulat capitis, dat inania verba,", "dat sine mente sonum gressusque effingit euntis,", "morte obita qualis fama est volitare figuras", "aut quae sopitos deludunt somnia sensus."], "trans": "Allí con hueca niebla forma la diosa un tenue fantasma inconsistente<div>a imagen del mismo Eneas —maravilla a la vista el prodigio—,</div><div>lo reviste de las armas del dárdano, simula el escudo y las plumas del airón</div><div>en la cabeza del hijo de la diosa y le dota de palabras vacías,</div><div>sonidos sin sentido, y remeda sus pasos al andar, igual que esos espectros</div><div>que se dice revuelan cuando se ha ido la muerte o como las visiones</div><div>que engañan los sentidos entre sueños.</div>", "gloss": "<div><b>adsimulō, -ās, -āre, -āvī, -ātum</b>: imitar</div><div><b>Aenēās, -ae, m.</b>: Eneas</div><div><b>caput, -itis, n.</b>: cabeza</div><div><b>cavus, -a, -um</b>: hueco</div><div><b>clipeus, -ī, m.</b>: escudo</div><div><b>Dardanius, -a, -um</b>: dardanio, troyano</div><div><b>dea, -ae, f.</b>: diosa</div><div><b>dīvīnus, -a, -um</b>: divino</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>faciēs, -ēī, f.</b>: aspecto, figura</div><div><b>in (prep. + acus.)</b>: con forma de</div><div><b>inānis, -e</b>: vacío</div><div><b>iuba, -ae, f.</b>: crin, penacho</div><div><b>mēns, mentis, f.</b>: mente</div><div><b>mīrābilis, -e</b>: admirable</div><div><b>mōnstrum, -ī, n.</b>: prodigio</div><div><b>nūbēs, -is, f.</b>: nube</div><div><b>ōrnō, -ās, -āre, -āvī, -ātum</b>: adornar, equipar</div><div><b>-que</b>: y</div><div><b>sine (prep. + abl.)</b>: sin</div><div><b>sonus, -ī, m.</b>: sonido</div><div><b>tēlum, -ī, n.</b>: arma arrojadiza</div><div><b>tenuis, -e</b>: tenue</div><div><b>tum (adv.)</b>: entonces</div><div><b>umbra, -ae, f.</b>: sombra</div><div><b>verbum, -ī, n.</b>: palabra</div><div><b>vīs, f. (pl. vīrēs)</b>: fuerza</div><div><b>vīsus, -ūs, m. (vīsū mīrābile: admirable de ver)</b>: vista</div>", "notes": "<div>Juno fabrica un Eneas falso. Hacé la lista de lo que el fantasma tiene y de lo que le falta. ¿Con qué otras dos cosas lo compara el narrador al final, y qué tienen en común las tres?</div><div>↔ 9.116-122 (el otro <i>mirabile monstrum</i>).</div><ul><li><i>visu mirabile monstrum</i>: casi el mismo paréntesis de 9.120.</li><li><i>sine viribus… inania verba… sine mente sonum</i>: tres maneras de decir «vacío».</li><li><i>dat… dat… effingit</i>: presentes; el sujeto es <i>dea</i> (Juno).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b"}, "ul": {"2": "b", "6": "b", "11": "r", "12": "r", "13": "r", "21": "b", "27": "b", "32": "b"}, "lk": {}}, {"id": "a10-666-671", "ref": "10.666-671", "lines": ["Respicit ignarus rerum ingratusque salutis", "et duplicis cum voce manus ad sidera tendit:", "Omnipotens genitor, tanton me crimine dignum", "duxisti et talis voluisti expendere poenas?", "Quo feror? Unde abii? Quae me fuga quemve reducit?", "Laurentisne iterum muros aut castra videbo?"], "trans": "Éste mira hacia atrás sin saber la verdad ni agradecer su salvación<div>y eleva las dos manos y la voz a un mismo tiempo al cielo:</div><div>«¡Omnipotente Padre! ¿Es que has creído que era yo tan culpable</div><div>y has querido imponerme este castigo? ¿A dónde me arrebatan?</div><div>¿De dónde vengo? ¿Por qué huyo?</div><div>¿De qué traza me presento de nuevo? ¿Volveré a ver los muros laurentes</div><div>y mi campo de guerra?&nbsp;</div>", "gloss": "<div><b>abeō, -īs, -īre, abiī, abitum</b>: irse</div><div><b>ad (prep. + acus.)</b>: hacia</div><div><b>aut</b>: o</div><div><b>castra, -ōrum, n. pl.</b>: campamento</div><div><b>crīmen, -inis, n.</b>: crimen</div><div><b>cum (prep. + abl.)</b>: con</div><div><b>dignus, -a, -um</b>: digno (+ abl.)</div><div><b>dūcō, -is, -ere, dūxī, ductum</b>: considerar</div><div><b>duplex, -icis</b>: doble (aquí: las dos)</div><div><b>ego, meī</b>: yo</div><div><b>et</b>: y</div><div><b>expendō, -is, -ere, expendī, expēnsum</b>: pagar</div><div><b>ferō, fers, ferre, tulī, lātum (feror: soy llevado)</b>: llevar</div><div><b>fuga, -ae, f.</b>: huida</div><div><b>genitor, -ōris, m.</b>: padre</div><div><b>ignārus, -a, -um</b>: que no sabe</div><div><b>ingrātus, -a, -um</b>: desagradecido (+ gen.)</div><div><b>iterum (adv.)</b>: otra vez</div><div><b>Laurēns, -entis</b>: laurente</div><div><b>manus, -ūs, f.</b>: mano</div><div><b>mūrus, -ī, m.</b>: muro</div><div><b>-ne</b>: partícula interrogativa</div><div><b>omnipotēns, -entis</b>: todopoderoso</div><div><b>poena, -ae, f.</b>: castigo</div><div><b>-que</b>: y</div><div><b>quī, quae, quod (interrog.)</b>: ¿qué?, ¿cuál?</div><div><b>quis, quid (interrog.)</b>: ¿quién?, ¿qué?</div><div><b>quō (adv.)</b>: ¿adónde?</div><div><b>redūcō, -is, -ere, redūxī, reductum</b>: traer de vuelta</div><div><b>rēs, reī, f.</b>: cosa; situación</div><div><b>respiciō, -is, -ere, respexī, respectum</b>: mirar hacia atrás</div><div><b>salūs, -ūtis, f.</b>: salvación</div><div><b>sīdus, -eris, n.</b>: astro, estrella</div><div><b>tālis, -e</b>: tal</div><div><b>tantus, -a, -um</b>: tan grande</div><div><b>tendō, -is, -ere, tetendī, tentum</b>: tender</div><div><b>unde (adv.)</b>: ¿de dónde?</div><div><b>-ve</b>: o</div><div><b>videō, -ēs, -ēre, vīdī, vīsum</b>: ver</div><div><b>volō, vīs, velle, voluī</b>: querer</div><div><b>vōx, vōcis, f.</b>: voz</div>", "notes": "<div>A Turno lo salvaron y no lo agradece: <i>ingratus salutis</i>. Contá las preguntas que hace. ¿Alguna tiene respuesta? ¿A quién acusa, y de qué?</div><div>↔ 9.390-392 (Niso, perdido en el bosque).</div><ul><li><i>tanton</i> = <i>tanto</i> + <i>-ne</i>: otra vez el <i>-ne</i> interrogativo.</li><li><i>duxisti… voluisti</i>: perfectos en 2.ª persona: le reprocha a Júpiter.</li><li><i>Quo feror? Unde abii?</i>: «¿adónde me llevan? ¿de dónde me fui?». <i>Feror</i> es pasivo: no decide él.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b"}, "ul": {"3": "r", "4": "b", "8": "b", "11": "b", "14": "b", "17": "b", "19": "g", "22": "g", "28": "g"}, "lk": {}}, {"id": "a10-723-729", "ref": "10.723-729", "lines": ["impastus stabula alta leo ceu saepe peragrans,", "suadet enim vesana fames, si forte fugacem", "conspexit capream aut surgentem in cornua cervum,", "gaudet, hians immane, comasque arrexit et haeret", "visceribus super accumbens, lavit inproba taeter", "ora cruor,", "sic ruit in densos alacer Mezentius hostis."], "trans": "como el león ayuno que ronda sin cesar los establos vallados<div>aciado de hambre ciega, si avista alguna cabra fugitiva o algún ciervo</div><div>de enhiesta cornamenta, exulta abriendo sus inmensas fauces,</div><div>eriza sus guedejas y ahinojado se pega a las entrañas de su presa</div><div>y su belfo cruel queda bañado en repulsiva sangre;</div><div>así se precipita Mezencio impetuoso en las cerradas filas enemigas.</div>", "gloss": "", "notes": "<div>Este león ya lo viste: el paréntesis es idéntico al de 9.340. Pero la escena cambió. ¿Qué come cada león y dónde? ¿Quién queda mejor parado en la comparación: Euríalo o Mezencio?</div><div>↔ 9.339-343 (el león de Euríalo) y 9.59-66 (el lobo de Turno).</div><ul><li><i>ceu… sic</i>: «como… así»: abre y cierra el símil.</li><li><i>conspexit… arrexit</i>: perfectos en medio de presentes (<i>gaudet, haeret</i>).</li><li><i>lavit improba taeter ora cruor</i>: el sujeto, <i>cruor</i>, llega al final: «baña la boca feroz la sangre repugnante».</li></ul>", "hl": {}, "fx": {}, "ul": {"3": "b", "7": "r", "8": "r", "9": "r", "10": "r", "14": "g", "25": "g", "31": "g", "35": "b", "42": "b"}, "lk": {}}, {"id": "a10-755-759", "ref": "10.755-759", "lines": ["Iam gravis aequabat luctus et mutua Mavors", "funera: caedebant pariter pariterque ruebant", "victores victique, neque his fuga nota neque illis.", "Di Iovis in tectis iram miserantur inanem", "amborum et tantos mortalibus esse labores:"], "trans": "Ya iguala el duro Marte los duelos y las muertes de unos y otros.<div>Mataban y morían por igual vencedores y vencidos, pero ni un bando ni otro</div><div>conocía la huida. Y en la mansión de Júpiter los dioses se conduelen</div><div>de la cólera vana de ambos bandos y de que los mortales hayan de soportar</div><div>tan duros trances.</div>", "gloss": "<div><b>aequō, -ās, -āre, -āvī, -ātum</b>: igualar</div><div><b>ambō, -ae, -ō</b>: ambos</div><div><b>caedō, -is, -ere, cecīdī, caesum</b>: matar</div><div><b>deus, -ī, m. (nom. pl. dī)</b>: dios</div><div><b>et</b>: y</div><div><b>fuga, -ae, f.</b>: huida</div><div><b>fūnus, -eris, n.</b>: muerte</div><div><b>gravis, -e</b>: pesado, duro</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>iam</b>: ya</div><div><b>ille, illa, illud</b>: aquel, aquella, aquello</div><div><b>in (prep. + abl.)</b>: en</div><div><b>inānis, -e</b>: vano, inútil</div><div><b>īra, -ae, f.</b>: ira</div><div><b>Iuppiter, Iovis, m.</b>: Júpiter</div><div><b>labor, -ōris, m.</b>: sufrimiento, fatiga</div><div><b>lūctus, -ūs, m.</b>: duelo</div><div><b>Māvors, -ortis, m.</b>: Marte</div><div><b>miseror, -ārī, miserātus sum</b>: compadecerse de</div><div><b>mortālis, -is, m.</b>: mortal</div><div><b>mūtuus, -a, -um</b>: recíproco</div><div><b>neque</b>: y no, ni</div><div><b>nōtus, -a, -um</b>: conocido</div><div><b>pariter (adv.)</b>: igualmente, a la par</div><div><b>-que</b>: y</div><div><b>ruō, -is, -ere, ruī</b>: caer</div><div><b>sum, es, esse, fuī</b>: ser, haber</div><div><b>tantus, -a, -um</b>: tan grande</div><div><b>tēctum, -ī, n.</b>: techo, casa</div><div><b>victor, -ōris, m.</b>: vencedor</div><div><b>victus, -a, -um</b>: vencido</div>", "notes": "<div>Por un momento no hay troyanos ni latinos: hay <i>victores victique</i>. ¿Quién mira la batalla desde arriba, qué siente y qué hace al respecto?</div><div>↔ 9.465-472 (los troyanos que miran desde el muro).</div><ul><li><i>caedebant pariter pariterque ruebant</i>: imperfectos en espejo, con <i>pariter</i> en el centro: «mataban por igual y por igual caían».</li><li><i>neque his… neque illis</i>: dativos: «ni para estos ni para aquellos».</li><li><i>iram… inanem</i>: «ira vana». El adjetivo de <i>inania verba</i> (10.639).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b"}, "ul": {"12": "r", "13": "r", "21": "b", "30": "b", "32": "b"}, "lk": {}}, {"id": "a10-779-782", "ref": "10.779-782", "lines": ["Herculis Antoren comitem, qui missus ab Argis", "haeserat Euandro atque Itala consederat urbe.", "Sternitur infelix alieno volnere caelumque", "aspicit et dulcis moriens reminiscitur Argos"], "trans": "Antores, compañero de Hércules,<div>que desterrado de Argos se había unido a Evandro y que en una ciudad de Italia</div><div>había ya fijado su morada. Queda tendido en tierra, desventurado de él,</div><div>por un golpe que no iba a él dirigido, alza la vista al cielo y expirando</div><div>recuerda su dulce tierra de Argos</div>", "gloss": "", "notes": "<div>Antores muere por una herida que no era para él. ¿Qué hace en el último verso, y por qué ese gesto pesa más en alguien que había cambiado de tierra?</div><div>↔ 9.485-489 (Euríalo, <i>terra ignota</i>).</div><ul><li><i>alieno volnere</i>: «por una herida ajena», destinada a otro.</li><li><i>dulcis… Argos</i>: acusativo plural: «la dulce Argos»; <i>reminiscitur</i>, «recuerda».</li><li><i>moriens</i>: otra vez el participio de 9.436 y 10.489.</li></ul>", "hl": {}, "fx": {}, "ul": {"0": "b", "12": "b", "16": "b", "20": "r", "21": "r", "22": "r", "23": "r"}, "lk": {}}, {"id": "a10-791-793", "ref": "10.791-793", "lines": ["Hic mortis durae casum tuaque optima facta,", "siqua fidem tanto est operi latura vetustas,", "non equidem nec te, iuvenis memorande, silebo."], "trans": "No pasaré en silencio aquí ni el trance doloroso de tu muerte ni tu hazaña<div>si el tiempo transcurrido logra hacer que se crea tal proeza,</div><div>ni dejaré tampoco de nombrarte, joven héroe, tan digno de recuerdo.</div>", "gloss": "<div><b>cāsus, -ūs, m.</b>: caída, desgracia</div><div><b>dūrus, -a, -um</b>: duro</div><div><b>equidem</b>: por cierto</div><div><b>factum, -ī, n.</b>: hecho</div><div><b>hīc (adv.)</b>: aquí</div><div><b>iuvenis, -is, m.</b>: joven</div><div><b>memorandus, -a, -um</b>: digno de ser recordado</div><div><b>mors, mortis, f.</b>: muerte</div><div><b>nec</b>: y no, ni</div><div><b>nōn</b>: no</div><div><b>optimus, -a, -um</b>: muy bueno, excelente</div><div><b>-que</b>: y</div><div><b>sileō, -ēs, -ēre, siluī</b>: callar</div><div><b>tū, tuī</b>: tú, vos</div><div><b>tuus, -a, -um</b>: tuyo</div>", "notes": "<div>El narrador le habla a Lauso antes de que muera y promete no callarlo. Encontrá la condición que pone. ¿De quién duda: de Lauso, del lector o del tiempo?</div><div>↔ 9.441-449 (<i>Fortunati ambo</i>) y 9.77-79 (<i>prisca fides</i>).</div><ul><li><i>iuvenis memorande</i>: vocativo: «joven digno de recuerdo».</li><li><i>non… silebo</i>: futuro, 1.ª persona: «no callaré».</li><li><i>siqua fidem… vetustas</i>: <i>fides</i> es la palabra de 9.79: si el tiempo vuelve creíble algo tan grande.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b"}, "ul": {"1": "b", "14": "r", "15": "r", "16": "r", "17": "r", "18": "r", "19": "r", "20": "r"}, "lk": {}}, {"id": "a10-815-820", "ref": "10.815-820", "lines": ["Parcae fila legunt: validum namque exigit ensem", "per medium Aeneas iuvenem totumque recondit.", "Transiit et parmam mucro, levia arma minacis,", "et tunicam, molli mater quam neverat auro,", "implevitque sinum sanguis; tum vita per auras", "concessit maesta ad manis corpusque reliquit."], "trans": "y ya acaban las Parcas de devanar las hebras de la vida de Lauso,<div>pues Eneas descarga su poderosa espada en pleno cuerpo del muchacho</div><div>y la entierra hasta la empuñadura. Ya la punta había traspasado el broquel,</div><div>parva defensa para tanta osadía, y la túnica que le bordó su madre</div><div>entrelazándola de flexible hilo de oro. Y le había inundado en sangre el pecho.</div><div>Al cabo su vida dejó el cuerpo y se fue por las auras desolada a las sombras.</div>", "gloss": "<div><b>ad (prep. + acus.)</b>: hacia</div><div><b>Aenēās, -ae, m.</b>: Eneas</div><div><b>aura, -ae, f.</b>: aire</div><div><b>concēdō, -is, -ere, concessī, concessum</b>: retirarse, irse</div><div><b>corpus, -oris, n.</b>: cuerpo</div><div><b>ēnsis, -is, m.</b>: espada</div><div><b>exigō, -is, -ere, exēgī, exāctum</b>: hundir</div><div><b>fīlum, -ī, n.</b>: hilo</div><div><b>iuvenis, -is, m.</b>: joven</div><div><b>legō, -is, -ere, lēgī, lēctum</b>: recoger, devanar</div><div><b>maestus, -a, -um</b>: triste</div><div><b>Mānēs, -ium, m. pl.</b>: los Manes, almas de los muertos</div><div><b>medius, -a, -um</b>: medio</div><div><b>namque</b>: pues</div><div><b>Parcae, -ārum, f. pl.</b>: las Parcas</div><div><b>per (prep. + acus.)</b>: por, a través de</div><div><b>-que</b>: y</div><div><b>recondō, -is, -ere, recondidī, reconditum</b>: hundir</div><div><b>relinquō, -is, -ere, relīquī, relictum</b>: dejar, abandonar</div><div><b>tōtus, -a, -um</b>: todo, entero</div><div><b>tum (adv.)</b>: entonces</div><div><b>validus, -a, -um</b>: fuerte</div><div><b>vīta, -ae, f.</b>: vida</div>", "notes": "<div>La punta de la espada atraviesa dos cosas antes de llegar al cuerpo. ¿Cuál es la segunda y quién la hizo? ¿Por qué Virgilio se detiene en ese detalle justo ahora?</div><div>↔ 9.485-489 (la tela que tejía la madre de Euríalo).</div><ul><li><i>tunicam, molli mater quam neverat auro</i>: «la túnica que la madre había tejido con oro flexible»; <i>neverat</i>, de <i>neo</i>, «hilar».</li><li><i>transiit… implevit… concessit… reliquit</i>: perfectos en fila: todo ya pasó.</li><li><i>vita… concessit maesta</i>: la vida «se retiró triste»: <i>maesta</i> concuerda con <i>vita</i>.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b"}, "ul": {"6": "b", "13": "g", "16": "b", "21": "r", "22": "r", "23": "r", "24": "r", "25": "r", "26": "r", "27": "g", "29": "b", "34": "g", "38": "b", "39": "g"}, "lk": {}}, {"id": "a10-821-826", "ref": "10.821-826", "lines": ["At vero ut voltum vidit morientis et ora,", "ora modis Anchisiades pallentia miris,", "ingemuit miserans graviter dextramque tetendit,", "et mentem patriae subiit pietatis imago.", "Quid tibi nunc, miserande puer, pro laudibus istis,", "quid pius Aeneas tanta dabit indole dignum?"], "trans": "Pero el hijo de Anquises contemplando aquel rostro moribundo,<div>aquella cara que iba cubriendo una asombrosa palidez,</div><div>compadecido de él, gime en lo hondo de su pecho.</div><div>Y le alarga la mano y aflora a su alma el vivo reflejo de su mismo amor filial.</div><div>«¿Qué podría ahora darte, infortunado joven, <br>por esa noble hazaña el fiel Eneas?<br><br></div>", "gloss": "<div><b>Aenēās, -ae, m.</b>: Eneas</div><div><b>dextra, -ae, f.</b>: mano derecha</div><div><b>dignus, -a, -um</b>: digno (+ abl.)</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>et</b>: y</div><div><b>graviter (adv.)</b>: profundamente</div><div><b>imāgō, -inis, f.</b>: imagen</div><div><b>indolēs, -is, f.</b>: carácter, índole</div><div><b>ingemō, -is, -ere, ingemuī</b>: gemir</div><div><b>iste, ista, istud</b>: ese</div><div><b>laus, laudis, f.</b>: mérito, gloria</div><div><b>mēns, mentis, f.</b>: mente</div><div><b>miserandus, -a, -um</b>: digno de compasión</div><div><b>miseror, -ārī, miserātus sum</b>: compadecerse</div><div><b>nunc</b>: ahora</div><div><b>patrius, -a, -um</b>: paterno</div><div><b>pietās, -ātis, f.</b>: piedad</div><div><b>pius, -a, -um</b>: piadoso</div><div><b>prō (prep. + abl.)</b>: a cambio de</div><div><b>puer, -ī, m.</b>: muchacho</div><div><b>-que</b>: y</div><div><b>quis, quid (interrog.)</b>: ¿quién?, ¿qué?</div><div><b>subeō, -īs, -īre, subiī, subitum</b>: venir a la mente</div><div><b>tantus, -a, -um</b>: tan grande</div><div><b>tendō, -is, -ere, tetendī, tentum</b>: tender</div><div><b>tū, tuī</b>: tú, vos</div>", "notes": "<div>Eneas acaba de matar a Lauso y de golpe se frena. ¿Qué ve y qué imagen se le cruza? Compará el verso 824 con 9.294: cambia un verbo y cambia quién siente. ¿Qué te dice eso sobre cómo están armados los dos libros?</div><div>↔ 9.287-294 (Julo llora por la madre de Euríalo).</div><ul><li><i>ora, / ora</i>: la palabra repetida al final de un verso y al comienzo del siguiente: la mirada se queda en la cara.</li><li><i>Anchisiades</i>: «hijo de Anquises»: justo acá se lo nombra por su padre.</li><li><i>subiit</i>: perfecto de <i>subeo</i>, «le vino a la mente»; <i>miserande puer</i>, vocativo: «muchacho digno de compasión».</li></ul>", "hl": {"22": "y", "23": "y"}, "fx": {"13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b"}, "ul": {"4": "g", "13": "g", "17": "g", "18": "r", "19": "r", "20": "r", "21": "r", "22": "r", "23": "r"}, "lk": {}}, {"id": "a10-846-852", "ref": "10.846-852", "lines": ["Tantane me tenuit vivendi, nate, voluptas,", "ut pro me hostili paterer succedere dextrae,", "quem genui? Tuane haec genitor per volnera servor,", "morte tua vivens? Heu, nunc misero mihi demum", "exitium infelix, nunc alte volnus adactum!", "Idem ego, nate, tuum maculavi crimine nomen,", "pulsus ob invidiam solio sceptrisque paternis."], "trans": "«¡Hijo mío, tan gran ansia de vivir se apoderó de mí que he consentido<div>te enfrentaras por mí a la espada enemiga, tú a quien yo di la vida!</div><div>¡Ay, esa herida tuya le ha salvado la vida a tu padre que vive por tu muerte!</div><div>¡Ay, triste de mí, ahora es cuando empiezo a sentir la amargura del destierro!</div><div>¡Ahora sí que la herida cala en lo hondo! Yo he manchado, hijo mío,</div><div>con deshonor tu nombre, ¡yo a quien, aborrecido,</div><div>han echado del trono y el cetro de mis padres!</div>", "gloss": "<div><b>adigō, -is, -ere, adēgī, adāctum</b>: clavar, hundir</div><div><b>altē (adv.)</b>: profundamente</div><div><b>crīmen, -inis, n.</b>: crimen, culpa</div><div><b>dēmum (adv.)</b>: por fin</div><div><b>ego, meī</b>: yo</div><div><b>exitium, -iī, n.</b>: ruina, muerte</div><div><b>heu</b>: ¡ay!</div><div><b>īdem, eadem, idem</b>: mismo</div><div><b>īnfēlīx, -īcis</b>: desdichado</div><div><b>invidia, -ae, f.</b>: odio, hostilidad</div><div><b>maculō, -ās, -āre, -āvī, -ātum</b>: manchar</div><div><b>miser,
