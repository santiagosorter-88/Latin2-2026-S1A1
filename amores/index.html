-āre, -āvī, -ātum</b>: señalar</div><div><b>digitus, -ī, m.</b>: dedo</div><div><b>dum</b>: mientras</div><div><b>eō, īs, īre, iī, itum (euntem: que va)</b>: ir</div><div><b>fābula, -ae, f.</b>: habladuría, tema de conversación</div><div><b>faciō, -is, -ere, fēcī, factum (facta: los hechos)</b>: hacer</div><div><b>ferus, -a, -um</b>: fiero, salvaje</div><div><b>hic, haec, hoc</b>: este</div><div><b>iactō, -ās, -āre, -āvī, -ātum (iactāris: andás de boca en boca)</b>: lanzar, agitar</div><div><b>in (prep. + acus. / + abl.)</b>: hacia; en</div><div><b>multus, -a, -um</b>: mucho</div><div><b>nārrō, -ās, -āre, -āvī, -ātum</b>: contar</div><div><b>nec</b>: y no, ni</div><div><b>nēquitia, -ae, f.</b>: desenfreno, picardía</div><div><b>praetereō, -īs, -īre, -iī, -itum (praeteritō pudōre: dejado de lado el pudor)</b>: pasar por alto</div><div><b>pudor, -ōris, m.</b>: pudor</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>referō, -fers, -ferre, rettulī, relātum</b>: contar</div><div><b>saepe</b>: a menudo</div><div><b>secō, -ās, -āre, secuī, sectum</b>: cortar, dividir</div><div><b>sentiō, -īs, -īre, sēnsī, sēnsum</b>: sentir, darse cuenta</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>tōtus, -a, -um</b>: todo</div><div><b>tuus, -a, -um</b>: tuyo</div><div><b>uātēs, -is, m.</b>: poeta, vate</div><div><b>uia, -ae, f.</b>: camino</div><div><b>uīnōsus, -a, -um</b>: regado de vino</div><div><b>ūrō, -is, -ere, ussī, ustum</b>: quemar</div><div><b>Vrbs, Vrbis, f.</b>: la Ciudad, Roma</div>", "notes": "<div><b>«Ese es al que quema Amor»</b></div><div>¿Qué dice la gente del poeta?</div><div>↔ 1.1.26 (<i>uror</i>).</div><ul><li><i>compita secta</i>, <i>uatem euntem</i>: participios concertados.</li><li><i>quem</i>: OD de <i>urit</i>; <i>hic, hic est</i>.</li><li><i>iactaris</i>: pasiva, 2.ª sg. <i>praeterito pudore</i>: ablativo absoluto.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b"}, "ul": {"32": "b", "25": "b", "35": "r", "37": "r", "8": "r", "9": "r", "14": "r", "16": "r", "19": "r", "20": "r", "22": "r", "30": "r"}, "lk": {}}, {"id": "a3-1-23-30", "ref": "3.1.23-30", "lines": ["tempus erat thyrso pulsum grauiore moueri;", "cessatum satis est; incipe maius opus.", "materia premis ingenium; cane facta uirorum:", "“haec animo” dices “area digna meo est.”", "quod tenerae cantent lusit tua Musa puellae,", "primaque per numeros acta iuuenta suos.", "nunc habeam per te Romana Tragoedia nomen!", "implebit leges spiritus iste meas’."], "trans": "<div>Sería ya momento de que fueras por el tirso inspirado, más solemne.</div><div>Basta ya de indolencia: da comienzo a una obra de mayor envergadura.</div><div>Con ese tema ahogas tu talento.</div><div>Canta hazañas de héroes: “Éste es —dirás— el campo digno de mi ingenio”.</div><div>Ha dejado tu Musa poemas para que las tiernas muchachas los reciten, y escribió tu primera juventud con los ritmos que le eran apropiados.</div><div>Tenga ahora con tu ayuda yo, la Tragedia, el nombre de romana.</div><div>Bien cumplirá tu inspiración mis normas».</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-1-31-40", "ref": "3.1.31-40", "lines": ["hactenus, et mouit pictis innixa cothurnis", "densum caesarie terque quaterque caput.", "altera, si memini, limis surrisit ocellis;", "fallor, an in dextra myrtea uirga fuit?", "‘quid grauibus uerbis, animosa Tragoedia,’ dixit", "‘me premis? an numquam non grauis esse potes?", "imparibus tamen es numeris dignata moueri;", "in me pugnasti uersibus usa meis.", "non ego contulerim sublimia carmina nostris;", "obruit exiguas regia uestra fores."], "trans": "<div>Así habló y, apoyándose en sus coloreados coturnos, agitó por tres y cuatro veces su cabeza de espesa cabellera.</div><div>La otra sonrió, si no recuerdo mal, mirando de reojo.</div><div>¿Me equivoco o en su diestra tenía un tallo de mirto? «¿Por qué me agobias —dijo—, impetuosa Tragedia, con solemnes palabras?</div><div>¿Nunca puedes dejar de ser solemne?</div><div>Te has dignado expresarte, sin embargo, con ritmo desigual.</div><div>Has combatido usando contra mí mis propios versos.</div><div>Yo no habría comparado con los nuestros esos sublimes poemas.</div><div>Vuestro rango regio anonada mis humildes puertas.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-1-41-46", "ref": "3.1.41-46", "lines": ["sum leuis, et mecum leuis est, mea cura, Cupido:", "non sum materia fortior ipsa mea.", "rustica sit sine me lasciui mater Amoris:", "huic ego proueni lena comesque deae.", "quam tu non poteris duro reserare cothurno,", "haec est blanditiis ianua laxa meis."], "trans": "<div>Soy ligera, y conmigo es ligero Cupido, mi desvelo: no soy más fuerte que mis propios temas.</div><div>Sin mí sería rústica la madre del juguetón Amor.</div><div>Yo he nacido para ser alcahueta y compañera de esa diosa.</div><div>La puerta que no podrías abrir tú con tu duro coturno, está entreabierta por obra de mis tiernas expresiones.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-1-47-52", "ref": "3.1.47-52", "lines": ["per me decepto didicit custode Corinna", "liminis astricti sollicitare fidem", "delabique toro tunica uelata soluta", "atque impercussos nocte mouere pedes.", "et tamen emerui plus quam tu posse, ferendo", "multa supercilio non patienda tuo:"], "trans": "<div>Y he merecido, a pesar de todo, el tener más poder que tú, aguantando muchas cosas que no puede tu ceño soportar: aprendió de mí Corina a remover, burlando a su guardián, el seguro de unos umbrales bien atados, a salir a escondidas de su lecho por una suelta túnica velada, y a mover en la noche sus pies sin tropezar.</div>", "gloss": "<div><b>astringō, -is, -ere, astrīnxī, astrictum (astrictus: cerrado)</b>: atar, cerrar</div><div><b>Corinna, -ae, f.</b>: Corina</div><div><b>custōs, -ōdis, m.</b>: guardián</div><div><b>dēcipiō, -is, -ere, dēcēpī, dēceptum</b>: engañar</div><div><b>discō, -is, -ere, didicī</b>: aprender</div><div><b>ego, meī</b>: yo</div><div><b>fidēs, -eī, f.</b>: fidelidad</div><div><b>līmen, -inis, n.</b>: umbral, puerta</div><div><b>per (prep. + acus.)</b>: por, gracias a</div><div><b>sollicitō, -ās, -āre, -āvī, -ātum</b>: tentar, sobornar</div>", "notes": "<div><b>La maestra de Corina</b></div><div>¿Qué le enseñó la Elegía a Corina?</div><ul><li><i>decepto custode</i>: ablativo absoluto («burlando a su guardián»).</li><li><i>astricti liminis</i>: participio concertado. <i>didicit</i>: perfecto.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b"}, "ul": {"3": "g", "2": "r", "4": "r", "6": "r", "7": "r"}, "lk": {}}, {"id": "a3-1-53-60", "ref": "3.1.53-60", "lines": ["uel quotiens foribus duris infixa pependi", "non uerita a populo praetereunte legi!", "quin ego me memini, dum custos saeuus abiret,", "ancillae miseram delituisse sinu.", "quid, cum me munus natali mittis, at illa", "rumpit et apposita barbara mergit aqua?", "prima tuae moui felicia semina mentis;", "munus habes, quod te iam petit ista, meum.’"], "trans": "<div>¡Cuántas veces, escrita en las tablillas, colgando estuve de su dura puerta, sin tener miedo de que me leyera la gente que pasaba por delante!</div><div>Me acuerdo incluso de que me llevaron, en tanto que el guardián cruel se marchaba, oculta entre el vestido de una sierva.</div><div>¿Y qué diremos de cuándo me envías como regalo el día del cumpleaños, y ella como una bárbara me rompe y me tira en el agua que está al lado?</div><div>Fui yo quien inspiró por vez primera las felices semillas de tu ingenio; Regalo mío es lo que ahora ésta te pide».</div>", "gloss": "<div><b>fēlīx, -īcis</b>: fecundo, feliz</div><div><b>habeō, -ēs, -ēre, habuī, habitum</b>: tener</div><div><b>iam</b>: ya</div><div><b>iste, ista, istud</b>: ese, esa, eso</div><div><b>mēns, mentis, f.</b>: mente, inteligencia</div><div><b>meus, -a, -um</b>: mío</div><div><b>moueō, -ēs, -ēre, mōuī, mōtum</b>: mover, despertar</div><div><b>mūnus, -eris, n.</b>: regalo</div><div><b>petō, -is, -ere, petīuī, petītum</b>: buscar, pedir</div><div><b>prīmus, -a, -um</b>: primero</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>sēmen, -inis, n.</b>: semilla</div><div><b>tū, tuī</b>: tú, vos</div><div><b>tuus, -a, -um</b>: tuyo</div>", "notes": "<div><b>El regalo</b></div><ul><li><i>quod</i>: OD de <i>petit</i>, antecedente <i>munus</i>.</li><li><i>moui</i>: perfecto, 1.ª sg. Hipérbaton <i>tuae… mentis</i>.</li></ul>", "hl": {}, "fx": {"38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b"}, "ul": {"42": "b", "43": "b", "44": "b", "40": "r", "46": "r"}, "lk": {}}, {"id": "a3-1-61-70", "ref": "3.1.61-70", "lines": ["desierat; coepi ‘per uos utramque rogamus,", "in uacuas aures uerba timentis eant.", "altera me sceptro decoras altoque cothurno:", "iam nunc contracto magnus in ore sonus.", "altera das nostro uicturum nomen amori:", "ergo ades et longis uersibus adde breues!", "exiguum uati concede, Tragoedia, tempus:", "tu labor aeternus; quod petit illa, breue est.’", "mota dedit ueniam. teneri properentur Amores,", "dum uacat: a tergo grandius urget opus."], "trans": "<div>Terminó ella de hablar.</div><div>Empecé yo: «Por vosotras os ruego, a una y a otra, que prestéis atención a las palabras de este hombre que os respeta.</div><div>Con tu cetro y con tu alto coturno tú me honras: ya desde ahora en mi boca que tú has tocado habrá grandes acentos.</div><div>Tú por tu parte otorgas a mi amor la fama victoriosa.</div><div>Quédate, pues, conmigo y añade versos breves a los largos.</div><div>Concédele, Tragedia, a este poeta un corto aplazamiento.</div><div>Tú eres labor eterna; la que ella pide, breve».</div><div>Conmovida me dio ella su permiso.</div><div>Que los tiernos Amores se apresuren mientras hay tiempo libre.</div><div>Por la espalda una obra más grandiosa viene urgiendo.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-2-1-6", "ref": "3.2.1-6", "lines": ["Non ego nobilium sedeo studiosus equorum;", "cui tamen ipsa faues, uincat ut ille, precor.", "ut loquerer tecum, ueni, tecumque sederem,", "ne tibi non notus, quem facis, esset amor.", "tu cursus spectas, ego te; spectemus uterque", "quod iuuat atque oculos pascat uterque suos."], "trans": "<div>«No estoy sentado aquí por mi afición a los nobles caballos.</div><div>Sin embargo, deseo que venza el favorito tuyo.</div><div>He venido buscando hablar contigo y sentarme a tu lado, y que el amor que inspiras no te sea desconocido.</div><div>Tú miras las carreras, y yo a ti.</div><div>Miremos ambos lo que nos agrada y alimente sus ojos cada uno.</div>", "gloss": "", "notes": "<div><b>En el circo</b></div><div>¿A qué fue el poeta a las carreras?</div><ul><li>El recorrido espacial va del dormitorio (libro 1) al exterior (libros 2 y 3) (Booth).</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-2-7-14", "ref": "3.2.7-14", "lines": ["o, cuicumque faues, felix agitator equorum!", "ergo illi curae contigit esse tuae?", "hoc mihi contingat, sacro de carcere missis", "insistam forti mente uehendus equis", "et modo lora dabo, modo uerbere terga notabo,", "nunc stringam metas interiore rota;", "si mihi currenti fueris conspecta, morabor,", "deque meis manibus lora remissa fluent."], "trans": "<div>Oh, afortunado el conductor de carro que sea tu favorito, pues ¿no tiene la suerte de que tú te ocupes de él?</div><div>Ojalá la tuviera yo, que al punto de sacar los corceles de la sacra casilla de salida, iría ya firme de pie, avanzando a toda marcha, y aflojaría las riendas unas veces, otras señalaría con el látigo sus lomos y de pronto con la rueda interior en las metas rozaría.</div><div>Si en la carrera yo te divisara me detendría y caerían de mis manos las riendas sueltas.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-2-15-24", "ref": "3.2.15-24", "lines": ["a, quam paene Pelops Pisaea concidit hasta,", "dum spectat uultus, Hippodamia, tuos!", "nempe fauore suae uicit tamen ille puellae:", "uincamus dominae quisque fauore suae!", "quid frustra refugis? cogit nos linea iungi;", "haec in lege loci commoda Circus habet.", "tu tamen a dextra, quicumque es, parce puellae;", "contactu lateris laeditur ista tui.", "tu quoque, qui spectas post nos, tua contrahe crura,", "si pudor est, rigido nec preme terga genu."], "trans": "<div>¡Ah, pero qué poco faltó para que Pélope cayera por la lanza pisea derribado, mientras mira tu rostro, Hipodamía!</div><div>De hecho él venció gracias a los favores de su amada: venzamos así todos con los favores de nuestras señoras.</div><div>¿Por qué en vano te alejas?</div><div>La línea que traza los asientos nos obliga a estar juntos: el circo por ley de espacio tiene estas ventajas.</div><div>—Tú, sin embargo, el de su derecha, aléjate de la muchacha: el roce de tu costado a ella le molesta.</div><div>Y tú, que desde atrás estás mirándonos, si tienes algo de vergüenza, encoge tus piernas, y no aprietes con tu dura rodilla sus espaldas.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-2-25-34", "ref": "3.2.25-34", "lines": ["sed nimium demissa iacent tibi pallia terra:", "collige, uel digitis en ego tollo meis.", "inuida, uestis, eras, quae tam bona crura tegebas;", "quoque magis spectes — inuida, uestis, eras.", "talia Milanion Atalantes crura fugacis", "optauit manibus sustinuisse suis;", "talia pinguntur succinctae crura Dianae,", "cum sequitur fortes fortior ipsa feras.", "his ego non uisis arsi; quid fiet ab ipsis?", "in flammam flammas, in mare fundis aquas."], "trans": "<div>Pero está arrastrando tu manto por el suelo, recógelo, te cuelga demasiado, o mejor, mira, yo te lo levanto con mis dedos.</div><div>Celoso eras, vestido que unas piernas tan bellas ocultabas para verlas tú más.</div><div>Celoso eras.</div><div>Unas piernas así, las de la rauda Atalanta, deseaba Milanión tenerlas bien sujetas con sus manos.</div><div>Así pintan los muslos de Diana la de túnica corta, cuando sigue a fuertes fieras —siendo ella más fuerte.</div><div>Yo ardí por éstas sin haberlas visto, ¿qué me va a suceder en su presencia?</div><div>Echas fuego en la hoguera, en el mar agua.</div>", "gloss": "<div><b>ā, ab (prep. + abl.)</b>: por, a partir de</div><div><b>aqua, -ae, f.</b>: agua</div><div><b>ārdeō, -ēs, -ēre, ārsī, ārsum</b>: arder</div><div><b>ego, meī</b>: yo</div><div><b>fīō, fīs, fierī, factus sum (fīet: sucederá)</b>: hacerse, suceder</div><div><b>flamma, -ae, f.</b>: llama</div><div><b>fundō, -is, -ere, fūdī, fūsum</b>: derramar</div><div><b>hic, haec, hoc</b>: este, esta, esto; (pl.) estas cosas</div><div><b>in (prep. + acus.)</b>: en, sobre</div><div><b>ipse, ipsa, ipsum</b>: mismo; (pl.) ellas mismas</div><div><b>mare, -is, n.</b>: mar</div><div><b>nōn</b>: no</div><div><b>quis, quid (interrog.)</b>: ¿quién?, ¿qué?</div><div><b>uideō, -ēs, -ēre, uīdī, uīsum</b>: ver</div>", "notes": "<div><b>Fuego al fuego</b></div><ul><li><i>his non uisis</i>: ablativo absoluto («sin haberlas visto»).</li><li><i>in flammam</i>, <i>in mare</i>: <i>in</i> + acusativo. <i>arsi</i>: perfecto.</li></ul>", "hl": {}, "fx": {"49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b", "60": "b", "61": "b", "62": "b", "63": "b", "64": "b"}, "ul": {"53": "g", "49": "r", "51": "r", "52": "r", "58": "r", "59": "r", "61": "r", "62": "r"}, "lk": {}}, {"id": "a3-2-35-44", "ref": "3.2.35-44", "lines": ["suspicor ex istis et cetera posse placere,", "quae bene sub tenui condita ueste latent.", "uis tamen interea faciles arcessere uentos,", "quos faciet nostra mota tabella manu?", "an magis hic meus est animi, non aeris, aestus,", "captaque femineus pectora torret amor?", "dum loquor, alba leui sparsa est tibi puluere uestis:", "sordide de niueo corpore puluis abi!", "sed iam pompa uenit: linguis animisque fauete!", "tempus adest plausus: aurea pompa uenit."], "trans": "<div>Sospecho a partir de ellas que igual puede complacerme eso otro que se encuentra bajo el leve vestido bien oculto.</div><div>Mas ¿quieres entretanto hacer venir brisas ligeras que producirá la tablilla agitada por mi mano?</div><div>¿O más bien este ardiente calor mío es de mi sentimiento y no del aire, y un amor de mujer está abrasando mi corazón cautivo?</div><div>Mientras estoy hablando, se ha cubierto de polvo fino tu vestido blanco.</div><div>Vete, vil polvo, de este níveo cuerpo.</div><div>Mas ya viene el cortejo: concededle silencio y atención.</div><div>Llega el momento para los aplausos.</div><div>Viene el cortejo deslumbrante de oro.</div>", "gloss": "<div><b>abeō, -īs, -īre, abiī, abitum</b>: irse</div><div><b>albus, -a, -um</b>: blanco</div><div><b>corpus, -oris, n.</b>: cuerpo</div><div><b>dē (prep. + abl.)</b>: de, desde</div><div><b>dum</b>: mientras</div><div><b>leuis, -e</b>: liviano, fino</div><div><b>loquor, -eris, loquī, locūtus sum</b>: hablar</div><div><b>niueus, -a, -um</b>: blanco como la nieve</div><div><b>puluis, -eris, m.</b>: polvo</div><div><b>sordidus, -a, -um</b>: sucio</div><div><b>spargō, -is, -ere, sparsī, sparsum</b>: esparcir, salpicar</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>tū, tuī</b>: tú, vos</div><div><b>uestis, -is, f.</b>: vestido</div>", "notes": "<div><b>El polvo</b></div><ul><li><i>sparsa est</i>: pasiva de perfectum; <i>leui puluere</i>, causa eficiente.</li><li><i>tibi</i>: dativo de interés. <i>abi</i>: imperativo de <i>abeo</i>.</li></ul>", "hl": {}, "fx": {"40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b"}, "ul": {"48": "b", "52": "b", "53": "b", "43": "r", "44": "r", "45": "r", "46": "r", "47": "r"}, "lk": {}}, {"id": "a3-2-45-54", "ref": "3.2.45-54", "lines": ["prima loco fertur passis Victoria pinnis:", "huc ades et meus hic fac, dea, uincat amor!", "plaudite Neptuno, nimium qui creditis undis!", "nil mihi cum pelago; me mea terra capit.", "plaude tuo Marti, miles! nos odimus arma;", "pax iuuat et media pace repertus amor.", "auguribus Phoebus, Phoebe uenantibus assit!", "artifices in te uerte, Minerua, manus!", "ruricolae, Cereri teneroque assurgite Baccho!", "Pollucem pugiles, Castora placet eques!"], "trans": "<div>Traen en primer lugar a la Victoria, desplegadas las alas; ven aquí diosa, y haz que mi amor sea vencedor.</div><div>Aplaudid a Neptuno, los que tanta confianza tenéis en las aguas.</div><div>No quiero nada con el mar.</div><div>A mí mi amada tierra me retiene preso.</div><div>Aplaude tú, soldado, al Marte tuyo.</div><div>Yo aborrezco las armas.</div><div>Me complace la paz, y en plena paz surgió el amor.</div><div>Que favorezca Febo a los augures y Febe a los que cazan .</div><div>Tú, Minerva, vuelve hacia ti las manos artesanas.</div><div>Los que labráis el campo, levantaos ante Ceres y el tierno Baco.</div><div>Que honren los púgiles a Pólux, a Cástor el jinete.</div>", "gloss": "<div><b>amor, -ōris, m.</b>: amor</div><div><b>arma, -ōrum, n. pl.</b>: armas</div><div><b>capiō, -is, -ere, cēpī, captum</b>: tomar, atraer</div><div><b>crēdō, -is, -ere, crēdidī, crēditum (+ dat.)</b>: confiar en, creer</div><div><b>cum (prep. + abl.)</b>: con</div><div><b>ego, meī</b>: yo</div><div><b>et</b>: y</div><div><b>iuuō, -ās, -āre, iūuī, iūtum</b>: agradar, ayudar</div><div><b>Mārs, Mārtis, m.</b>: Marte</div><div><b>medius, -a, -um</b>: medio</div><div><b>meus, -a, -um</b>: mío</div><div><b>mīles, -itis, m.</b>: soldado</div><div><b>Neptūnus, -ī, m.</b>: Neptuno</div><div><b>nīl (= nihil)</b>: nada</div><div><b>nimium (adv.)</b>: demasiado</div><div><b>nōs, nostrum</b>: nosotros</div><div><b>ōdī, ōdisse (perfecto con valor de presente)</b>: odiar</div><div><b>pāx, pācis, f.</b>: paz</div><div><b>pelagus, -ī, n.</b>: mar, alta mar</div><div><b>plaudō, -is, -ere, plausī, plausum (+ dat.)</b>: aplaudir</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>reperiō, -īs, -īre, repperī, repertum</b>: encontrar</div><div><b>terra, -ae, f.</b>: tierra</div><div><b>tuus, -a, -um</b>: tuyo</div><div><b>unda, -ae, f.</b>: ola; (pl.) el mar</div>", "notes": "<div><b>Paz y amor</b></div><div>¿Por qué el poeta no aplaude a Neptuno ni a Marte?</div><ul><li><i>qui creditis</i>: el verbo en 2.ª pl muestra el antecedente.</li><li><i>plaudo</i>, <i>credo</i> + dativo.</li><li><i>repertus amor</i>: participio predicativo. <i>odimus</i>: perfecto con valor de presente.</li></ul>", "hl": {}, "fx": {"15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b"}, "ul": {"32": "b", "40": "b", "36": "b", "41": "r", "42": "r", "15": "r", "16": "r", "18": "r", "19": "r", "20": "r", "29": "r", "31": "r"}, "lk": {}}, {"id": "a3-2-55-64", "ref": "3.2.55-64", "lines": ["nos tibi, blanda Venus, puerisque potentibus arcu", "plaudimus: inceptis annue, diua, meis", "daque nouae mentem dominae, patiatur amari;", "annuit et motu signa secunda dedit.", "quod dea promisit, promittas ipsa rogamus:", "pace loquar Veneris, tu dea maior eris.", "per tibi tot iuro testes pompamque deorum", "te dominam nobis tempus in omne peti.", "sed pendent tibi crura: potes, si forte iuuabit,", "cancellis primos inseruisse pedes."], "trans": "<div>Yo a ti te aplaudo, delicada Venus, y a los niños armados con el arco.</div><div>Presta tu asentimiento a mis propósitos, diosa, y dale a mi dueña un sentir nuevo: que deje que la quiera.</div><div>Sí, ha asentido y ha mostrado su acuerdo con un gesto.</div><div>Te ruego que prometas tú también lo mismo que la diosa ha prometido.</div><div>Con la venia de Venus voy a hablar: tú serás diosa de más rango que ella.</div><div>Ante tantos testigos como aquí hay y ante el cortejo de los dioses yo te juro que tú siempre vas a ser requerida por mí como mi dueña.</div><div>Mas te cuelgan las piernas; si te place puedes meter la punta de los pies entre la reja.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-2-65-74", "ref": "3.2.65-74", "lines": ["maxima iam uacuo praetor spectacula Circo", "quadriiugos aequo carcere misit equos.", "cui studeas, uideo; uincet, cuicumque fauebis;", "quid cupias, ipsi scire uidentur equi.", "me miserum! metam spatioso circuit orbe.", "quid facis? admoto proximus axe subit!", "quid facis, infelix? perdis bona uota puellae;", "tende, precor, ualida lora sinistra manu!", "fauimus ignauo. sed enim reuocate, Quirites,", "et date iactatis undique signa togis!"], "trans": "<div>Ya saca el pretor el mayor espectáculo sobre el circo vacío: Los caballos de cuadriga que salen de casillas igualadas.</div><div>Estoy viendo al que apoyas.</div><div>Vencerá tu favorito.</div><div>Incluso los caballos parece que conocen tus deseos.</div><div>Ha girado en la meta, ay de mí, con una curva demasiado abierta.</div><div>¿Qué haces?</div><div>El de atrás se te ha acercado rozándote con su eje.</div><div>¿Y tú qué haces, desgraciado?</div><div>Estás desperdiciando los propicios deseos de la muchacha.</div><div>Tira con mano firme de la rienda izquierda, te lo ruego.</div><div>Hemos dado a un inútil nuestro apoyo.</div><div>Mas, llamadlos, quirites, nuevamente, y dad por todas partes la señal agitando las togas.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-2-75-84", "ref": "3.2.75-84", "lines": ["en reuocant; ac ne turbet toga mota capillos,", "in nostros abdas te licet usque sinus.", "iamque patent iterum reserato carcere postes,", "euolat admissis discolor agmen equis.", "nunc saltem supera spatioque insurge patenti!", "sint mea, sint dominae fac rata uota meae!", "sunt dominae rata uota meae, mea uota supersunt;", "ille tenet palmam, palma petenda mea est.", "risit et argutis quiddam promisit ocellis:", "hoc satis est, alio cetera redde loco!"], "trans": "<div>Fíjate, nuevamente los llaman.</div><div>Y, para que al moverse no alborote la toga tus cabellos, puedes tú resguardar la cabeza bien dentro en mi regazo.</div><div>Ya dejan otra vez el paso libre las puertas, al abrirse las casillas, va en un vuelo el tropel multicolor.</div><div>Vence esta vez al menos y álzate sobre el espacio que ante ti se abre.</div><div>Haz que se vean cumplidos mis deseos, los de mi dueña.</div><div>Sí, ya están cumplidos los deseos de mi dueña y los míos.</div><div>Él se ha llevado ya la palma, ahora yo he de lograr la mía.</div><div>Se ha reído ella y algo me ha prometido con sus ojos expresivos: «Aquí basta con eso.</div><div>Lo demás dámelo en otro lugar».</div>", "gloss": "<div><b>admittō, -is, -ere, admīsī, admissum</b>: soltar a la carrera</div><div><b>agmen, -inis, n.</b>: columna, tropel</div><div><b>carcer, -eris, m.</b>: casilla de salida (en el circo)</div><div><b>discolor, -ōris</b>: de varios colores</div><div><b>equus, -ī, m.</b>: caballo</div><div><b>ēuolō, -ās, -āre, -āvī, -ātum</b>: salir volando</div><div><b>iam</b>: ya</div><div><b>iterum</b>: de nuevo</div><div><b>pateō, -ēs, -ēre, patuī</b>: estar abierto</div><div><b>postis, -is, m.</b>: poste, puerta</div><div><b>-que</b>: y</div><div><b>reserō, -ās, -āre, -āvī, -ātum</b>: abrir (quitando el cerrojo)</div>", "notes": "<div><b>¡Largan!</b></div><ul><li><i>reserato carcere</i>, <i>admissis equis</i>: dos ablativos absolutos.</li></ul>", "hl": {}, "fx": {"15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b"}, "ul": {"24": "b", "20": "b", "25": "r", "18": "r", "19": "r", "22": "r"}, "lk": {}}, {"id": "a3-11-1-6", "ref": "3.11.1-6", "lines": ["Multa diuque tuli; uitiis patientia uicta est.", "cede fatigato pectore, turpis Amor!", "scilicet asserui iam me fugique catenas,", "et, quae non puduit ferre, tulisse pudet.", "uicimus et domitum pedibus calcamus Amorem:", "uenerunt capiti cornua sera meo."], "trans": "<div>Mucho llevo aguantado, y largo tiempo.</div><div>Mi paciencia ha acabado derrotada por tus traiciones.</div><div>Vete, infame amor, de mi cansado pecho.</div><div>En verdad me he librado y he huido de mis cadenas ya, y aquello mismo que no me avergoncé de tolerar me avergüenzo de haberlo tolerado.</div><div>Victorioso he salido, y pisoteo al Amor dominado con mis pies.</div><div>Me han salido los cuernos en la cabeza tarde.</div>", "gloss": "<div><b>Amor, -ōris, m.</b>: Amor</div><div><b>calcō, -ās, -āre, -āvī, -ātum</b>: pisotear</div><div><b>caput, -itis, n.</b>: cabeza</div><div><b>cēdō, -is, -ere, cessī, cessum</b>: retirarse, ceder</div><div><b>cornū, -ūs, n.</b>: cuerno</div><div><b>diū</b>: largo tiempo</div><div><b>domō, -ās, -āre, domuī, domitum</b>: domar, someter</div><div><b>et</b>: y</div><div><b>fatīgō, -ās, -āre, -āvī, -ātum</b>: fatigar, cansar</div><div><b>ferō, fers, ferre, tulī, lātum</b>: soportar, llevar</div><div><b>meus, -a, -um</b>: mío</div><div><b>multus, -a, -um</b>: mucho; (n. pl.) muchas cosas</div><div><b>patientia, -ae, f.</b>: paciencia</div><div><b>pectus, -oris, n.</b>: pecho, corazón</div><div><b>pēs, pedis, m.</b>: pie</div><div><b>-que</b>: y</div><div><b>sērus, -a, -um</b>: tardío</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>turpis, -e</b>: vergonzoso, indigno</div><div><b>ueniō, -īs, -īre, uēnī, uentum</b>: venir, llegar</div><div><b>uincō, -is, -ere, uīcī, uictum</b>: vencer</div><div><b>uitium, -iī, n.</b>: vicio, falta</div>", "notes": "<div><b><i>Multa diuque tuli</i></b></div><div>¿De qué se libera el poeta?</div><div>↔ Catulo 8 (<i>perfer et obdura</i>); Catulo 85 (<i>odi et amo</i>).</div><ul><li><i>uicta est</i>: pasiva de perfectum; <i>uitiis</i>, causa eficiente. <i>fatigato pectore</i>: trampa, no es ablativo absoluto.</li><li><i>domitum Amorem</i>: participio concertado. <i>uicimus</i>: 1.ª pl por 1.ª sg.</li><li>La renuncia parodia a Catulo (Booth); el <i>odi et amo</i> de 3.11 como principio retórico (Von Albrecht). Recepción: Castillejo, «Querella al amor» (Cristóbal).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b"}, "ul": {"32": "b", "28": "b", "25": "g", "2": "g", "31": "g", "3": "r", "5": "r", "6": "r", "8": "r", "9": "r", "27": "r", "30": "r"}, "lk": {}}, {"id": "a3-11-7-14", "ref": "3.11.7-14", "lines": ["perfer et obdura! dolor hic tibi proderit olim:", "saepe tulit lassis sucus amarus opem.", "ergo ego sustinui, foribus tam saepe repulsus,", "ingenuum dura ponere corpus humo?", "ergo ego nesciocui, quem tu complexa tenebas,", "excubui clausam, seruus ut, ante domum?", "uidi, cum foribus lassus prodiret amator", "inualidum referens emeritumque latus."], "trans": "<div>Aguanta y ten paciencia.</div><div>Este dolor te será útil un día.</div><div>Muchas veces curó un jarabe amargo a los enfermos.</div><div>Y yo, al que tantas veces echaste de tus puertas, ¿he aguantado tender mi cuerpo de hombre libre sobre aquel duro suelo?</div><div>¿Y yo he montado como un esclavo guardia ante tu casa cerrada, en beneficio de no sé qué individuo, al que tú mantenías abrazado?</div><div>He visto que salía de tu puerta fatigado tu amante, sin fuerza en su costado, licenciado después de haber cumplido.</div>", "gloss": "<div><b>corpus, -oris, n.</b>: cuerpo</div><div><b>dūrus, -a, -um</b>: duro</div><div><b>ego, meī</b>: yo</div><div><b>ergō</b>: entonces, pues</div><div><b>foris, -is, f. (pl. forēs)</b>: puerta (de la casa)</div><div><b>humus, -ī, f. (humō: en el suelo)</b>: tierra, suelo</div><div><b>ingenuus, -a, -um</b>: libre de nacimiento, noble</div><div><b>pōnō, -is, -ere, posuī, positum</b>: poner, tender</div><div><b>repellō, -is, -ere, reppulī, repulsum</b>: rechazar, echar</div><div><b>saepe</b>: a menudo</div><div><b>sustineō, -ēs, -ēre, sustinuī, sustentum (+ inf.)</b>: soportar</div><div><b>tam</b>: tan</div>", "notes": "<div><b>Tirado ante la puerta</b></div><ul><li><i>repulsus</i>: participio predicativo.</li><li><i>sustinui</i>: perfecto. Hipérbaton <i>ingenuum… corpus</i>, <i>dura… humo</i>.</li></ul>", "hl": {}, "fx": {"14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b"}, "ul": {"24": "b", "17": "b", "16": "g", "20": "r"}, "lk": {}}, {"id": "a3-11-15-24", "ref": "3.11.15-24", "lines": ["hoc tamen est leuius quam quod sum uisus ab illo;", "eueniat nostris hostibus ille pudor.", "quando ego non fixus lateri patienter adhaesi,", "ipse tuus custos, ipse uir, ipse comes?", "scilicet et populo per me comitata placebas:", "causa fuit multis noster amoris amor.", "turpia quid referam uanae mendacia linguae", "et periuratos in mea damna deos,", "quid iuuenum tacitos inter conuiuia nutus", "uerbaque compositis dissimulata notis?"], "trans": "<div>Y, sin embargo, eso importa menos que el haber sido visto yo por él.</div><div>¡Sufran mis enemigos esa enorme vergüenza!</div><div>¿Cuándo no he estado yo pacientemente a tu lado pegado, siendo siempre guardián tuyo, marido, acompañante?</div><div>Siempre, sí.</div><div>Y, cuando yo te acompañaba, gustabas a la gente; el amor mío fue lo que originó el amor de muchos.</div><div>¿Y para qué contar las infames mentiras de tu frívola lengua, y los perjurios contrarios a los dioses, que me perdían a mí?</div><div>¿Qué diré de las señas silenciosas de jóvenes en medio de banquetes, y de aquellas palabras encubiertas por medio de mensajes acordados?</div>", "gloss": "<div><b>amor, -ōris, m.</b>: amor</div><div><b>causa, -ae, f.</b>: causa</div><div><b>comitor, -ārī, comitātus sum (comitāta: acompañada)</b>: acompañar</div><div><b>ego, meī</b>: yo</div><div><b>et</b>: también</div><div><b>multus, -a, -um</b>: mucho; (pl.) muchos</div><div><b>noster, nostra, nostrum</b>: nuestro; (aquí) mío</div><div><b>per (prep. + acus.)</b>: por, gracias a</div><div><b>placeō, -ēs, -ēre, placuī (+ dat.)</b>: gustar, agradar</div><div><b>populus, -ī, m.</b>: pueblo</div><div><b>scīlicet</b>: claro, por cierto</div><div><b>sum, es, esse, fuī</b>: ser</div>", "notes": "<div><b>Ella le debe su fama</b></div><ul><li><i>comitata</i>: participio de deponente con sentido pasivo.</li><li><i>placebas populo</i>: verbo que rige dativo.</li><li><i>causa fuit multis noster amoris amor</i>: juego <i>amoris amor</i>.</li></ul>", "hl": {}, "fx": {"29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b"}, "ul": {"40": "b", "41": "b", "34": "r", "35": "r", "31": "r"}, "lk": {}}, {"id": "a3-11-25-32", "ref": "3.11.25-32", "lines": ["dicta erat aegra mihi: praeceps amensque cucurri;", "ueni, et riuali non erat aegra meo.", "his et quae taceo duraui saepe ferendis:", "quaere alium pro me qui uelit ista pati.", "iam mea uotiua puppis redimita corona", "lenta tumescentes aequoris audit aquas.", "desine blanditias et uerba potentia quondam", "perdere: non ego sum stultus, ut ante fui."], "trans": "<div>Me dijeron que ella estaba enferma: precipitado y loco fui corriendo.</div><div>Llegué y para mi rival no estaba enferma.</div><div>Estas cosas y otras que me callo hube de soportar frecuentemente.</div><div>Procura encontrar otro en vez de mí, que quiera tolerarlas.</div><div>Ya mi popa adornada con corona votiva oye despreocupada las hinchadas aguas marinas.</div><div>Deja tú las muestras de ternura y también esas palabras capaces de perderme en otro tiempo: yo ya no soy el tonto que antes fui.</div>", "gloss": "<div><b>aeger, aegra, aegrum</b>: enfermo</div><div><b>āmēns, -entis</b>: fuera de sí</div><div><b>currō, -is, -ere, cucurrī, cursum</b>: correr</div><div><b>dīcō, -is, -ere, dīxī, dictum</b>: decir</div><div><b>ego, meī</b>: yo</div><div><b>et</b>: y</div><div><b>meus, -a, -um</b>: mío</div><div><b>nōn</b>: no</div><div><b>praeceps, -cipitis</b>: precipitado, a toda prisa</div><div><b>-que</b>: y</div><div><b>riuālis, -is, m.</b>: rival</div><div><b>sum, es, esse, fuī</b>: ser, estar</div><div><b>ueniō, -īs, -īre, uēnī, uentum</b>: venir, llegar</div>", "notes": "<div><b>La falsa enferma</b></div><ul><li><i>dicta erat</i>: pluscuamperfecto pasivo; la traducción hace activa impersonal.</li><li><i>aegra</i>: predicativo subjetivo; <i>praeceps amensque</i>, no obligatorio.</li><li><i>cucurri</i>, <i>ueni</i>: perfectos.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b"}, "ul": {"9": "b", "6": "g", "7": "g", "0": "r", "1": "r", "2": "r", "12": "r"}, "lk": {}}, {"id": "a3-11-33-42", "ref": "3.11.33-42", "lines": ["luctantur pectusque leue in contraria tendunt", "hac amor, hac odium; sed, puto, uincit amor.", "odero, si potero; si non, inuitus amabo:", "nec iuga taurus amat; quae tamen odit, habet.", "nequitiam fugio, fugientem forma reducit;", "auersor morum crimina, corpus amo.", "sic ego nec sine te nec tecum uiuere possum", "et uideor uoti nescius esse mei.", "aut formosa fores minus aut minus improba uellem:", "non facit ad mores tam bona forma malos."], "trans": "<div>Luchan y mi ligero corazón arrastran en contrarias direcciones por un lado el amor, por otro el odio, mas creo que el amor sale victorioso.</div><div>Odiaré, si es que puedo, y, si no, amaré en contra de mi voluntad.</div><div>Tampoco tiene el toro amor al yugo; sin embargo, soporta lo que odia.</div><div>Huyo de tu perfidia; mientras huyo me hace volver de nuevo tu hermosura.</div><div>Rechazo la maldad de tus costumbres; amo tu cuerpo.</div><div>De ese modo yo ni sin ti ni contigo vivir puedo y creo que ni yo sé lo que deseo.</div><div>Yo quisiera que fueses menos bella o menos mala.</div><div>No concuerda una apariencia tan hermosa con un comportamiento tan malvado.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-11-43-52", "ref": "3.11.43-52", "lines": ["facta merent odium, facies exorat amorem:", "me miserum! uitiis plus ualet illa suis.", "parce per o lecti socialia iura, per omnes,", "qui dant fallendos se tibi saepe, deos,", "perque tuam faciem, magni mihi numinis instar,", "perque tuos oculos, qui rapuere meos.", "quicquid eris, mea semper eris; tu selige tantum,", "me quoque uelle uelis anne coactus amem.", "lintea dem potius uentisque ferentibus utar", "ut, quam, si nolim, cogar amare, uelim."], "trans": "<div>Tus hechos son merecedores de odio.</div><div>Tu semblante reclama sólo amor.</div><div>Desdichado de mí.</div><div>Más importante es ella que sus propias deslealtades.</div><div>Oh, no me hagas sufrir ¡por los derechos que proporciona un lecho compartido, y por todos los dioses que se prestan a que tú tantas veces los engañes, y por tu cara, que es para mí igual a una divinidad en su esplendor, por tus ojos, que han hecho a los míos prisioneros!</div><div>Seas como seas, siempre serás mía; tú elige solamente si quieres que te ame también por mi propia voluntad, o forzado.</div><div>Mejor desplegaría yo mis velas y gozaría de vientos favorables, y querría amar a aquella a la que me vería forzado a amar aunque yo no quisiera.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-12-1-6", "ref": "3.12.1-6", "lines": ["Quis fuit ille dies, quo tristia semper amanti", "omina non albae concinuistis aues?", "quodue putem sidus nostris occurrere fatis,", "quosue deos in me bella mouere querar?", "quae modo dicta mea est, quam coepi solus amare,", "cum multis uereor ne sit habenda mihi."], "trans": "<div>¿Qué día fue aquel, oh pájaros funestos, en que a este perpetuo enamorado le anunciasteis presagios sombríos con vuestro canto?</div><div>¿O qué estrella podré considerar que se opone en su curso a mi destino?</div><div>¿De qué dioses podré proferir quejas porque se hallen en guerra contra mí?</div><div>La que hasta hace bien poco decían que era mía, a la que comencé yo solo a amar, me temo que con muchos habré de compartirla.</div>", "gloss": "", "notes": "<div><b>Corina, compartida</b></div><div>¿De qué se queja el poeta?</div><ul><li>La fama que el poeta le da a su amada hace que otros la deseen y que él la pierda (3.12.8) (Von Albrecht).</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-12-7-14", "ref": "3.12.7-14", "lines": ["fallimur, an nostris innotuit illa libellis?", "sic erit: ingenio prostitit illa meo.", "et merito! quid enim formae praeconia feci?", "uendibilis culpa facta puella mea est.", "me lenone placet, duce me perductus amator,", "ianua per nostras est adaperta manus.", "an prosint, dubium, nocuerunt carmina certe:", "inuidiae nostris illa fuere bonis."], "trans": "<div>¿Me equivoco o se ha hecho ella famosa gracias a mis libros?</div><div>Así debe de ser: por mi talento se ha prostituido ella.</div><div>Y con razón, pues ¿por qué hice pregón de su hermosura?</div><div>Por mi culpa mi amada ha acabado poniéndose a la venta.</div><div>Gusta, porque yo he sido su alcahuete, llega hasta ella su amante, porque yo lo he guiado.</div><div>La puerta ha sido abierta por mis manos.</div><div>Si los versos resultan provechosos es algo que está en duda, a mí al menos me han perjudicado: han provocado envidia por mis bienes.</div>", "gloss": "<div><b>adaperiō, -īs, -īre, adaperuī, adapertum</b>: abrir</div><div><b>amātor, -ōris, m.</b>: amante</div><div><b>culpa, -ae, f.</b>: culpa</div><div><b>dux, ducis, m.</b>: guía, jefe</div><div><b>ego, meī</b>: yo</div><div><b>enim</b>: pues, en efecto</div><div><b>et</b>: y</div><div><b>faciō, -is, -ere, fēcī, factum</b>: hacer</div><div><b>fīō, fīs, fierī, factus sum</b>: hacerse, volverse</div><div><b>fōrma, -ae, f.</b>: belleza, hermosura</div><div><b>iānua, -ae, f.</b>: puerta</div><div><b>lēnō, -ōnis, m.</b>: alcahuete</div><div><b>manus, -ūs, f.</b>: mano</div><div><b>meritō (adv.)</b>: con razón, merecidamente</div><div><b>meus, -a, -um</b>: mío</div><div><b>noster, nostra, nostrum</b>: nuestro; (aquí) mío</div><div><b>per (prep. + acus.)</b>: por, a través de</div><div><b>perdūcō, -is, -ere, perdūxī, perductum</b>: conducir hasta</div><div><b>placeō, -ēs, -ēre, placuī, placitum</b>: gustar, agradar</div><div><b>praecōnium, -iī, n.</b>: pregón, anuncio</div><div><b>puella, -ae, f.</b>: muchacha</div><div><b>quis, quid (interrog.)</b>: ¿quién?, ¿qué?</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>uēndibilis, -e</b>: vendible, en venta</div>", "notes": "<div><b>El poeta alcahuete</b></div><ul><li><i>facta est</i>, <i>est adaperta</i>: pasiva de perfectum; <i>perductus</i>, con elipsis de <i>est</i>.</li><li><i>me lenone</i>, <i>duce me</i>: ablativos absolutos sin participio.</li><li><i>feci</i>: perfecto.</li></ul>", "hl": {}, "fx": {"12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b"}, "ul": {"31": "b", "18": "g", "35": "r", "36": "r", "19": "r", "21": "r", "24": "r", "25": "r", "26": "r", "28": "r", "29": "r", "30": "r"}, "lk": {}}, {"id": "a3-12-15-24", "ref": "3.12.15-24", "lines": ["cum Thebae, cum Troia foret, cum Caesaris acta,", "ingenium mouit sola Corinna meum.", "auersis utinam tetigissem carmina Musis,", "Phoebus et inceptum destituisset opus!", "nec tamen ut testes mos est audire poetas;", "malueram uerbis pondus abesse meis.", "per nos Scylla patri caros furata capillos", "pube premit rabidos inguinibusque canes;", "nos pedibus pinnas dedimus, nos crinibus angues;", "uictor Abantiades alite fertur equo;"], "trans": "<div>Aunque existían ya Tebas y Troya y las gestas de César, solamente Corina despertó mi inspiración.</div><div>¡Ojalá que las Musas se hubiesen apartado de mí cuando empezaba los poemas, y que se hubiese retirado Febo del trabajo emprendido!</div><div>Y sin embargo no es costumbre escuchar a los poetas como a personas fiables: yo habría preferido que no hubiesen tenido mis palabras efecto.</div><div>Por obra mía Escila, la que cortó a su padre los cabellos por él tan apreciados, lleva junto a su pubis y a sus ingles unos perros rabiosos.</div><div>Yo he puesto a unos pies alas, sierpes a unos cabellos.</div><div>Victorioso va el vástago de Abante sobre un caballo alado.</div>", "gloss": "<div><b>Abantiadēs, -ae, m.</b>: el descendiente de Abante (Perseo)</div><div><b>āles, ālitis</b>: alado</div><div><b>anguis, -is, m./f.</b>: serpiente</div><div><b>crīnis, -is, m.</b>: cabello</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>equus, -ī, m.</b>: caballo</div><div><b>ferō, fers, ferre, tulī, lātum (fertur: va, es llevado)</b>: llevar</div><div><b>nōs, nostrum</b>: nosotros</div><div><b>pēs, pedis, m.</b>: pie</div><div><b>pinna, -ae, f.</b>: pluma, ala</div><div><b>uictor, -ōris, m.</b>: vencedor</div>", "notes": "<div><b>La licencia de los poetas</b></div><ul><li><i>fertur</i>: pasiva con valor medio («va»).</li><li><i>pedibus</i>, <i>crinibus</i>: objeto indirecto. <i>dedimus</i>: 1.ª pl por 1.ª sg.</li></ul>", "hl": {}, "fx": {"48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b"}, "ul": {"57": "b", "54": "b", "55": "b", "51": "g", "49": "r", "58": "r", "53": "r"}, "lk": {}}, {"id": "a3-12-25-34", "ref": "3.12.25-34", "lines": ["idem per spatium Tityon porreximus ingens", "et tria uipereo fecimus ora cani;", "fecimus Enceladon iaculantem mille lacertis,", "ambiguae captos uirginis ore uiros;", "Aeolios Ithacis inclusimus utribus Euros;", "proditor in medio Tantalus amne sitit;", "de Niobe silicem, de uirgine fecimus ursam;", "concinit Odrysium Cecropis ales Ityn;", "Iuppiter aut in aues aut se transformat in aurum", "aut secat imposita uirgine taurus aquas."], "trans": "<div>Yo también extendí por un espacio enorme a Ticio, y creé las tres cabezas de aquel perro con rabo de serpiente.</div><div>Imaginé a Encélado que disparaba dardos con mil brazos, y a hombres cautivados por la voz que emitía una doncella biforme.</div><div>Yo he encerrado a los Euros de Eolo en los odres del de Ítaca.</div><div>Tántalo el delator en el medio del río siente sed.</div><div>Convertí a Níobe en roca y a una doncella en osa.</div><div>Canta al odrisio Itis el pájaro Cecrópida.</div><div>Júpiter se transforma en aves u oro, o, llevando en su lomo a la doncella, surca las aguas convertido en toro.</div>", "gloss": "<div><b>Aeolius, -a, -um</b>: de Eolo</div><div><b>amnis, -is, m.</b>: río</div><div><b>aqua, -ae, f.</b>: agua</div><div><b>auis, -is, f.</b>: ave</div><div><b>aurum, -ī, n.</b>: oro</div><div><b>aut</b>: o (aut… aut: o… o)</div><div><b>Eurus, -ī, m.</b>: Euro (viento del este); viento</div><div><b>impōnō, -is, -ere, imposuī, impositum</b>: poner encima</div><div><b>in (prep. + abl.)</b>: en</div><div><b>in (prep. + acus.)</b>: en (cambio de estado)</div><div><b>inclūdō, -is, -ere, inclūsī, inclūsum</b>: encerrar</div><div><b>Ithacus, -a, -um</b>: de Ítaca, itacense</div><div><b>Iuppiter, Iouis, m.</b>: Júpiter</div><div><b>medius, -a, -um</b>: medio</div><div><b>prōditor, -ōris, m.</b>: traidor</div><div><b>sē, suī</b>: se, a sí mismo</div><div><b>secō, -ās, -āre, secuī, sectum</b>: cortar, surcar</div><div><b>sitiō, -īs, -īre, sitīuī</b>: tener sed</div><div><b>Tantalus, -ī, m.</b>: Tántalo</div><div><b>taurus, -ī, m.</b>: toro</div><div><b>trānsfōrmō, -ās, -āre, -āvī, -ātum</b>: transformar</div><div><b>uirgō, -inis, f.</b>: doncella</div><div><b>ūter, ūtris, m.</b>: odre</div>", "notes": "<div><b>Mitos inventados</b></div><div>¿Qué hicieron los poetas con los mitos?</div><ul><li><i>imposita uirgine</i>: ablativo absoluto.</li><li><i>in aues</i>, <i>in aurum</i>: <i>in</i> + acusativo (cambio de estado).</li><li><i>inclusimus</i>: perfecto, 1.ª pl. El propio texto insinúa que Corina es ficticia (3.12.43-44) (Booth).</li></ul>", "hl": {}, "fx": {"22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b"}, "ul": {"25": "b", "27": "b", "31": "b", "48": "r", "52": "r", "53": "r", "24": "r", "57": "r", "56": "r", "47": "r"}, "lk": {}}, {"id": "a3-12-35-44", "ref": "3.12.35-44", "lines": ["Protea quid referam Thebanaque semina, dentes,", "qui uomerent flammas ore, fuisse boues,", "flere genis electra tuas, auriga, sorores,", "quaeque rates fuerint, nunc maris esse deas,", "auersumque diem mensis furialibus Atrei,", "duraque percussam saxa secuta lyram?", "exit in immensum fecunda licentia uatum,", "obligat historica nec sua uerba fide;", "et mea debuerat falso laudata uideri", "femina; credulitas nunc mihi uestra nocet."], "trans": "<div>¿Para qué nombraré a Proteo, y los dientes —las semillas de Tebas—, y que hubo toros que echaban fuego por la boca; que lloraban, auriga, tus hermanas ámbar que les caía por las mejillas; que las que fueron naves son ahora diosas del mar ; que se volvió hacia atrás el día ante el atroz festín de Atreo, y que se sometieron a los sones de una lira las rocas insensibles?</div><div>La libertad creadora de los poetas se desborda sin límites y no ata a la verdad histórica sus términos.</div><div>También os debería haber parecido falso el elogio mío de esta mujer.</div><div>Vuestra credulidad ahora me daña.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-14-1-10", "ref": "3.14.1-10", "lines": ["Non ego, ne pecces, cum sis formosa, recuso,", "sed ne sit misero scire necesse mihi,", "nec te nostra iubet fieri censura pudicam", "sed tamen ut temptes dissimulare rogat.", "non peccat, quaecumque potest peccasse negare,", "solaque famosam culpa professa facit.", "quis furor est, quae nocte latent, in luce fateri", "et, quae clam facias, facta referre palam?", "ignoto meretrix corpus iunctura Quiriti", "opposita populum summouet ante sera;"], "trans": "<div>Yo no te pido, hermosa como eres, que no me seas infiel, mas sí que yo, desdichado, no tenga que enterarme.</div><div>Y además no te ordenan mis reproches que te hagas casta, pero sí te ruegan que hagas intentos por disimularlo.</div><div>No es infiel la que puede decir que no lo ha sido.</div><div>Y además una mujer adquiere mala fama tan sólo si hace pública su culpa.</div><div>¿Qué insensatez es ésa, desvelar de día lo que en la noche está escondido, y proclamar en público los actos que realizas en secreto?</div><div>La meretriz que va a enlazar su cuerpo con un desconocido ciudadano se aparta de la gente, echando previamente los cerrojos.</div>", "gloss": "", "notes": "<div><b>Disimulá</b></div><div>¿Qué le pide el poeta a Corina?</div><ul><li>Libro 3 en espejo: en la segunda mitad el amante se aleja de la amada (Von Albrecht).</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-14-11-20", "ref": "3.14.11-20", "lines": ["tu tua prostitues famae peccata sinistrae", "commissi perages indiciumque tui?", "sit tibi mens melior, saltemue imitare pudicas,", "teque probam, quamuis non eris, esse putem.", "quae facis, haec facito: tantum fecisse negato", "nec pudeat coram uerba modesta loqui.", "est qui nequitiam locus exigat; omnibus illum", "deliciis imple, stet procul inde Pudor.", "hinc simul exieris, lasciuia protinus omnis", "absit, et in lecto crimina pone tuo."], "trans": "<div>¿Vas a prostituir tú tus traiciones dándolas a rumores maliciosos, y a ofrecer pruebas de tu propia falta?</div><div>Muestra mayor prudencia, o por lo menos imita a las honestas, de manera que, aun sin serlo, crea yo que eres honrada.</div><div>Harás lo mismo que haces.</div><div>Bastará con que niegues que lo hayas hecho.</div><div>Y no te dé vergüenza decir públicamente palabras decorosas.</div><div>Hay un lugar que es propio para los amoríos: llénalo bien con todos los placeres, y que quede el pudor lejos de allí.</div><div>Pero tan pronto como salgas de él, que se aleje de ti toda lascivia, y deja los delitos en tu lecho.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-14-21-30", "ref": "3.14.21-30", "lines": ["illic nec tunicam tibi sit posuisse pudori", "nec femori impositum sustinuisse femur;", "illic purpureis condatur lingua labellis,", "inque modos uenerem mille figuret amor;", "illic nec uoces nec uerba iuuantia cessent", "spondaque lasciua mobilitate tremat.", "indue cum tunicis metuentem crimina uultum,", "et pudor obscenum diﬀiteatur opus.", "da populo, da uerba mihi; sine nescius errem,", "et liceat stulta credulitate frui."], "trans": "<div>Allí no te avergüences de quitarte la túnica ni de poner tus muslos debajo de otros muslos.</div><div>Allí que entre una lengua en tus purpúreos labios, y que el amor invente placer de mil maneras.</div><div>Allí gritos, palabras excitantes no paren, y que la cama tiemble con el vaivén gozoso.</div><div>Revístete, a la vez que de la túnica, de un rostro que se asuste de tus culpas.</div><div>Burla a la gente.</div><div>Búrlame a mí.</div><div>Deja que en mi ignorancia me equivoque y que me sea posible disfrutar de mi credulidad necia.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-14-31-40", "ref": "3.14.31-40", "lines": ["cur totiens uideo mitti recipique tabellas?", "cur pressus prior est interiorque torus?", "cur plus quam somno turbatos esse capillos", "collaque conspicio dentis habere notam?", "tantum non oculos crimen deducis ad ipsos;", "si dubitas famae parcere, parce mihi.", "mens abit et morior, quotiens peccasse fateris,", "perque meos artus frigida gutta fluit.", "tunc amo, tunc odi frustra, quod amare necesse est;", "tunc ego, sed tecum, mortuus esse uelim."], "trans": "<div>¿Por qué veo tan frecuentemente tablillas que se envían y se reciben?</div><div>¿Por qué aparece hundido por arriba y en el centro tu lecho?</div><div>¿Por qué veo que están alborotados tus cabellos por algo más que el sueño, y que tu cuello presenta la señal de algún mordisco?</div><div>Por lo menos no traes ante mis propios ojos tu delito.</div><div>Si dudas en ahorrarle eso a tu fama, ahórramelo a mí.</div><div>Pierdo el sentido y muero cada vez que reconoces que has sido infiel, y cae sudor frío por mis miembros.</div><div>Entonces amo, entonces odio en vano, porque es forzoso amarte.</div><div>Entonces yo muerto quisiera estar, pero contigo.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-14-41-50", "ref": "3.14.41-50", "lines": ["nil equidem inquiram nec, quae celare parabis,", "insequar; et falli muneris instar erit.", "si tamen in media deprensa tenebere culpa", "et fuerint oculis probra uidenda meis,", "quae bene uisa mihi fuerint, bene uisa negato:", "concedent uerbis lumina nostra tuis.", "prona tibi uinci cupientem uincere palma est,", "sit modo ‘non feci’ dicere lingua memor.", "cum tibi contingat uerbis superare duobus,", "etsi non causa, iudice uince tuo."], "trans": "<div>Yo ya no voy a preguntarte nada ni a indagar lo que quieras ocultarme, y tendré por regalos tus engaños.</div><div>Si a pesar de ello acabas sorprendida en flagrante delito, y si tuvieran que contemplar mis ojos esa infamia, negarás que haya visto claramente aquello que habré visto claramente.</div><div>Podrá más tu palabra que mis ojos.</div><div>Fácil tienes la palma y la victoria sobre un hombre que quiere ser vencido.</div><div>Acuérdese tu lengua solamente de decirme: «No fui».</div><div>Ya que se te presenta la ocasión de trïunfar con dos palabras, vence, ya que no por el caso, por tu juez.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-15-1-10", "ref": "3.15.1-10", "lines": ["Quaere nouum uatem, tenerorum mater Amorum!", "raditur haec elegis ultima meta meis.", "quos ego composui, Paeligni ruris alumnus", "(nec me deliciae dedecuere meae),", "si quid id est, usque a proauis uetus ordinis heres,", "non modo militiae turbine factus eques.", "Mantua Vergilio gaudet, Verona Catullo;", "Paelignae dicar gloria gentis ego.", "quam sua libertas ad honesta coegerat arma,", "cum timuit socias anxia Roma manus."], "trans": "<div>Búscate un poeta nuevo, madre de los Amores tiernos.</div><div>Mis elegías están rozando aquí la última meta.</div><div>Las he compuesto yo, que me crié en el campo pelignio (y, la verdad, no me deshonran estas diversiones).</div><div>Si tiene algún valor, soy caballero por herencia de un rango que procede de mi antiguo abolengo, y no creado en la vorágine de la milicia.</div><div>Mantua se enorgullece de Virgilio, Verona de Catulo, y yo seré llamado gloria de la nación pelignia, a la que hizo su propia libertad tomar las armas del honor, cuando Roma tenía miedo y angustia ante las tropas aliadas.</div>", "gloss": "", "notes": "<div><b>Despedida</b></div><div>¿Qué deja el poeta y hacia dónde va?</div><div>↔ 1.15.</div><ul><li>3.15 despide el género (Harrison); Dioniso lo llama a la tragedia (Von Albrecht).</li><li>Con <i>Amores</i> queda completa la explotación de la elegía amorosa: «poética del ascenso genérico» (Harrison).</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-15-11-20", "ref": "3.15.11-20", "lines": ["atque aliquis spectans hospes Sulmonis aquosi", "moenia, quae campi iugera pauca tenent,", "‘quae tantum’ dicet ‘potuistis ferre poetam,", "quantulacumque estis, uos ego magna uoco’.", "culte puer puerique parens Amathusia culti,", "aurea de campo uellite signa meo;", "corniger increpuit thyrso grauiore Lyaeus:", "pulsanda est magnis area maior equis.", "imbelles elegi, genialis Musa, ualete,", "post mea mansurum fata superstes opus!"], "trans": "<div>Y dirá un forastero mirando las murallas de la húmeda Sulmona, que contienen unas pocas yugadas de terreno: «A vosotras, que habéis sido capaces de alumbrar un poeta tan valioso, por pequeñas que seáis, yo os llamo grandes».</div><div>Niño elegante, y tú, Amatusia, madre del elegante niño, arrancad vuestros áureos estandartes del territorio mío.</div><div>Me ha incitado con su tirso más grave el cornígero Lieo.</div><div>Una pista más ancha es la que tienen que golpear mis corceles poderosos.</div><div>Elegías incapaces de guerrear, Musa de los placeres, Adiós.</div><div>También a ti, obra que tras mi muerte permanecerás viva.</div>", "gloss": "<div><b>aliquis, aliqua, aliquid</b>: alguno, alguien</div><div><b>aquōsus, -a, -um</b>: rico en agua</div><div><b>atque</b>: y</div><div><b>campus, -ī, m.</b>: campo, llanura</div><div><b>dīcō, -is, -ere, dīxī, dictum (dīcet: dirá)</b>: decir</div><div><b>ego, meī</b>: yo</div><div><b>ferō, fers, ferre, tulī, lātum</b>: llevar, producir</div><div><b>hospes, -itis, m.</b>: forastero, visitante</div><div><b>iūgerum, -ī, n.</b>: yugada (medida de tierra)</div><div><b>magnus, -a, -um</b>: grande</div><div><b>moenia, -ium, n. pl.</b>: murallas</div><div><b>paucī, -ae, -a</b>: pocos</div><div><b>poēta, -ae, m.</b>: poeta</div><div><b>possum, potes, posse, potuī</b>: poder</div><div><b>quantuluscumque, -acumque, -umcumque</b>: por pequeño que sea</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>spectō, -ās, -āre, -āvī, -ātum</b>: mirar, contemplar</div><div><b>Sulmō, -ōnis, m.</b>: Sulmona (ciudad natal de Ovidio)</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>tantus, -a, -um (tantum, adv.: tanto)</b>: tan grande</div><div><b>teneō, -ēs, -ēre, tenuī, tentum</b>: tener, ocupar</div><div><b>uocō, -ās, -āre, -āvī, -ātum</b>: llamar</div><div><b>uōs, uestrum</b>: vosotros</div>", "notes": "<div><b>Sulmona</b></div><div>¿Qué dirá el forastero al ver Sulmona?</div><ul><li><i>spectans</i>: participio predicativo.</li><li><i>quae</i>: relativo; <i>uos magna uoco</i>, predicativo objetivo.</li><li><i>dicet</i>: futuro.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b"}, "ul": {"3": "b", "4": "b", "6": "b", "15": "g", "2": "r", "20": "r", "23": "r", "22": "r", "7": "r", "12": "r"}, "lk": {}}]};

  rq('rRef').textContent = t.ref + ' ▾';
  rq('rRef').setAttribute('aria-label', `Pasaje ${t.ref}. Ver la lista de pasajes`);
  rq('rPos').textContent = (idx + 1) + '/' + P.length;
  rq('rPrev').disabled = idx === 0; rq('rNext').disabled = idx === P.length - 1;
  rq('rLat').innerHTML = latHtml(t);
  const tabs = [];
  if(hasText(t.gloss)) tabs.push(['gloss', 'Glosario']);
  if(hasText(t.trans)) tabs.push(['trans', 'Traducción']);
  if(hasText(t.notes)) tabs.push(['notes', qLabel(t.notes)]);
  rq('rPanel').hidden = !tabs.length;
  const k = tabs.some(x => x[0] === tabSel) ? tabSel : (tabs[0] || [])[0];
  rq('rTabs').innerHTML = tabs.map(([key, lbl]) => `<button role="tab" data-k="${key}" aria-selected="${key === k}" title="${esc(lbl)}">${esc(lbl)}</button>`).join('');
  rq('rTab').innerHTML = !k ? '' : k === 'gloss' ? sortGloss(t.gloss) : t[k];
}
function go(i){ i = Math.max(0, Math.min(P.length - 1, i)); if(i === idx) return; idx = i; store.set('pid', P[idx].id); render(); window.scrollTo(0, 0); }
function openSheet(){
  rq('rSheetLbl').textContent = DATA.clase + ' · ' + P.length + ' pasajes';
  rq('rList').innerHTML = P.map((t, j) => `<li><button data-j="${j}"${j === idx ? ' aria-current="true"' : ''}><span class="rr">${esc(t.ref)}</span><span class="rw" lang="la">${esc((t.lines[0] || '').split(/\s+/).slice(0, 6).join(' '))}</span></button></li>`).join('');
  rq('rSheet').hidden = false;
  const c = rq('rList').querySelector('[aria-current]'); if(c) c.scrollIntoView({block:'center'});
}
rq('rSel').remove();
rq('rPrev').onclick = () => go(idx - 1);
rq('rNext').onclick = () => go(idx + 1);
rq('rRef').onclick = openSheet;
rq('rSheetClose').onclick = () => { rq('rSheet').hidden = true; };
rq('rSheet').addEventListener('click', e => {
  if(e.target === e.currentTarget){ rq('rSheet').hidden = true; return; }
  const b = e.target.closest('[data-j]'); if(b){ rq('rSheet').hidden = true; go(+b.dataset.j); }
});
rq('rTabs').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if(!b) return; tabSel = b.dataset.k; store.set('tab', tabSel); render(); });
rq('rMinus').onclick = () => { fs = Math.max(16, fs - 2); store.set('fs', fs); applyPrefs(); };
rq('rPlus').onclick = () => { fs = Math.min(30, fs + 2); store.set('fs', fs); applyPrefs(); };
rq('rThemeBtn').onclick = () => { const dark = getComputedStyle(document.body).colorScheme.includes('dark'); store.set('theme', dark ? 'light' : 'dark'); applyPrefs(); };
const openUrl = u => { u = safeUrl(u); if(u){ try { window.open(u, '_blank', 'noopener'); } catch(e){} } };
rq('rTab').addEventListener('click', e => { const a = e.target.closest('a'); if(a){ e.preventDefault(); openUrl(a.getAttribute('href')); } });
rq('rLat').addEventListener('click', e => { const w = e.target.closest('.w.lk'); if(w && getSelection().isCollapsed) openUrl(P[idx].lk[w.dataset.i]); });
let sw = null;
rq('rLat').addEventListener('touchstart', e => { if(e.touches.length === 1) sw = {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()}; }, {passive:true});
rq('rLat').addEventListener('touchend', e => {
  if(!sw) return; const s = sw; sw = null; const p = e.changedTouches[0], dx = p.clientX - s.x, dy = p.clientY - s.y;
  if(Date.now() - s.t > 700 || Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) / 2 || !getSelection().isCollapsed) return;
  go(idx + (dx < 0 ? 1 : -1));
}, {passive:true});
window.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ rq('rSheet').hidden = true; return; }
  if(!rq('rSheet').hidden) return;
  if(e.key === 'ArrowRight') go(idx + 1); else if(e.key === 'ArrowLeft') go(idx - 1);
});
applyPrefs(); render();
</script>
</body></html>
