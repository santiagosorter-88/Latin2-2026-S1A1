": "a1-13-1-10", "ref": "1.13.1-10", "lines": ["Iam super Oceanum uenit a seniore marito", "flaua pruinoso quae uehit axe diem.", "quo properas, Aurora? mane! sic Memnonis umbris", "annua sollemni caede parentet auis.", "nunc iuuat in teneris dominae iacuisse lacertis;", "si quando, lateri nunc bene iuncta meo est.", "nunc etiam somni pingues et frigidus aer,", "et liquidum tenui gutture cantat auis.", "quo properas, ingrata uiris, ingrata puellis?", "roscida purpurea supprime lora manu."], "trans": "<div>Ya viene, por encima del Océano dejando a su marido tan anciano la rubia diosa que nos trae el día en su escarchado carro.</div><div>¿A dónde vas tan rauda, Aurora?</div><div>Para, y a cambio de ello que tribute el ave cada año un solemne sacrificio en honor de la sombra de Memnón.</div><div>Ahora es grato yacer entre los tiernos brazos de mi dueña, ahora más que nunca está ella bien unida a mi costado.</div><div>Ahora también los sueños son tranquilos, fresco el aire, y entona con su leve garganta el pájaro su canto transparente.</div><div>¿A dónde vas tan rauda, molestando a los hombres, molestando también a las mujeres?</div><div>Refrena con tu mano sonrosada las riendas recubiertas de rocío.</div>", "gloss": "", "notes": "<div><b>Alba</b></div><div>¿A quién le habla el poeta y qué le reprocha?</div><ul><li>Poema de alba: Von Albrecht sugiere que el alba medieval quizá derive de 1.13.</li><li>Recepción: Cetina, «Horas alegres»; Quevedo, soneto a la Aurora, con <i>uariatio</i> (Cristóbal).</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a1-13-11-20", "ref": "1.13.11-20", "lines": ["ante tuos ortus melius sua sidera seruat", "nauita nec media nescius errat aqua;", "te surgit quamuis lassus ueniente uiator", "et miles saeuas aptat ad arma manus;", "prima bidente uides oneratos arua colentes,", "prima uocas tardos sub iuga panda boues;", "tu pueros somno fraudas tradisque magistris,", "ut subeant tenerae uerbera saeua manus,", "atque eadem sponsum cultos ante Atria mittis,", "unius ut uerbi grandia damna ferant;"], "trans": "<div>Antes de que tú surjas, sus estrellas mejor observa el navegante, y no vaga en medio del agua, confundido.</div><div>Al llegar tú, el viajero se levanta por cansado que esté, y el soldado ajusta al armamento sus manos rigurosas.</div><div>Tú eres la primera que contempla cargados con su azada a los labriegos, la primera que hace que se pongan los lentos bueyes bajo el yugo arqueado.</div><div>Tú privas a los niños del sueño y los entregas a los maestros, para que sus tiernas manos a azotes crueles se sometan, y tú envías a unos hombres elegantes ante los atrios, a comprometerse y a sufrir grandes daños por sólo una palabra.</div>", "gloss": "<div><b>ad (prep. + acus.)</b>: a, hacia</div><div><b>aptō, -ās, -āre, -āvī, -ātum</b>: ajustar, adaptar</div><div><b>arma, -ōrum, n. pl.</b>: armas</div><div><b>aruum, -ī, n.</b>: campo arado</div><div><b>bidēns, -entis, m.</b>: azada de dos dientes</div><div><b>bōs, bouis, m./f.</b>: buey</div><div><b>colō, -is, -ere, coluī, cultum (colentēs: los que cultivan)</b>: cultivar</div><div><b>et</b>: y</div><div><b>iugum, -ī, n.</b>: yugo</div><div><b>lassus, -a, -um</b>: cansado</div><div><b>manus, -ūs, f.</b>: mano</div><div><b>mīles, -itis, m.</b>: soldado</div><div><b>onerō, -ās, -āre, -āvī, -ātum</b>: cargar</div><div><b>pandus, -a, -um</b>: curvo</div><div><b>prīmus, -a, -um</b>: primero</div><div><b>quamuīs</b>: aunque</div><div><b>saeuus, -a, -um</b>: cruel, fiero</div><div><b>sub (prep. + acus.)</b>: bajo</div><div><b>surgō, -is, -ere, surrēxī, surrēctum</b>: levantarse</div><div><b>tardus, -a, -um</b>: lento</div><div><b>tū, tuī</b>: tú, vos</div><div><b>ueniō, -īs, -īre, uēnī, uentum (te ueniente: al llegar tú)</b>: venir, llegar</div><div><b>uiātor, -ōris, m.</b>: viajero, caminante</div><div><b>uideō, -ēs, -ēre, uīdī, uīsum</b>: ver</div><div><b>uocō, -ās, -āre, -āvī, -ātum</b>: llamar</div>", "notes": "<div><b>La Aurora interrumpe</b></div><div>¿Quiénes se levantan con la Aurora?</div><ul><li><i>te ueniente</i>: ablativo absoluto con pronombre de 2.ª persona.</li><li><i>lassus</i>, <i>prima</i>: predicativos subjetivos no obligatorios.</li><li><i>arua colentes</i>: participio sustantivado («los labriegos»); <i>oneratos</i>, predicativo.</li><li><i>quamuis</i>: concesivo en indicativo.</li></ul>", "hl": {}, "fx": {"13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b"}, "ul": {"18": "b", "27": "b", "20": "b", "38": "b", "16": "r", "17": "r", "13": "r", "29": "r", "30": "r", "31": "r"}, "lk": {}}, {"id": "a1-13-21-30", "ref": "1.13.21-30", "lines": ["nec tu consulto, nec tu iucunda diserto:", "cogitur ad lites surgere uterque nouas;", "tu, cum feminei possint cessare labores,", "lanificam reuocas ad sua pensa manum.", "omnia perpeterer; sed surgere mane puellas", "quis, nisi cui non est ulla puella, ferat?", "optaui quotiens ne Nox tibi cedere uellet,", "ne fugerent uultus sidera mota tuos!", "optaui quotiens aut uentus frangeret axem", "aut caderet spissa nube retentus equus!"], "trans": "<div>Tampoco agradas al jurisconsulto ni al abogado: deben levantarse uno y otro para ir a nuevos pleitos.</div><div>Cuando podrían descansar los brazos de las mujeres, tú obligas a las manos hilanderas a volver a su ovillo.</div><div>Todo lo aguantaría con paciencia.</div><div>Pero, que se levanten de mañana las muchachas, ¿quién puede soportarlo a no ser el que no tiene ninguna?</div><div>¡Cuántas veces deseé que la Noche no te dejara paso y que, en su movimiento, las estrellas no huyeran de tu rostro!</div><div>¡Cuántas veces deseé que el viento quebrantara el eje de tu carro, que cayera uno de tus corceles, detenido por una espesa nube!</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a1-13-31-40", "ref": "1.13.31-40", "lines": ["inuida, quo properas? quod erat tibi filius ater,", "materni fuerat pectoris ille color.", "[quid, si non Cephali quondam flagrasset amore?", "an putat ignotam nequitiam esse suam?]", "Tithono uellem de te narrare liceret:", "femina non caelo turpior ulla foret.", "illum dum refugis, longo quia grandior aeuo,", "surgis ad inuisas a sene mane rotas;", "at si quem manibus Cephalum complexa teneres,", "clamares ‘lente currite, Noctis equi!’"], "trans": "<div>Envidiosa, ¿a dónde vas tan rauda?</div><div>Era negro tu hijo, porque de ese color tenía el corazón su madre.</div><div>Quisiera que Titono pudiera hablar de ti: en el cielo no habría mujer alguna más avergonzada.</div><div>Con tal de huir de él, porque es viejo y de edad muy avanzada, con el alba te subes a ese carro que el anciano aborrece.</div><div>Pero si, con tus manos abrazándolo, a Céfalo tuvieras, gritarías: «Corred lentos, corceles de la noche».</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a1-13-41-48", "ref": "1.13.41-48", "lines": ["cur ego plectar amans, si uir tibi marcet ab annis?", "num me nupsisti conciliante seni?", "aspice quot somnos iuueni donarit amato", "Luna, neque illius forma secunda tuae.", "ipse deum genitor, ne te tam saepe uideret,", "commisit noctes in sua uota duas.", "iurgia finieram; scires audisse: rubebat,", "nec tamen assueto tardius orta dies."], "trans": "<div>¿Por qué al amar voy yo a pagar las culpas de que esté consumido tu esposo por los años?</div><div>¿Acaso serví yo de intermediario para que te casaras con el viejo?</div><div>Contempla cuánto sueño la Luna concedió a su amado joven (y la hermosura de ella no cede ante la tuya).</div><div>Incluso el propio padre de los dioses juntó, para no verte tantas veces, dos noches y cumplió así sus deseos.</div><div>Yo ya había terminado mis reproches: podría parecer que me había oído, pues se ruborizaba.</div><div>Sin embargo, no nació el día después que de costumbre.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a1-15-1-6", "ref": "1.15.1-6", "lines": ["Quid mihi, Liuor edax, ignauos obicis annos", "ingeniique uocas carmen inertis opus,", "non me more patrum, dum strenua sustinet aetas,", "praemia militiae puluerulenta sequi", "nec me uerbosas leges ediscere nec me", "ingrato uocem prostituisse foro?"], "trans": "<div>¿Por qué, Envidia voraz, me echas en cara mis años de pereza, y a mis versos los llamas obra de un talento estéril?</div><div>¿Y que no haya seguido la costumbre de los antepasados, mientras da la edad valiente fuerzas, y no tenga polvorientos trofeos de la milicia, que no domine la palabrería de las leyes, y no haya prostituido en el ingrato foro la voz mía?</div>", "gloss": "", "notes": "<div><b><i>Sphragis</i></b></div><div>¿Qué le reprocha la Envidia al poeta?</div><div>↔ 3.15.</div><ul><li>Poema de cierre como <i>sphragis</i>: frente a la Envidia, el <i>uates</i> rechaza la milicia, el derecho y el foro y busca <i>fama perennis</i> (Sala).</li><li>La conciencia de la inmortalidad del poeta está ya en 1.15 y vuelve en 3.15 (Von Albrecht).</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a1-15-7-12", "ref": "1.15.7-12", "lines": ["mortale est, quod quaeris, opus; mihi fama perennis", "quaeritur, in toto semper ut orbe canar.", "uiuet Maeonides, Tenedos dum stabit et Ide,", "dum rapidas Simois in mare uoluet aquas;", "uiuet et Ascraeus, dum mustis uua tumebit,", "dum cadet incurua falce resecta Ceres;"], "trans": "<div>Lo que me pides son obras mortales.</div><div>Yo pretendo una fama duradera, de tal modo que sea cantado siempre en todo el universo.</div><div>Vivirá el de Meonia, mientras Ténedos e Ida perduren, mientras vierta sus aguas presurosas el Símois en el mar.</div><div>Y vivirá el de Ascra mientras se hinche la uva con su mosto, mientras caiga el cereal segado por la hoz curva.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a1-15-13-22", "ref": "1.15.13-22", "lines": ["Battiades semper toto cantabitur orbe:", "quamuis ingenio non ualet, arte ualet;", "nulla Sophocleo ueniet iactura cothurno;", "cum sole et luna semper Aratus erit;", "dum fallax seruus, durus pater, improba lena", "uiuent et meretrix blanda, Menandros erit;", "Ennius arte carens animosique Accius oris", "casurum nullo tempore nomen habent;", "Varronem primamque ratem quae nesciet aetas", "aureaque Aesonio terga petita duci?"], "trans": "<div>El Batíada será siempre cantado en todo el universo: él es valioso por su arte, aunque no sea por su talento.</div><div>Ningún daño vendrá al coturno de Sófocles.</div><div>Arato estará siempre junto al sol y la luna.</div><div>Menandro seguirá, mientras estén vivos el siervo mentiroso, el padre inflexible, la pérfida alcahueta junto a la cariñosa meretriz.</div><div>Ennio, carente de arte, y Accio, el de generosa voz, gozan de un renombre que en ningún momento decaerá.</div><div>¿Qué época va a ignorar a Varrón y la primera nave, y el lomo de oro que buscaba el Esonio caudillo?</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a1-15-23-32", "ref": "1.15.23-32", "lines": ["carmina sublimis tunc sunt peritura Lucreti,", "exitio terras cum dabit una dies;", "Tityrus et segetes Aeneiaque arma legentur,", "Roma triumphati dum caput orbis erit;", "donec erunt ignes arcusque Cupidinis arma,", "discentur numeri, culte Tibulle, tui;", "Gallus et Hesperiis et Gallus notus Eois,", "et sua cum Gallo nota Lycoris erit.", "ergo cum silices, cum dens patientis aratri", "depereant aeuo, carmina morte carent."], "trans": "<div>Los poemas del sublime Lucrecio morirán cuando un único día acabe con las tierras.</div><div>Títiro y las cosechas y las armas de Eneas se leerán mientras sea capital Roma del mundo a nuestro triunfo sometido.</div><div>Mientras existan fuegos y arcos, armas de Cupido, serán, culto Tibulo, aprendidos tus versos.</div><div>Será célebre Galo en el Occidente, y Galo en el Oriente y célebre con Galo su querida Licoris.</div><div>Así que, aunque las piedras y aunque el diente del arado sufrido, perezcan con el tiempo, los poemas están libres de la muerte.</div>", "gloss": "<div><b>Aenēius, -a, -um</b>: de Eneas</div><div><b>arma, -ōrum, n. pl.</b>: armas</div><div><b>caput, -itis, n.</b>: cabeza, capital</div><div><b>dum</b>: mientras</div><div><b>et</b>: y</div><div><b>legō, -is, -ere, lēgī, lēctum (legentur: serán leídos)</b>: leer</div><div><b>orbis, -is, m.</b>: orbe, mundo</div><div><b>-que</b>: y</div><div><b>Rōma, -ae, f.</b>: Roma</div><div><b>seges, -etis, f.</b>: mies, sembrado (las Geórgicas)</div><div><b>sum, es, esse, fuī (erit: será)</b>: ser</div><div><b>Tītyrus, -ī, m.</b>: Títiro (pastor de las Églogas)</div><div><b>triumphō, -ās, -āre, -āvī, -ātum (triumphātus: vencido)</b>: triunfar sobre</div>", "notes": "<div><b>La carrera de Virgilio</b></div><div>¿Qué tres obras nombra el v. 25?</div><div>↔ Verg. <i>Ecl.</i> 1.1 (<i>Tityre</i>); <i>Georg.</i>; <i>Aen.</i></div><ul><li><i>legentur</i>: pasiva de infectum, 3.ª pl (futuro); la traducción da «se leerán».</li><li><i>triumphati orbis</i>: participio concertado.</li><li><i>Tityrus et segetes Aeneiaque arma</i>: <i>Églogas</i>, <i>Geórgicas</i>, <i>Eneida</i>. Ovidio fue el primero en ver la carrera de Virgilio como paradigma (Thomas).</li></ul>", "hl": {}, "fx": {"12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b"}, "ul": {"21": "b", "14": "b", "17": "r", "19": "r", "22": "r"}, "lk": {}}, {"id": "a1-15-33-42", "ref": "1.15.33-42", "lines": ["cedant carminibus reges regumque triumphi,", "cedat et auriferi ripa benigna Tagi.", "uilia miretur uulgus; mihi flauus Apollo", "pocula Castalia plena ministret aqua,", "sustineamque coma metuentem frigora myrtum", "atque a sollicito multus amante legar.", "pascitur in uiuis Liuor; post fata quiescit,", "cum suus ex merito quemque tuetur honos.", "ergo etiam cum me supremus adederit ignis,", "uiuam, parsque mei multa superstes erit."], "trans": "<div>Ante el poema cedan los reyes y los triunfos de los reyes.</div><div>Ceda también la orilla del aurífero Tajo generosa.</div><div>Admire el vulgo cosas despreciables y a mí sírvame el rubio Apolo una copa llena con agua de Castalia.</div><div>Tenga yo en mis cabellos el mirto temeroso de los fríos y léame mucho así el amante inquieto.</div><div>La Envidia se alimenta de los vivos; tras la muerte descansa, cuando vela por cada cual su fama merecida.</div><div>Así que incluso cuando el fuego último me haya devorado, viviré y gran parte de mí perdurará.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-1-1-10", "ref": "2.1.1-10", "lines": ["Hoc quoque composui, Paelignis natus aquosis,", "ille ego nequitiae Naso poeta meae.", "hoc quoque iussit Amor; procul hinc, procul este, seueri!", "non estis teneris apta theatra modis.", "me legat in sponsi facie non frigida uirgo", "et rudis ignoto tactus amore puer;", "atque aliquis iuuenum, quo nunc ego, saucius arcu", "agnoscat flammae conscia signa suae", "miratusque diu ‘quo’ dicat ‘ab indice doctus", "composuit casus iste poeta meos?’"], "trans": "<div>Esta obra también yo la he compuesto, el nacido en la húmeda tierra de los pelignios, yo, el famoso Nasón, poeta de mi propia mala vida.</div><div>Esta obra también nace por mandato del Amor.</div><div>¡Alejaos, alejaos de aquí los rigurosos!</div><div>No sois el auditorio que conviene a mis dulces acentos.</div><div>Que me lea la doncella enfebrecida por la presencia de su prometido, y el muchacho inexperto tocado de un amor que desconoce, y que un joven, herido por el arco que ahora me hiere a mí, reconozca señales cómplices de su fuego y, saliendo de un largo asombro, diga: «¿Qué delator ha instruido a ese poeta para que pueda así cantar mi caso?»</div>", "gloss": "<div><b>aquōsus, -a, -um</b>: rico en agua, húmedo</div><div><b>compōnō, -is, -ere, composuī, compositum</b>: componer, escribir</div><div><b>ego, meī</b>: yo</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>ille, illa, illud</b>: aquel; (ille ego) aquel famoso yo</div><div><b>meus, -a, -um</b>: mío</div><div><b>nāscor, -eris, nāscī, nātus sum (nātus: nacido)</b>: nacer</div><div><b>Nāsō, -ōnis, m.</b>: Nasón (Ovidio)</div><div><b>nēquitia, -ae, f.</b>: picardía, desenfreno</div><div><b>Paelignī, -ōrum, m. pl.</b>: los pelignos (pueblo de Ovidio)</div><div><b>poēta, -ae, m.</b>: poeta</div><div><b>quoque</b>: también</div>", "notes": "<div><b><i>Ille ego… Naso</i></b></div><div>¿Quién habla y cómo se presenta?</div><div>↔ Prólogo apócrifo de la <i>Eneida</i> (<i>Ille ego qui quondam…</i>).</div><ul><li><i>composui</i>: perfecto, 1.ª sg. <i>natus</i>: participio concertado (de <i>nascor</i>, deponente).</li><li><i>Paelignis aquosis</i>: ablativo de origen.</li><li>2.1 desvía otra epopeya, ahora una Gigantomaquia (Harrison).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b"}, "ul": {"9": "b", "2": "r", "4": "r"}, "lk": {}}, {"id": "a2-1-11-18", "ref": "2.1.11-18", "lines": ["ausus eram, memini, caelestia dicere bella", "centimanumque Gygen (et satis oris erat),", "cum male se Tellus ulta est ingestaque Olympo", "ardua deuexum Pelion Ossa tulit:", "in manibus nimbos et cum Ioue fulmen habebam,", "quod bene pro caelo mitteret ille suo.", "clausit amica fores: ego cum Ioue fulmen omisi;", "excidit ingenio Iuppiter ipse meo."], "trans": "<div>Yo me había atrevido a tratar, lo recuerdo, las guerras celestiales y al centímano Giges (tenía aliento bastante para ello), el caso en que la Tierra se vengó cruelmente y en que el Osa escarpado al ser lanzado en contra del Olimpo arrastró al Pelión en su caída.</div><div>En mis manos tenía yo las nubes, y el rayo junto a Júpiter, el que él iba a lanzar con puntería por defender su cielo.</div><div>Mas mi amiga cerró sus puertas.</div><div>Yo solté a Júpiter y al rayo.</div><div>Se cayó Júpiter en persona de mi mente.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-1-19-28", "ref": "2.1.19-28", "lines": ["Iuppiter, ignoscas; nil me tua tela iuuabant;", "clausa tuo maius ianua fulmen habet.", "blanditias elegosque leues, mea tela, resumpsi:", "mollierunt duras lenia uerba fores.", "carmina sanguineae deducunt cornua lunae", "et reuocant niueos solis euntis equos;", "carmine dissiliunt abruptis faucibus angues", "inque suos fontes uersa recurrit aqua;", "carminibus cessere fores, insertaque posti,", "quamuis robur erat, carmine uicta sera est."], "trans": "<div>(Perdón, Júpiter, nada me ayudaban tus armas.</div><div>Y esa puerta cerrada es aún más fulminante que tu rayo).</div><div>Retomé yo las tiernas expresiones y los ligeros versos elegíacos —mis armas.</div><div>Mis palabras suaves lograron ablandar su puerta dura.</div><div>Son versos los que logran que aparezcan los cuernos de la sangrienta luna y que se den la vuelta los corceles níveos del Sol en marcha.</div><div>Por un hechizo en verso saltan despedazadas las serpientes con las fauces partidas, y el agua que fluía vuelve a sus manantiales.</div><div>Por obra de los versos al fin cedió la puerta y al cerrojo en la jamba introducido, aunque ésta era de roble, el verso lo venció.</div>", "gloss": "<div><b>carmen, -inis, n.</b>: poema, canto</div><div><b>cēdō, -is, -ere, cessī, cessum (cessēre = cessērunt)</b>: ceder</div><div><b>foris, -is, f. (pl. forēs)</b>: puerta (de la casa)</div><div><b>īnserō, -is, -ere, īnseruī, īnsertum (+ dat.)</b>: introducir, encajar en</div><div><b>postis, -is, m.</b>: jamba, poste de la puerta</div><div><b>quamuīs</b>: aunque</div><div><b>-que</b>: y</div><div><b>rōbur, -oris, n.</b>: roble; solidez</div><div><b>sera, -ae, f.</b>: cerrojo</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>uincō, -is, -ere, uīcī, uictum</b>: vencer</div>", "notes": "<div><b>El poder del canto</b></div><div>¿Qué consigue el verso?</div><ul><li><i>uicta est</i>: pasiva de perfectum; <i>carmine</i>, causa eficiente. La traducción la vuelve activa.</li><li><i>inserta posti</i>: participio concertado; <i>cessere</i> = <i>cesserunt</i>.</li><li><i>quamuis</i> concesivo en indicativo.</li></ul>", "hl": {}, "fx": {"46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b"}, "ul": {"48": "b", "50": "b", "52": "b", "46": "b", "47": "g", "49": "r", "57": "r", "54": "r", "55": "r"}, "lk": {}}, {"id": "a2-1-29-38", "ref": "2.1.29-38", "lines": ["quid mihi profuerit uelox cantatus Achilles?", "quid pro me Atrides alter et alter agent,", "quique tot errando quot bello perdidit annos,", "raptus et Haemoniis flebilis Hector equis?", "at facie tenerae laudata saepe puellae", "ad uatem, pretium carminis, ipsa uenit.", "magna datur merces: heroum clara ualete", "nomina! non apta est gratia uestra mihi.", "ad mea formosos uultus adhibete, puellae,", "carmina, purpureus quae mihi dictat Amor!"], "trans": "<div>¿De qué me habría servido cantar al raudo Aquiles?</div><div>¿Qué bien me harían a mí los dos Atridas y el que en viajes errantes tantos años perdió como en la guerra, o Héctor el que merece ser llorado cuando arrastrado fue por caballos hemonios?</div><div>En cambio, tras frecuentes elogios a una tierna muchacha, ella se entrega al poeta como pago por sus versos.</div><div>¡Grande es la recompensa que se da!</div><div>Adiós preclaros nombres de los héroes.</div><div>No son vuestros favores los que a mí me convienen.</div><div>Y vosotras, muchachas, volved vuestros hermosos ojos hacia estos versos que ya el purpúreo Amor me va dictando.</div>", "gloss": "<div><b>ad (prep. + acus.)</b>: hacia, a</div><div><b>adhibeō, -ēs, -ēre, adhibuī, adhibitum</b>: aplicar, volver hacia</div><div><b>Amor, -ōris, m.</b>: Amor</div><div><b>aptus, -a, -um (+ dat.)</b>: adecuado</div><div><b>carmen, -inis, n.</b>: poema, canto</div><div><b>clārus, -a, -um</b>: ilustre</div><div><b>dictō, -ās, -āre, -āvī, -ātum</b>: dictar</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>ego, meī</b>: yo</div><div><b>fōrmōsus, -a, -um</b>: hermoso</div><div><b>grātia, -ae, f.</b>: favor, gracia</div><div><b>hērōs, -ōis, m.</b>: héroe</div><div><b>magnus, -a, -um</b>: grande</div><div><b>mercēs, -ēdis, f.</b>: recompensa, paga</div><div><b>meus, -a, -um</b>: mío</div><div><b>nōmen, -inis, n.</b>: nombre</div><div><b>nōn</b>: no</div><div><b>puella, -ae, f.</b>: muchacha</div><div><b>purpureus, -a, -um</b>: purpúreo, resplandeciente</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>ualeō, -ēs, -ēre, ualuī (ualēte: adiós)</b>: estar bien</div><div><b>uester, uestra, uestrum</b>: vuestro</div><div><b>uultus, -ūs, m.</b>: rostro</div>", "notes": "<div><b>Adiós a los héroes</b></div><div>¿Qué gana el poeta con la elegía?</div><div>↔ 1.1.27-28 (<i>ferrea cum uestris bella ualete modis</i>).</div><ul><li><i>datur</i>: pasiva con «se» en la traducción.</li><li><i>apta est</i> + dativo: predicativo subjetivo.</li><li><i>quae</i>: n. pl., antecedente <i>carmina</i>, OD de <i>dictat</i>.</li><li><i>ualete</i>, <i>adhibete</i>: imperativos plurales.</li></ul>", "hl": {}, "fx": {"39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b", "60": "b", "61": "b", "62": "b", "63": "b"}, "ul": {"58": "b", "41": "b", "42": "b", "45": "b", "63": "b", "40": "r", "48": "r", "60": "r", "47": "r"}, "lk": {}}, {"id": "a2-4-1-8", "ref": "2.4.1-8", "lines": ["Non ego mendosos ausim defendere mores", "falsaque pro uitiis arma mouere meis.", "confiteor, si quid prodest delicta fateri;", "in mea nunc demens crimina fassus eo.", "odi, nec possum, cupiens, non esse quod odi:", "heu quam, quae studeas ponere, ferre graue est!", "nam desunt uires ad me mihi iusque regendum;", "auferor, ut rapida concita puppis aqua."], "trans": "<div>Yo no me atrevería a defender mis desviadas costumbres, ni a esgrimir defensas engañosas en favor de mis vicios.</div><div>Lo confieso —si sirve para algo el confesar las culpas.</div><div>Ahora, tras confesarlo, vuelvo insensatamente a mis delitos.</div><div>Odio y no me es posible dejar de desear aquello que odio.</div><div>¡Ay, qué dura se hace de llevar la carga que uno intenta sacudirse!</div><div>No tengo fuerzas ni jurisdicción para ejercer dominio sobre mí.</div><div>Empujado me veo, como la nave a la que arrastra un rápido torrente.</div>", "gloss": "", "notes": "<div><b>Todas le gustan</b></div><div>¿Qué confiesa el poeta?</div><ul><li>Libro 2 en simetría axial alrededor de 2.10, el amor por dos mujeres (Von Albrecht).</li><li>El amante elegíaco ovidiano es «alegremente amoral» (Booth).</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-4-9-18", "ref": "2.4.9-18", "lines": ["non est certa meos quae forma inuitet amores:", "centum sunt causae cur ego semper amem.", "siue aliqua est oculos in humum deiecta modestos,", "uror, et insidiae sunt pudor ille meae;", "siue procax aliqua est, capior quia rustica non est", "spemque dat in molli mobilis esse toro;", "aspera si uisa est rigidasque imitata Sabinas,", "uelle sed ex alto dissimulare puto;", "siue es docta, places raras dotata per artes;", "siue rudis, placita es simplicitate tua."], "trans": "<div>No hay un modelo exacto de hermosura que sea el que despierta mis amores.</div><div>Existen cien motivos para que yo esté siempre enamorado.</div><div>Si alguna está en sí misma recogida con la mirada baja, me abraso y su recato es para mí emboscada que me tiende.</div><div>Si otra es provocativa, caigo preso de que no sea una rústica, y me ofrece esperanzas de que se moverá en el blando lecho.</div><div>Si se muestra intratable, imitadora de las sabinas rigurosas, pienso que quiere, pero está disimulando en el fondo.</div><div>Si culta eres, me encantas por esas raras artes que te adornan.</div><div>Mas, si eres ignorante, me has complacido por tu ingenuidad.</div>", "gloss": "<div><b>aliquis, aliqua, aliquid</b>: alguno, alguna</div><div><b>capiō, -is, -ere, cēpī, captum (capior: soy capturado)</b>: tomar, capturar</div><div><b>dēiciō, -is, -ere, dēiēcī, dēiectum</b>: bajar, echar abajo</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>et</b>: y</div><div><b>humus, -ī, f.</b>: tierra, suelo</div><div><b>ille, illa, illud</b>: aquel, ese</div><div><b>in (prep. + acus. / + abl.)</b>: hacia; en</div><div><b>īnsidiae, -ārum, f. pl.</b>: trampa, emboscada</div><div><b>meus, -a, -um</b>: mío</div><div><b>mōbilis, -e</b>: movedizo, ágil</div><div><b>modestus, -a, -um</b>: recatado, modesto</div><div><b>mollis, -e</b>: blando, suave</div><div><b>nōn</b>: no</div><div><b>oculus, -ī, m.</b>: ojo</div><div><b>procāx, -ācis</b>: desenvuelto, provocativo</div><div><b>pudor, -ōris, m.</b>: pudor</div><div><b>-que</b>: y</div><div><b>quia</b>: porque</div><div><b>rūsticus, -a, -um</b>: rústico, tosco</div><div><b>sīue</b>: o si (sīue… sīue: ya sea que… o que)</div><div><b>spēs, -eī, f.</b>: esperanza</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>torus, -ī, m.</b>: lecho</div><div><b>ūrō, -is, -ere, ussī, ustum (ūror: me quemo)</b>: quemar</div>", "notes": "<div><b><i>Siue… siue</i></b></div><div>¿Qué tienen en común la recatada y la desenvuelta?</div><ul><li><i>uror</i>, <i>capior</i>: pasiva de infectum, 1.ª sg (<i>capio</i>, 5.ª conjugación).</li><li><i>insidiae sunt</i>: predicativo subjetivo.</li><li><i>quia</i>: causal en indicativo. <i>deiecta oculos</i>: término a consultar.</li></ul>", "hl": {}, "fx": {"15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b"}, "ul": {"27": "b", "25": "r", "26": "r", "34": "r", "23": "r"}, "lk": {}}, {"id": "a2-4-19-28", "ref": "2.4.19-28", "lines": ["est quae Callimachi prae nostris rustica dicat", "carmina: cui placeo, protinus ipsa placet;", "est etiam quae me uatem et mea carmina culpet:", "culpantis cupiam sustinuisse femur.", "molliter incedit: motu capit; altera dura est:", "at poterit tacto mollior esse uiro.", "huic, quia dulce canit flectitque facillima uocem,", "oscula cantanti rapta dedisse uelim;", "haec querulas habili percurrit pollice chordas:", "tam doctas quis non possit amare manus?"], "trans": "<div>Dice una que los versos de Calímaco son rústicos al lado de los míos: al instante me agrada esa mujer a la que yo le agrado.</div><div>También existe la que me critica a mí como poeta y a mis versos: pues sobre mí quisiera yo los muslos de esa que me censura.</div><div>Avanza delicada: me cautiva su movimiento.</div><div>Brusca es esta otra, pero al tocar a un hombre podría ser más tierna.</div><div>A ésta, porque canta dulcemente y modula la voz con gran soltura quisiera darle besos robados mientras canta.</div><div>Esa pulsa las cuerdas lastimeras con su pulgar experto.</div><div>¿Quién podría no enamorarse de tan doctas manos?</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-4-29-38", "ref": "2.4.29-38", "lines": ["illa placet gestu numerosaque bracchia ducit", "et tenerum molli torquet ab arte latus:", "ut taceam de me, qui causa tangor ab omni,", "illic Hippolytum pone, Priapus erit.", "tu, quia tam longa es, ueteres heroidas aequas", "et potes in toto multa iacere toro;", "haec habilis breuitate sua est: corrumpor utraque;", "conueniunt uoto longa breuisque meo.", "non est culta: subit quid cultae accedere possit;", "ornata est: dotes exhibet ipsa suas."], "trans": "<div>Aquella con su gesto nos deleita, mueve los brazos cadenciosamente y ondula su costado delicado con suavidad: para no hablar de mí que me conmuevo por cualquier motivo, pon a Hipólito allí y será un Príapo.</div><div>Tú, por lo alta que eres, te pareces a antiguas heroínas y en la cama puedes ocupar todo con tu cuerpo.</div><div>Ésta se presta por su pequeñez a ser acariciada.</div><div>Por las dos yo me pierdo: la grande y la pequeña van bien para mi gusto.</div><div>Una no está arreglada: me imagino cuánto le añadiría el que lo estuviera.</div><div>Otra está engalanada: ella misma me muestra sus encantos.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-4-39-48", "ref": "2.4.39-48", "lines": ["candida me capiet, capiet me flaua puella;", "est etiam in fusco grata colore uenus.", "seu pendent niuea pulli ceruice capilli,", "Leda fuit nigra conspicienda coma;", "seu flauent, placuit croceis Aurora capillis:", "omnibus historiis se meus aptat amor.", "me noua sollicitat, me tangit serior aetas:", "haec melior specie, moribus illa placet.", "denique quas tota quisquam probat Vrbe puellas,", "noster in has omnes ambitiosus amor."], "trans": "<div>La de piel blanca me cautivará, y me cautivará la sonrosada.</div><div>También en el color de piel oscuro resulta el amor grato.</div><div>Si caen negros cabellos sobre el cuello de nieve, Leda fue deseable por su pelo moreno.</div><div>Y si es rubia, resulta que la Aurora gustó por su cabello de color azafranado.</div><div>Mi amor se adapta a todas las historias.</div><div>La juventud me atrae, la madurez me llama.</div><div>La primera es mejor por su hermosura, por su comportamiento agrada la otra.</div><div>En fin, a esas muchachas que el buen gusto de todo el mundo aprueba en Roma entera, mi amor las ambiciona a todas ellas.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-6-1-6", "ref": "2.6.1-6", "lines": ["Psittacus, Eois imitatrix ales ab Indis,", "occidit: exsequias ite frequenter, aues;", "ite, piae uolucres, et plangite pectora pinnis", "et rigido teneras ungue notate genas;", "horrida pro maestis lanietur pluma capillis,", "pro longa resonent carmina uestra tuba."], "trans": "<div>El papagayo, el ave imitadora venida de las Indias aurorales, ha muerto.</div><div>Id en bandada, aves, a sus exequias.</div><div>Id, pájaros piadosos, y golpeaos con las alas el pecho y arañad vuestras tiernas mejillas con vuestras duras uñas.</div><div>En vez de los cabellos, arrancaos en duelo las plumas erizadas, y resuenen vuestros cantos en vez de la larga trompeta.</div>", "gloss": "", "notes": "<div><b>Muere el papagayo</b></div><div>¿Qué tipo de poema es?</div><div>↔ Catulo 3 (el gorrión de Lesbia).</div><ul><li>Epicedio paródico: el lamento fúnebre, función original de la elegía, aplicado a un ave.</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-6-7-12", "ref": "2.6.7-12", "lines": ["quod scelus Ismarii quereris, Philomela, tyranni,", "expleta est annis ista querela suis;", "alitis in rarae miserum deuertere funus;", "magna sed antiqua est causa doloris Itys.", "omnes, quae liquido libratis in aere cursus,", "tu tamen ante alios, turtur amice, dole."], "trans": "<div>Lamentas, Filomela, el crimen del tirano de Ísmaro, pero ese lamento se ha cumplido, al cabo de los años.</div><div>Dedícate ahora al triste funeral del raro pájaro.</div><div>Es para tu dolor Itis motivo grande, sí, pero antiguo.</div><div>Todos los que en el aire transparente voláis en equilibrio, lamentaos y tú antes que ninguno, tórtolo amigo suyo.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-6-13-22", "ref": "2.6.13-22", "lines": ["plena fuit uobis omni concordia uita", "et stetit ad finem longa tenaxque fides.", "quod fuit Argolico iuuenis Phoceus Orestae,", "hoc tibi, dum licuit, psittace, turtur erat.", "quid tamen ista fides, quid rari forma coloris,", "quid uox mutandis ingeniosa sonis,", "quid iuuat, ut datus es, nostrae placuisse puellae?", "infelix, auium gloria, nempe iaces.", "tu poteras fragiles pinnis hebetare zmaragdos,", "tincta gerens rubro Punica rostra croco."], "trans": "<div>Toda la vida hubo entre vosotros concordia plena y permaneció hasta el fin la lealtad, larga y constante.</div><div>Lo mismo que fue el joven de la Fócide para Orestes de Argos, fue ese tórtolo para ti, mientras ello fue posible.</div><div>¿Para qué sirve ahora esa lealtad?</div><div>¿Para qué la hermosura de tu color exótico?</div><div>¿Para qué esa voz tuya habilidosa en variar los registros, para qué haber gustado tanto a nuestra amada al serle regalado?</div><div>Yaces, sí, infeliz gloria de las aves, muerto.</div><div>Tú podías con tus plumas hacer sombra a las frágiles esmeraldas; tenías pico cartaginés, coloreado con el rojo azafrán.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-6-23-32", "ref": "2.6.23-32", "lines": ["non fuit in terris uocum simulantior ales:", "reddebas blaeso tam bene uerba sono.", "raptus es inuidia: non tu fera bella mouebas;", "garrulus et placidae pacis amator eras.", "plenus eras minimo, nec prae sermonis amore", "in multos poteras ora uacare cibos;", "nux erat esca tibi causaeque papauera somni,", "pellebatque sitim simplicis umor aquae.", "ecce, coturnices inter sua proelia uiuunt,", "forsitan et fiunt inde frequenter anus."], "trans": "<div>No hubo en la tierra pájaro más hábil imitando las voces, por lo bien que con tus balbuceos repetías las palabras.</div><div>Has sido arrebatado por la envidia: tú no causabas guerras sanguinarias; parlanchín eras, y un enamorado de la plácida paz.</div><div>En cambio, mira, las codornices viven en medio de sus luchas y muchas llegarán tal vez a viejas.</div><div>Te llenabas con nada y no podías —por amor que tenías a estar charlando— dejar tu pico libre para mucho alimento.</div><div>Una nuez era toda tu comida, y adormidera, que te daba sueño; te quitaba la sed un chorro de agua clara.</div>", "gloss": "<div><b>amātor, -ōris, m.</b>: amante</div><div><b>bellum, -ī, n.</b>: guerra</div><div><b>et</b>: y</div><div><b>ferus, -a, -um</b>: fiero, salvaje</div><div><b>garrulus, -a, -um</b>: charlatán</div><div><b>inuidia, -ae, f.</b>: envidia</div><div><b>moueō, -ēs, -ēre, mōuī, mōtum</b>: mover, promover</div><div><b>nōn</b>: no</div><div><b>pāx, pācis, f.</b>: paz</div><div><b>placidus, -a, -um</b>: plácido, tranquilo</div><div><b>rapiō, -is, -ere, rapuī, raptum</b>: arrebatar</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>tū, tuī</b>: tú, vos</div>", "notes": "<div><b>Arrebatado por la envidia</b></div><div>¿Por qué murió el papagayo, según el poeta?</div><ul><li><i>raptus es</i>: pasiva de perfectum, 2.ª sg; <i>inuidia</i>, causa eficiente (ablativo solo).</li><li><i>garrulus… amator eras</i>: predicativo subjetivo.</li></ul>", "hl": {}, "fx": {"13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b"}, "ul": {"24": "b", "21": "r", "25": "r", "26": "r", "13": "r", "14": "r", "15": "r"}, "lk": {}}, {"id": "a2-6-33-42", "ref": "2.6.33-42", "lines": ["uiuit edax uultur ducensque per aera gyros", "miluus et pluuiae graculus auctor aquae;", "uiuit et armiferae cornix inuisa Mineruae,", "illa quidem saeclis uix moritura nouem.", "occidit ille, loquax humanae uocis imago,", "psittacus, extremo munus ab orbe datum.", "optima prima fere manibus rapiuntur auaris;", "implentur numeris deteriora suis:", "tristia Phylacidae Thersites funera uidit", "iamque cinis uiuis fratribus Hector erat."], "trans": "<div>Vivo está el voraz buitre y el milano que traza círculos por los aires, y el grajo que nos trae el agua de lluvia; viva también está la corneja a la que odia la guerrera Minerva, y que difícilmente acabará muriendo dentro de nueve siglos.</div><div>Y sin embargo ha muerto aquel locuaz reflejo de la voz humana, el papagayo, un regalo ofrecido desde el confín del mundo.</div><div>Los seres más valiosos suelen ser los primeros que esas manos avaras arrebatan.</div><div>Los peores, en cambio, completan su destino.</div><div>Tersites conoció los tristes funerales del Filácida, y Héctor era ceniza ya cuando aún vivían sus hermanos.</div>", "gloss": "<div><b>ā, ab (prep. + abl.)</b>: desde, de</div><div><b>auārus, -a, -um</b>: ávido, codicioso</div><div><b>dēterior, -ius</b>: peor</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>extrēmus, -a, -um</b>: extremo, el más lejano</div><div><b>ferē</b>: casi siempre, por lo general</div><div><b>hūmānus, -a, -um</b>: humano</div><div><b>ille, illa, illud</b>: aquel</div><div><b>imāgō, -inis, f.</b>: imagen, imitación</div><div><b>impleō, -ēs, -ēre, implēuī, implētum</b>: llenar, completar</div><div><b>loquāx, -ācis</b>: parlanchín</div><div><b>manus, -ūs, f.</b>: mano</div><div><b>mūnus, -eris, n.</b>: regalo</div><div><b>numerus, -ī, m.</b>: número</div><div><b>occidō, -is, -ere, occidī, occāsum</b>: caer, morir</div><div><b>optimus, -a, -um</b>: el mejor</div><div><b>orbis, -is, m.</b>: orbe, mundo</div><div><b>prīmus, -a, -um</b>: primero</div><div><b>psittacus, -ī, m.</b>: papagayo, loro</div><div><b>rapiō, -is, -ere, rapuī, raptum</b>: arrebatar</div><div><b>suus, -a, -um</b>: suyo</div><div><b>uōx, uōcis, f.</b>: voz</div>", "notes": "<div><b>Los mejores mueren primero</b></div><div>¿Qué sentencia saca el poeta?</div><ul><li><i>munus… datum</i>: participio concertado.</li><li><i>rapiuntur</i>, <i>implentur</i>: pasiva, 3.ª pl; <i>auaris manibus</i>, causa eficiente.</li><li><i>occĭdit</i> («cae, muere») no es <i>occīdit</i> («mata»).</li></ul>", "hl": {}, "fx": {"25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b"}, "ul": {"35": "b", "29": "b", "30": "b", "33": "r", "36": "r", "40": "r", "41": "r", "42": "r", "43": "r"}, "lk": {}}, {"id": "a2-6-43-52", "ref": "2.6.43-52", "lines": ["quid referam timidae pro te pia uota puellae,", "uota procelloso per mare rapta Noto?", "septima lux uenit non exhibitura sequentem,", "et stabat uacuo iam tibi Parca colo;", "nec tamen ignauo stupuerunt uerba palato:", "clamauit moriens lingua ‘Corinna, uale!’", "colle sub Elysio nigra nemus ilice frondet", "udaque perpetuo gramine terra uiret.", "si qua fides dubiis, uolucrum locus ille piarum", "dicitur, obscenae quo prohibentur aues."], "trans": "<div>¿Y qué voy a contar de las promesas piadosas que asustada hizo por ti mi amada, unas promesas que arrastró el proceloso Noto por el mar?</div><div>Llegó el séptimo día, que no iba a alumbrar otro, y allí estaba la Parca con la rueca vacía ya para ti.</div><div>No se paralizaron, sin embargo, tus palabras en un paladar perezoso; mientras moría gritó tu lengua: «adiós, Corina».</div><div>En la falda del monte Elíseo, hay un bosque frondoso de negros acebos, y la tierra húmeda verdece siempre gracias a una grama perpetua.</div><div>Se cuenta, si creemos esta dudosa historia, que aquél es el lugar de las aves piadosas y las de mal agüero están excluidas.</div>", "gloss": "<div><b>clāmō, -ās, -āre, -āvī, -ātum</b>: gritar</div><div><b>Corinna, -ae, f.</b>: Corina</div><div><b>ignāuus, -a, -um</b>: inerte, perezoso</div><div><b>lingua, -ae, f.</b>: lengua</div><div><b>morior, -eris, morī, mortuus sum (moriēns: muriendo)</b>: morir</div><div><b>nec</b>: y no, ni</div><div><b>palātum, -ī, n.</b>: paladar</div><div><b>stupeō, -ēs, -ēre, stupuī</b>: quedarse inmóvil, entumecerse</div><div><b>tamen</b>: sin embargo</div><div><b>ualeō, -ēs, -ēre, ualuī (ualē: adiós)</b>: estar bien</div><div><b>uerbum, -ī, n.</b>: palabra</div>", "notes": "<div><b>Las últimas palabras</b></div><div>¿Qué dice el papagayo al morir?</div><ul><li><i>moriens lingua</i>: participio concertado predicativo («mientras moría»).</li><li><i>stupuerunt</i>, <i>clamauit</i>: perfectos.</li></ul>", "hl": {}, "fx": {"27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b"}, "ul": {"33": "r", "34": "r", "35": "r", "30": "r"}, "lk": {}}, {"id": "a2-6-53-62", "ref": "2.6.53-62", "lines": ["illic innocui late pascuntur olores", "et uiuax phoenix, unica semper auis;", "explicat ipsa suas ales Iunonia pinnas,", "oscula dat cupido blanda columba mari.", "psittacus has inter nemorali sede receptus", "conuertit uolucres in sua uerba pias.", "ossa tegit tumulus, tumulus pro corpore magnus,", "quo lapis exiguus par sibi carmen habet:", "COLLIGOR EX IPSO DOMINAE PLACVISSE SEPVLCHRO.", "ORA FVERE MIHI PLVS AVE DOCTA LOQVI."], "trans": "<div>Allí habitan los cisnes inocentes, y el Fénix de vida perdurable, eternamente solo, despliega sus plumas también el ave de Juno, y la tierna paloma da besos a su macho apasionado.</div><div>En esa nemorosa residencia, el papagayo, entre ellas acogido, atrae hacia sus palabras la atención de esas aves pïadosas.</div><div>Sus huesos cubre un túmulo de tierra, túmulo de tamaño adecuado a su cuerpo.</div><div>Encima hay una lápida, como él diminuta, que presenta grabados estos versos: «SE VE POR MI SEPULCRO QUE COMPLACÍ A MI DUEÑA.</div><div>MI PICO SUPO HABLAR MÁS DE LO QUE HABÍA UN AVE».</div>", "gloss": "<div><b>carmen, -inis, n.</b>: poema, inscripción</div><div><b>corpus, -oris, n.</b>: cuerpo</div><div><b>exiguus, -a, -um</b>: pequeño</div><div><b>habeō, -ēs, -ēre, habuī, habitum</b>: tener</div><div><b>lapis, -idis, m.</b>: piedra, lápida</div><div><b>magnus, -a, -um</b>: grande</div><div><b>os, ossis, n.</b>: hueso</div><div><b>pār, paris (+ dat.)</b>: igual, a la medida de</div><div><b>prō (prep. + abl.)</b>: para, en proporción a</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>sē, suī</b>: se, sí mismo</div><div><b>tegō, -is, -ere, tēxī, tēctum</b>: cubrir</div><div><b>tumulus, -ī, m.</b>: túmulo</div>", "notes": "<div><b>El epitafio</b></div><div>¿Cómo es la tumba del papagayo?</div><ul><li><i>quo</i>: relativo, ablativo, antecedente <i>tumulus</i>.</li><li><i>par sibi</i>: un epitafio a la medida del ave.</li></ul>", "hl": {}, "fx": {"35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b"}, "ul": {"40": "b", "43": "b", "35": "b", "47": "b", "42": "r"}, "lk": {}}, {"id": "a2-9-1-6", "ref": "2.9.1-6", "lines": ["O numquam pro re satis indignande Cupido,", "o in corde meo desidiose puer,", "quid me, qui miles numquam tua signa reliqui,", "laedis, et in castris uulneror ipse meis?", "cur tua fax urit, figit tuus arcus amicos?", "gloria pugnantes uincere maior erat."], "trans": "<div>Oh Cupido que nunca estás saciado en tu ira contra mí, oh niño perezoso que te quedas dentro en mi corazón, ¿por qué me dañas a mí —que soy soldado que jamás ha desertado de tus estandartes— y en mi propio cuartel recibo heridas?</div><div>¿Por qué abrasa tu antorcha y traspasa tu arco a los amigos?</div><div>Más gloria te daría vencer a los rebeldes.</div>", "gloss": "<div><b>castra, -ōrum, n. pl.</b>: campamento</div><div><b>ego, meī</b>: yo</div><div><b>et</b>: y</div><div><b>in (prep. + abl.)</b>: en</div><div><b>ipse, ipsa, ipsum</b>: él mismo; (aquí) yo mismo</div><div><b>laedō, -is, -ere, laesī, laesum</b>: herir, dañar</div><div><b>meus, -a, -um</b>: mío</div><div><b>mīles, -itis, m.</b>: soldado</div><div><b>numquam</b>: nunca</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>quis, quid (quid: ¿por qué?)</b>: ¿quién?, ¿qué?</div><div><b>relinquō, -is, -ere, relīquī, relictum</b>: abandonar</div><div><b>signum, -ī, n.</b>: estandarte, insignia</div><div><b>tuus, -a, -um</b>: tuyo</div><div><b>uulnerō, -ās, -āre, -āvī, -ātum</b>: herir</div>", "notes": "<div><b>Herido en su propio campamento</b></div><div>¿Qué le reprocha el soldado a Cupido?</div><div>↔ 1.9 (<i>militia amoris</i>).</div><ul><li><i>uulneror</i> (pasiva) frente a <i>laedis</i> (activa).</li><li><i>qui… reliqui</i>: el relativo toma la persona del antecedente (<i>me</i>).</li><li>La renuncia al amor parodia a Tibulo (Booth). Recepción: Quevedo, «Pide al amor que, siquiera ya por inútil, le despida» (2.9 y 3.11) (Cristóbal).</li></ul>", "hl": {}, "fx": {"13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b"}, "ul": {"16": "b", "25": "r", "20": "r", "21": "r", "15": "r"}, "lk": {}}, {"id": "a2-9-7-16", "ref": "2.9.7-16", "lines": ["quid? non Haemonius, quem cuspide perculit, heros", "confossum medica postmodo iuuit ope?", "uenator sequitur fugientia, capta relinquit,", "semper et inuentis ulteriora petit.", "nos tua sentimus, populus tibi deditus, arma;", "pigra reluctanti cessat in hoste manus.", "quid iuuat in nudis hamata retundere tela", "ossibus? ossa mihi nuda reliquit amor.", "tot sine amore uiri, tot sunt sine amore puellae:", "hinc tibi cum magna laude triumphus eat."], "trans": "<div>¿Acaso no curó el héroe hemonio con medicinal arte al malherido tras haberlo abatido con su lanza?</div><div>Sigue a la presa que huye el cazador, pero ya capturada la abandona, y busca, tras lograrla, siempre otra.</div><div>Nosotros, este pueblo a ti rendido, padecemos tus armas.</div><div>Y con ese enemigo que opone resistencia tu mano se detiene perezosa.</div><div>¿Qué placer hay en embotar tus dardos de punta curva en mis desnudos huesos?</div><div>Mis huesos el Amor dejó desnudos.</div><div>Son tantos los varones sin amor, y tantas las mujeres sin amor: ahí obtendrías tú el triunfo con gran gloria.</div>", "gloss": "<div><b>capiō, -is, -ere, cēpī, captum (capta: lo capturado)</b>: tomar, capturar</div><div><b>et</b>: y</div><div><b>fugiō, -is, -ere, fūgī, fugitum (fugientia: lo que huye)</b>: huir</div><div><b>inueniō, -īs, -īre, inuēnī, inuentum (inuenta: lo hallado)</b>: encontrar</div><div><b>petō, -is, -ere, petīuī, petītum</b>: buscar, ir tras</div><div><b>relinquō, -is, -ere, relīquī, relictum</b>: abandonar, dejar</div><div><b>semper</b>: siempre</div><div><b>sequor, -eris, sequī, secūtus sum</b>: seguir, perseguir</div><div><b>uēnātor, -ōris, m.</b>: cazador</div><div><b>ulterior, -ius</b>: más lejano; (n. pl.) lo que está más allá</div>", "notes": "<div><b>El cazador</b></div><div>¿Qué busca el cazador y qué deja?</div><ul><li><i>fugientia</i> (presente) / <i>capta</i>, <i>inuentis</i> (perfecto): participios sustantivados.</li><li><i>sequitur</i>: deponente. <i>ulteriora</i>: comparativo.</li></ul>", "hl": {}, "fx": {"12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b"}, "ul": {"12": "b", "19": "r", "14": "r", "15": "r"}, "lk": {}}, {"id": "a2-9-17-26", "ref": "2.9.17-26", "lines": ["Roma, nisi immensum uires promosset in orbem,", "stramineis esset nunc quoque tecta casis.", "fessus in acceptos miles deducitur agros,", "mittitur in saltus carcere liber equus,", "longaque subductam celant naualia pinum,", "tutaque deposito poscitur ense rudis:", "me quoque, qui totiens merui sub amore puellae,", "defunctum placide uiuere tempus erat.", "‘uiue’ deus ‘posito’ si quis mihi dicat ‘amore’,", "deprecer: usque adeo dulce puella malum est."], "trans": "<div>(Roma estaría aún cubierta de cabañas con techumbre de paja si no hubiera desplegado sus fuerzas por el mundo infinito).</div><div>El soldado cansado a aquellas tierras que le han sido entregadas se retira.</div><div>Permiten al caballo que se vaya, libre ya de la cuadra, por los prados.</div><div>Largos diques resguardan a la nave varada.</div><div>Y al deponer la espada, pide uno la vara, bien segura, del retiro.</div><div>También sería hora de que yo, que tantas veces ya he sido soldado obediente al amor de una muchacha, viviera, tras cumplir, plácidamente.</div><div>Si a mí el dios me dijera: «vive ya sin amor», le rogaría que a eso no me obligara: hasta tal punto una muchacha es un dulce mal.</div>", "gloss": "<div><b>accipiō, -is, -ere, accēpī, acceptum (acceptī: recibidos)</b>: recibir</div><div><b>ager, agrī, m.</b>: campo</div><div><b>carcer, -eris, m.</b>: casilla de salida (en el circo)</div><div><b>cēlō, -ās, -āre, -āvī, -ātum</b>: ocultar</div><div><b>dēdūcō, -is, -ere, dēdūxī, dēductum</b>: llevar, retirar</div><div><b>dēpōnō, -is, -ere, dēposuī, dēpositum</b>: dejar, deponer</div><div><b>ēnsis, -is, m.</b>: espada</div><div><b>equus, -ī, m.</b>: caballo</div><div><b>fessus, -a, -um</b>: cansado</div><div><b>in (prep. + acus.)</b>: hacia, a</div><div><b>līber, -era, -erum</b>: libre</div><div><b>longus, -a, -um</b>: largo</div><div><b>mīles, -itis, m.</b>: soldado</div><div><b>mittō, -is, -ere, mīsī, missum</b>: enviar, soltar</div><div><b>nāuālia, -ium, n. pl.</b>: astillero, dique</div><div><b>pīnus, -ūs/-ī, f.</b>: pino; (aquí) la nave</div><div><b>poscō, -is, -ere, poposcī</b>: pedir, reclamar</div><div><b>-que</b>: y</div><div><b>rudis, -is, f.</b>: espada de madera (del gladiador licenciado)</div><div><b>saltus, -ūs, m.</b>: prado de montaña, pastizal</div><div><b>subdūcō, -is, -ere, subdūxī, subductum</b>: sacar (la nave) a tierra</div><div><b>tūtus, -a, -um</b>: seguro, sin peligro</div>", "notes": "<div><b>El retiro</b></div><div>¿Qué reciben el soldado, el caballo y la nave?</div><ul><li><i>deducitur</i>, <i>mittitur</i>, <i>poscitur</i>: pasiva de infectum.</li><li><i>acceptos agros</i>, <i>subductam pinum</i>: participios concertados.</li><li><i>deposito ense</i>: ablativo absoluto. <i>rudis</i>: la espada de madera del gladiador licenciado.</li></ul>", "hl": {}, "fx": {"13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b"}, "ul": {"16": "b", "34": "b", "28": "b", "22": "b", "32": "r", "17": "r", "33": "r", "19": "r", "26": "r", "31": "r", "15": "r"}, "lk": {}}, {"id": "a2-9-27-36", "ref": "2.9.27-36", "lines": ["cum bene pertaesum est animoque relanguit ardor,", "nescioquo miserae turbine mentis agor.", "ut rapit in praeceps dominum spumantia frustra", "frena retentantem durior oris equus,", "ut subitus, prope iam prensa tellure, carinam", "tangentem portus uentus in alta rapit,", "sic me saepe refert incerta Cupidinis aura", "notaque purpureus tela resumit Amor.", "fige, puer! positis nudus tibi praebeor armis;", "hic tibi sunt uires, hic tua dextra facit."], "trans": "<div>Cuando ya estoy hastiado y mi ardor desfallece, no sé qué torbellino de mi alma desgraciada me arrastra.</div><div>De igual modo que el corcel duro de boca lleva al precipicio a su dueño, que tira inútilmente del espumante freno una vez y otra; como nave que alcanza tierra firme y, tocando ya el puerto, de repente el viento la arrebata hacia alta mar, así la incierta brisa de Cupido me hace retroceder frecuentemente y de nuevo sus dardos conocidos saca el purpúreo Amor.</div><div>¡Clávalos, niño!</div><div>Me ofrezco a ti desnudo y desarmado.</div><div>Aquí tienes tus fuerzas, aquí tu diestra actúa,</div>", "gloss": "<div><b>arma, -ōrum, n. pl.</b>: armas</div><div><b>dextra, -ae, f.</b>: mano derecha</div><div><b>faciō, -is, -ere, fēcī, factum</b>: hacer, actuar</div><div><b>fīgō, -is, -ere, fīxī, fīxum</b>: clavar</div><div><b>hīc (adv.)</b>: aquí</div><div><b>nūdus, -a, -um</b>: desnudo, desarmado</div><div><b>pōnō, -is, -ere, posuī, positum</b>: poner; deponer</div><div><b>praebeō, -ēs, -ēre, praebuī, praebitum (praebeor: me ofrezco)</b>: ofrecer</div><div><b>puer, -ī, m.</b>: niño, muchacho</div><div><b>sum, es, esse, fuī</b>: ser, haber</div><div><b>tū, tuī</b>: tú, vos</div><div><b>tuus, -a, -um</b>: tuyo</div><div><b>uīs, uīs, f. (pl. uīrēs)</b>: fuerza</div>", "notes": "<div><b><i>Fige, puer!</i></b></div><div>¿Por qué el poeta se ofrece desarmado?</div><ul><li><i>positis armis</i>: ablativo absoluto.</li><li><i>praebeor</i>: pasiva, 1.ª sg («me ofrezco»).</li><li><i>tibi sunt uires</i>: dativo posesivo. <i>hic</i>: adverbio.</li></ul>", "hl": {}, "fx": {"49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b", "60": "b", "61": "b", "62": "b", "63": "b"}, "ul": {"59": "b", "51": "r", "54": "r", "55": "r", "57": "r", "58": "r"}, "lk": {}}, {"id": "a2-9-37-46", "ref": "2.9.37-46", "lines": ["huc tamquam iussae ueniunt iam sponte sagittae;", "uix illis prae me nota pharetra sua est.", "infelix, tota quicumque quiescere nocte", "sustinet et somnos praemia magna uocat!", "stulte, quid est somnus gelidae nisi mortis imago?", "longa quiescendi tempora fata dabunt.", "me modo decipiant uoces fallacis amicae", "(sperando certe gaudia magna feram),", "et modo blanditias dicat, modo iurgia nectat,", "saepe fruar domina, saepe repulsus eam."], "trans": "<div>hacia aquí vienen solas tus flechas, cual cumpliendo una orden: me conocen casi mejor a mí ya que a su aljaba.</div><div>Infeliz el que insiste en reposar de noche y llama grandes premios a sus sueños.</div><div>Necio, el sueño ¿qué es sino la imagen de la helada muerte?</div><div>Ya te darán los hados largo tiempo para el reposo.</div><div>A mí que me engañe lo dicho por mi traidora amiga (mucho disfrutaré, ciertamente, esperando), que otras veces me diga palabras cariñosas, y otras me arme una riña.</div><div>Ojalá yo a menudo disfrute de mi dueña y a menudo me marche rechazado.</div>", "gloss": "<div><b>ego, meī</b>: yo</div><div><b>hūc</b>: hacia aquí</div><div><b>iam</b>: ya</div><div><b>ille, illa, illud</b>: aquel; (pl.) ellas</div><div><b>iubeō, -ēs, -ēre, iussī, iussum</b>: ordenar</div><div><b>nōtus, -a, -um</b>: conocido</div><div><b>pharetra, -ae, f.</b>: aljaba, carcaj</div><div><b>prae (prep. + abl.)</b>: más que, en comparación con</div><div><b>sagitta, -ae, f.</b>: flecha</div><div><b>sponte (abl.)</b>: espontáneamente, por sí mismas</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>suus, -a, -um</b>: suyo</div><div><b>tamquam</b>: como si</div><div><b>ueniō, -īs, -īre, uēnī, uentum</b>: venir</div><div><b>uix</b>: apenas</div>", "notes": "<div><b>Las flechas conocen el camino</b></div><ul><li><i>tamquam iussae</i>: participio predicativo.</li><li><i>nota est</i> + dativo: predicativo subjetivo; la traducción invierte el sujeto.</li><li>Garcilaso: una remembranza «bien endeble» de 2.9b.41, señalada por Herrera (Cristóbal).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b"}, "ul": {"2": "r", "11": "r", "14": "r"}, "lk": {}}, {"id": "a2-9-47-54", "ref": "2.9.47-54", "lines": ["quod dubius Mars est, per te, priuigne Cupido, est,", "et mouet exemplo uitricus arma tuo;", "tu leuis es multoque tuis uentosior alis", "gaudiaque ambigua dasque negasque fide.", "si tamen exaudis, pulchra cum matre, Cupido,", "indeserta meo pectore regna gere:", "accedant regno, nimium uaga turba, puellae;", "ambobus populis sic uenerandus eris."], "trans": "<div>Si Marte es inseguro es por tu culpa, Cupido, que eres el hijastro suyo.</div><div>Según tu ejemplo, mueve tu padrastro sus armas: tú eres ligero y mucho más sumiso a los vientos que tus alas, y con lealtad incierta das y niegas los gozos.</div><div>Si, a pesar de ello, con tu hermosa madre, me prestas atención, lleva a mi pecho tus reinos que no saben de abandono.</div><div>Sométanse a tu reino las muchachas, que forman muchedumbre demasiado inconstante: tendrán así que honrarte los dos pueblos.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-15-1-8", "ref": "2.15.1-8", "lines": ["Anule, formosae digitum uincture puellae,", "in quo censendum nil nisi dantis amor,", "munus eas gratum; te laeta mente receptum", "protinus articulis induat illa suis.", "tam bene conuenias quam mecum conuenit illi,", "et digitum iusto commodus orbe teras.", "felix, a domina tractaberis, anule, nostra:", "inuideo donis iam miser ipse meis."], "trans": "<div>Anillo destinado a rodear el dedo de una hermosa mujer, tú, en quien no debe valorarse nada a no ser el amor del que te ofrenda, ojalá seas regalo que le guste, y, habiéndote aceptado alegremente, te ponga con presteza ella en su mano.</div><div>Ajústate a ella tan bien como se ajusta ella conmigo, y frota, acomodándote, su dedo con cerco exacto.</div><div>Anillo afortunado, que vas a ser tocado por mi dueña: ay de mí, envidio ya hasta a mis obsequios.</div>", "gloss": "<div><b>ā, ab (prep. + abl.)</b>: por (agente); de, desde</div><div><b>ānulus, -ī, m.</b>: anillo</div><div><b>domina, -ae, f.</b>: señora, amada</div><div><b>dōnum, -ī, n.</b>: regalo</div><div><b>fēlīx, -īcis</b>: feliz, afortunado</div><div><b>iam</b>: ya</div><div><b>inuideō, -ēs, -ēre, inuīdī, inuīsum (+ dat.)</b>: envidiar</div><div><b>ipse, ipsa, ipsum</b>: él mismo; (aquí) yo mismo</div><div><b>meus, -a, -um</b>: mío</div><div><b>miser, -era, -erum</b>: desdichado</div><div><b>noster, nostra, nostrum</b>: nuestro; (aquí) mío</div><div><b>tractō, -ās, -āre, -āvī, -ātum (tractāberis: serás tocado)</b>: tocar, manejar</div>", "notes": "<div><b>El anillo</b></div><div>¿Qué desea el poeta?</div><ul><li><i>tractaberis</i>: pasiva, 2.ª sg (futuro); <i>a domina</i>, complemento agente.</li><li><i>inuideo donis</i>: verbo que rige dativo.</li></ul>", "hl": {}, "fx": {"37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b"}, "ul": {"38": "r", "39": "r", "40": "r", "43": "r", "44": "r"}, "lk": {}}, {"id": "a2-15-9-18", "ref": "2.15.9-18", "lines": ["o utinam fieri subito mea munera possem", "artibus Aeaeae Carpathiiue senis!", "tunc ego, cum cupiam dominae tetigisse papillas", "et laeuam tunicis inseruisse manum,", "elabar digito quamuis angustus et haerens", "inque sinum mira laxus ab arte cadam.", "idem ego, ut arcanas possim signare tabellas", "neue tenax ceram siccaque gemma trahat,", "umida formosae tangam prius ora puellae;", "tantum ne signem scripta dolenda mihi."], "trans": "<div>Ojalá yo pudiera convertirme de pronto en mi regalo, gracias a las mañas de la de Eea o del viejo de Cárpatos.</div><div>Entonces desearía yo, señora, que tocases tus pechos y metieses entre la túnica tu mano izquierda.</div><div>Aunque estrecho y ceñido, yo me resbalaría del dedo y, suelto ya, con asombrosa astucia iría a parar a tu regazo.</div><div>También, para poder sellar tablillas secretas y que no se llevara mi gema tan adherente y seca la cera, iría yo antes a tocar la húmeda boca de mi hermosa amada.</div><div>¡Con tal que no tuviera que sellar mensajes que me hubieran de hacer daño!</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-15-19-28", "ref": "2.15.19-28", "lines": ["si dabor ut condar loculis, exire negabo,", "astringens digitos orbe minore tuos.", "non ego dedecori tibi sum, mea uita, futurus,", "quodue tener digitus ferre recuset onus.", "me gere, cum calidis perfundes imbribus artus,", "damnaque sub gemmam perfer euntis aquae.", "sed, puto, te nuda mea membra libidine surgent,", "et peragam partes anulus ille uiri.", "irrita quid uoueo? paruum proficiscere munus:", "illa datam tecum sentiat esse fidem."], "trans": "<div>Si vas a darme para que me guarden dentro de tu joyero, me negaré a salir apretando tu dedo con un cerco más breve.</div><div>Que no sea yo, mi vida, para ti motivo de vergüenza, ni una carga que rechace llevar tu tierno dedo.</div><div>Llévame puesto cuando estés rociando con una lluvia cálida tu cuerpo, y deja que mi gema por el agua que cae se deteriore.</div><div>Pero pienso que, estando tú desnuda, se alzará de pasión el miembro mío.</div><div>Y aun siendo sólo anillo llevaré a cabo la tarea propia de un hombre.</div><div>¿Mas para qué deseo algo irrealizable?</div><div>Marcha, breve regalo: que ella aprecie que contigo le ofrezco mi lealtad.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-17-1-6", "ref": "2.17.1-6", "lines": ["Si quis erit, qui turpe putet seruire puellae,", "illo conuincar iudice turpis ego.", "sim licet infamis, dum me moderatius urat", "quae Paphon et fluctu pulsa Cythera tenet.", "atque utinam dominae miti quoque praeda fuissem,", "formosae quoniam praeda futurus eram!"], "trans": "<div>Si alguien piensa que es algo vergonzoso ser el esclavo de una mujer, ante ese juez culpable yo seré de esa vergüenza.</div><div>Sea yo infame, con tal de que me abrase con más mesura la que habita en Pafos y en Citera azotada por las olas.</div><div>Ojalá hubiese caído yo cautivo de una dueña que fuese también dulce, puesto que había de serlo de una hermosa.</div>", "gloss": "", "notes": "<div><b>Esclavo de Corina</b></div><div>¿Cómo presenta el poeta su <i>seruitium</i>?</div><div>↔ 1.2.</div><ul><li>El <i>seruitium</i> pierde el tono masoquista (Booth).</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-17-7-14", "ref": "2.17.7-14", "lines": ["dat facies animos: facie uiolenta Corinna est;", "me miserum! cur est tam bene nota sibi?", "scilicet a speculi sumuntur imagine fastus,", "nec nisi compositam se prius illa uidet.", "non, tibi si facies nimium dat in omnia regni", "(o facies oculos nata tenere meos!),", "collatum idcirco tibi me contemnere debes:", "aptari magnis inferiora licet."], "trans": "<div>La hermosura provoca la soberbia: por su hermosura es altanera Corina.</div><div>Pobre de mí, ¿por qué ella se conoce a sí misma tan bien?</div><div>Nace su orgullo en verdad de la imagen del espejo, y ella antes de arreglarse no se mira.</div><div>Si te da tu hermosura un dominio excesivo sobre todas las cosas —¡oh hermosura creada para poseer mis ojos!— no debes despreciarme, comparado contigo.</div><div>A lo grande se puede ajustar lo pequeño.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-17-15-24", "ref": "2.17.15-24", "lines": ["traditur et nymphe mortalis amore Calypso", "capta recusantem detinuisse uirum;", "creditur aequoream Pthio Nereida regi,", "Egeriam iusto concubuisse Numae;", "Vulcani Venus est, quamuis incude relicta", "turpiter obliquo claudicet ille pede;", "carminis hoc ipsum genus impar, sed tamen apte", "iungitur herous cum breuiore modo.", "tu quoque me, mea lux, in quaslibet accipe leges;", "te deceat medio iura dedisse foro."], "trans": "<div>Se cuenta que la ninfa Calipso, cautivada por amor a un mortal, retuvo al héroe, que a ello se negaba.</div><div>Se cuenta que acostadas estuvieron la Nereida del mar con el rey ptío, y Egeria en compañía del justo Numa.</div><div>Esposa es Venus de Vulcano, aunque él, cuando abandona el yunque, torpemente cojee con pie torcido.</div><div>Desigual es la propia forma de este poema y, sin embargo, se une con justeza el verso heroico con el que es más breve.</div><div>También tú acéptame, luz mía, en las condiciones que te plazcan.</div><div>Yo admito que me impongas tus leyes en el medio del foro.</div>", "gloss": "<div><b>aptē (adv.)</b>: adecuadamente</div><div><b>breuis, -e (comp. breuior)</b>: breve, corto</div><div><b>carmen, -inis, n.</b>: poema, canto</div><div><b>cum (prep. + abl.)</b>: con</div><div><b>genus, -eris, n.</b>: género, clase</div><div><b>hērōus, -ī, m.</b>: verso heroico, hexámetro</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>impār, -aris</b>: desigual</div><div><b>ipse, ipsa, ipsum</b>: mismo</div><div><b>iungō, -is, -ere, iūnxī, iūnctum</b>: unir</div><div><b>modus, -ī, m.</b>: medida, metro</div><div><b>sed</b>: pero</div><div><b>tamen</b>: sin embargo</div>", "notes": "<div><b>El dístico, pareja desigual</b></div><div>¿Qué compara el poeta con su relación?</div><div>↔ 1.1.1-4.</div><ul><li><i>iungitur</i>: pasiva («se une»).</li><li><i>herous… breuiore modo</i>: hexámetro y pentámetro; <i>breuiore</i>, comparativo.</li><li>El dístico favorece el avance del pensamiento por paralelismo o antítesis (Von Albrecht).</li></ul>", "hl": {}, "fx": {"30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b"}, "ul": {"33": "b", "30": "b", "38": "r"}, "lk": {}}, {"id": "a2-17-25-34", "ref": "2.17.25-34", "lines": ["non tibi crimen ero, nec quo laetere remoto;", "non erit hic nobis infitiandus amor.", "sunt mihi pro magno felicia carmina censu,", "et multae per me nomen habere uolunt.", "noui aliquam, quae se circumferat esse Corinnam;", "ut fiat, quid non illa dedisse uelit?", "sed neque diuersi ripa labuntur eadem", "frigidus Eurotas populiferque Padus,", "nec nisi tu nostris cantabitur ulla libellis;", "ingenio causas tu dabis una meo."], "trans": "<div>Ninguna acusación te harán por mí, y no te alegrarás cuando me marche.</div><div>De este amor no tendremos que renegar nosotros.</div><div>Cual de una gran fortuna dispongo de mis versos generosos y muchas quieren tener renombre gracias a mí.</div><div>Y alguna hay que conozco que por ahí va contando que es Corina.</div><div>¿Qué no estaría dispuesta a dar porque así fuera?</div><div>Pero, diversos como son, no corren por la misma ribera el fresco Eurotas y el Po en cuyas orillas crecen álamos.</div><div>Ni a otra que no seas tú la cantarán mis libros.</div><div>Sólo tú inspirarás la creación mía.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-19-1-6", "ref": "2.19.1-6", "lines": ["Si tibi non opus est seruata, stulte, puella,", "at mihi fac serues, quo magis ipse uelim!", "quod licet, ingratum est; quod non licet, acrius urit:", "ferreus est, si quis, quod sinit alter, amat.", "speremus pariter, pariter metuamus amantes,", "et faciat uoto rara repulsa locum."], "trans": "<div>Si para ti no es algo necesario vigilar a tu amada, necio, al menos procura vigilarla por mí, para que yo la quiera más.</div><div>Lo que está permitido, desagrada.</div><div>Lo prohibido nos quema con más fuerza.</div><div>De hierro es el que ama lo que otro le permite.</div><div>Tengamos los amantes un tanto de esperanza, otro de miedo, y que deje un lugar para el deseo de vez en cuando alguna negativa.</div>", "gloss": "", "notes": "<div><b>Vigilala</b></div><div>¿Qué le pide el poeta al marido?</div><ul><li>Paradoja elegíaca: el amor necesita obstáculos.</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-19-7-12", "ref": "2.19.7-12", "lines": ["quo mihi fortunam, quae numquam fallere curet?", "nil ego, quod nullo tempore laedat, amo.", "uiderat hoc in me uitium uersuta Corinna,", "quaque capi possem, callida norat opem.", "a, quotiens sani capitis mentita dolores", "cunctantem tardo iussit abire pede!"], "trans": "<div>¿Para qué quiero yo una buena suerte que nunca se preocupa por fallarme?</div><div>Yo no siento ningún amor por algo que no me da ninguna vez molestias.</div><div>Corina, experta ya, había advertido en mí ese fallo y conocía en su astucia el truco que podía seducirme.</div><div>¡Ah, cuántas veces ella, aparentando que su sana cabeza le dolía, me ordenó que me fuera, y yo me iba con paso lento, en medio de mis dudas!</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-19-13-22", "ref": "2.19.13-22", "lines": ["a, quotiens finxit culpam, quantumque licebat", "insonti, speciem praebuit esse nocens!", "sic ubi uexarat tepidosque refouerat ignes,", "rursus erat uotis comis et apta meis.", "quas mihi blanditias, quam dulcia uerba parabat!", "oscula, di magni, qualia quotque dabat!", "tu quoque, quae nostros rapuisti nuper ocellos,", "saepe time insidias, saepe rogata nega.", "et sine me ante tuos proiectum in limine postes", "longa pruinosa frigora nocte pati."], "trans": "<div>¡Ah, cuántas veces ella simuló una traición y —todo cuanto puede una inocente— ofreció la apariencia de culpable!</div><div>Así, cuando me había maltratado y había avivado la entibiada hoguera volvía a ser amable y a cumplir mis deseos.</div><div>¡Para mí, qué expresiones de cariño, qué palabras tan dulces preparaba!</div><div>¡Los besos, grandes dioses, cómo y cuántos me daba!</div><div>También tú, que hace poco cautivaste mis ojos, ten a menudo miedo de una trampa, di a menudo que no, cuando te ruegue, y déjame que sufra tendido en el umbral ante tus puertas los largos fríos en la escarchada noche.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-19-23-32", "ref": "2.19.23-32", "lines": ["sic mihi durat amor longosque adolescit in annos;", "hoc iuuat, haec animi sunt alimenta mei;", "pinguis amor nimiumque patens in taedia nobis", "uertitur et, stomacho dulcis ut esca, nocet.", "si numquam Danaen habuisset aenea turris,", "non esset Danae de Ioue facta parens;", "dum seruat Iuno mutatam cornibus Io,", "facta est quam fuerat gratior illa Ioui.", "quod licet et facile est quisquis cupit, arbore frondes", "carpat et e magno flumine potet aquam."], "trans": "<div>Así el amor me dura y va creciendo durante largos años.</div><div>Eso es lo que gusta, son ésos los alimentos de mi corazón.</div><div>El amor que es tranquilo y demasiado dado a las situaciones aburridas se me revuelve y me hace al final daño, como comida dulce en el estómago.</div><div>Si una broncínea torre nunca hubiera tenido a Dánae encerrada dentro, Júpiter no habría hecho madre a Dánae.</div><div>En la medida en que vigila Juno a Io, la transmutada por los cuernos, ella gusta ahora a Júpiter más que antes.</div><div>El que desea lo lícito y lo fácil que arranque de los árboles las hojas y del río caudaloso beba el agua.</div>", "gloss": "<div><b>cornū, -ūs, n.</b>: cuerno</div><div><b>dum</b>: mientras</div><div><b>fīō, fīs, fierī, factus sum</b>: hacerse, volverse</div><div><b>grātus, -a, -um (comp. grātior)</b>: grato, querido</div><div><b>ille, illa, illud</b>: aquel; ella</div><div><b>Īō, Īūs, f. (acus. Īō)</b>: Ío</div><div><b>Iūnō, -ōnis, f.</b>: Juno</div><div><b>Iuppiter, Iouis, m.</b>: Júpiter</div><div><b>mūtō, -ās, -āre, -āvī, -ātum</b>: cambiar, transformar</div><div><b>quam</b>: que (en comparaciones)</div><div><b>seruō, -ās, -āre, -āvī, -ātum</b>: vigilar, custodiar</div><div><b>sum, es, esse, fuī</b>: ser</div>", "notes": "<div><b>Ío</b></div><div>¿Qué ejemplo mítico usa?</div><ul><li><i>facta est</i>: pasiva de perfectum (de <i>fio</i>), casi «llegó a ser» + predicativo.</li><li><i>mutatam Io</i>: participio concertado. <i>gratior… quam</i>: comparativo.</li></ul>", "hl": {}, "fx": {"42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b"}, "ul": {"44": "b", "54": "b", "48": "r", "49": "r", "45": "r"}, "lk": {}}, {"id": "a2-19-33-38", "ref": "2.19.33-38", "lines": ["si qua uolet regnare diu, deludat amantem!", "(ei mihi, ne monitis torquear ipse meis!)", "quidlibet eueniat, nocet indulgentia nobis;", "quod sequitur, fugio; quod fugit, ipse sequor.", "at tu, formosae nimium secure puellae,", "incipe iam prima claudere nocte forem;"], "trans": "<div>Si una quiere reinar por largo tiempo que trate con engaños a su amante. (¡Ay de mí, ojalá que no me vea por mis propios consejos torturado!</div><div>Mas, sea cual sea su efecto, me causa malestar la complacencia: huyo de quien me sigue; yo sigo a quien me huye.</div><div>Y tú, que desatiendes demasiado a tu hermosa mujer, empieza ya a echar llave a la puerta nada más que anochezca.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-19-39-44", "ref": "2.19.39-44", "lines": ["incipe, quis totiens furtim tua limina pulset,", "quaerere, quid latrent nocte silente canes,", "quas ferat et referat sollers ancilla tabellas,", "cur totiens uacuo secubet ipsa toro.", "mordeat ista tuas aliquando cura medullas,", "daque locum nostris materiamque dolis."], "trans": "<div>Empieza a preguntarte quién toca tantas veces en tu umbral a escondidas, por qué ladran tus perros cuando calla la noche, qué tablillas trae y lleva la diligente esclava, y por qué ella se acuesta tanto en distinto lecho: que esa preocupación, de cuando en cuando remuerda tus entrañas; dale a nuestros engaños la ocasión y el motivo.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-19-45-50", "ref": "2.19.45-50", "lines": ["ille potest uacuo furari litore harenas,", "uxorem stulti si quis amare potest.", "iamque ego praemoneo: nisi tu seruare puellam", "incipis, incipiet desinere esse mea.", "multa diuque tuli; speraui saepe futurum,", "cum bene seruasses, ut bene uerba darem."], "trans": "<div>Arenas en la playa solitaria es capaz de robar aquel que puede amar a la mujer de un tonto.</div><div>Ya te lo advierto con tiempo: si tú no empiezas a guardar a tu muchacha, empezará a dejar de ser mía ella.</div><div>Mucho llevo aguantado, y largo tiempo.</div><div>A menudo he tenido la esperanza de que conseguiría yo burlarte cuando tú la tuvieras bien guardada.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a2-19-51-60", "ref": "2.19.51-60", "lines": ["lentus es et pateris nulli patienda marito;", "at mihi concessa finis amoris erit.", "scilicet infelix numquam prohibebor adire?", "nox mihi sub nullo uindice semper erit?", "nil metuam? per nulla traham suspiria somnos?", "nil facies, cur te iure perisse uelim?", "quid mihi cum facili, quid cum lenone marito?", "corrumpis uitio gaudia nostra tuo.", "quin alium, quem tanta iuuet patientia, quaeris?", "me tibi riualem si iuuat esse, ueta!"], "trans": "<div>Pero tú no reaccionas, y permites lo que no ha de aguantar ningún marido.</div><div>Este amor consentido va a acabar para mí.</div><div>¿Nunca, infeliz de mí, me impedirán la entrada?</div><div>¿Siempre ha de estar mi noche sin castigo?</div><div>¿Nada habré de temer?</div><div>¿Cogeré el sueño sin que medien suspiros?</div><div>¿No harás nada para que con razón desee tu muerte?</div><div>¿Qué tengo yo que ver con un marido que es un consentidor, un alcahuete?</div><div>Corrompe con sus fallos nuestros goces.</div><div>¿Por qué no buscas a otro al que le guste tanta tolerancia?</div><div>Si te gusta que yo sea rival tuyo, házmelo imposible.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-1-1-8", "ref": "3.1.1-8", "lines": ["Stat uetus et multos incaedua silua per annos;", "credibile est illi numen inesse loco.", "fons sacer in medio speluncaque pumice pendens,", "et latere ex omni dulce queruntur aues.", "hic ego dum spatior tectus nemoralibus umbris", "(quod mea, quaerebam, Musa moueret, opus),", "uenit odoratos Elegia nexa capillos,", "et, puto, pes illi longior alter erat."], "trans": "<div>Existe un bosque viejo y que no ha sido cortado en muchos años.</div><div>Se diría que habita aquel lugar una deidad.</div><div>Una fuente sagrada hay en el medio, y una gruta además, de cuyo techo cuelga piedra porosa.</div><div>Y por doquier los pájaros se quejan dulcemente.</div><div>Allí yo, que paseaba protegido por las sombras del bosque, iba buscando la obra que mi Musa inspiraría.</div><div>Llegó la Elegía que llevaba recogido el cabello perfumado, y tenía —creo— un pie más largo que otro.</div>", "gloss": "", "notes": "<div><b>Elegía y Tragedia</b></div><div>¿Quiénes se le aparecen al poeta?</div><div>↔ 1.1; 2.18.</div><ul><li>Debate entre Tragedia y Elegía, resuelto con un compromiso: un libro más de elegías y después la tragedia (Harrison).</li><li>Otra vez el poeta protesta en lugar de acatar, como en 1.1 (McKeown); se ve en una encrucijada (Von Albrecht).</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-1-9-16", "ref": "3.1.9-16", "lines": ["forma decens, uestis tenuissima, uultus amantis,", "et pedibus uitium causa decoris erat.", "uenit et ingenti uiolenta Tragoedia passu:", "fronte comae torua, palla iacebat humi;", "laeua manus sceptrum late regale mouebat,", "Lydius alta pedum uincla cothurnus erat;", "et prior ‘ecquis erit’ dixit ‘tibi finis amandi,", "o argumenti lente poeta tui?"], "trans": "<div>Era proporcionada en su hermosura, su vestido finísimo, su rostro de enamorada, y hasta aquel defecto de los pies producía en ella elegancia.</div><div>Llegó también, violenta, la Tragedia, dando pasos enormes.</div><div>Le caían por la frente terrible los cabellos; arrastraba su manto por el suelo.</div><div>Movía su mano izquierda con soltura el cetro regio; y el coturno lidio era el alto calzado de sus pies.</div><div>Y hablando ella primero, así me dijo: «¿Dejarás algún día de amar, oh poeta que en tu propio argumento te demoras?</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a3-1-17-22", "ref": "3.1.17-22", "lines": ["nequitiam uinosa tuam conuiuia narrant,", "narrant in multas compita secta uias.", "saepe aliquis digito uatem designat euntem", "atque ait “hic, hic est, quem ferus urit Amor!”", "fabula, nec sentis, tota iactaris in Vrbe,", "dum tua praeterito facta pudore refers."], "trans": "<div>De tus extravíos hablan los banquetes donde se sirve el vino en abundancia.</div><div>Hablan de ello las plazas donde se cruzan numerosas calles.</div><div>Muchas veces alguno con el dedo señala al poeta que va andando y dice: “Éste es, éste es el que padece las quemaduras del feroz amor”.</div><div>Los rumores te llevan y te traen por toda la ciudad —y no te enteras— mientras estás contando tus hazañas, una vez que has perdido la vergüenza.</div>", "gloss": "<div><b>aiō (ait: dice)</b>: decir</div><div><b>aliquis, aliqua, aliquid</b>: alguien</div><div><b>Amor, -ōris, m.</b>: Amor</div><div><b>atque</b>: y</div><div><b>compitum, -ī, n.</b>: encrucijada</div><div><b>conuīuium, -iī, n.</b>: banquete</div><div><b>dēsignō, -ās,
