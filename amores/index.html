<!doctype html>
<html lang="es"><head><meta charset="utf-8">

<title>Ovidio, Amores · Pantallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap">
<style>
  :root{--f-body:'Bitter',Georgia,serif; --f-lat:'Bitter',Georgia,serif; --f-label:'Bitter',Georgia,serif; --label-w:600;}
  *{box-sizing:border-box;} [hidden]{display:none!important;}
  html,body{margin:0;} body{font-family:var(--f-body);}
  button,select{font:inherit;}
  .rlive{color:var(--rsoft);}
  .l{display:flex; gap:.5em; align-items:baseline;}
  .vn{font-style:normal; font-family:var(--f-label); font-weight:var(--label-w); font-size:.5em; color:var(--soft); width:2.4em; flex:none; text-align:right; letter-spacing:.03em; font-variant-numeric:tabular-nums;}
  .lt{flex:1; min-width:0;}
  .w{border-radius:.15em; padding:0 .06em; margin:0 -.06em;}
  body.brush .w{cursor:pointer;}
  body.brush .w:hover{outline:2px dashed var(--line); outline-offset:1px;}
  .c-y{background:var(--mk-y); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-y-e);}
  .c-r{background:var(--mk-r); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-r-e);}
  .c-b{background:var(--mk-b); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-b-e);}
  .c-g{background:var(--mk-g); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-g-e);}
  mark{border-radius:.15em; padding:0 .05em;}
  .body a,.w.lk{color:inherit; text-decoration-line:underline; text-decoration-color:var(--accent); text-decoration-thickness:.09em; text-underline-offset:.16em; cursor:pointer;}
  .body s,.body strike,.body del,.w.fs{text-decoration-line:line-through; text-decoration-thickness:.07em;}
  .w.lk.fs{text-decoration-line:underline line-through;}
  .body u,.w.u{text-decoration-line:underline; text-decoration-thickness:.09em; text-underline-offset:.2em; text-decoration-skip-ink:none;}
  .w.u.fs{text-decoration-line:underline line-through;}
  .u-y{text-decoration-color:var(--ul-y)!important;} .u-r{text-decoration-color:var(--ul-r)!important;} .u-b{text-decoration-color:var(--ul-b)!important;}
  .u-g{text-decoration-color:var(--ul-g)!important;} .u-k{text-decoration-color:var(--ul-k)!important;}
  .us-double{text-decoration-style:double; text-decoration-thickness:.07em;} .us-wavy{text-decoration-style:wavy; text-decoration-thickness:.06em;} .us-dotted{text-decoration-style:dotted; text-decoration-thickness:.12em;}
  .body b,.body strong,.w.fb{font-weight:700;}

  body.lector{
    --rbg:#FFFEFB; --rsurface:#F4EFE5; --rink:#2A2016; --rsoft:#5C4F3B; --rline:#DDD3C0; --raccent:#B32F2F; --raccent-ink:#FFFFFF;
    --rlive:#2E7D32; --rfree:#A15C00; --roff:#7A6E5C;
    --mk-y:#FFC000; --mk-r:#FF5E4D; --mk-b:#4F8DFF; --mk-g:#2FBF4F; --mk-ink:#2A2016;
    --mk-y-e:#B07F00; --mk-r-e:#B8231A; --mk-b-e:#1A4FC4; --mk-g-e:#137A2E;
    --ul-y:#E0A800; --ul-r:#E0342A; --ul-b:#1F5FE0; --ul-g:#1E9E3A; --ul-k:#2A2016; --accent:#B32F2F;
    background:var(--rbg); color:var(--rink); color-scheme:light;
  }
  body.lector[data-rtheme="dark"]{
    --rbg:#121110; --rsurface:#1F1D1A; --rink:#F3EFE8; --rsoft:#BDB5A8; --rline:#3D3833; --raccent:#FFD54A; --raccent-ink:#000000;
    --rlive:#5BD86B; --rfree:#FFB547; --roff:#9C948A;
    --mk-y:#FFE000; --mk-r:#FF6E5E; --mk-b:#6CB4FF; --mk-g:#4BE36B; --mk-ink:#000000;
    --mk-y-e:transparent; --mk-r-e:transparent; --mk-b-e:transparent; --mk-g-e:transparent;
    --ul-y:#FFE000; --ul-r:#FF6E5E; --ul-b:#6CB4FF; --ul-g:#4BE36B; --ul-k:#F3EFE8; --accent:#FFD54A;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark){
    body.lector:not([data-rtheme="light"]){
      --rbg:#121110; --rsurface:#1F1D1A; --rink:#F3EFE8; --rsoft:#BDB5A8; --rline:#3D3833; --raccent:#FFD54A; --raccent-ink:#000000;
      --rlive:#5BD86B; --rfree:#FFB547; --roff:#9C948A;
      --mk-y:#FFE000; --mk-r:#FF6E5E; --mk-b:#6CB4FF; --mk-g:#4BE36B; --mk-ink:#000000;
      --mk-y-e:transparent; --mk-r-e:transparent; --mk-b-e:transparent; --mk-g-e:transparent;
      --ul-y:#FFE000; --ul-r:#FF6E5E; --ul-b:#6CB4FF; --ul-g:#4BE36B; --ul-k:#F3EFE8; --accent:#FFD54A;
      color-scheme:dark;
    }
  }
  #lector{min-height:100dvh; display:flex; flex-direction:column; background:var(--rbg); color:var(--rink); font-family:var(--f-body); -webkit-text-size-adjust:100%;}
  #lector button{font-family:var(--f-body); cursor:pointer; -webkit-tap-highlight-color:transparent;}
  #lector button:focus-visible,#lector select:focus-visible{outline:3px solid var(--raccent); outline-offset:2px;}
  .rtop{position:sticky; top:0; z-index:5; background:var(--rbg); border-bottom:1px solid var(--rline); padding:8px 16px 8px;}
  .rrow{display:flex; align-items:center; gap:10px; min-width:0;}
  .rclase{flex:1; min-width:0; font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rref{flex:none; font-weight:600; font-size:17px; background:var(--rsurface); color:var(--rink); border:1px solid var(--rline); border-radius:20px; padding:6px 14px; min-height:42px; font-variant-numeric:tabular-nums;}
  .rsub{margin-top:6px; font-size:13px; color:var(--rsoft);}
  .rlive{display:flex; align-items:center; gap:7px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rlive i{width:9px; height:9px; border-radius:50%; background:var(--roff); flex:none;}
  .rlive[data-s="live"] i{background:var(--rlive); box-shadow:0 0 0 3px color-mix(in srgb, var(--rlive) 28%, transparent);}
  .rlive[data-s="free"] i{background:var(--rfree);}
  .rpos{font-variant-numeric:tabular-nums; flex:none;}
  .rtools{display:flex; gap:4px; flex:none;}
  .rtools button{font-weight:600; font-size:14px; min-width:40px; height:36px; padding:0 8px; border-radius:18px; border:1px solid var(--rline); background:transparent; color:var(--rink);}
  .rnote{display:flex; align-items:center; gap:10px; margin-top:8px; padding:8px 10px; background:var(--rsurface); border-left:3px solid var(--rfree); font-size:14px; line-height:1.35;}
  .rnote button{margin-left:auto; flex:none; font-weight:600; font-size:14px; min-height:40px; padding:0 14px; border-radius:20px; border:none; background:var(--raccent); color:var(--raccent-ink);}
  .rmain{flex:1; width:100%; max-width:1100px; margin:0 auto; padding:18px 16px calc(100px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:22px;}
  .rlat{font-size:var(--rfs,21px); line-height:1.55; max-width:calc(21em + 2.6em); overflow-wrap:break-word;}
  .rlat .l{gap:.45em;}
  .rlat .vn{font-family:var(--f-body); font-weight:600; font-size:.55em; width:2.3em; color:var(--rsoft); letter-spacing:0;}
  .rlat .lt{padding-left:1.2em; text-indent:-1.2em;}
  .rpanel{border-top:1px solid var(--rline);}
  .rtabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;}
  .rtabs::-webkit-scrollbar{display:none;}
  .rtabs button{flex:none; font-weight:600; font-size:15px; background:none; border:none; border-bottom:3px solid transparent; color:var(--rsoft); padding:10px 12px; min-height:46px; max-width:75vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rtabs button[aria-selected="true"]{color:var(--rink); border-bottom-color:var(--raccent);}
  .rtab{font-size:17px; line-height:1.55; padding:12px 2px; overflow-wrap:break-word;}
  .rtab ul,.rtab ol{margin:0; padding-left:1.2em;} .rtab li{margin:.3em 0;} .rtab li::marker{color:var(--raccent);}
  .rtab p,.rtab div{margin:0;}
  .rtab .rg{padding:.4em 0; border-bottom:1px solid var(--rline);} .rtab .rg:last-child{border-bottom:none;}
  .rtab b,.rtab strong{font-weight:700;}
  .rtab a{color:inherit; text-decoration-line:underline; text-decoration-color:var(--raccent); text-underline-offset:.16em;}
  .rtab u{text-decoration-thickness:.09em; text-underline-offset:.2em; text-decoration-skip-ink:none;}
  .rtab s,.rtab strike,.rtab del{text-decoration-thickness:.07em;}
  .rmsg{padding:56px 16px; text-align:center; font-size:17px; line-height:1.5; color:var(--rsoft); max-width:460px; margin:0 auto;}
  .rnav{position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; gap:10px; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--rbg); border-top:1px solid var(--rline);}
  .rnav button{flex:1; min-height:52px; font-weight:600; font-size:17px; border-radius:26px; border:1px solid var(--rline); background:var(--rsurface); color:var(--rink);}
  .rnav #rNext{background:var(--raccent); color:var(--raccent-ink); border-color:var(--raccent);}
  .rnav button:disabled{opacity:.4; cursor:default;}
  .rsheet{position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center;}
  .rsheet-in{background:var(--rbg); color:var(--rink); width:100%; max-width:640px; max-height:82dvh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));}
  .rsheet-head{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px;}
  .rsheet-head .rlbl{margin:0; font-size:13px; color:var(--rsoft); width:100%;}
  .rsheet-head select{flex:1; min-width:0; font:16px var(--f-body); padding:8px; min-height:44px; background:var(--rsurface); color:var(--rink); border:1px solid var(--rline); border-radius:8px;}
  .rsheet-head button{font-weight:600; font-size:15px; min-height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--rline); background:transparent; color:var(--rink); margin-left:auto;}
  #rList{list-style:none; margin:0; padding:0;}
  #rList button{width:100%; text-align:left; display:flex; gap:10px; align-items:baseline; padding:12px 10px; min-height:50px; background:none; border:none; border-left:4px solid transparent; color:var(--rink); font-size:16px;}
  #rList button .rr{font-weight:600; flex:none; font-variant-numeric:tabular-nums;}
  #rList button .rw{color:var(--rsoft); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; min-width:0;}
  #rList button[aria-current="true"]{border-left-color:var(--raccent); background:var(--rsurface);}
  @media (min-width:701px){
    .rmain{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); align-items:start; gap:36px; padding-top:24px;}
    .rpanel{border-top:none; border-left:1px solid var(--rline); padding-left:24px; position:sticky; top:110px; max-height:calc(100dvh - 210px); overflow:auto;}
    .rnav{justify-content:center;} .rnav button{flex:0 1 260px;}
  }
</style></head>
<body class="lector">
<div id="lector">
  <header class="rtop">
    <div class="rrow">
      <span class="rclase" id="rClase">Cargando…</span>
      <button class="rref" id="rRef" aria-haspopup="dialog">—</button>
    </div>
    <div class="rrow rsub">
      <span class="rlive" id="rLive"></span>
      <span class="rpos" id="rPos"></span>
      <span class="rtools">
        <button id="rMinus" aria-label="Letra más chica">A−</button>
        <button id="rPlus" aria-label="Letra más grande">A+</button>
        <button id="rThemeBtn" aria-label="Cambiar entre tema claro y oscuro">◐</button>
      </span>
    </div>
    <div class="rnote" id="rNote" hidden></div>
  </header>
  <main class="rmain" id="rMain">
    <section class="rlat" id="rLat" lang="la" aria-label="Texto latino"></section>
    <section class="rpanel" id="rPanel" hidden>
      <div class="rtabs" role="tablist" id="rTabs"></div>
      <div class="rtab" id="rTab" role="tabpanel"></div>
    </section>
  </main>
  <p class="rmsg" id="rMsg" hidden></p>
  <nav class="rnav" aria-label="Pasajes">
    <button id="rPrev">◀ Anterior</button>
    <button id="rNext">Siguiente ▶</button>
  </nav>
  <div class="rsheet" id="rSheet" hidden role="dialog" aria-label="Pasajes de la clase">
    <div class="rsheet-in">
      <div class="rsheet-head">
        <p class="rlbl" id="rSheetLbl">Clase</p>
        <select id="rSel" aria-label="Elegir clase"></select>
        <button id="rSheetClose">Cerrar</button>
      </div>
      <ol id="rList"></ol>
    </div>
  </div>
</div>

<script>
const DATA = {"clase": "Ovidio, Amores I–III", "pasajes": [{"id": "a1-1-1-10", "ref": "1.1.1-10", "lines": ["Arma graui numero uiolentaque bella parabam", "edere, materia conueniente modis.", "par erat inferior uersus; risisse Cupido", "dicitur atque unum surripuisse pedem.", "‘quis tibi, saeue puer, dedit hoc in carmina iuris?", "Pieridum uates, non tua, turba sumus.", "quid, si praeripiat flauae Venus arma Mineruae,", "uentilet accensas flaua Minerua faces?", "quis probet in siluis Cererem regnare iugosis,", "lege pharetratae uirginis arua coli?"], "trans": "<div>Las armas y las guerras violentas me aprestaba a cantar con solemne ritmo, asunto adecuado a la métrica.</div><div>Igual al primer verso era el segundo.</div><div>Pero, se cuenta que Cupido rió y le arrancó un pie a escondidas.</div><div>«Niño cruel, ¿quién te ha dado ese derecho sobre el verso?</div><div>Formamos los poetas el tropel de las Piérides, no el tuyo.</div><div>¿Qué pasaría si Venus a la rubia Minerva le arrancara las armas y la rubia Minerva sacudiera en el aire las teas llameantes?</div><div>¿Vería bien alguien que reinara Ceres sobre los bosques que hay en las montañas, y que los campos fuesen cultivados bajo el poder de la doncella armada con el carcaj?</div>", "gloss": "<div><b>arma, -ōrum, n. pl.</b>: armas</div><div><b>atque</b>: y</div><div><b>bellum, -ī, n.</b>: guerra</div><div><b>carmen, -inis, n.</b>: poema, canto</div><div><b>conueniō, -īs, -īre, conuēnī, conuentum</b>: ser adecuado (+ dat.)</div><div><b>Cupīdō, -inis, m.</b>: Cupido</div><div><b>dīcō, -is, -ere, dīxī, dictum (dīcitur: se dice)</b>: decir</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>ēdō, -is, -ere, ēdidī, ēditum</b>: dar a conocer, cantar</div><div><b>grauis, -e</b>: pesado, grave</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>in (prep. + acus.)</b>: sobre</div><div><b>īnferior, -ius</b>: inferior; (aquí) el segundo</div><div><b>iūs, iūris, n. (hoc iūris: este derecho)</b>: derecho</div><div><b>māteria, -ae, f.</b>: materia, asunto</div><div><b>modus, -ī, m. (pl. ritmos, metro)</b>: medida, modo</div><div><b>nōn</b>: no</div><div><b>numerus, -ī, m.</b>: ritmo, metro</div><div><b>pār, paris</b>: igual</div><div><b>parō, -ās, -āre, -āvī, -ātum</b>: prepararse a, disponerse a</div><div><b>pēs, pedis, m.</b>: pie</div><div><b>Pīerides, -um, f. pl.</b>: las Piérides, las Musas</div><div><b>puer, -ī, m.</b>: niño, muchacho</div><div><b>-que</b>: y</div><div><b>quis, quid (interrog.)</b>: ¿quién?, ¿qué?</div><div><b>rīdeō, -ēs, -ēre, rīsī, rīsum</b>: reír</div><div><b>saeuus, -a, -um</b>: cruel</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>surripiō, -is, -ere, surripuī, surreptum</b>: robar a escondidas</div><div><b>tū, tuī</b>: tú, vos</div><div><b>turba, -ae, f.</b>: multitud, tropel</div><div><b>tuus, -a, -um</b>: tuyo</div><div><b>uātēs, -is, m.</b>: poeta, vate</div><div><b>uersus, -ūs, m.</b>: verso</div><div><b>uiolentus, -a, -um</b>: violento</div><div><b>ūnus, -a, -um</b>: uno</div>", "notes": "<div><b>El chasco del pentámetro</b></div><div>¿Qué metro esperamos después de <i>Arma</i>… y qué nos da Ovidio en el v. 2?</div><div>↔ <i>Aen.</i> 1.1 (<i>Arma uirumque cano</i>); <i>Her.</i> 15.5-8 (Safo y los metros).</div><ul><li><i>materia conueniente modis</i>: ablativo absoluto (<i>modis</i>, dativo regido por <i>conuenire</i>). Participio en ablativo absoluto en <i>-e</i>.</li><li><i>graui numero</i> nombra el hexámetro dentro del hexámetro; el dístico es todo dactílico (McKeown).</li><li><i>Cupido… dicitur risisse</i>: nominativo con infinitivo perfecto («se dice que Cupido rió»). Vuelve en 1.5.11-12 y 1.9.37-38.</li><li><i>surripuisse</i>: el «a escondidas» está en el preverbio (<i>sub</i> + <i>rapio</i>), no en el tiempo.</li><li><i>hoc iuris</i>: genitivo partitivo. <i>Ordo</i>: <i>saeue puer, quis dedit tibi hoc iuris in carmina?</i></li><li><i>turba</i> sirve a los dos miembros: <i>uates sumus turba Pieridum, non tua</i>.</li><li>vv. 7-10: mundo al revés (Venus ↔ Minerva, Ceres ↔ Diana): <i>locus de indignatione</i>, antesala del adynaton. <i>quid si praeripiat</i>: subjuntivo potencial.</li><li>Consagración del poeta: de Hesíodo al prólogo de los <i>Aitia</i> de Calímaco; pero Ovidio no admite que la épica lo exceda y protesta (McKeown).</li><li>Cupido en lugar de Apolo: «una profunda deflación» del tópico calimaqueo (Thomas). <i>Arma</i> reproduce los sonidos de <i>arma uirumque cano</i> (Stroh, citado por McKeown).</li><li><i>dicitur</i>: la vocación propia contada como mito etiológico; Ovidio se burla de la apelación a la <i>uox populi</i> (Cristóbal 1992).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b"}, "ul": {"31": "b", "20": "b", "28": "b", "15": "r", "25": "g", "19": "g", "14": "r", "0": "r", "16": "r"}, "lk": {}}, {"id": "a1-1-11-20", "ref": "1.1.11-20", "lines": ["crinibus insignem quis acuta cuspide Phoebum", "instruat, Aoniam Marte mouente lyram?", "sunt tibi magna, puer, nimiumque potentia regna;", "cur opus affectas, ambitiose, nouum?", "an, quod ubique, tuum est? tua sunt Heliconia tempe?", "uix etiam Phoebo iam lyra tuta sua est?", "cum bene surrexit uersu noua pagina primo,", "attenuat neruos proximus ille meos.", "nec mihi materia est numeris leuioribus apta,", "aut puer aut longas compta puella comas.’"], "trans": "<div>A Febo el de hermosos cabellos ¿alguien le dotaría de lanza aguda, mientras que Marte toca la aonia lira?</div><div>Niño, tus reinos son grandes y en demasía poderosos.</div><div>¿Por qué, ambicioso, aspiras a una posesión nueva?</div><div>¿Por doquier todo es tuyo?</div><div>¿Tuyo el valle del Helicón?</div><div>¿Ni Febo ya siquiera va a ser dueño seguro de su lira?</div><div>Cuando una nueva página con el verso primero empieza bien, debilita el siguiente mis impulsos.</div><div>Pero yo para un ritmo más ligero no tengo materiales apropiados: no un muchacho, tampoco una muchacha de larga cabellera acicalada»</div>", "gloss": "<div><b>affectō, -ās, -āre, -āvī, -ātum</b>: aspirar a, ambicionar</div><div><b>ambitiōsus, -a, -um</b>: ambicioso</div><div><b>an</b>: ¿acaso?</div><div><b>aptus, -a, -um</b>: adecuado (+ dat.)</div><div><b>cūr</b>: ¿por qué?</div><div><b>ego, meī</b>: yo</div><div><b>etiam</b>: también, incluso</div><div><b>iam</b>: ya</div><div><b>leuis, -e (comp. leuior)</b>: liviano</div><div><b>lyra, -ae, f.</b>: lira</div><div><b>magnus, -a, -um</b>: grande</div><div><b>māteria, -ae, f.</b>: materia, asunto</div><div><b>nec</b>: y no, ni</div><div><b>nimium (adv.)</b>: demasiado</div><div><b>nouus, -a, -um</b>: nuevo</div><div><b>numerus, -ī, m. (pl. ritmos, versos)</b>: ritmo</div><div><b>opus, -eris, n.</b>: obra, tarea</div><div><b>Phoebus, -ī, m.</b>: Febo</div><div><b>potēns, -entis</b>: poderoso</div><div><b>puella, -ae, f.</b>: muchacha</div><div><b>puer, -ī, m.</b>: niño, muchacho</div><div><b>-que</b>: y</div><div><b>quī, quae, quod (quod ubīque: lo que hay en todas partes)</b>: que, lo que</div><div><b>rēgnum, -ī, n.</b>: reino</div><div><b>sum, es, esse, fuī</b>: ser, haber</div><div><b>suus, -a, -um</b>: suyo, propio</div><div><b>tū, tuī</b>: tú, vos</div><div><b>tūtus, -a, -um</b>: seguro</div><div><b>tuus, -a, -um</b>: tuyo</div><div><b>ubīque</b>: en todas partes</div><div><b>uix</b>: apenas</div>", "notes": "<div><b>¿Una obra nueva?</b></div><div>¿Qué le reprocha el poeta a Cupido, y en qué sentido el reproche se vuelve contra el propio Ovidio?</div><div>↔ Cic. <i>Cat.</i> 1.1-2 (<i>quousque tandem…</i>, <i>o tempora, o mores!</i>).</div><ul><li><i>sunt tibi… regna</i>; <i>mihi materia est</i>: dativo posesivo.</li><li>Léxico político: <i>regnum affectare</i> («aspirar a la tiranía»), <i>ambitiose</i>.</li><li><i>an, quod ubique, tuum est?</i>: relativa sin antecedente con elipsis de <i>est</i>.</li><li><i>uix etiam… iam</i>: tono exasperado; <i>sua</i> remite a <i>Phoebo</i>.</li><li>vv. 17-18: el pentámetro «afloja los nervios» del hexámetro; lectura obscena posible pero discutida (Marg, Harder vs. McKeown).</li><li><i>numeris leuioribus apta</i>: comparativo; <i>apta</i> + dativo. Eco del primer dístico.</li><li>v. 12 <i>Marte mouente</i>: otro ablativo absoluto.</li></ul>", "hl": {}, "fx": {"11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "60": "b", "64": "b"}, "ul": {"19": "r", "18": "r", "20": "r", "21": "r", "22": "r"}, "lk": {}}, {"id": "a1-1-21-30", "ref": "1.1.21-30", "lines": ["questus eram, pharetra cum protinus ille soluta", "legit in exitium spicula facta meum", "lunauitque genu sinuosum fortiter arcum", "‘quod’que ‘canas, uates, accipe’ dixit ‘opus!’", "me miserum! certas habuit puer ille sagittas:", "uror et in uacuo pectore regnat Amor.", "sex mihi surgat opus numeris, in quinque residat;", "ferrea cum uestris bella ualete modis.", "cingere litorea flauentia tempora myrto,", "Musa per undenos emodulanda pedes."], "trans": "<div>Apenas acababa de quejarme cuando él, abriendo su carcaj de pronto, extrajo las saetas para perdición mía fabricadas, y sobre la rodilla, decidido, curvó cual media luna su arco combado y dijo: «Toma poeta, tema para que cantes».</div><div>¡Desgraciado de mí!</div><div>El niño tiene flechas certeras.</div><div>Yo me abraso, y el Amor reina en mi corazón deshabitado.</div><div>Que nazcan, pues, mis versos con ritmo de seis pies, y que en cinco se queden.</div><div>¡Adiós, guerras feroces, y quedaos con vuestra métrica!</div><div>Ciñe tus rubias sienes con mirto ribereño, Musa, tú que has de ser cantada con un ritmo de once pies.</div>", "gloss": "<div><b>accipiō, -is, -ere, accēpī, acceptum</b>: recibir</div><div><b>Amor, -ōris, m.</b>: Amor</div><div><b>bellum, -ī, n.</b>: guerra</div><div><b>canō, -is, -ere, cecinī, cantum</b>: cantar</div><div><b>certus, -a, -um</b>: certero, seguro</div><div><b>cingō, -is, -ere, cīnxī, cīnctum (cingere: «cíñete»)</b>: ceñir</div><div><b>cum (prep. + abl.)</b>: con</div><div><b>dīcō, -is, -ere, dīxī, dictum</b>: decir</div><div><b>ego, meī</b>: yo</div><div><b>ēmodulor, -ārī (ēmodulanda: que ha de ser cantada)</b>: cantar con ritmo</div><div><b>et</b>: y</div><div><b>ferreus, -a, -um</b>: de hierro, cruel</div><div><b>flāueō, -ēs, -ēre (flāuēns: rubio)</b>: ser rubio</div><div><b>habeō, -ēs, -ēre, habuī, habitum</b>: tener</div><div><b>ille, illa, illud</b>: aquel, aquella, aquello</div><div><b>in (prep. + abl.)</b>: en</div><div><b>lītoreus, -a, -um</b>: de la orilla, ribereño</div><div><b>miser, -era, -erum</b>: desdichado</div><div><b>modus, -ī, m. (pl. ritmos, metro)</b>: medida, modo</div><div><b>Mūsa, -ae, f.</b>: Musa</div><div><b>myrtus, -ī, f.</b>: mirto</div><div><b>opus, -eris, n.</b>: obra, tema</div><div><b>pectus, -oris, n.</b>: pecho, corazón</div><div><b>per (prep. + acus.)</b>: por, a lo largo de</div><div><b>pēs, pedis, m.</b>: pie</div><div><b>puer, -ī, m.</b>: niño, muchacho</div><div><b>-que</b>: y</div><div><b>quī, quae, quod (quod canās: para que cantes)</b>: que, el cual</div><div><b>rēgnō, -ās, -āre, -āvī, -ātum</b>: reinar</div><div><b>sagitta, -ae, f.</b>: flecha</div><div><b>tempus, -oris, n. (pl. las sienes)</b>: sien</div><div><b>uacuus, -a, -um</b>: vacío</div><div><b>ualeō, -ēs, -ēre, ualuī (ualēte: adiós)</b>: estar bien</div><div><b>uātēs, -is, m.</b>: poeta, vate</div><div><b>uester, uestra, uestrum</b>: vuestro</div><div><b>ūndēnī, -ae, -a</b>: de a once</div><div><b>ūrō, -is, -ere, ussī, ustum (ūror: me quemo)</b>: quemar</div>", "notes": "<div><b><i>Vror</i>: el disparo</b></div><div>¿Qué cambia entre los vv. 19-20 y los vv. 25-26?</div><div>↔ 1.1.13 (<i>regna</i>) → <i>regnat</i>; 1.2.43 (<i>ures</i>).</div><ul><li><i>quod canas</i>: relativa final. <i>Ordo</i>: <i>dixitque: «uates, accipe opus quod canas!»</i></li><li><i>me miserum</i>: acusativo exclamativo.</li><li><i>uror</i>: 1.ª persona de la voz pasiva. <i>in uacuo pectore</i> responde a los vv. 19-20.</li><li><i>Ordo</i>: <i>ferrea bella, ualete cum uestris modis</i>; <i>bella</i>, vocativo; <i>ualete</i>, imperativo plural.</li><li><i>cingere</i>: imperativo pasivo-medio de 2.ª sg. («cíñete»), no infinitivo.</li><li><i>emodulanda</i>: gerundivo concordado con <i>Musa</i> («que has de ser cantada»). Si concuerda, es gerundivo. De <i>emodulor</i>, no de <i>aemulor</i>.</li><li><i>undenos pedes</i>: 6 + 5, el dístico.</li><li><i>uror et in uacuo pectore</i> recuerda a Horacio (<i>Carm.</i> 1.6.17-19, <i>uacui… urimur</i>): un sujeto sin compromiso pasional, lejos del enamorado atormentado (Sala).</li><li>Ovidio, primer poeta que recibe la carrera de Virgilio como modelo dado; <i>Amores</i> ocupa el lugar de las <i>Églogas</i> (Thomas).</li></ul>", "hl": {}, "fx": {"18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b", "60": "b", "61": "b"}, "ul": {"61": "b", "35": "r", "55": "b", "23": "b", "27": "g", "22": "g", "32": "r", "33": "r", "34": "r", "36": "r", "37": "r", "31": "r"}, "lk": {}}, {"id": "a1-2-1-6", "ref": "1.2.1-6", "lines": ["Esse quid hoc dicam, quod tam mihi dura uidentur", "strata, neque in lecto pallia nostra sedent,", "et uacuus somno noctem, quam longa, peregi,", "lassaque uersati corporis ossa dolent?", "nam, puto, sentirem, si quo temptarer amore —", "an subit et tecta callidus arte nocet?"], "trans": "<div>¿Por qué diré que el lecho me parece tan duro, que no paran mis mantas en la cama, que la noche —cuán larga— la he pasado sin sueño, y que me duelen los cansados huesos de este cuerpo que ha dado tantas vueltas?</div><div>Pues, creo, me daría cuenta si estuviera siendo acosado por algún amor.</div><div>¿O acaso entra furtivo y hábilmente me hace daño con artes encubiertas?</div>", "gloss": "<div><b>ars, artis, f.</b>: arte, artimaña</div><div><b>callidus, -a, -um</b>: astuto</div><div><b>doleō, -ēs, -ēre, doluī</b>: doler</div><div><b>lassus, -a, -um</b>: cansado</div><div><b>noceō, -ēs, -ēre, nocuī, nocitum</b>: dañar</div><div><b>os, ossis, n.</b>: hueso</div><div><b>-que</b>: y</div><div><b>somnus, -ī, m.</b>: sueño</div><div><b>tegō, -is, -ere, tēxī, tēctum (tēctus: oculto)</b>: cubrir</div><div><b>uacuus, -a, -um (+ abl.)</b>: vacío, libre de</div>", "notes": "<div><b>Síntomas</b></div><div>¿Qué le pasa al poeta? ¿Por qué no sabe nombrarlo?</div><div>↔ Mozart, «Voi che sapete» (<i>Le nozze di Figaro</i>); <i>Aen.</i> 4.1-5.</div><ul><li><i>uacuus somno</i>: ablativo de separación; eco de 1.1.26 <i>in uacuo pectore</i>.</li><li><i>lassaque… ossa dolent</i>: el hipérbaton encierra <i>uersati corporis</i>.</li><li><i>tecta… arte</i> modifica a <i>callidus</i>; cf. <i>Aen.</i> 4.2 <i>caeco carpitur igni</i>.</li><li>El insomnio como síntoma de amor: preludio del <i>morbus amoris</i>.</li><li>Ovidio duda y elige (<i>cedamus</i>): para Propercio y Tibulo, en cambio, el amor es un destino inevitable (Sala).</li></ul>", "hl": {}, "fx": {"17": "b", "18": "b", "23": "b", "26": "b", "27": "b", "39": "b", "40": "b", "41": "b", "42": "b"}, "ul": {"41": "r", "26": "b", "40": "r", "42": "r", "39": "r"}, "lk": {}}, {"id": "a1-2-7-12", "ref": "1.2.7-12", "lines": ["sic erit: haeserunt tenues in corde sagittae,", "et possessa ferus pectora uersat Amor.", "cedimus, an subitum luctando accendimus ignem?", "cedamus: leue fit, quod bene fertur, onus.", "uidi ego iactatas mota face crescere flammas", "et rursus nullo concutiente mori."], "trans": "<div>Así debe de ser.</div><div>Sus finas flechas están clavadas en mi corazón y el fiero Amor trastorna el pecho que ya es suyo.</div><div>¿Cederé, o resistiéndome avivaré este fuego inesperado?</div><div>Cedamos: bien llevada la carga se hace leve.</div><div>Yo he visto cómo crecen, al agitar la antorcha, las llamas tremolantes, y también que se extinguen si nadie las remueve.</div>", "gloss": "<div><b>accendō, -is, -ere, accendī, accēnsum</b>: encender</div><div><b>Amor, -ōris, m.</b>: Amor</div><div><b>an</b>: o acaso</div><div><b>bene</b>: bien</div><div><b>cēdō, -is, -ere, cessī, cessum</b>: ceder, rendirse</div><div><b>concutiō, -is, -ere, concussī, concussum</b>: sacudir, agitar</div><div><b>cor, cordis, n.</b>: corazón</div><div><b>crēscō, -is, -ere, crēuī, crētum</b>: crecer</div><div><b>ego, meī</b>: yo</div><div><b>et</b>: y</div><div><b>fax, facis, f.</b>: antorcha</div><div><b>ferō, fers, ferre, tulī, lātum (fertur: se lleva)</b>: llevar</div><div><b>ferus, -a, -um</b>: fiero, salvaje</div><div><b>fīō, fīs, fierī, factus sum</b>: hacerse, volverse</div><div><b>flamma, -ae, f.</b>: llama</div><div><b>haereō, -ēs, -ēre, haesī, haesum</b>: quedar clavado</div><div><b>iactō, -ās, -āre, -āvī, -ātum</b>: agitar</div><div><b>ignis, -is, m.</b>: fuego</div><div><b>in (prep. + abl.)</b>: en</div><div><b>leuis, -e</b>: liviano</div><div><b>luctor, -ārī, luctātus sum (luctandō: luchando)</b>: luchar</div><div><b>morior, -eris, morī, mortuus sum</b>: morir, apagarse</div><div><b>moueō, -ēs, -ēre, mōuī, mōtum</b>: mover, agitar</div><div><b>nūllus, -a, -um (nūllō: sin que nadie)</b>: ninguno</div><div><b>onus, -eris, n.</b>: carga</div><div><b>pectus, -oris, n.</b>: pecho, corazón</div><div><b>possideō, -ēs, -ēre, possēdī, possessum</b>: ocupar, poseer</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>rūrsus</b>: a su vez, en cambio</div><div><b>sagitta, -ae, f.</b>: flecha</div><div><b>subitus, -a, -um</b>: repentino</div><div><b>tenuis, -e</b>: fino, delgado</div><div><b>uersō, -ās, -āre, -āvī, -ātum</b>: dar vueltas, revolver</div><div><b>uideō, -ēs, -ēre, uīdī, uīsum</b>: ver</div>", "notes": "<div><b>Ceder o luchar</b></div><div>¿Qué decide el poeta y con qué argumento?</div><div>↔ <i>Aen.</i> 4.4 (<i>haerent infixi pectore uultus</i>); Verg. <i>Ecl.</i> 10.69 (<i>et nos cedamus Amori</i>).</div><ul><li><i>haeserunt… sagittae</i>: perfecto; <i>tenues</i>, plural por singular.</li><li>Doble hipérbaton entrelazado: <i>possessa… pectora</i> / <i>ferus… Amor</i>.</li><li><i>cedimus</i> (indicativo) vs. <i>cedamus</i> (subjuntivo exhortativo).</li><li><i>luctando</i>: gerundio en ablativo.</li><li><i>Ordo</i>: <i>onus quod bene fertur fit leue</i>; <i>onus</i> es el antecedente postergado.</li><li>vv. 11-18: tres <i>exempla</i> (antorcha, bueyes, caballo) y la sentencia.</li><li>vv. 11-12 <i>mota face</i>, <i>nullo concutiente</i>: ablativos absolutos (banco).</li></ul>", "hl": {}, "fx": {"2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b"}, "ul": {"25": "r", "10": "b", "18": "b", "5": "b", "2": "g", "26": "g", "35": "r", "36": "r", "20": "r", "21": "r", "22": "r", "23": "r", "24": "r", "29": "r", "30": "r"}, "lk": {}}, {"id": "a1-2-13-22", "ref": "1.2.13-22", "lines": ["uerbera plura ferunt quam quos iuuat usus aratri,", "detractant prensi dum iuga prima, boues.", "asper equus duris contunditur ora lupatis;", "frena minus sentit, quisquis ad arma facit.", "acrius inuitos multoque ferocius urget,", "quam qui seruitium ferre fatentur, Amor.", "en ego confiteor: tua sum noua praeda, Cupido;", "porrigimus uictas ad tua iura manus.", "nil opus est bello: pacem ueniamque rogamus;", "nec tibi laus armis uictus inermis ero."], "trans": "<div>Los bueyes que oprimidos se resisten al primer yugo, sufren más azotes que los que se complacen soportando el arado.</div><div>Hiere el duro bocado al caballo rebelde: Siente menos el freno el que se hace a las riendas.</div><div>A los que se resisten el Amor los fustiga más duro y con crueldad mucho mayor que a quienes le declaran servidumbre.</div><div>Pues bien, yo lo confieso, Cupido, soy tu presa más reciente, y hacia tu poder tiendo mis manos derrotadas.</div><div>Para nada la guerra es necesaria: tregua y paz te suplico.</div><div>Desarmado y vencido por las armas yo no te voy a dar ninguna gloria.</div>", "gloss": "<div><b>ad (prep. + acus.)</b>: hacia, ante</div><div><b>arma, -ōrum, n. pl.</b>: armas; (aquí) los arreos</div><div><b>asper, -era, -erum</b>: áspero, rebelde</div><div><b>cōnfiteor, -ēris, -ērī, cōnfessus sum</b>: confesar</div><div><b>contundō, -is, -ere, contudī, contūsum</b>: golpear, lastimar</div><div><b>Cupīdō, -inis, m.</b>: Cupido</div><div><b>dūrus, -a, -um</b>: duro</div><div><b>ego, meī</b>: yo</div><div><b>ēn</b>: ¡he aquí!, ¡mirá!</div><div><b>equus, -ī, m.</b>: caballo</div><div><b>faciō, -is, -ere, fēcī, factum (ad arma facit: se hace a las riendas)</b>: hacer</div><div><b>frēnum, -ī, n.</b>: freno</div><div><b>iūs, iūris, n. (pl. leyes, dominio)</b>: derecho</div><div><b>lupāta, -ōrum, n. pl.</b>: bocado (con dientes de lobo)</div><div><b>manus, -ūs, f.</b>: mano</div><div><b>minus (adv.)</b>: menos</div><div><b>nouus, -a, -um</b>: nuevo</div><div><b>ōs, ōris, n.</b>: boca</div><div><b>porrigō, -is, -ere, porrēxī, porrēctum</b>: tender, extender</div><div><b>praeda, -ae, f.</b>: presa, botín</div><div><b>quisquis, quidquid</b>: quienquiera que</div><div><b>sentiō, -īs, -īre, sēnsī, sēnsum</b>: sentir</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>tuus, -a, -um</b>: tuyo</div><div><b>uincō, -is, -ere, uīcī, uictum (uictus: vencido)</b>: vencer</div>", "notes": "<div><b>La rendición</b></div><div>¿Cómo se presenta el poeta frente a Cupido?</div><ul><li><i>confiteor</i>: deponente (forma pasiva, sentido activo), junto a <i>uror</i>.</li><li><i>tua sum noua praeda, Cupido</i>: vocativo; paso de <i>ego… sum</i> a <i>porrigimus</i> (plural poético).</li><li><i>uictas manus</i>: participio concertado.</li><li>Ovidio acepta el <i>seruitium amoris</i> como algo bueno (González Iglesias).</li><li>v. 15 <i>contunditur</i>: pasiva de infectum, 3.ª sg; la traducción la vuelve activa (banco).</li></ul>", "hl": {}, "fx": {"14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b"}, "ul": {"50": "b", "18": "b", "45": "r", "17": "r", "41": "r", "42": "r", "43": "r", "44": "r"}, "lk": {}}, {"id": "a1-2-23-32", "ref": "1.2.23-32", "lines": ["necte comam myrto, maternas iunge columbas;", "qui deceant, currus uitricus ipse dabit,", "inque dato curru, populo clamante triumphum,", "stabis et adiunctas arte mouebis aues.", "ducentur capti iuuenes captaeque puellae:", "haec tibi magnificus pompa triumphus erit.", "ipse ego, praeda recens, factum modo uulnus habebo", "et noua captiua uincula mente feram.", "Mens Bona ducetur manibus post terga retortis", "et Pudor et castris quicquid Amoris obest."], "trans": "<div>Corona tu cabello con el mirto. y engancha las palomas de tu madre, que tu padrastro te entregará el carro adecuado y en él de pie irás guiando con destreza las aves embridadas, mientras el pueblo aclama el triunfo tuyo.</div><div>Desfilarán los jóvenes cautivos y con ellos cautivas las muchachas.</div><div>Un magnífico triunfo te dará ese cortejo.</div><div>Yo mismo, prisionero hecho hace poco, mostraré mi recién abierta herida, y arrastraré mis nuevas cadenas como esclavo.</div><div>Allí irá la Cordura con las manos atadas a la espalda, el Pudor, todo aquello que a las tropas del Amor se resiste.</div>", "gloss": "<div><b>capiō, -is, -ere, cēpī, captum (captus: cautivo)</b>: tomar, capturar</div><div><b>clāmō, -ās, -āre, -āvī, -ātum</b>: gritar, aclamar</div><div><b>columba, -ae, f.</b>: paloma</div><div><b>coma, -ae, f.</b>: cabellera</div><div><b>currus, -ūs, m. (aquí pl. poético)</b>: carro</div><div><b>dō, dās, dare, dedī, datum</b>: dar</div><div><b>dūcō, -is, -ere, dūxī, ductum</b>: llevar, conducir</div><div><b>ipse, ipsa, ipsum</b>: él mismo, ella misma</div><div><b>iungō, -is, -ere, iūnxī, iūnctum</b>: uncir, unir</div><div><b>iuuenis, -is, m.</b>: joven</div><div><b>māternus, -a, -um</b>: materno, de tu madre</div><div><b>myrtus, -ī, f.</b>: mirto</div><div><b>nectō, -is, -ere, nexuī, nexum</b>: anudar, trenzar</div><div><b>populus, -ī, m.</b>: pueblo</div><div><b>puella, -ae, f.</b>: muchacha</div><div><b>-que</b>: y</div><div><b>stō, stās, stāre, stetī, statum</b>: estar de pie</div><div><b>triumphus, -ī, m.</b>: triunfo</div><div><b>uītricus, -ī, m.</b>: padrastro</div>", "notes": "<div><b>El triunfo de Cupido</b></div><div>¿Qué elementos del triunfo romano reconocemos?</div><ul><li><i>necte</i>, <i>iunge</i>: imperativos.</li><li><i>currus</i>: acusativo plural poético; <i>uitricus</i>: ¿Vulcano o Marte?</li><li><i>populo clamante</i>: ablativo absoluto; <i>inque dato curru</i>, en cambio, no lo es.</li><li><i>stabis</i>: futuro de <i>sto</i>; el <i>triumphator</i> va de pie.</li><li><i>ducentur</i>: futuro pasivo; <i>capti / captae</i>.</li><li>v. 29 <i>uulnus</i> (neutro de 3.ª) vs. v. 30 <i>uincula</i> (neutro de 2.ª).</li><li>El triunfo de Amor: Petrarca lo sigue en el <i>Trionfo d'Amore</i>, y de ahí pasa al <i>Triunphete de amor</i> de Santillana (González Iglesias).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "8": "b", "9": "b", "10": "b", "11": "b", "15": "b", "16": "b", "17": "b", "18": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b"}, "ul": {"26": "b", "16": "r", "17": "r", "15": "r"}, "lk": {}}, {"id": "a1-2-33-42", "ref": "1.2.33-42", "lines": ["omnia te metuent; ad te sua bracchia tendens", "uulgus ‘io’ magna uoce ‘triumphe’ canet.", "Blanditiae comites tibi erunt Errorque Furorque,", "assidue partes turba secuta tuas.", "his tu militibus superas hominesque deosque;", "haec tibi si demas commoda, nudus eris.", "laeta triumphanti de summo mater Olympo", "plaudet et appositas sparget in ora rosas.", "tu pinnas gemma, gemma uariante capillos,", "ibis in auratis aureus ipse rotis."], "trans": "<div>Todos te tendrán miedo.</div><div>La multitud, tendiéndote sus brazos, entonará con grandes voces: «¡Io!</div><div>¡Triunfo!</div><div>Las Seducciones te irán acompañando, y el Error, el Delirio, la banda habitual de tus secuaces.</div><div>Con esa soldadesca sometes a los hombres y a los dioses.</div><div>Sin ese apoyo quedarías desnudo.</div><div>Gozosa desde lo alto del Olimpo, tu madre aplaudirá tu triunfo, y sobre tu cabeza derramará las rosas preparadas.</div><div>Mientras van matizando gemas tus alas, gemas tus cabellos, irás en áureo carro tú, que también en oro resplandeces.</div>", "gloss": "<div><b>deus, -ī, m.</b>: dios</div><div><b>hic, haec, hoc</b>: este, esta, esto</div><div><b>homō, -inis, m.</b>: ser humano</div><div><b>mīles, -itis, m.</b>: soldado</div><div><b>-que</b>: y (-que… -que: tanto… como)</div><div><b>superō, -ās, -āre, -āvī, -ātum</b>: vencer, superar</div><div><b>tū, tuī</b>: tú, vos</div>", "notes": "<div><b>El cortejo</b></div><div>¿Quiénes acompañan a Cupido y quiénes son sus prisioneros?</div><div>↔ <i>castris… Amoris</i> (v. 32) → 1.9.</div><ul><li>Personificaciones: <i>Mens Bona</i>, <i>Pudor</i>, <i>Blanditiae</i>, <i>Error</i>, <i>Furor</i>.</li><li><i>his militibus</i>: ablativo instrumental; <i>-que… -que</i>.</li><li><i>laeta… mater de summo Olympo… plaudet</i>: futuro.</li></ul>", "hl": {}, "fx": {"25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b"}, "ul": {"27": "r", "29": "r", "25": "r", "26": "r", "28": "r", "30": "r"}, "lk": {}}, {"id": "a1-2-43-52", "ref": "1.2.43-52", "lines": ["tum quoque non paucos, si te bene nouimus, ures;", "tum quoque praeteriens uulnera multa dabis.", "non possunt, licet ipse uelis, cessare sagittae;", "feruida uicino flamma uapore nocet.", "talis erat domita Bacchus Gangetide terra:", "tu grauis alitibus, tigribus ille fuit.", "ergo cum possim sacri pars esse triumphi,", "parce tuas in me perdere uictor opes.", "aspice cognati felicia Caesaris arma:", "qua uicit, uictos protegit ille manu."], "trans": "<div>Si te conozco bien, incluso entonces quemarás a no pocos, incluso entonces a tu paso irás abriendo heridas muchas.</div><div>Tus saetas no pueden reposar ni aunque tú quieras (también la ardiente llama abrasa con el halo que desprende).</div><div>Igual marchaba Baco al conquistar la tierra bañada por el Ganges: de ti tiran las aves, de él los tigres.</div><div>Así pues, ya que puedo participar en tu divino triunfo, no malgastes tus fuerzas conmigo, vencedor.</div><div>Fíjate en las felices armas de tu pariente César: él con su mano victoriosa protege a los vencidos.</div>", "gloss": "<div><b>āles, ālitis, m./f.</b>: ave; (aquí) las palomas</div><div><b>arma, -ōrum, n. pl.</b>: armas</div><div><b>aspiciō, -is, -ere, aspexī, aspectum</b>: mirar</div><div><b>Bacchus, -ī, m.</b>: Baco</div><div><b>bene</b>: bien</div><div><b>Caesar, -aris, m.</b>: César</div><div><b>cessō, -ās, -āre, -āvī, -ātum</b>: detenerse, cesar</div><div><b>cognātus, -a, -um</b>: pariente</div><div><b>domō, -ās, -āre, domuī, domitum</b>: domar, someter</div><div><b>ego, meī</b>: yo</div><div><b>fēlīx, -īcis</b>: afortunado, victorioso</div><div><b>Gangētis, -idis (adj. f.)</b>: del Ganges, de la India</div><div><b>grauis, -e (+ abl.)</b>: pesado; (aquí) imponente</div><div><b>ille, illa, illud</b>: aquel; él</div><div><b>in (prep. + acus.)</b>: contra, en</div><div><b>manus, -ūs, f.</b>: mano</div><div><b>nōn</b>: no</div><div><b>nōscō, -is, -ere, nōuī, nōtum (nōuimus: conocemos)</b>: conocer</div><div><b>ops, opis, f. (pl. recursos, fuerzas)</b>: ayuda</div><div><b>parcō, -is, -ere, pepercī, parsum (parce + inf.: no…)</b>: perdonar, ahorrar</div><div><b>paucī, -ae, -a</b>: pocos</div><div><b>perdō, -is, -ere, perdidī, perditum</b>: desperdiciar, perder</div><div><b>possum, potes, posse, potuī</b>: poder</div><div><b>prōtegō, -is, -ere, prōtēxī, prōtēctum</b>: proteger</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>quoque</b>: también</div><div><b>sagitta, -ae, f.</b>: flecha</div><div><b>sī</b>: si</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>tālis, -e</b>: tal</div><div><b>terra, -ae, f.</b>: tierra</div><div><b>tigris, -is, m./f.</b>: tigre</div><div><b>tū, tuī</b>: tú, vos</div><div><b>tum</b>: entonces</div><div><b>tuus, -a, -um</b>: tuyo</div><div><b>uictor, -ōris, m.</b>: vencedor</div><div><b>uincō, -is, -ere, uīcī, uictum (uictus: vencido)</b>: vencer</div><div><b>ūrō, -is, -ere, ussī, ustum</b>: quemar</div>", "notes": "<div><b>Cupido y Augusto</b></div><div>¿Elogio o ironía?</div><div>↔ <i>Aen.</i> 6.851-853 (<i>parcere subiectis et debellare superbos</i>); Prop. 2.16.41-42.</div><ul><li><i>ures</i>: futuro activo de <i>uro</i> (cf. <i>uror</i>, 1.1.26). <i>non paucos</i>: litotes. <i>nouimus</i>: perfecto con valor de presente.</li><li><i>licet ipse uelis</i>: <i>licet</i> concesivo («aunque tú mismo quieras»).</li><li>vv. 47-48: Baco; <i>domita Gangetide terra</i>, ablativo absoluto.</li><li><i>parce</i> + infinitivo = imperativo negativo. <i>Ordo</i>: <i>uictor, parce perdere tuas opes in me</i>.</li><li><i>Ordo</i>: <i>ille uictos protegit (ea) manu qua uicit</i>: antecedente incorporado y postergado.</li><li><i>cognati</i>: Augusto, pariente de Cupido por Venus; <i>felicia arma</i>, la <i>felicitas</i> augustal.</li><li>Libro 1 en paralelismo: el triunfo de Amor (1.2) se corresponde con la milicia del enamorado (1.9) (Von Albrecht).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "15": "b", "16": "b", "20": "b", "21": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b", "60": "b", "61": "b", "62": "b", "63": "b"}, "ul": {"51": "b", "52": "b", "35": "b", "36": "b", "56": "b", "59": "r", "38": "g", "7": "g", "32": "r", "31": "r", "29": "r", "30": "r", "58": "r", "60": "r", "61": "r", "62": "r", "63": "r"}, "lk": {}}, {"id": "a1-5-1-6", "ref": "1.5.1-6", "lines": ["Aestus erat mediamque dies exegerat horam;", "apposui medio membra leuanda toro.", "pars adaperta fuit, pars altera clausa fenestrae,", "quale fere siluae lumen habere solent,", "qualia sublucent fugiente crepuscula Phoebo", "aut ubi nox abiit nec tamen orta dies."], "trans": "<div>Hacía un calor ardiente y el día había mediado.</div><div>Tendí para aliviarlo en el lecho mi cuerpo.</div><div>De la ventana una hoja estaba abierta, la otra cerrada.</div><div>Aproximadamente como suelen tener la luz los bosques, como alumbra el ocaso tenue cuando huye Febo, o cuando se ha marchado la noche y sin embargo no ha nacido aún el día.</div>", "gloss": "<div><b>aestus, -ūs, m.</b>: calor, bochorno</div><div><b>sum, es, esse, fuī</b>: ser, haber</div>", "notes": "<div><b>La hora y la luz</b></div><div>¿Cómo es la luz que entra en el cuarto?</div><ul><li><i>Aestus erat</i>: el comienzo narrativo.</li><li>Tres símiles de la luz: <i>quale… lumen</i>, <i>qualia… crepuscula</i>, <i>aut ubi nox abiit</i>.</li><li><i>fugiente Phoebo</i>: ablativo absoluto.</li><li>Luz «cinematográfica», tempo lento (González Iglesias).</li><li>1.5 no se burla de sus intertextos: Propercio 2.15, Filodemo, la <i>candida diua</i> de Catulo 68; hay incluso una lectura de la siesta como sueño (Booth).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b"}, "ul": {"0": "r", "1": "r"}, "lk": {}}, {"id": "a1-5-7-16", "ref": "1.5.7-16", "lines": ["illa uerecundis lux est praebenda puellis,", "qua timidus latebras speret habere pudor.", "ecce, Corinna uenit tunica uelata recincta,", "candida diuidua colla tegente coma,", "qualiter in thalamos formosa Semiramis isse", "dicitur et multis Lais amata uiris.", "deripui tunicam; nec multum rara nocebat,", "pugnabat tunica sed tamen illa tegi,", "cumque ita pugnaret tamquam quae uincere nollet,", "uicta est non aegre proditione sua."], "trans": "<div>Esa luz ha de ofrecerse a las muchachas tímidas, de manera que espere hallar refugio por allí su vergüenza recatada.</div><div>He aquí que Corina se presenta por desceñida túnica velada, cubriendo su cabello dividido el blanco cuello, cual se cuenta que iba la hermosa Semíramis al tálamo, y cual Lais que fue amada por muchos.</div><div>Le arranqué la túnica —a pesar de que al ser fina no molestaba mucho.</div><div>Mas peleaba ella para cubrirse con la túnica.</div><div>Y, como peleara cual si no me quisiera vencer, vencida fue, sin disgusto entregándose ella misma.</div>", "gloss": "<div><b>candidus, -a, -um</b>: blanco, radiante</div><div><b>collum, -ī, n.</b>: cuello</div><div><b>coma, -ae, f.</b>: cabellera</div><div><b>Corinna, -ae, f.</b>: Corina</div><div><b>dēripiō, -is, -ere, dēripuī, dēreptum</b>: arrancar</div><div><b>dīuiduus, -a, -um</b>: dividido, partido</div><div><b>ecce</b>: ¡he aquí!, ¡mirá!</div><div><b>ille, illa, illud</b>: aquel, aquella</div><div><b>lūx, lūcis, f.</b>: luz</div><div><b>praebeō, -ēs, -ēre, praebuī, praebitum (praebenda est: debe ofrecerse)</b>: ofrecer</div><div><b>pudor, -ōris, m.</b>: pudor</div><div><b>puella, -ae, f.</b>: muchacha</div><div><b>recingō, -is, -ere, recīnxī, recīnctum (recīnctus: desceñido)</b>: desceñir</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>tegō, -is, -ere, tēxī, tēctum</b>: cubrir</div><div><b>tunica, -ae, f.</b>: túnica</div><div><b>uēlō, -ās, -āre, -āvī, -ātum (uēlātus: cubierto)</b>: cubrir, velar</div><div><b>ueniō, -īs, -īre, uēnī, uentum</b>: venir, llegar</div><div><b>uerēcundus, -a, -um</b>: pudoroso, recatado</div>", "notes": "<div><b>Corina</b></div><div>¿Qué se muestra y qué se oculta?</div><div>↔ <i>emodulanda</i> (1.1.30).</div><ul><li><i>Ordo</i>: <i>illa lux praebenda est puellis uerecundis</i>: gerundivo + <i>sum</i> = obligación.</li><li><i>puellis</i>: dativo regido por <i>praebeo</i> (¿o agente? discutir).</li><li><i>uelata recincta</i>: dos participios.</li><li><i>isse dicitur</i>: nominativo con infinitivo perfecto, como en 1.1.3-4. Semíramis y Lais.</li><li><i>deripui</i>: brusco paso a la acción.</li><li>v. 10 <i>tegente coma</i>: ablativo absoluto (banco).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "35": "b", "36": "b"}, "ul": {"2": "r", "11": "b", "35": "g", "0": "r", "1": "r", "3": "r", "4": "r", "5": "r", "21": "r", "22": "r"}, "lk": {}}, {"id": "a1-5-17-26", "ref": "1.5.17-26", "lines": ["ut stetit ante oculos posito uelamine nostros,", "in toto nusquam corpore menda fuit.", "quos umeros, quales uidi tetigique lacertos!", "forma papillarum quam fuit apta premi!", "quam castigato planus sub pectore uenter!", "quantum et quale latus! quam iuuenale femur!", "singula quid referam? nil non laudabile uidi,", "et nudam pressi corpus ad usque meum.", "cetera quis nescit? lassi requieuimus ambo.", "proueniant medii sic mihi saepe dies!"], "trans": "<div>Cuando quedó desnuda ante mis ojos ningún defecto había en su cuerpo todo.</div><div>¡Qué hombros, qué brazos vi y toqué!</div><div>¡La forma de los senos, qué apropiada para ser apretada en la caricia!</div><div>Bajo el pecho perfecto ¡qué vientre liso!</div><div>¡Qué extenso, qué precioso su costado!</div><div>¡Qué muslos juveniles!</div><div>¿Para qué ir parte a parte?</div><div>No vi nada que no fuera elogiable, y desnuda la apreté contra mi cuerpo.</div><div>¿Quién desconoce el resto?</div><div>Fatigados los dos nos entregamos al reposo.</div><div>¡Ojalá con frecuencia los mediodías así se me presenten!</div>", "gloss": "<div><b>ad usque (prep. + acus.)</b>: hasta</div><div><b>ambō, -ae, -ō</b>: ambos</div><div><b>ante (prep. + acus.)</b>: delante de</div><div><b>cēterus, -a, -um</b>: restante; (n. pl.) lo demás</div><div><b>corpus, -oris, n.</b>: cuerpo</div><div><b>et</b>: y</div><div><b>in (prep. + abl.)</b>: en</div><div><b>lassus, -a, -um</b>: cansado</div><div><b>laudābilis, -e</b>: digno de alabanza</div><div><b>menda, -ae, f.</b>: defecto</div><div><b>meus, -a, -um</b>: mío</div><div><b>nesciō, -īs, -īre, nescīuī</b>: no saber, ignorar</div><div><b>nīl (= nihil)</b>: nada</div><div><b>nōn</b>: no</div><div><b>noster, nostra, nostrum</b>: nuestro; (aquí) mío</div><div><b>nūdus, -a, -um</b>: desnudo</div><div><b>nusquam</b>: en ninguna parte</div><div><b>oculus, -ī, m.</b>: ojo</div><div><b>pōnō, -is, -ere, posuī, positum (positō: depuesto)</b>: poner; deponer</div><div><b>premō, -is, -ere, pressī, pressum</b>: apretar, estrechar</div><div><b>quis, quid (interrog.)</b>: ¿quién?, ¿qué?; (quid) ¿para qué?</div><div><b>referō, -fers, -ferre, rettulī, relātum</b>: referir, contar</div><div><b>requiēscō, -is, -ere, requiēuī, requiētum</b>: descansar</div><div><b>singulī, -ae, -a</b>: cada uno, uno por uno</div><div><b>stō, stās, stāre, stetī, statum</b>: estar de pie</div><div><b>sum, es, esse, fuī</b>: ser, haber</div><div><b>tōtus, -a, -um</b>: todo</div><div><b>uēlāmen, -inis, n.</b>: velo, vestido</div><div><b>uideō, -ēs, -ēre, uīdī, uīsum</b>: ver</div><div><b>ut (+ indic.)</b>: cuando, apenas</div>", "notes": "<div><b>Lo que no se dice</b></div><div>¿Dónde se corta el relato y por qué?</div><div>↔ 1.2.4 (<i>lassaque… ossa</i>); 1.2.26 (<i>stabis</i>).</div><ul><li><i>ut</i> temporal + indicativo; <i>posito uelamine</i>, ablativo absoluto encerrado en <i>oculos… nostros</i>.</li><li>vv. 19-22: <i>congeries</i> de exclamativos (<i>quos… quales… quam…</i>).</li><li><i>quid referam?</i>: subjuntivo deliberativo; <i>nil non</i>: litotes; <i>laudabile</i>, adjetivo en <i>-bilis</i>.</li><li><i>cetera quis nescit?</i>: aposiopesis y preterición.</li><li><i>medii… dies</i> cierra en anillo con <i>mediam… horam</i> (v. 1).</li><li><i>singula quid referam</i> pasa a la comedia elegíaca medieval <i>De tribus puellis</i> (Cristóbal).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b"}, "ul": {"48": "b", "10": "b", "5": "r", "1": "g", "56": "r", "44": "g", "12": "g", "47": "g", "4": "r", "55": "r", "57": "r"}, "lk": {}}, {"id": "a1-9-1-8", "ref": "1.9.1-8", "lines": ["Militat omnis amans, et habet sua castra Cupido;", "Attice, crede mihi, militat omnis amans.", "quae bello est habilis, Veneri quoque conuenit aetas:", "turpe senex miles, turpe senilis amor.", "quos petiere duces animos in milite forti,", "hos petit in socio bella puella uiro.", "peruigilant ambo, terra requiescit uterque:", "ille fores dominae seruat, at ille ducis."], "trans": "<div>Todo amante es soldado y Cupido posee sus ejércitos.</div><div>Ático, créeme, todo amante es soldado.</div><div>La edad que es propia para hacer la guerra también para el amor es la adecuada Una vergüenza es un soldado viejo.</div><div>Una vergüenza es un amor senil.</div><div>Los años que le piden los generales al soldado fuerte, se los pide a su amigo una bella doncella.</div><div>Ambos pasan la noche de guardia y los dos duermen en el suelo.</div><div>Vigila uno la puerta de su dueña, y el otro la de su general.</div>", "gloss": "<div><b>amāns, -antis, m.</b>: amante, enamorado</div><div><b>amor, -ōris, m.</b>: amor</div><div><b>animus, -ī, m.</b>: ánimo, espíritu</div><div><b>Atticus, -ī, m.</b>: Ático (destinatario del poema)</div><div><b>bellus, -a, -um</b>: lindo, bonito</div><div><b>castra, -ōrum, n. pl.</b>: campamento</div><div><b>crēdō, -is, -ere, crēdidī, crēditum (+ dat.)</b>: creer</div><div><b>Cupīdō, -inis, m.</b>: Cupido</div><div><b>dux, ducis, m.</b>: jefe, general</div><div><b>ego, meī</b>: yo</div><div><b>et</b>: y</div><div><b>fortis, -e</b>: valiente</div><div><b>habeō, -ēs, -ēre, habuī, habitum</b>: tener</div><div><b>hic, haec, hoc</b>: este</div><div><b>in (prep. + abl.)</b>: en</div><div><b>mīles, -itis, m.</b>: soldado</div><div><b>mīlitō, -ās, -āre, -āvī, -ātum</b>: ser soldado, militar</div><div><b>omnis, -e</b>: todo</div><div><b>petō, -is, -ere, petīuī, petītum (petiēre = petiērunt)</b>: buscar, pedir</div><div><b>puella, -ae, f.</b>: muchacha</div><div><b>quī, quae, quod</b>: que, el cual</div><div><b>senex, senis, m.</b>: viejo</div><div><b>senīlis, -e</b>: de viejo, senil</div><div><b>socius, -a, -um</b>: compañero, aliado</div><div><b>suus, -a, -um</b>: suyo, propio</div><div><b>turpis, -e (turpe: cosa fea, vergonzoso)</b>: feo, vergonzoso</div><div><b>uir, uirī, m.</b>: hombre, varón</div>", "notes": "<div><b><i>Militia amoris</i></b></div><div>¿En qué se parecen el soldado y el amante?</div><div>↔ <i>castris… Amoris</i> (1.2.32).</div><ul><li><i>militat omnis amans</i>: abre y cierra el primer dístico (epanadiplosis).</li><li><i>turpe</i>: neutro predicativo de adjetivo de dos terminaciones, «cosa vergonzosa (es)…»; elipsis de <i>est</i>.</li><li><i>habilis</i>, <i>senilis</i>: misma clase; <i>quae… aetas</i>, antecedente incorporado.</li><li>La <i>militia</i> de 1.9 no ridiculiza usos anteriores, que ya eran humorísticos (Booth).</li><li>Recepción: Castillejo parafrasea 1.9 en el <i>Sermón de amores</i>, quizá la primera traducción castellana de <i>Amores</i> (Cristóbal); Góngora, «Ciego que apuntas y atinas» (González Iglesias).</li><li>vv. 5-6 <i>quos… hos</i>: relativo y su correlativo (banco).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b"}, "ul": {"33": "b", "23": "b", "24": "b", "27": "b", "30": "b", "29": "g", "0": "r", "1": "r", "2": "r", "35": "r", "11": "r", "12": "r", "13": "r", "28": "r"}, "lk": {}}, {"id": "a1-9-9-18", "ref": "1.9.9-18", "lines": ["militis oﬀicium longa est uia; mitte puellam,", "strenuus exempto fine sequetur amans;", "ibit in aduersos montes duplicataque nimbo", "flumina, congestas exteret ille niues,", "nec freta pressurus tumidos causabitur Euros", "aptaue uerrendis sidera quaeret aquis.", "quis, nisi uel miles uel amans, et frigora noctis", "et denso mixtas perferet imbre niues?", "mittitur infestos alter speculator in hostes,", "in riuale oculos alter, ut hoste, tenet."], "trans": "<div>La tarea del soldado es el largo camino.</div><div>Haz que se vaya lejos la muchacha, y hasta el confín del mundo la seguirá su amante valeroso.</div><div>Irá contra los montes que le impiden pasar, contra los ríos de caudal redoblado por las lluvias, y aplastará la nieve amontonada.</div><div>Si va a cruzar los mares, no pondrá por pretexto los Euros sopladores, ni exigirá que haya astros favorables para surcar las aguas.</div><div>¿Quién sino un soldado o un amante arrostrará los fríos de la noche y las nieves mezcladas con tupido aguacero?</div><div>Al primero lo mandan a espiar a los encarnizados enemigos.</div><div>El otro en su rival tiene clavados los ojos, cual si fuese un enemigo.</div>", "gloss": "<div><b>alter, -era, -erum</b>: el uno, el otro (alter… alter)</div><div><b>hostis, -is, m.</b>: enemigo</div><div><b>in (prep. + abl.)</b>: en, sobre</div><div><b>in (prep. + acus.)</b>: contra</div><div><b>īnfestus, -a, -um</b>: hostil, encarnizado</div><div><b>mittō, -is, -ere, mīsī, missum</b>: enviar</div><div><b>oculus, -ī, m.</b>: ojo</div><div><b>riuālis, -is, m.</b>: rival</div><div><b>speculātor, -ōris, m.</b>: espía, explorador</div><div><b>teneō, -ēs, -ēre, tenuī, tentum</b>: tener, mantener</div><div><b>ut</b>: como</div>", "notes": "<div><b>Las penurias</b></div><div>¿Qué soportan los dos?</div><div>↔ Catulo 11 (los confines del mundo).</div><ul><li>Montes, ríos, nieves, mares: la serie de lugares recónditos.</li><li><i>mittitur</i>: voz pasiva. <i>Ordo</i>: <i>alter mittitur speculator in infestos hostes</i>; <i>speculator</i>, predicativo subjetivo.</li><li>v. 18 <i>ut hoste</i>: <i>ut</i> = «como».</li><li>v. 17 <i>mittitur</i> frente a <i>tenet</i>: pasiva y activa en el mismo dístico; <i>speculator</i>, predicativo subjetivo (banco).</li></ul>", "hl": {}, "fx": {"49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b", "60": "b", "61": "b"}, "ul": {"56": "b", "60": "b", "54": "b", "49": "r", "52": "r", "61": "r"}, "lk": {}}, {"id": "a1-9-19-28", "ref": "1.9.19-28", "lines": ["ille graues urbes, hic durae limen amicae", "obsidet; hic portas frangit, at ille fores.", "saepe soporatos inuadere profuit hostes", "caedere et armata uulgus inerme manu;", "sic fera Threicii ceciderunt agmina Rhesi", "et dominum capti deseruistis equi.", "nempe maritorum somnis utuntur amantes", "et sua sopitis hostibus arma mouent.", "custodum transire manus uigilumque cateruas", "militis et miseri semper amantis opus."], "trans": "<div>Éste asedia difíciles ciudades.</div><div>El umbral de su dura amiga aquél.</div><div>Uno derriba puertas de murallas como el otro de casas.</div><div>Muchas veces ha sido provechoso atacar a enemigos cuando duermen, y matar con las armas en la mano al tropel desarmado.</div><div>Así cayeron las tropas feroces del tracio Reso, y dejasteis, caballos, de servir a vuestro amo cuando fue apresado.</div><div>Muchas veces se sirven los amantes del sueño en el que se hallan los maridos, y, mientras esos enemigos duermen, ellos moviendo están sus propias armas.</div><div>Traspasar puestos de los centinelas y bandas de guardianes, es trabajo del soldado y del siempre triste amante.</div>", "gloss": "<div><b>agmen, -inis, n.</b>: tropa, columna</div><div><b>amīca, -ae, f.</b>: amiga, amada</div><div><b>at</b>: pero, en cambio</div><div><b>cadō, -is, -ere, cecidī, cāsum</b>: caer, morir</div><div><b>capiō, -is, -ere, cēpī, captum (captī: capturados)</b>: tomar, capturar</div><div><b>dēserō, -is, -ere, dēseruī, dēsertum</b>: abandonar</div><div><b>dominus, -ī, m.</b>: amo, dueño</div><div><b>dūrus, -a, -um</b>: duro, inflexible</div><div><b>equus, -ī, m.</b>: caballo</div><div><b>et</b>: y</div><div><b>ferus, -a, -um</b>: fiero</div><div><b>foris, -is, f. (pl. forēs)</b>: puerta (de la casa)</div><div><b>frangō, -is, -ere, frēgī, frāctum</b>: romper</div><div><b>grauis, -e</b>: pesado; (aquí) poderoso, fuerte</div><div><b>hic, haec, hoc</b>: este; (ille… hic) el uno… el otro</div><div><b>ille, illa, illud</b>: aquel; (ille… hic) el uno… el otro</div><div><b>līmen, -inis, n.</b>: umbral</div><div><b>obsideō, -ēs, -ēre, obsēdī, obsessum</b>: sitiar, asediar</div><div><b>porta, -ae, f.</b>: puerta (de la ciudad)</div><div><b>Rhēsus, -ī, m.</b>: Reso (rey tracio)</div><div><b>sīc</b>: así</div><div><b>Thrēicius, -a, -um</b>: tracio</div><div><b>urbs, urbis, f.</b>: ciudad</div>", "notes": "<div><b><i>Hic</i> e <i>ille</i></b></div><div>¿Quién es <i>ille</i> y quién <i>hic</i> en cada verso?</div><ul><li>v. 19: <i>ille</i>, el soldado (<i>graues urbes</i>); <i>hic</i>, el amante (<i>limen amicae</i>).</li><li>v. 20: <i>portas</i> (de la ciudad) / <i>fores</i> (de la casa): las referencias se invierten en quiasmo.</li><li><i>obsidet</i>, en encabalgamiento, común a los dos sujetos.</li><li>v. 23: Reso, ejemplo épico del ataque nocturno.</li><li>v. 24 <i>capti</i>: participio concertado; <i>deseruistis</i>, apóstrofe a los caballos.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b"}, "ul": {"9": "b", "2": "r", "29": "b", "5": "r", "34": "g", "28": "g", "0": "r", "1": "r", "3": "r", "4": "r", "6": "r", "7": "r", "33": "r"}, "lk": {}}, {"id": "a1-9-29-38", "ref": "1.9.29-38", "lines": ["Mars dubius, nec certa Venus: uictique resurgunt,", "quosque neges umquam posse iacere, cadunt.", "ergo desidiam quicumque uocabat amorem,", "desinat: ingenii est experientis amor.", "ardet in abducta Briseide maestus Achilles;", "dum licet, Argeas frangite, Troes, opes;", "Hector ab Andromaches complexibus ibat ad arma,", "et, galeam capiti quae daret, uxor erat;", "summa ducum, Atrides uisa Priameide fertur", "Maenadis effusis obstipuisse comis."], "trans": "<div>Marte es dudoso y Venus no es segura.</div><div>Se alzan los vencidos y, en cambio, caen los que parecía que nunca acabarían abatidos.</div><div>Así que, el que al amor lo llamaba pereza, que abandone.</div><div>Propio de alguien que emprende es el amor.</div><div>El apenado Aquiles se abrasa por Briseida, que le ha sido arrebatada: mientras es posible troyanos, destrozad al ejército argivo.</div><div>Del abrazo de Andrómaca a las armas marchaba Héctor y su esposa era quien le ponía el casco en la cabeza.</div><div>Del general en jefe, del Atrida, cuéntase que aturdido se quedó al contemplar a la hija de Príamo con el alborotado cabello de una Ménade.</div>", "gloss": "<div><b>abdūcō, -is, -ere, abdūxī, abductum</b>: llevarse, arrebatar</div><div><b>Achillēs, -is, m.</b>: Aquiles</div><div><b>amor, -ōris, m.</b>: amor</div><div><b>ārdeō, -ēs, -ēre, ārsī, ārsum</b>: arder</div><div><b>Argēus, -a, -um</b>: argivo, griego</div><div><b>Brīsēis, -idis, f.</b>: Briseida</div><div><b>certus, -a, -um</b>: cierto, seguro</div><div><b>dēsidia, -ae, f.</b>: pereza, ocio</div><div><b>dēsinō, -is, -ere, dēsiī, dēsitum</b>: dejar de (hacerlo), desistir</div><div><b>dubius, -a, -um</b>: dudoso, incierto</div><div><b>dum</b>: mientras</div><div><b>ergō</b>: por lo tanto</div><div><b>experiēns, -entis</b>: activo, emprendedor</div><div><b>frangō, -is, -ere, frēgī, frāctum</b>: romper, quebrar</div><div><b>in (prep. + abl.)</b>: por (causa)</div><div><b>ingenium, -iī, n.</b>: ingenio, carácter</div><div><b>licet, licēre, licuit</b>: es lícito, se puede</div><div><b>maestus, -a, -um</b>: triste</div><div><b>Mārs, Mārtis, m.</b>: Marte; (aquí) la guerra</div><div><b>nec</b>: y no, ni</div><div><b>ops, opis, f. (pl. recursos, poder)</b>: ayuda</div><div><b>quīcumque, quaecumque, quodcumque</b>: quienquiera que</div><div><b>sum, es, esse, fuī (+ gen.: es propio de)</b>: ser</div><div><b>Trōs, Trōis, m. (pl. Trōes)</b>: troyano</div><div><b>uocō, -ās, -āre, -āvī, -ātum</b>: llamar</div><div><b>Venus, -eris, f.</b>: Venus; (aquí) el amor</div>", "notes": "<div><b><i>Ingenii est experientis amor</i></b></div><div>¿Qué reproche moral invierte la sentencia?</div><div>↔ Safo fr. 44 (Héctor y Andrómaca) y fr. 16.</div><ul><li><i>Mars dubius, nec certa Venus</i>: elipsis de <i>est</i>; quiasmo.</li><li><i>uocabat desidiam amorem</i>: doble acusativo (<i>desidiam</i>, predicativo objetivo).</li><li><i>desinat</i>: subjuntivo yusivo. <i>quicumque</i>: relativo indefinido.</li><li><i>ingenii est experientis</i>: genitivo predicativo (de cualidad).</li><li><i>exempla</i> épicos: Aquiles, Héctor, Agamenón. <i>fertur obstipuisse</i>: nominativo con infinitivo perfecto.</li><li>El amor, y con él la escritura amorosa, es «propio de un talento activo» (Sala).</li><li>v. 33 <i>in abducta Briseide</i>: participio concertado; <i>frangite</i>, imperativo.</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b"}, "ul": {"0": "b", "17": "b", "33": "b", "4": "b", "22": "r", "28": "b", "18": "g", "32": "r", "19": "r", "20": "r", "21": "r", "25": "r", "26": "r"}, "lk": {}}, {"id": "a1-9-39-46", "ref": "1.9.39-46", "lines": ["Mars quoque deprensus fabrilia uincula sensit;", "notior in caelo fabula nulla fuit.", "ipse ego segnis eram discinctaque in otia natus;", "mollierant animos lectus et umbra meos;", "impulit ignauum formosae cura puellae,", "iussit et in castris aera merere suis.", "inde uides agilem nocturnaque bella gerentem:", "qui nolet fieri desidiosus, amet!"], "trans": "<div>Marte incluso, apresado, padeció las cadenas del herrero y en el cielo no hubo habladuría más célebre.</div><div>Yo mismo era perezoso y dado al ocio relajado.</div><div>La penumbra y el lecho habían ablandado mi ánimo.</div><div>Mas la atención a una muchacha hermosa me impulsó a salir de mi indolencia y me ordenó servir en sus ejércitos.</div><div>Desde entonces ya ves que estoy ágil y lucho en batallas nocturnas.</div><div>El que no quiera hacerse un vago ¡que ame!</div>", "gloss": "<div><b>caelum, -ī, n.</b>: cielo</div><div><b>dēprehendō, -is, -ere, dēprehendī, dēprehēnsum</b>: sorprender, atrapar</div><div><b>fabrīlis, -e</b>: de herrero</div><div><b>fābula, -ae, f.</b>: historia, relato</div><div><b>in (prep. + abl.)</b>: en</div><div><b>Mārs, Mārtis, m.</b>: Marte</div><div><b>nōtus, -a, -um (comp. nōtior)</b>: conocido</div><div><b>nūllus, -a, -um</b>: ninguno</div><div><b>quoque</b>: también</div><div><b>sentiō, -īs, -īre, sēnsī, sēnsum</b>: sentir</div><div><b>sum, es, esse, fuī</b>: ser</div><div><b>uinculum, -ī, n.</b>: cadena, lazo</div>", "notes": "<div><b>Marte atrapado y el cierre</b></div><div>¿Qué cuenta el poeta de sí mismo?</div><div>↔ <i>Od.</i> 8.266-366 (Demódoco).</div><ul><li><i>nulla fabula notior fuit</i>: comparativo con término negativo (sentido de superlativo).</li><li><i>segnis</i> (v. 41) / <i>agilem</i> (v. 45); <i>desidiam</i> (v. 31) / <i>desidiosus</i> (v. 46).</li><li><i>in castris… suis</i> (v. 44) / <i>habet sua castra Cupido</i> (v. 1).</li><li>El poeta <i>ignauus</i>, empujado por una muchacha a «ganar la soldada» en los cuarteles de Amor (Sala).</li><li>v. 39 <i>deprensus</i>: participio concertado (Marte «sorprendido»).</li></ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b"}, "ul": {"8": "b", "0": "b", "11": "g", "5": "g", "2": "r"}, "lk": {}}, {"id": "a1-11-1-8", "ref": "1.11.1-8", "lines": ["Colligere incertos et in ordine ponere crines", "docta neque ancillas inter habenda Nape", "inque ministeriis furtiuae cognita noctis", "utilis et dandis ingeniosa notis,", "saepe uenire ad me dubitantem hortata Corinnam,", "saepe laboranti fida reperta mihi,", "accipe et ad dominam peraratas mane tabellas", "perfer et obstantes sedula pelle moras."], "trans": "<div>Experta en recoger y en arreglar los cabellos que están alborotados, Nape, que no has de ser contada entre las siervas, y que por tus servicios a mis noches furtivas ya me eres conocida, eficaz e ingeniosa transmitiendo mensajes, tú, que has conseguido muchas veces que viniera Corina, cuando dudaba, a mí, y que me has demostrado tu lealtad muchas veces, cuando he estado en apuros, coge ahora estas tablillas que le he escrito.</div><div>Dáselas de mañana a tu señora, y salva con presteza los obstáculos que puedan demorarte.</div>", "gloss": "<div><b>accipiō, -is, -ere, accēpī, acceptum</b>: recibir, tomar</div><div><b>ad (prep. + acus.)</b>: hacia, a</div><div><b>domina, -ae, f.</b>: señora, amada</div><div><b>et</b>: y</div><div><b>māne (adv.)</b>: por la mañana</div><div><b>mora, -ae, f.</b>: demora</div><div><b>obstō, -ās, -āre, obstitī (obstāns: que obstaculiza)</b>: obstaculizar</div><div><b>pellō, -is, -ere, pepulī, pulsum</b>: echar, apartar</div><div><b>perarō, -ās, -āre, -āvī, -ātum (perarātus: escrito)</b>: surcar; escribir (sobre cera)</div><div><b>perferō, -fers, -ferre, -tulī, -lātum</b>: llevar hasta el final, entregar</div><div><b>sēdulus, -a, -um</b>: diligente, solícito</div><div><b>tabella, -ae, f.</b>: tablilla (de escribir)</div>", "notes": "<div><b>Las tablillas</b></div><div>¿Qué le pide el poeta a Nape?</div><ul><li><i>peraratas tabellas</i> (perfecto) / <i>obstantes moras</i> (presente): dos participios concertados; la traducción los vuelve relativas.</li><li><i>accipe, perfer, pelle</i>: imperativos.</li><li>Corina «no tiene rostro ni personalidad» y su situación cambia de poema en poema (Booth).</li></ul>", "hl": {}, "fx": {"35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b"}, "ul": {"41": "r", "44": "r", "47": "r", "39": "r"}, "lk": {}}, {"id": "a1-11-9-18", "ref": "1.11.9-18", "lines": ["nec silicum uenae nec durum in pectore ferrum", "nec tibi simplicitas ordine maior adest;", "credibile est et te sensisse Cupidinis arcus;", "in me militiae signa tuere tuae.", "si quaeret quid agam, spe noctis uiuere dices;", "cetera fert blanda cera notata manu.", "dum loquor, hora fugit; uacuae bene redde tabellas,", "uerum continuo fac tamen illa legat.", "aspicias oculos mando frontemque legentis:", "et tacito uultu scire futura licet."], "trans": "<div>Tus venas no están hechas de piedra, y en el pecho no tienes corazón de hierro duro ni más ingenuidad de la debida.</div><div>Lo esperable es que tú también hayas probado el arco de Cupido: defiende en mí la enseña de tu ejército.</div><div>Si te pregunta cómo estoy, dirás que vivo en la esperanza de una noche.</div><div>Lo demás va en la blanda cera escrito por mi mano.</div><div>Mientras estoy hablando, escapa el tiempo.</div><div>Dale las tablillas cuando no esté ocupada, en buen momento.</div><div>Mas logra que las lea inmediatamente.</div><div>Fíjate, te lo ruego, mientras lee, en sus ojos y en su frente.</div><div>Por los datos de un rostro silencioso puede saberse lo que va a pasar.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a1-11-19-28", "ref": "1.11.19-28", "lines": ["nec mora, perlectis rescribat multa iubeto;", "odi, cum late splendida cera uacat.", "comprimat ordinibus uersus, oculosque moretur", "margine in extremo littera †rasa† meos.", "quid digitos opus est graphium lassare tenendo?", "hoc habeat scriptum tota tabella ‘VENI’.", "non ego uictrices lauro redimire tabellas", "nec Veneris media ponere in aede morer;", "subscribam VENERI FIDAS SIBI NASO MINISTRAS", "DEDICAT. AT NVPER VILE FVISTIS ACER."], "trans": "<div>Y, en cuanto de leer haya acabado, logra que escriba una respuesta larga.</div><div>(Odio la cera en blanco, extensa y reluciente).</div><div>Que apriete los renglones, que una letra borrosa entretenga mis ojos en el borde del margen.</div><div>Mas ¿qué necesidad tienen sus dedos sosteniendo el estilo, de cansarse?</div><div>Que en toda la tablilla sólo ponga «ven».</div><div>Yo no tardaré en coronar con laurel mis tablillas vencedoras, y en colgarlas en medio del santuario de Venus.</div><div>Les pondré esta inscripción: «A VENUS LE DEDICA NASÓN ESTAS SUS FIELES SERVIDORAS.</div><div>VOSOTRAS, QUE HACE NADA ERAIS SÓLO VIL ACEBO».</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a1-12-1-10", "ref": "1.12.1-10", "lines": ["Flete meos casus: tristes rediere tabellae;", "infelix hodie littera posse negat.", "omina sunt aliquid: modo cum discedere uellet,", "ad limen digitos restitit icta Nape.", "missa foras iterum limen transire memento", "cautius atque alte sobria ferre pedem.", "ite hinc, diﬀiciles, funebria ligna, tabellae,", "tuque, negaturis cera referta notis,", "quam, puto, de longae collectam flore cicutae", "melle sub infami Corsica misit apis."], "trans": "<div>Llorad mi mala suerte: tristes han regresado mis tablillas.</div><div>La infausta carta dice que hoy no puede.</div><div>Algún sentido tienen los presagios: cuando se disponía Nape a salir hace un instante, se detuvo, porque los dedos se golpeó contra el umbral.</div><div>Cuando otra vez te manden salir, acuérdate de cruzar el umbral con más cuidado y, prestando atención, de alzar el pie.</div><div>Alejaos, incómodas tablillas, maderas fúnebres, y tú también cera llena de signos negadores, recogida —seguro— de la flor de alta cicuta por la abeja corsa que bajo su miel pésima te puso.</div>", "gloss": "", "notes": "<div><b>Las tablillas, malditas</b></div><div>¿Por qué el poeta se ensaña con las tablillas?</div><div>↔ 1.11 (la ida).</div><ul><li>Díptico con 1.11: el mismo objeto, de la esperanza al fracaso.</li><li>Góngora, <i>Polifemo</i> v. 39: posible eco de 1.12.19-20, como hipótesis frente a la fuente senequista de Dámaso Alonso (González Iglesias).</li></ul>", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a1-12-11-20", "ref": "1.12.11-20", "lines": ["at tamquam minio penitus medicata rubebas;", "ille color uere sanguinulentus erat.", "proiectae triuiis iaceatis, inutile lignum,", "uosque rotae frangat praetereuntis onus.", "illum etiam, qui uos ex arbore uertit in usum,", "conuincam puras non habuisse manus.", "praebuit illa arbor misero suspendia collo,", "carnifici duras praebuit illa cruces;", "illa dedit turpes raucis bubonibus umbras,", "uulturis in ramis et strigis oua tulit."], "trans": "<div>Roja estabas igual que si te hubieran con bermellón teñido intensamente: tu color ciertamente era de sangre.</div><div>Ojalá que en el suelo os veáis tiradas allá donde se cruzan tres caminos, leño inútil, y el peso de una rueda os quebrante pasando por encima.</div><div>Incluso probaré que el que os cortó del árbol para daros un uso, no tenía las manos puras.</div><div>Proporcionó aquel árbol los soportes para colgar un cuello infortunado, proporcionó al verdugo horribles cruces, infames sombras dio a los roncos búhos, y los huevos del buitre y el vampiro en sus ramas sostuvo.</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "a1-12-21-30", "ref": "1.12.21-30", "lines": ["his ego commisi nostros insanus amores", "molliaque ad dominam uerba ferenda dedi!", "aptius hae capiant uadimonia garrula cerae,", "quas aliquis duro cognitor ore legat;", "inter ephemeridas melius tabulasque iacerent,", "in quibus absumptas fleret auarus opes.", "ergo ego uos rebus duplices pro nomine sensi;", "auspicii numerus non erat ipse boni.", "quid precer iratus, nisi uos cariosa senectus", "rodat, et immundo cera sit alba situ?"], "trans": "<div>Y a éstas, loco de mí, les confié mis amores, y les di mis palabras de cariño, para que las llevaran a mi dueña.</div><div>Esta cera mejor acogería citaciones a juicio farragosas, que leería algún juez con voz severa.</div><div>Estarían mejor tiradas entre esos libros de cuentas y registros donde llora el avaro sus riquezas perdidas.</div><div>En consecuencia, yo me he dado cuenta de que sois, de acuerdo con vuestro nombre, dobles.</div><div>Ni el propio número era un buen auspicio.</div><div>¿Qué pediré, furioso como estoy, sino que os corroa carcomida vejez y que esté blanca por el inmundo moho vuestra cera?</div>", "gloss": "", "notes": "", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id
