<!doctype html>
<html lang="es"><head><meta charset="utf-8">

<title>Eneida XI y XII · Pantallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap">
<style>
  :root{--f-body:'Bitter',Georgia,serif; --f-lat:'Bitter',Georgia,serif; --f-label:'Bitter',Georgia,serif; --label-w:600;}
  *{box-sizing:border-box;} [hidden]{display:none!important;}
  html,body{margin:0;} body{font-family:var(--f-body);}
  button,select{font:inherit;}
  .rlive{color:var(--rsoft);}
  .l{display:flex; gap:.5em; align-items:baseline;}
  .vn{font-style:normal; font-family:var(--f-label); font-weight:var(--label-w); font-size:.5em; color:var(--soft); width:2.4em; flex:none; text-align:right; letter-spacing:.03em; font-variant-numeric:tabular-nums;}
  .lt{flex:1; min-width:0;}
  .w{border-radius:.15em; padding:0 .06em; margin:0 -.06em;}
  body.brush .w{cursor:pointer;}
  body.brush .w:hover{outline:2px dashed var(--line); outline-offset:1px;}
  .c-y{background:var(--mk-y); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-y-e);}
  .c-r{background:var(--mk-r); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-r-e);}
  .c-b{background:var(--mk-b); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-b-e);}
  .c-g{background:var(--mk-g); color:var(--mk-ink); box-shadow:inset 0 -.14em 0 var(--mk-g-e);}
  mark{border-radius:.15em; padding:0 .05em;}
  .body a,.w.lk{color:inherit; text-decoration-line:underline; text-decoration-color:var(--accent); text-decoration-thickness:.09em; text-underline-offset:.16em; cursor:pointer;}
  .body s,.body strike,.body del,.w.fs{text-decoration-line:line-through; text-decoration-thickness:.07em;}
  .w.lk.fs{text-decoration-line:underline line-through;}
  .body u,.w.u{text-decoration-line:underline; text-decoration-thickness:.09em; text-underline-offset:.2em; text-decoration-skip-ink:none;}
  .w.u.fs{text-decoration-line:underline line-through;}
  .u-y{text-decoration-color:var(--ul-y)!important;} .u-r{text-decoration-color:var(--ul-r)!important;} .u-b{text-decoration-color:var(--ul-b)!important;}
  .u-g{text-decoration-color:var(--ul-g)!important;} .u-k{text-decoration-color:var(--ul-k)!important;}
  .us-double{text-decoration-style:double; text-decoration-thickness:.07em;} .us-wavy{text-decoration-style:wavy; text-decoration-thickness:.06em;} .us-dotted{text-decoration-style:dotted; text-decoration-thickness:.12em;}
  .body b,.body strong,.w.fb{font-weight:700;}

  body.lector{
    --rbg:#FFFEFB; --rsurface:#F4EFE5; --rink:#2A2016; --rsoft:#5C4F3B; --rline:#DDD3C0; --raccent:#B32F2F; --raccent-ink:#FFFFFF;
    --rlive:#2E7D32; --rfree:#A15C00; --roff:#7A6E5C;
    --mk-y:#FFC000; --mk-r:#FF5E4D; --mk-b:#4F8DFF; --mk-g:#2FBF4F; --mk-ink:#2A2016;
    --mk-y-e:#B07F00; --mk-r-e:#B8231A; --mk-b-e:#1A4FC4; --mk-g-e:#137A2E;
    --ul-y:#E0A800; --ul-r:#E0342A; --ul-b:#1F5FE0; --ul-g:#1E9E3A; --ul-k:#2A2016; --accent:#B32F2F;
    background:var(--rbg); color:var(--rink); color-scheme:light;
  }
  body.lector[data-rtheme="dark"]{
    --rbg:#121110; --rsurface:#1F1D1A; --rink:#F3EFE8; --rsoft:#BDB5A8; --rline:#3D3833; --raccent:#FFD54A; --raccent-ink:#000000;
    --rlive:#5BD86B; --rfree:#FFB547; --roff:#9C948A;
    --mk-y:#FFE000; --mk-r:#FF6E5E; --mk-b:#6CB4FF; --mk-g:#4BE36B; --mk-ink:#000000;
    --mk-y-e:transparent; --mk-r-e:transparent; --mk-b-e:transparent; --mk-g-e:transparent;
    --ul-y:#FFE000; --ul-r:#FF6E5E; --ul-b:#6CB4FF; --ul-g:#4BE36B; --ul-k:#F3EFE8; --accent:#FFD54A;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:dark){
    body.lector:not([data-rtheme="light"]){
      --rbg:#121110; --rsurface:#1F1D1A; --rink:#F3EFE8; --rsoft:#BDB5A8; --rline:#3D3833; --raccent:#FFD54A; --raccent-ink:#000000;
      --rlive:#5BD86B; --rfree:#FFB547; --roff:#9C948A;
      --mk-y:#FFE000; --mk-r:#FF6E5E; --mk-b:#6CB4FF; --mk-g:#4BE36B; --mk-ink:#000000;
      --mk-y-e:transparent; --mk-r-e:transparent; --mk-b-e:transparent; --mk-g-e:transparent;
      --ul-y:#FFE000; --ul-r:#FF6E5E; --ul-b:#6CB4FF; --ul-g:#4BE36B; --ul-k:#F3EFE8; --accent:#FFD54A;
      color-scheme:dark;
    }
  }
  #lector{min-height:100dvh; display:flex; flex-direction:column; background:var(--rbg); color:var(--rink); font-family:var(--f-body); -webkit-text-size-adjust:100%;}
  #lector button{font-family:var(--f-body); cursor:pointer; -webkit-tap-highlight-color:transparent;}
  #lector button:focus-visible,#lector select:focus-visible{outline:3px solid var(--raccent); outline-offset:2px;}
  .rtop{position:sticky; top:0; z-index:5; background:var(--rbg); border-bottom:1px solid var(--rline); padding:8px 16px 8px;}
  .rrow{display:flex; align-items:center; gap:10px; min-width:0;}
  .rclase{flex:1; min-width:0; font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rref{flex:none; font-weight:600; font-size:17px; background:var(--rsurface); color:var(--rink); border:1px solid var(--rline); border-radius:20px; padding:6px 14px; min-height:42px; font-variant-numeric:tabular-nums;}
  .rsub{margin-top:6px; font-size:13px; color:var(--rsoft);}
  .rlive{display:flex; align-items:center; gap:7px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rlive i{width:9px; height:9px; border-radius:50%; background:var(--roff); flex:none;}
  .rlive[data-s="live"] i{background:var(--rlive); box-shadow:0 0 0 3px color-mix(in srgb, var(--rlive) 28%, transparent);}
  .rlive[data-s="free"] i{background:var(--rfree);}
  .rpos{font-variant-numeric:tabular-nums; flex:none;}
  .rtools{display:flex; gap:4px; flex:none;}
  .rtools button{font-weight:600; font-size:14px; min-width:40px; height:36px; padding:0 8px; border-radius:18px; border:1px solid var(--rline); background:transparent; color:var(--rink);}
  .rnote{display:flex; align-items:center; gap:10px; margin-top:8px; padding:8px 10px; background:var(--rsurface); border-left:3px solid var(--rfree); font-size:14px; line-height:1.35;}
  .rnote button{margin-left:auto; flex:none; font-weight:600; font-size:14px; min-height:40px; padding:0 14px; border-radius:20px; border:none; background:var(--raccent); color:var(--raccent-ink);}
  .rmain{flex:1; width:100%; max-width:1100px; margin:0 auto; padding:18px 16px calc(100px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:22px;}
  .rlat{font-size:var(--rfs,21px); line-height:1.55; max-width:calc(21em + 2.6em); overflow-wrap:break-word;}
  .rlat .l{gap:.45em;}
  .rlat .vn{font-family:var(--f-body); font-weight:600; font-size:.55em; width:2.3em; color:var(--rsoft); letter-spacing:0;}
  .rlat .lt{padding-left:1.2em; text-indent:-1.2em;}
  .rpanel{border-top:1px solid var(--rline);}
  .rtabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;}
  .rtabs::-webkit-scrollbar{display:none;}
  .rtabs button{flex:none; font-weight:600; font-size:15px; background:none; border:none; border-bottom:3px solid transparent; color:var(--rsoft); padding:10px 12px; min-height:46px; max-width:75vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rtabs button[aria-selected="true"]{color:var(--rink); border-bottom-color:var(--raccent);}
  .rtab{font-size:17px; line-height:1.55; padding:12px 2px; overflow-wrap:break-word;}
  .rtab ul,.rtab ol{margin:0; padding-left:1.2em;} .rtab li{margin:.3em 0;} .rtab li::marker{color:var(--raccent);}
  .rtab p,.rtab div{margin:0;}
  .rtab .rg{padding:.4em 0; border-bottom:1px solid var(--rline);} .rtab .rg:last-child{border-bottom:none;}
  .rtab b,.rtab strong{font-weight:700;}
  .rtab a{color:inherit; text-decoration-line:underline; text-decoration-color:var(--raccent); text-underline-offset:.16em;}
  .rtab u{text-decoration-thickness:.09em; text-underline-offset:.2em; text-decoration-skip-ink:none;}
  .rtab s,.rtab strike,.rtab del{text-decoration-thickness:.07em;}
  .rmsg{padding:56px 16px; text-align:center; font-size:17px; line-height:1.5; color:var(--rsoft); max-width:460px; margin:0 auto;}
  .rnav{position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; gap:10px; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--rbg); border-top:1px solid var(--rline);}
  .rnav button{flex:1; min-height:52px; font-weight:600; font-size:17px; border-radius:26px; border:1px solid var(--rline); background:var(--rsurface); color:var(--rink);}
  .rnav #rNext{background:var(--raccent); color:var(--raccent-ink); border-color:var(--raccent);}
  .rnav button:disabled{opacity:.4; cursor:default;}
  .rsheet{position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center;}
  .rsheet-in{background:var(--rbg); color:var(--rink); width:100%; max-width:640px; max-height:82dvh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));}
  .rsheet-head{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px;}
  .rsheet-head .rlbl{margin:0; font-size:13px; color:var(--rsoft); width:100%;}
  .rsheet-head select{flex:1; min-width:0; font:16px var(--f-body); padding:8px; min-height:44px; background:var(--rsurface); color:var(--rink); border:1px solid var(--rline); border-radius:8px;}
  .rsheet-head button{font-weight:600; font-size:15px; min-height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--rline); background:transparent; color:var(--rink); margin-left:auto;}
  #rList{list-style:none; margin:0; padding:0;}
  #rList button{width:100%; text-align:left; display:flex; gap:10px; align-items:baseline; padding:12px 10px; min-height:50px; background:none; border:none; border-left:4px solid transparent; color:var(--rink); font-size:16px;}
  #rList button .rr{font-weight:600; flex:none; font-variant-numeric:tabular-nums;}
  #rList button .rw{color:var(--rsoft); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; min-width:0;}
  #rList button[aria-current="true"]{border-left-color:var(--raccent); background:var(--rsurface);}
  @media (min-width:701px){
    .rmain{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); align-items:start; gap:36px; padding-top:24px;}
    .rpanel{border-top:none; border-left:1px solid var(--rline); padding-left:24px; position:sticky; top:110px; max-height:calc(100dvh - 210px); overflow:auto;}
    .rnav{justify-content:center;} .rnav button{flex:0 1 260px;}
  }
</style></head>
<body class="lector">
<div id="lector">
  <header class="rtop">
    <div class="rrow">
      <span class="rclase" id="rClase">Cargando…</span>
      <button class="rref" id="rRef" aria-haspopup="dialog">—</button>
    </div>
    <div class="rrow rsub">
      <span class="rlive" id="rLive"></span>
      <span class="rpos" id="rPos"></span>
      <span class="rtools">
        <button id="rMinus" aria-label="Letra más chica">A−</button>
        <button id="rPlus" aria-label="Letra más grande">A+</button>
        <button id="rThemeBtn" aria-label="Cambiar entre tema claro y oscuro">◐</button>
      </span>
    </div>
    <div class="rnote" id="rNote" hidden></div>
  </header>
  <main class="rmain" id="rMain">
    <section class="rlat" id="rLat" lang="la" aria-label="Texto latino"></section>
    <section class="rpanel" id="rPanel" hidden>
      <div class="rtabs" role="tablist" id="rTabs"></div>
      <div class="rtab" id="rTab" role="tabpanel"></div>
    </section>
  </main>
  <p class="rmsg" id="rMsg" hidden></p>
  <nav class="rnav" aria-label="Pasajes">
    <button id="rPrev">◀ Anterior</button>
    <button id="rNext">Siguiente ▶</button>
  </nav>
  <div class="rsheet" id="rSheet" hidden role="dialog" aria-label="Pasajes de la clase">
    <div class="rsheet-in">
      <div class="rsheet-head">
        <p class="rlbl" id="rSheetLbl">Clase</p>
        <select id="rSel" aria-label="Elegir clase"></select>
        <button id="rSheetClose">Cerrar</button>
      </div>
      <ol id="rList"></ol>
    </div>
  </div>
</div>

<script>
const DATA = {"clase": "Eneida XI y XII", "pasajes": [{"id": "a11-5-16", "ref": "11.5-16", "lines": ["Ingentem quercum decisis undique ramis", "constituit tumulo fulgentiaque induit arma,", "Mezenti ducis exuvias, tibi, magne, tropaeum,", "bellipotens: aptat rorantis sanguine cristas", "telaque trunca viri et bis sex thoraca petitum", "perfossumque locis clipeumque ex aere sinistrae", "subligat atque ensem collo suspendit eburnum.", "Tum socios, namque omnis eum stipata tegebat", "turba ducum, sic incipiens hortatur ovantis:", "Maxima res effecta, viri; timor omnis abesto,", "quod superest: haec sunt spolia et de rege superbo", "primitiae, manibusque meis Mezentius hic est."], "trans": "<div>Planta en un altozano una talluda encina que desnuda de todo su ramaje y la decora de radiantes armas, las que cobró a Mezencio, trofeo que te brinda a ti, dios poderoso de la guerra.<\/div><div>Le acomoda el penacho de plumas húmedo de su sangre todavía, y los truncados dardos del guerrero y la coraza herida y perforada en doce puntos, y prende al brazo izquierdo el bronce de su escudo y la espada de puño de marfil se la cuelga del cuello.<\/div><div>Luego a sus camaradas victoriosos —todos sus capitanes en apretado cerco le rodean— comienza así a arengarles: «Lo más está logrado, compañeros.<\/div><div>Fuera todo temor por lo que resta.<\/div><div>Son ésos los despojos, las primicias de un engreído rey.<\/div><div>Así han puesto mis manos a Mezencio.<\/div><div>[…]<\/div>", "gloss": "<div><b>absum, abes, abesse, āfuī<\/b>: estar lejos (abestō: que se aleje)<\/div><div><b>dē (prep. + abl.)<\/b>: de<\/div><div><b>et<\/b>: y<\/div><div><b>hic, haec, hoc<\/b>: este, esta, esto<\/div><div><b>manus, -ūs, f.<\/b>: mano<\/div><div><b>meus, -a, -um<\/b>: mío<\/div><div><b>Mezentius, -iī, m.<\/b>: Mezencio<\/div><div><b>omnis, -e<\/b>: todo<\/div><div><b>prīmitiae, -ārum, f. pl.<\/b>: primicias<\/div><div><b>-que<\/b>: y<\/div><div><b>rēx, rēgis, m.<\/b>: rey<\/div><div><b>spolia, -ōrum, n. pl.<\/b>: despojos<\/div><div><b>sum, es, esse, fuī<\/b>: ser, estar<\/div><div><b>superbus, -a, -um<\/b>: soberbio<\/div><div><b>timor, -ōris, m.<\/b>: miedo<\/div>", "notes": "<div><b>¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>¿Por qué dice Eneas «Mezentius hic est» de un tronco?<\/div><div>La coraza perforada «dos veces seis» no muestra heridas de combate sino abuso del cadáver; Mezencio había pedido ser enterrado con Lauso (10.906). «Tristeza atenuada»: el trofeo dice lo que Eneas calla (Anderson).<\/div><div>↔ 11.173 (<i>immanis truncus<\/i>, en boca de Evandro).<\/div><ul><li><i>constituit… aptat… subligat… suspendit<\/i>: presentes.<\/li><li><i>abesto<\/i>: imperativo de <i>absum<\/i>.<\/li><li><i>haec sunt spolia… hic est<\/i>: demostrativos con <i>sum<\/i>. <i>Mezenti<\/i>: genitivo de 2.ª.<\/li><li>Libro tripartito: funerales (1-224), debate (225-444), batalla (445-915) (Horsfall).<\/li><li>XI es un libro «marcadamente no augusteo», que no exige equipaje político (Horsfall).<\/li><\/ul>", "hl": {}, "fx": {"58": "b", "59": "b", "60": "b", "63": "b", "64": "b", "65": "b", "66": "b", "67": "b", "68": "b", "69": "b", "70": "b", "71": "b", "72": "b", "73": "b", "74": "b", "75": "b"}, "ul": {"58": "b", "68": "b", "73": "r", "74": "r", "75": "r"}, "lk": {}}, {"id": "a11-42-52", "ref": "11.42-52", "lines": ["Tene, inquit, miserande puer, cum laeta veniret,", "invidit Fortuna mihi, ne regna videres", "nostra neque ad sedes victor veherere paternas?", "Non haec Evandro de te promissa parenti", "discedens dederam, cum me complexus euntem", "mitteret in magnum imperium metuensque moneret", "acris esse viros, cum dura proelia gente.", "Et nunc ille quidem spe multum captus inani", "fors et vota facit cumulatque altaria donis:", "nos iuvenem exanimum et nil iam caelestibus ullis", "debentem vano maesti comitamur honore."], "trans": "<div>«¡Doncel infortunado!<\/div><div>¡Con que te me ha robado celosa la Fortuna cuando me sonreía, negándote que vieras mi reino y que volvieras victorioso a la casa de tu padre!<\/div><div>No era ésa la promesa que hice a tu padre Evandro sobre ti cuando a punto de partir estrechándome en sus brazos me mandaba a ganar un gran imperio y me advertía receloso que eran hombres aguerridos y era fuerza luchar contra una dura raza.<\/div><div>Él en este momento aferrado a una esperanza vana tal vez empeñe votos y cargue de presentes los altares mientras nosotros afligidos rendimos inútiles honores a un cuerpo inanimado que no debe ya nada a los dioses del cielo.<\/div><div>[…]<\/div>", "gloss": "<div><b>altāria, -ium, n. pl.<\/b>: altar<\/div><div><b>cumulō, -ās, -āre, -āvī, -ātum<\/b>: colmar<\/div><div><b>dōnum, -ī, n.<\/b>: ofrenda, regalo<\/div><div><b>et<\/b>: y<\/div><div><b>faciō, -is, -ere, fēcī, factum<\/b>: hacer<\/div><div><b>fors (adv.)<\/b>: quizás<\/div><div><b>-que<\/b>: y<\/div><div><b>vōtum, -ī, n.<\/b>: voto, promesa<\/div>", "notes": "<div><b>¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>Según Eneas, ¿qué está haciendo Evandro en este momento y qué no sabe todavía?<\/div><div><i>maestus<\/i> aparece once veces en el libro XI, ocho entre los vv. 26 y 189, casi todas en el duelo troyano: ¿sesgo del narrador? (Anderson)<\/div><div>↔ 11.169-181 (Evandro ya lo sabe).<\/div><ul><li><i>Tene… invidit Fortuna mihi<\/i>: <i>te<\/i>, pronombre en acusativo + <i>-ne<\/i> interrogativo; <i>invidit<\/i>, perfecto; <i>mihi<\/i>, dativo.<\/li><li><i>ille… nos<\/i>: un demostrativo para el padre que espera y un pronombre personal para los que llevan el cuerpo.<\/li><li><i>facit… cumulat… comitamur<\/i>: presentes: dos escenas al mismo tiempo, en dos lugares.<\/li><li>Eneas llora tres veces: <i>inlacrimans<\/i> (29), <i>lacrimis obortis<\/i> (41), <i>deflevit<\/i> (59) (Anderson).<\/li><\/ul>", "hl": {}, "fx": {"54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b", "60": "b"}, "ul": {"2": "r", "3": "r", "7": "g", "26": "b", "59": "b", "70": "r", "71": "r", "72": "r", "73": "r"}, "lk": {}}, {"id": "a11-67-77", "ref": "11.67-77", "lines": ["Hic iuvenem agresti sublimem stramine ponunt,", "qualem virgineo demessum pollice florem", "seu mollis violae seu languentis hyacinthi,", "cui neque fulgor adhuc necdum sua forma recessit:", "non iam mater alit tellus viresque ministrat.", "Tum geminas vestes auroque ostroque rigentis", "extulit Aeneas, quas illi laeta laborum", "ipsa suis quondam manibus Sidonia Dido", "fecerat et tenui telas discreverat auro.", "Harum unam iuveni supremum maestus honorem", "induit arsurasque comas obnubit amictu,"], "trans": "<div>Allí tienden al joven aupándolo sobre aquel lecho rústico.<\/div><div>Parece flor que han cortado unos dedos virginales, o una tierna violeta o un jacinto delicado que no ha perdido aún su viso y su belleza, pero que ya no nutre ni le infunde vigor la madre tierra.<\/div><div>Entonces saca Eneas dos clámides de rígidos relieves bordados de oro y grana, que la sidonia Dido, gozosa en su tarea, tejió para él un día con sus manos y había entreverado la trama de hilos de oro.<\/div><div>Con una —último honor— envuelve entristecido el cadáver del joven, con la otra va velando los cabellos que han de arder en las llamas.<\/div>", "gloss": "<div><b>agrestis, -e<\/b>: rústico<\/div><div><b>hic (adv.)<\/b>: aquí<\/div><div><b>iuvenis, -is, m.<\/b>: joven<\/div><div><b>pōnō, -is, -ere, posuī, positum<\/b>: poner, colocar<\/div><div><b>strāmen, -inis, n.<\/b>: paja, lecho de ramas<\/div><div><b>sublīmis, -e<\/b>: en alto<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>¿Qué objeto viene de Cartago y para qué sirve ahora?<\/div><div>Palante y Dido, los dos privados de vida y de amor (Anderson).<\/div><div>↔ 4.262-264 (Eneas con el manto de Dido: los mismos versos) y 9.435-437 (la flor de Euríalo); Catulo 62 (modelo del símil) (Horsfall)<\/div><ul><li><i>ponunt<\/i>: presente; <i>extulit… induit<\/i>: perfectos; <i>fecerat<\/i>: pluscuamperfecto.<\/li><li><i>quas illi… Dido… fecerat<\/i>: <i>illi<\/i>, dativo del demostrativo: «para él».<\/li><li><i>Harum unam<\/i>: demostrativo en genitivo plural: «una de estas».<\/li><li>La flor arrancada por mano de muchacha es imagen de desfloración: la muerte como boda frustrada; <i>obnubit<\/i> (77) es el velo nupcial (Anderson).<\/li><\/ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b"}, "ul": {"1": "b", "4": "b", "6": "r", "7": "r", "8": "r", "9": "r", "10": "r", "24": "g", "27": "b", "38": "g", "63": "r", "64": "r", "65": "r", "66": "r"}, "lk": {}}, {"id": "a11-108-119", "ref": "11.108-119", "lines": ["Quaenam vos tanto fortuna indigna, Latini,", "implicuit bello, qui nos fugiatis amicos?", "Pacem me exanimis et Martis sorte peremptis", "oratis? Equidem et vivis concedere vellem.", "Nec veni, nisi fata locum sedemque dedissent,", "nec bellum cum gente gero: rex nostra reliquit", "hospitia et Turni potius se credidit armis.", "Aequius huic Turnum fuerat se opponere morti.", "Si bellum finire manu, si pellere Teucros", "apparat, his mecum decuit concurrere telis:", "vixet, cui vitam deus aut sua dextra dedisset.", "Nunc ite et miseris supponite civibus ignem."], "trans": "<div>«Pero ¿qué odioso azar os ha envuelto, latinos, en esta horrible guerra, y os hace rechazar nuestra amistad?<\/div><div>¿Pedís de mí la paz para los muertos, víctimas del azar de la batalla?<\/div><div>A gusto os la daría también por los vivos.<\/div><div>No he venido a estas tierras sin que el hado me fijara primero lugar donde asentarme ni lucho con sus pueblos.<\/div><div>Vuestro rey ha sido quien dejó nuestra alianza.<\/div><div>Ha preferido confiar en las armas de Turno.<\/div><div>Más justo hubiera sido que Turno se expusiera en persona a la muerte.<\/div><div>Si piensa terminar esta guerra por la fuerza y expulsar a los teucros de sus tierras, debía haber cruzado sus armas con las mías.<\/div><div>Seguiría viviendo aquel a quien el cielo y la pujanza de su brazo le otorgara la vida.<\/div><div>Id y dad a las llamas los cadáveres de vuestros desgraciados compañeros».<\/div>", "gloss": "<div><b>bellum, -ī, n.<\/b>: guerra<\/div><div><b>cīvis, -is, m.<\/b>: ciudadano<\/div><div><b>cum (prep. + abl.)<\/b>: con<\/div><div><b>eō, īs, īre, iī, itum<\/b>: ir<\/div><div><b>et<\/b>: y<\/div><div><b>gēns, gentis, f.<\/b>: pueblo<\/div><div><b>gerō, -is, -ere, gessī, gestum<\/b>: llevar a cabo (bellum gerere: hacer la guerra)<\/div><div><b>ignis, -is, m.<\/b>: fuego<\/div><div><b>miser, -era, -erum<\/b>: desdichado<\/div><div><b>nec<\/b>: y no, ni<\/div><div><b>nunc (adv.)<\/b>: ahora<\/div><div><b>suppōnō, -is, -ere, supposuī, suppositum<\/b>: poner debajo (+ dat.)<\/div>", "notes": "<div><b>¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>¿Con quién dice Eneas que está en guerra y con quién no? ¿Le creés?<\/div><div>↔ 10.510 ss. (Eneas furioso después de la muerte de Palante).<\/div><ul><li><i>oratis<\/i>: presente 2.ª pl.; <i>veni<\/i>: perfecto 1.ª sg.; <i>reliquit<\/i>: perfecto 3.ª sg.<\/li><li><i>ite… supponite<\/i>: imperativos plurales.<\/li><li><i>vos… nos… me<\/i>: pronombres personales en un solo pasaje.<\/li><li>Uno de los presagios de la muerte de Turno en el funeral; Drances acepta acá la tregua (118-132) (Horsfall).<\/li><\/ul>", "hl": {}, "fx": {"32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "75": "b", "76": "b", "77": "b", "78": "b", "79": "b", "80": "b", "81": "b"}, "ul": {"6": "g", "20": "r", "21": "r", "22": "r", "23": "r", "24": "r", "26": "g", "32": "r", "33": "r", "34": "r", "35": "r", "36": "r", "39": "g", "45": "g", "53": "b", "64": "g", "80": "b", "81": "b"}, "lk": {}}, {"id": "a11-169-181", "ref": "11.169-181", "lines": ["Quin ego non alio digner te funere, Palla,", "quam pius Aeneas et quam magni Phryges et quam", "Tyrrhenique duces, Tyrrhenum exercitus omnis.", "Magna tropaea ferunt, quos dat tua dextera Leto:", "tu quoque nunc stares immanis truncus in armis,", "esset par aetas et idem si robur ab annis,", "Turne. Sed infelix Teucros quid demoror armis?", "Vadite et haec memores regi mandata referte:", "quod vitam moror invisam Pallante perempto,", "dextera causa tua est, Turnum natoque patrique", "quam debere vides. Meritis vacat hic tibi solus", "fortunaeque locus. Non vitae gaudia quaero,", "nec fas, sed nato Manis perferre sub imos."], "trans": "<div>«[…] No, no podría yo rendirte otros honores en tu muerte, Palante, que los que te ha rendido el <mark class=\"c-r\">fiel<\/mark> Eneas, los jefes de los frigios, los príncipes de Etruria y su ejército entero.<\/div><div>Espléndidos trofeos van portando, entregados por tu brazo a la muerte.<\/div><div>Tú también estarías aquí, Turno —enorme tronco vestido de tus armas—, si él hubiera tenido tu edad y ese vigor que dan los años.<\/div><div>Pero ¿a qué os retengo alejados de la lucha, teucros, con mi desgracia?<\/div><div>Id y no os olvidéis de llevarle este encargo a vuestro rey: \"Si prolongo una vida que me resulta odiosa tras la muerte de Palante, es que fío en tu brazo; él nos debe la vida de Turno, como ves, a hijo y a padre.<\/div><div>Es lo único que queda a tu valor y tu fortuna.<\/div><div>No le pido a la vida gozo alguno, ni me es lícito ya.<\/div><div>Sólo quiero hacerle llegar a mi hijo esta alegría al reino de las sombras\"».<\/div>", "gloss": "<div><b>et<\/b>: y<\/div><div><b>fās, n. indecl.<\/b>: lo permitido por los dioses<\/div><div><b>gaudium, -iī, n.<\/b>: alegría<\/div><div><b>hic, haec, hoc<\/b>: este, esta, esto<\/div><div><b>īmus, -a, -um<\/b>: el más profundo<\/div><div><b>mandātum, -ī, n.<\/b>: encargo<\/div><div><b>Mānēs, -ium, m. pl.<\/b>: los Manes, almas de los muertos<\/div><div><b>memor, -oris<\/b>: que recuerda<\/div><div><b>nātus, -ī, m.<\/b>: hijo<\/div><div><b>nec<\/b>: y no, ni<\/div><div><b>nōn<\/b>: no<\/div><div><b>perferō, perfers, perferre, pertulī, perlātum<\/b>: llevar hasta el final<\/div><div><b>quaerō, -is, -ere, quaesīvī, quaesītum<\/b>: buscar<\/div><div><b>referō, refers, referre, rettulī, relātum<\/b>: llevar, transmitir<\/div><div><b>rēx, rēgis, m.<\/b>: rey<\/div><div><b>sed<\/b>: sino, pero<\/div><div><b>sub (prep. + acus.)<\/b>: bajo, hacia abajo<\/div><div><b>vādō, -is, -ere<\/b>: ir, marchar<\/div><div><b>vīta, -ae, f.<\/b>: vida<\/div>", "notes": "<div><b>¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>Evandro le manda decir a Eneas qué le debe. ¿Usa un verbo de pasión o uno de deuda?<\/div><div>↔ 12.317 (Eneas: <i>Turnum debent haec iam mihi sacra<\/i>) y 12.938-952.<\/div><ul><li><i>Turne<\/i>: vocativo de 2.ª declinación: Evandro le habla a un ausente.<\/li><li><i>Vadite… referte<\/i>: imperativos plurales, dirigidos a los troyanos.<\/li><li><i>Turnum natoque patrique… debere<\/i>: <i>Turnum<\/i>, acusativo, sujeto del infinitivo; <i>nato<\/i> y <i>patri<\/i> (de <i>pater, patris<\/i>), dativos: a quién se le debe.<\/li><li>El funeral de Palante está lleno de presagios de la muerte de Turno (5-13, 17, 91 s., 108-119, 129, 152-181) (Horsfall).<\/li><\/ul>", "hl": {}, "fx": {"54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b", "60": "b", "84": "b", "85": "b", "86": "b", "87": "b", "88": "b", "89": "b", "90": "b", "91": "b", "92": "b", "93": "b", "94": "b", "95": "b"}, "ul": {"6": "b", "40": "b", "44": "b", "58": "b", "71": "r", "72": "r", "73": "r", "74": "r", "75": "r", "76": "r", "92": "b"}, "lk": {}}, {"id": "a11-182-196", "ref": "11.182-196", "lines": ["Aurora interea miseris mortalibus almam", "extulerat lucem, referens opera atque labores:", "iam pater Aeneas, iam curvo in litore Tarchon", "constituere pyras. Huc corpora quisque suorum", "more tulere patrum, subiectisque ignibus atris", "conditur in tenebras altum caligine caelum.", "Ter circum accensos cincti fulgentibus armis", "decurrere rogos, ter maestum funeris ignem", "lustravere in equis ululatusque ore dedere;", "spargitur et tellus lacrimis, sparguntur et arma:", "it caelo clamorque virum clangorque tubarum.", "Hic alii spolia occisis derepta Latinis", "coniciunt igni, galeas ensesque decoros", "frenaque ferventisque rotas; pars munera nota,", "ipsorum clipeos et non felicia tela."], "trans": "<div>Entre tanto la Aurora había alzado en don su alentadora lumbre a los desventurados mortales tomándoles su carga de trabajos y pesares.<\/div><div>Ya había el paternal Eneas, y ya había Tarcón, el rey etrusco, erigido sus piras en la corva ribera.<\/div><div>A ellas va transportando sus muertos cada cual conforme a la costumbre de sus padres.<\/div><div>Prenden debajo antorchas de fuego ennegrecido.<\/div><div>Su velo envuelve en sombras la bóveda del cielo.<\/div><div>Ceñidos de sus armas radiantes dan tres vueltas a pie girando raudos en torno de la hoguera y otras tres rodean a caballo las llamas desoladas rompiendo en alaridos.<\/div><div>Rocían con su llanto tierra y armas.<\/div><div>Los gritos de los hombres y el clangor de las trompas llega al cielo.<\/div><div>Unos lanzan al fuego los despojos cobrados a los muertos latinos: almetes, espadas guarnecidas y las bridas y las ruedas hirvientes en sus ejes.<\/div><div>Arrojan otros, como ofrendas, objetos favoritos de los muertos, sus broqueles y dardos, que de nada sirvieron en sus manos.<\/div>", "gloss": "<div><b>Aenēās, -ae, m.<\/b>: Eneas<\/div><div><b>caelum, -ī, n.<\/b>: cielo<\/div><div><b>clāmor, -ōris, m.<\/b>: grito<\/div><div><b>clangor, -ōris, m.<\/b>: estruendo<\/div><div><b>cōnstituō, -is, -ere, cōnstituī, cōnstitūtum<\/b>: levantar, construir<\/div><div><b>curvus, -a, -um<\/b>: curvo<\/div><div><b>eō, īs, īre, iī, itum<\/b>: ir, subir<\/div><div><b>iam (adv.)<\/b>: ya<\/div><div><b>in (prep. + abl.)<\/b>: en<\/div><div><b>lītus, -oris, n.<\/b>: playa<\/div><div><b>pater, patris, m.<\/b>: padre<\/div><div><b>pyra, -ae, f.<\/b>: pira<\/div><div><b>-que<\/b>: y<\/div><div><b>Tarchōn, -ōnis, m.<\/b>: Tarcón<\/div><div><b>tuba, -ae, f.<\/b>: trompeta<\/div><div><b>vir, virī, m. (virum = virōrum)<\/b>: varón, hombre<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>¿Qué hacen los vivos con las armas de los muertos?<\/div><div>↔ 11.203 ss. (las piras del lado latino); 11.203-224 (el duelo latino: maldiciones contra la guerra y contra Turno) (Anderson)<\/div><ul><li><i>constituere, tulere, decurrere, lustravere, dedere<\/i>: perfectos 3.ª pl. en <i>-ere<\/i> (= <i>-erunt<\/i>).<\/li><li><i>spargitur… sparguntur<\/i>: el mismo verbo en singular y en plural.<\/li><li><i>clamorque virum<\/i>: <i>virum<\/i> = <i>virorum<\/i>, genitivo plural.<\/li><li><i>spargitur… sparguntur<\/i> (191) traduce a Homero (Horsfall).<\/li><\/ul>", "hl": {}, "fx": {"11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "62": "b", "63": "b", "64": "b", "65": "b", "66": "b", "67": "b"}, "ul": {"2": "r", "3": "r", "6": "b", "17": "b", "19": "g", "26": "g", "29": "b", "43": "g", "49": "g", "54": "g", "55": "r", "56": "r", "57": "r", "58": "r", "59": "r", "60": "r", "61": "r", "64": "b", "66": "b"}, "lk": {}}, {"id": "a11-281-293", "ref": "11.281-293", "lines": ["Munera, quae patriis ad me portatis ab oris,", "vertite ad Aenean. Stetimus tela aspera contra", "contulimusque manus: experto credite, quantus", "in clipeum adsurgat, quo turbine torqueat hastam.", "Si duo praeterea talis Idaea tulisset", "terra viros, ultro Inachias venisset ad urbes", "Dardanus, et versis lugeret Graecia fatis.", "Quidquid apud durae cessatum est moenia Troiae,", "Hectoris Aeneaeque manu victoria Graium", "haesit et in decimum vestigia rettulit annum.", "Ambo animis, ambo insignes praestantibus armis", "hic pietate prior. Coeant in foedera dextrae,", "qua datur; ast armis concurrant arma cavete."], "trans": "<div>«[…] En cuanto a los regalos que para mí traéis de vuestra patria, llevádselos a Eneas.<\/div><div>Me he enfrentado a los terribles tiros de su brazo y he luchado cuerpo a cuerpo con él.<\/div><div>Creedle a quien lo tiene bien probado.<\/div><div>¡Qué arrollador salta tras de su escudo!<\/div><div>¡Qué ímpetu de turbión, cuando vibra su lanza!<\/div><div>Si la tierra del Ida hubiera dado otros dos como él, los dárdanos hubieran atacado las mismas plazas de Ínaco y, cambiado el destino, le tocaría a Grecia ahora llorar.<\/div><div>Todo el tiempo perdido ante los muros de la terca Troya se debió al brazo de Héctor y de Eneas, que frenó la victoria de los griegos y retrasó diez años su llegada.<\/div><div>Los dos destacan en bravura, los dos por el empuje de sus armas.<\/div><div>Eneas le aventaja en el culto a los dioses y en amor a los suyos.<\/div><div>Unid en alianza vuestra diestra a la suya si os es dado y guardaos de enfrentaros con ellos en batalla&quot;.<\/div>", "gloss": "<div><b>ab (prep. + abl.)<\/b>: desde<\/div><div><b>ad (prep. + acus.)<\/b>: a, hacia<\/div><div><b>asper, -era, -erum<\/b>: áspero, cruel<\/div><div><b>cōnferō, cōnfers, cōnferre, contulī, collātum<\/b>: juntar (manūs cōnferre: combatir cuerpo a cuerpo)<\/div><div><b>contrā (prep. + acus.)<\/b>: frente a<\/div><div><b>crēdō, -is, -ere, crēdidī, crēditum<\/b>: creer (+ dat.)<\/div><div><b>ego, meī<\/b>: yo<\/div><div><b>expertus, -a, -um<\/b>: que tiene experiencia<\/div><div><b>manus, -ūs, f.<\/b>: mano<\/div><div><b>mūnus, -eris, n.<\/b>: regalo<\/div><div><b>ōra, -ae, f.<\/b>: costa, región<\/div><div><b>patrius, -a, -um<\/b>: patrio<\/div><div><b>portō, -ās, -āre, -āvī, -ātum<\/b>: llevar<\/div><div><b>-que<\/b>: y<\/div><div><b>quī, quae, quod<\/b>: que, el cual<\/div><div><b>stō, stās, stāre, stetī, statum<\/b>: estar de pie, plantarse<\/div><div><b>tēlum, -ī, n.<\/b>: dardo, arma<\/div><div><b>vertō, -is, -ere, vertī, versum<\/b>: volver, dirigir<\/div>", "notes": "<div><b>¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>¿A quién compara Diomedes con Eneas y en qué gana Eneas?<\/div><div>↔ 1.10 (<i>insignem pietate virum<\/i>).<\/div><ul><li><i>vertite… credite… cavete<\/i>: imperativos plurales.<\/li><li><i>Stetimus… contulimus<\/i>: perfectos en 1.ª plural.<\/li><li><i>hic pietate prior<\/i>: <i>hic<\/i>, demostrativo (Eneas, frente a Héctor).<\/li><li>El mensaje de Diomedes aísla a Turno: no va a morir al frente de una coalición pan-itálica (Horsfall).<\/li><li><i>stetimus contra<\/i> (282) traduce casi literalmente a Homero (Horsfall).<\/li><\/ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b"}, "ul": {"0": "b", "11": "g", "15": "g", "53": "b", "58": "g", "63": "g", "71": "r", "72": "r", "73": "r"}, "lk": {}}, {"id": "a11-362-375", "ref": "11.362-375", "lines": ["Nulla salus bello: pacem te poscimus omnes,", "Turne, simul pacis solum inviolabile pignus.", "Primus ego, invisum quem tu tibi fingis, et esse", "nil moror, en supplex venio. Miserere tuorum,", "pone animos et pulsus abi. Sat funera fusi", "vidimus ingentis et desolavimus agros.", "Aut si fama movet, si tantum pectore robur", "concipis et si adeo dotalis regia cordi est,", "aude atque adversum fidens fer pectus in hostem.", "Scilicet ut Turno contingat regia coniunx,", "nos animae viles, inhumata infletaque turba,", "sternamur campis. Etiam tu, siqua tibi vis,", "si patrii quid Martis habes, illum aspice contra,", "qui vocat."], "trans": "<div>«[…] No hay en la guerra salvación ninguna.<\/div><div>Paz es lo que de ti todos pedimos, Turno, y con la paz la única e inviolable garantía de paz.<\/div><div>Y antes que todos yo, al que tú te imaginas tu enemigo —ahora no paro en eso—.<\/div><div>Mírame, vengo a ti suplicante.<\/div><div>Ten piedad de tu pueblo, depón tu altanería y retírate vencido.<\/div><div>Ya bastantes derrotas y muertes hemos visto, ya hemos dejado arrasada una gran extensión de nuestros campos.<\/div><div>Pero si el ansia de la gloria te acucia, si tan fornido temple entraña tu ánimo, si tienes puesta el alma en recibir un palacio por dote, entonces ten valor, y frente a frente opón a tu enemigo firme pecho.<\/div><div>Claro, para que Turno obtenga el don de una esposa real, nosotros, despreciable turba, que no merece sepultura ni lágrimas, ¿yaceremos cubriendo de cadáveres el llano?<\/div><div>Ea, ya, si hay en ti algún valor, si algo tienes del brío guerrero de los tuyos, planta cara a quien te reta».<\/div>", "gloss": "<div><b>abeō, abīs, abīre, abiī, abitum<\/b>: irse<\/div><div><b>ager, agrī, m.<\/b>: campo<\/div><div><b>animus, -ī, m.<\/b>: ánimo (pl. soberbia, ira)<\/div><div><b>bellum, -ī, n.<\/b>: guerra<\/div><div><b>dēsōlō, -ās, -āre, -āvī, -ātum<\/b>: dejar desierto<\/div><div><b>et<\/b>: y<\/div><div><b>fūnus, -eris, n.<\/b>: muerte, cadáver<\/div><div><b>fūsus, -a, -um<\/b>: tendido, derribado<\/div><div><b>ingēns, -entis<\/b>: enorme<\/div><div><b>misereor, miserērī, miseritus sum<\/b>: compadecerse (+ gen.)<\/div><div><b>nūllus, -a, -um<\/b>: ninguno<\/div><div><b>omnis, -e<\/b>: todo<\/div><div><b>pāx, pācis, f.<\/b>: paz<\/div><div><b>pōnō, -is, -ere, posuī, positum<\/b>: deponer<\/div><div><b>poscō, -is, -ere, poposcī<\/b>: pedir, reclamar<\/div><div><b>pulsus, -a, -um<\/b>: rechazado, vencido<\/div><div><b>salūs, -ūtis, f.<\/b>: salvación<\/div><div><b>sat (adv.)<\/b>: bastante<\/div><div><b>Turnus, -ī, m.<\/b>: Turno<\/div><div><b>tū, tuī<\/b>: tú, vos<\/div><div><b>tuus, -a, -um<\/b>: tuyo (tuī: los tuyos)<\/div><div><b>videō, -ēs, -ēre, vīdī, vīsum<\/b>: ver<\/div>", "notes": "<div><b>¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>Drances dice algo que el poema parece compartir. ¿Qué? ¿Por qué el narrador no le da la razón?<\/div><div>Los problemas reales (las muertes, la futilidad de la guerra) se pierden en la pelea política (Anderson).<\/div><div>↔ 12.500-508 (el narrador ante Júpiter).<\/div><ul><li><i>Nulla salus bello<\/i>: falta <i>est<\/i>.<\/li><li><i>Miserere… pone… abi… aude… fer… aspice<\/i>: imperativos (<i>fer<\/i>, de <i>fero<\/i>).<\/li><li><i>ego… tu… tibi… nos… illum<\/i>: pronombres personales y un demostrativo.<\/li><li>Drances, <i>popularis<\/i> de colores salustianos: opiniones sensatas, dichas con una antipatía que solo puede producir lo contrario (Horsfall).<\/li><\/ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b"}, "ul": {"0": "r", "1": "r", "2": "r", "3": "b", "9": "b", "12": "b", "35": "b", "37": "g", "40": "g", "72": "r", "73": "r", "74": "r", "75": "r", "76": "r", "77": "r"}, "lk": {}}, {"id": "a11-434-444", "ref": "11.434-444", "lines": ["Quod si me solum Teucri in certamina poscunt", "idque placet tantumque bonis communibus obsto,", "non adeo has exosa manus Victoria fugit,", "ut tanta quicquam pro spe temptare recusem.", "Ibo animis contra, vel magnum praestet Achillem", "factaque Vulcani manibus paria induat arma", "ille licet. Vobis animam hanc soceroque Latino", "Turnus ego, haud ulli veterum virtute secundus,", "devovi. Solum Aeneas vocat: et vocet oro,", "nec Drances potius, sive est haec ira deorum,", "morte luat, sive est virtus et gloria, tollat."], "trans": "<div>«[…] Y si me desafían los teucros a mí solo y así lo deseáis y estorbo tanto al bien de todos, no esquiva la Victoria estas mis manos con tan odioso encono que rehúya cualquier riesgo a trueque de tan grandes esperanzas.<\/div><div>Iré a plantarle cara valeroso aunque aventaje al imponente Aquiles y vista una armadura pareja a la forjada por manos de Vulcano.<\/div><div>A vosotros y a mi suegro Latino os consagro esta vida yo, Turno, que no cedo en valor a ninguno de mis antepasados.<\/div><div>Que Eneas sólo a mí me desafía: pues eso es lo que quiero; que sea a mí y no a Drances.<\/div><div>Si está contra mí la ira de los dioses, que no la aplaque Drances con su muerte; si va en ello el valor y la gloria, no sea él quien la gane».<\/div>", "gloss": "<div><b>Aenēās, -ae, m.<\/b>: Eneas<\/div><div><b>anima, -ae, f.<\/b>: vida, alma<\/div><div><b>dēvoveō, -ēs, -ēre, dēvōvī, dēvōtum<\/b>: consagrar<\/div><div><b>ego, meī<\/b>: yo<\/div><div><b>haud<\/b>: no<\/div><div><b>hic, haec, hoc<\/b>: este<\/div><div><b>Latīnus, -ī, m.<\/b>: Latino<\/div><div><b>-que<\/b>: y<\/div><div><b>secundus, -a, -um<\/b>: inferior, segundo<\/div><div><b>socer, -erī, m.<\/b>: suegro<\/div><div><b>sōlus, -a, -um<\/b>: solo<\/div><div><b>Turnus, -ī, m.<\/b>: Turno<\/div><div><b>ūllus, -a, -um<\/b>: alguno<\/div><div><b>vetus, -eris<\/b>: antiguo (veterēs: los antiguos)<\/div><div><b>virtūs, -ūtis, f.<\/b>: valor<\/div><div><b>vocō, -ās, -āre, -āvī, -ātum<\/b>: llamar, desafiar<\/div><div><b>vōs, vestrī<\/b>: ustedes<\/div>", "notes": "<div><b>¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>¿Por qué Turno se nombra a sí mismo en tercera persona?<\/div><div>↔ 12.645 (<i>Turnum fugientem haec terra videbit?<\/i>).<\/div><ul><li><i>poscunt, placet, obsto<\/i>: presentes; <i>Ibo<\/i>: futuro de <i>eo<\/i>; <i>devovi<\/i>: perfecto.<\/li><li><i>Turnus ego<\/i>: nombre + pronombre.<\/li><li><i>animam hanc<\/i>: demostrativo con sustantivo de 1.ª; <i>vobis… Latino<\/i>: dativos.<\/li><li>«Odio pagado con intereses»: un discurso para conocedores de las peleas de la curia; prepara la segunda mitad de XI y el libro XII (Horsfall).<\/li><\/ul>", "hl": {}, "fx": {"43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b"}, "ul": {"48": "r", "49": "r", "50": "r", "51": "r", "52": "r", "53": "r", "54": "r", "55": "g", "56": "r", "57": "r", "58": "r", "59": "r", "60": "r", "61": "r"}, "lk": {}}, {"id": "a11-498-510", "ref": "11.498-510", "lines": ["Obvia cui Volscorum acie comitante Camilla", "occurrit portisque ab equo regina sub ipsis", "desiluit, quam tota cohors imitata relictis", "ad terram defluxit equis; tum talia fatur:", "Turne, sui merito siqua est fiducia forti,", "audeo et Aeneadum promitto occurrere turmae", "solaque Tyrrhenos equites ire obvia contra.", "Me sine prima manu temptare pericula belli", "tu pedes ad muros subsiste et moenia serva.", "Turnus ad haec, oculos horrenda in virgine fixus:", "O decus Italiae virgo, quas dicere grates", "quasve referre parem? Sed nunc, est omnia quando", "iste animus supra, mecum partire laborem."], "trans": "<div>Veloz viene a su encuentro la amazona Camila entre la escolta de su escuadrón de volscos.<\/div><div>Ante las mismas puertas de un salto descabalga la reina.<\/div><div>Toda la comitiva la imita.<\/div><div>Se deslizan en tierra dejando sus monturas.<\/div><div>Y así le habla ella: «Turno, si es justo que el valiente confíe en su valor, yo segura de mí me atrevo, lo prometo, a correr al encuentro del escuadrón de Eneas y a acometer yo sola a los jinetes tirrenos.<\/div><div>Déjame que afronte con mi brazo los primeros peligros de la guerra.<\/div><div>Tú quédate a pie firme ante los muros guardando la ciudad».<\/div><div>A esto Turno, clavando en la terrible muchacha la mirada: «¡Doncella, prez de Italia!, ¿qué gracias seré yo capaz de darte o con qué puedo pagarte?<\/div><div>Pero ahora, ya que tu ánimo está por encima de todo, comparte este trabajo conmigo.<\/div><div>[…]<\/div>", "gloss": "<div><b>ad (prep. + acus.)<\/b>: hacia, junto a<\/div><div><b>Aeneadae, -um, m. pl.<\/b>: los Enéadas, los troyanos<\/div><div><b>audeō, -ēs, -ēre, ausus sum<\/b>: atreverse<\/div><div><b>bellum, -ī, n.<\/b>: guerra<\/div><div><b>contrā (prep. + acus.)<\/b>: contra, frente a<\/div><div><b>ego, meī<\/b>: yo<\/div><div><b>eō, īs, īre, iī, itum<\/b>: ir<\/div><div><b>eques, equitis, m.<\/b>: jinete<\/div><div><b>et<\/b>: y<\/div><div><b>manus, -ūs, f.<\/b>: mano<\/div><div><b>moenia, -ium, n. pl.<\/b>: murallas<\/div><div><b>mūrus, -ī, m.<\/b>: muro<\/div><div><b>obvius, -a, -um<\/b>: que sale al encuentro<\/div><div><b>occurrō, -is, -ere, occurrī, occursum<\/b>: salir al encuentro (+ dat.)<\/div><div><b>pedes, peditis, m.<\/b>: soldado de a pie<\/div><div><b>perīculum, -ī, n.<\/b>: peligro<\/div><div><b>prīmus, -a, -um<\/b>: primero<\/div><div><b>prōmittō, -is, -ere, prōmīsī, prōmissum<\/b>: prometer<\/div><div><b>-que<\/b>: y<\/div><div><b>servō, -ās, -āre, -āvī, -ātum<\/b>: proteger, cuidar<\/div><div><b>sinō, -is, -ere, sīvī, situm<\/b>: dejar, permitir<\/div><div><b>sōlus, -a, -um<\/b>: solo<\/div><div><b>subsistō, -is, -ere, substitī<\/b>: quedarse firme<\/div><div><b>temptō, -ās, -āre, -āvī, -ātum<\/b>: intentar, probar<\/div><div><b>turma, -ae, f.<\/b>: escuadrón<\/div><div><b>tū, tuī<\/b>: tú, vos<\/div><div><b>Tyrrhēnus, -a, -um<\/b>: tirreno, etrusco<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>Camila propone el plan. ¿Qué le contesta Turno y cómo la llama?<\/div><div>↔ 7.803-811 (Camila en el catálogo).<\/div><ul><li><i>audeo et… promitto occurrere… ire<\/i>: presentes + infinitivos.<\/li><li><i>Me sine… temptare<\/i>: imperativo + pronombre + infinitivo.<\/li><li><i>subsiste… serva… partire<\/i>: imperativos.<\/li><li>Turno la pone al mando de jefes varones: no hay chovinismo entre los italianos; el narrador la llama <i>regina<\/i> (499, 703, 801) (Anderson).<\/li><\/ul>", "hl": {}, "fx": {"33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "52": "b", "53": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b"}, "ul": {"13": "g", "21": "g", "66": "b", "68": "r", "69": "r", "70": "r", "71": "r"}, "lk": {}}, {"id": "a11-552-566", "ref": "11.552-566", "lines": ["Telum immane manu valida quod forte gerebat", "bellator, solidum nodis et robore cocto,", "huic natam, libro et silvestri subere clausam,", "implicat atque habilem mediae circumligat hastae;", "quam dextra ingenti librans ita ad aethera fatur:", "Alma, tibi hanc, nemorum cultrix, Latonia virgo,", "ipse pater famulam voveo; tua prima per auras", "tela tenens supplex hostem fugit. Accipe, testor,", "diva tuam, quae nunc dubiis committitur auris.", "Dixit et adducto contortum hastile lacerto", "immittit: sonuere undae, rapidum super amnem", "infelix fugit in iaculo stridente Camilla.", "At Metabus, magna propius iam urgente caterva,", "dat sese fluvio atque hastam cum virgine victor", "gramineo donum Triviae de caespite vellit."], "trans": "<div>[…] a la enorme jabalina que el guerrero portaba por fortuna con mano vigorosa —era un leño nudoso endurecido al fuego— ata a su hija y la envuelve con corteza de alcornoque silvestre. la sujeta mañoso alrededor en el centro del arma.<\/div><div>Y vibrándola con poderosa diestra da este grito a los aires: &quot;Doncella alentadora, nacida de Latona, que moras en los bosques, yo, su padre, consagro esta hija mía a tu servicio.<\/div><div>Ella empuñando tu arma, la primera que empuña pidiendo tu favor, huye del enemigo por los aires.<\/div><div>Tú, diosa, acoge como tuya, te lo ruego, esta prenda que fío en este instante al inseguro vuelo de las auras&quot;.<\/div><div>Dice, echa atrás el brazo y girando el arma la dispara.<\/div><div>Resonaron las ondas.<\/div><div>Cruza la infortunada por encima de la rauda corriente en el venablo zumbador.<\/div><div>Métabo en el instante en que la gran caterva de enemigos casi le daba alcance se arroja al río y arranca vencedor de entre el herboso césped la ofrenda a Trivia, el arma con la niña.<\/div>", "gloss": "<div><b>accipiō, -is, -ere, accēpī, acceptum<\/b>: recibir<\/div><div><b>almus, -a, -um<\/b>: nutricia, benéfica<\/div><div><b>cultrīx, -īcis, f.<\/b>: habitante, protectora<\/div><div><b>dīva, -ae, f.<\/b>: diosa<\/div><div><b>famula, -ae, f.<\/b>: servidora<\/div><div><b>hic, haec, hoc<\/b>: esta<\/div><div><b>ipse, ipsa, ipsum<\/b>: mismo<\/div><div><b>Lātōnius, -a, -um<\/b>: hija de Latona<\/div><div><b>nemus, -oris, n.<\/b>: bosque<\/div><div><b>pater, patris, m.<\/b>: padre<\/div><div><b>testor, -ārī, -ātus sum<\/b>: poner por testigo<\/div><div><b>tū, tuī<\/b>: tú, vos<\/div><div><b>tuus, -a, -um<\/b>: tuyo<\/div><div><b>virgō, -inis, f.<\/b>: doncella<\/div><div><b>voveō, -ēs, -ēre, vōvī, vōtum<\/b>: consagrar<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>¿Qué hace un padre con su hija para salvarla, y qué le cuesta a ella?<\/div><div>No eligió la virginidad: la decide el voto del padre; Diana lo cuenta con simpatía, sin castigo (Anderson).<\/div><div>↔ 11.818-831 (la muerte de Camila).<\/div><ul><li><i>gerebat<\/i>: imperfecto; <i>implicat, circumligat, fatur<\/i>: presentes.<\/li><li><i>Accipe<\/i>: imperativo; <i>voveo<\/i>: presente.<\/li><li><i>tibi hanc… famulam<\/i>: pronombre en dativo + demostrativo en acusativo.<\/li><li><i>famula<\/i> (558) es sinónimo de <i>camilla<\/i>: el nombre de la chica es su consagración (Anderson).<\/li><\/ul>", "hl": {}, "fx": {"34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "54": "b", "55": "b", "56": "b", "57": "b"}, "ul": {"11": "b", "38": "b", "40": "b", "43": "r", "70": "g", "75": "r", "76": "r", "77": "r", "78": "r", "79": "r", "80": "r", "94": "b"}, "lk": {}}, {"id": "a11-648-658", "ref": "11.648-658", "lines": ["At medias inter caedes exsultat Amazon,", "unum exserta latus pugnae, pharetrata Camilla,", "et nunc lenta manu spargens hastilia denset,", "nunc validam dextra rapit indefessa bipennem;", "aureus ex umero sonat arcus et arma Dianae.", "Illa etiam in tergum, siquando pulsa recessit,", "spicula converso fugientia dirigit arcu.", "At circum lectae comites, Larinaque virgo", "Tullaque et aeratam quatiens Tarpeia securem,", "Italides, quas ipsa decus sibi dia Camilla", "delegit pacisque bonas bellique ministras:"], "trans": "<div>En medio del combate encarnizado la amazona Camila exulta armada de su aljaba descubierto para la lucha un pecho.<\/div><div>Unas veces dispara su mano espesa tromba de flexibles dardos, otras esgrime su incansable brazo la potente segur de doble filo.<\/div><div>Colgado de su hombro tintinea el arco de oro, y las armas de Diana.<\/div><div>Y cuando rechazada llega a retroceder, todavía vuelto el arco va disparando flechas en su huida.<\/div><div>Van a su alrededor las compañeras que ella misma ha elegido, las doncellas Larina y Tula y va Tarpeya enarbolando la segur de bronce.<\/div><div>Son de Italia las tres, como una diosa las escogió Camila para sí por gala de su escolta, leales servidoras en la paz y en la guerra.<\/div>", "gloss": "<div><b>arcus, -ūs, m.<\/b>: arco<\/div><div><b>arma, -ōrum, n. pl.<\/b>: armas<\/div><div><b>aureus, -a, -um<\/b>: de oro<\/div><div><b>Diāna, -ae, f.<\/b>: Diana<\/div><div><b>et<\/b>: y<\/div><div><b>ex (prep. + abl.)<\/b>: de, desde<\/div><div><b>sonō, -ās, -āre, sonuī<\/b>: sonar<\/div><div><b>umerus, -ī, m.<\/b>: hombro<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>¿Qué armas tiene Camila y de quién son?<\/div><div>↔ 1.490-493 (Pentesilea en el templo de Juno).<\/div><ul><li><i>exsultat, denset, rapit, sonat, dirigit<\/i>: presentes; <i>recessit<\/i>: perfecto.<\/li><li><i>Illa<\/i>: demostrativo; <i>Camilla<\/i>: nominativo de 1.ª.<\/li><li><i>quas ipsa… delegit<\/i>: perfecto.<\/li><li>La Camila amazona es posthomérica: la presencia de Homero en el libro es paradójica (Horsfall).<\/li><\/ul>", "hl": {}, "fx": {"25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b"}, "ul": {"3": "b", "4": "r", "5": "r", "39": "g", "64": "g", "65": "r", "66": "r", "67": "r", "68": "r"}, "lk": {}}, {"id": "a11-715-724", "ref": "11.715-724", "lines": ["Vane Ligus frustraque animis elate superbis,", "nequiquam patrias temptasti lubricus artis,", "nec fraus te incolumem fallaci perferet Auno,", "haec fatur virgo et pernicibus ignea plantis", "transit equum cursu frenisque adversa prehensis", "congreditur poenasque inimico ex sanguine sumit:", "quam facile accipiter saxo sacer ales ab alto", "consequitur pennis sublimem in nube columbam", "comprensamque tenet pedibusque eviscerat uncis;", "tum cruor et vulsae labuntur ab aethere plumae."], "trans": "<div>«Necio lígur, ufano sin razón en tu insolencia, en vano has acudido, escurridizo, a las tretas de tu tierra.<\/div><div>No logrará tu engaño devolverte sano y salvo al falaz Auno».<\/div><div>Prorrumpe la muchacha y con alados pies igual que una centella adelanta al corcel en la carrera y asiéndole las riendas le acomete de frente y se venga en la sangre del traidor con la fácil presteza con que de lo alto de una peña el gavilán, el de sacros augurios, da alcance a la paloma remontada a la altura de una nube y la prende tenaz y con sus corvas garras la va desentrañando y entre gotas de sangre las plumas arrancadas se deslizan de la cima del aire.<\/div>", "gloss": "<div><b>ex (prep. + abl.)<\/b>: de<\/div><div><b>inimīcus, -a, -um<\/b>: enemigo<\/div><div><b>poena, -ae, f.<\/b>: castigo (poenās sūmere: vengarse)<\/div><div><b>-que<\/b>: y<\/div><div><b>sanguis, -inis, m.<\/b>: sangre<\/div><div><b>sūmō, -is, -ere, sūmpsī, sūmptum<\/b>: tomar<\/div>", "notes": "<div><b>¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>Camila es el halcón. ¿Con qué fórmula se venga? Buscala en el último pasaje del poema.<\/div><div>↔ 12.949 (<i>poenam scelerato ex sanguine sumit<\/i>).<\/div><ul><li><i>temptasti<\/i> = <i>temptavisti<\/i>: perfecto 2.ª sg.<\/li><li><i>haec fatur virgo<\/i>: <i>haec<\/i>, demostrativo neutro plural.<\/li><li><i>consequitur… tenet… eviscerat<\/i>: presentes del símil.<\/li><li>El lígur le dice <i>femina<\/i> para provocarla; el símil la muestra superior (Anderson).<\/li><\/ul>", "hl": {}, "fx": {"32": "b", "33": "b", "34": "b", "35": "b", "36": "b"}, "ul": {"8": "g", "32": "r", "33": "r", "34": "r", "35": "r", "36": "r", "49": "b"}, "lk": {}}, {"id": "a11-768-782", "ref": "11.768-782", "lines": ["Forte sacer Cybelo Chloreus olimque sacerdos", "insignis longe Phrygiis fulgebat in armis", "spumantemque agitabat equum, quem pellis aënis", "in plumam squamis auro conserta tegebat.", "Ipse, peregrina ferrugine clarus et ostro,", "spicula torquebat Lycio Gortynia cornu;", "aureus ex umeris erat arcus et aurea vati", "cassida; tum croceam chlamydemque sinusque crepantis", "carbaseos fulvo in nodum collegerat auro", "pictus acu tunicas et barbara tegmina crurum.", "Hunc virgo, sive ut templis praefigeret arma", "Troïa, captivo sive ut se ferret in auro", "venatrix, unum ex omni certamine pugnae", "caeca sequebatur totumque incauta per agmen", "femineo praedae et spoliorum ardebat amore,"], "trans": "<div>Entre tanto aparece a lo lejos Cloreo consagrado a Cibeles, resplandeciente en su armadura frigia.<\/div><div>Espoleaba un potro espumeante, cubierto de una piel guarnecida de escamas de bronce igual que plumas que prendían broches de oro.<\/div><div>Relucía el guerrero con el brillo de sus rojizos visos de púrpura extranjera.<\/div><div>Iba tensando en su arco licio las gortinias flechas.<\/div><div>En oro está labrado el arco que le cuelga de los hombros, en oro el yelmo que luce el adivino, de oro rojizo el nudo con que prende la azafranada clámide sus sueltos pliegues de crujiente lino.<\/div><div>Bordó en oro la aguja su túnica y las calzas a usanza de los bárbaros de Oriente.<\/div><div>En él pone sus ojos la muchacha esperanzada en colgar de los muros del templo la armadura troyana o ataviarse con el oro cobrado al enemigo en la contienda.<\/div><div>Sólo a Cloreo —prescinde de todo otro combate— va persiguiendo ciega, como a pieza de caza, sin cautela ninguna, a través de las filas enemigas enardecida su alma de su ansia de mujer por la presa y los despojos.<\/div>", "gloss": "<div><b>arcus, -ūs, m.<\/b>: arco<\/div><div><b>aureus, -a, -um<\/b>: de oro<\/div><div><b>cassida, -ae, f.<\/b>: casco<\/div><div><b>et<\/b>: y<\/div><div><b>ex (prep. + abl.)<\/b>: de, desde<\/div><div><b>sum, es, esse, fuī<\/b>: ser, estar<\/div><div><b>umerus, -ī, m.<\/b>: hombro<\/div><div><b>vātēs, -is, m.<\/b>: sacerdote, vate<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>¿Por qué persigue Camila a Cloreo? El narrador da dos razones posibles y después un juicio: ¿de quién es ese juicio?<\/div><div><i>femineo… amore<\/i>: si <i>femineo<\/i> va con <i>amore<\/i> y no con <i>praedae et spoliorum<\/i>, «ardía de deseo de botín, con pasión de mujer»; Euríalo, varón, desmiente que la codicia sea «femenina» (Anderson).<\/div><div>↔ 9.359-366 (Euríalo y el botín) y 10.495-505 (Turno y el tahalí).<\/div><ul><li><i>fulgebat, agitabat, tegebat, torquebat, sequebatur, ardebat<\/i>: seis imperfectos: una descripción que dura.<\/li><li><i>Hunc virgo… sequebatur<\/i>: <i>hunc<\/i>, demostrativo en acusativo; <i>virgo<\/i>, nominativo de 3.ª (<i>virgo, virginis<\/i>).<\/li><li><i>femineo… amore<\/i>: ablativo: la palabra que hay que discutir.<\/li><li>Cloreo, sacerdote de Cibeles y probablemente eunuco (G. S. West): un blanco fácil; la muerte llega de Arrunte, cobarde, desde la emboscada (Anderson).<\/li><li><i>praedae et spoliorum<\/i> tiene paralelo en Livio; la armadura del catafracto (770 s.) es salustiana (Horsfall).<\/li><\/ul>", "hl": {}, "fx": {"35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b"}, "ul": {"42": "b", "83": "r", "86": "r", "89": "r", "90": "r", "91": "r", "92": "r", "93": "r", "94": "r"}, "lk": {}}, {"id": "a11-818-831", "ref": "11.818-831", "lines": ["labitur exsanguis, labuntur frigida leto", "lumina, purpureus quondam color ora reliquit.", "Tum sic exspirans Accam ex aequalibus unam", "adloquitur fidam ante alias, quae sola Camillae,", "quicum partiri curas; atque haec ita fatur:", "Hactenus, Acca soror, potui: nunc vulnus acerbum", "conficit, et tenebris nigrescunt omnia circum.", "Effuge et haec Turno mandata novissima perfer:", "succedat pugnae Troianosque arceat urbe.", "Iamque vale. Simul his dictis linquebat habenas,", "ad terram non sponte fluens. Tum frigida toto", "paulatim exsolvit se corpore lentaque colla", "et captum leto posuit caput, arma relinquunt,", "vitaque cum gemitu fugit indignata sub umbras."], "trans": "<div>Ya sin sangre se desmaya.<\/div><div>El frío de la muerte va apagando sus ojos y aquel color de púrpura primero abandona su rostro.<\/div><div>Al cabo, sin aliento, se vuelve hacia Aca, una muchacha de su misma edad, la más fiel entre todas, la única con quien ella comparte sus cuidados y le habla así: «Hasta aquí me han seguido las fuerzas, hermana Aca, ahora esta acerba herida acaba ya conmigo.<\/div><div>Todo a mi alrededor se me va oscureciendo en negras sombras.<\/div><div>Vuela y llévale a Turno este mi último encargo: que ocupe mi lugar en el combate y ahuyente a los troyanos de la ciudad.<\/div><div>Y ahora, adiós».<\/div><div>Mientras habla va soltando las riendas y se desliza en tierra contra su voluntad y fría ya, se le desligan poco a poco los miembros de su cuerpo y se le dobla el desmayado cuello y la cabeza, ya en poder de la muerte, y se le van las armas de las manos y la vida exhalando un gemido huye rebelde a hundirse entre las sombras.<\/div>", "gloss": "<div><b>Acca, -ae, f.<\/b>: Aca<\/div><div><b>acerbus, -a, -um<\/b>: cruel, amargo<\/div><div><b>circum (adv.)<\/b>: alrededor<\/div><div><b>cōnficiō, -is, -ere, cōnfēcī, cōnfectum<\/b>: acabar, consumir<\/div><div><b>effugiō, -is, -ere, effūgī<\/b>: escapar<\/div><div><b>et<\/b>: y<\/div><div><b>hactenus (adv.)<\/b>: hasta aquí<\/div><div><b>hic, haec, hoc<\/b>: este, esta, esto<\/div><div><b>iam (adv.)<\/b>: ya<\/div><div><b>mandātum, -ī, n.<\/b>: encargo<\/div><div><b>nigrēscō, -is, -ere, nigruī<\/b>: oscurecerse<\/div><div><b>novissimus, -a, -um<\/b>: último<\/div><div><b>nunc (adv.)<\/b>: ahora<\/div><div><b>omnis, -e<\/b>: todo<\/div><div><b>perferō, perfers, perferre, pertulī, perlātum<\/b>: llevar hasta el final<\/div><div><b>possum, potes, posse, potuī<\/b>: poder<\/div><div><b>-que<\/b>: y<\/div><div><b>soror, -ōris, f.<\/b>: hermana<\/div><div><b>tenebrae, -ārum, f. pl.<\/b>: tinieblas<\/div><div><b>Turnus, -ī, m.<\/b>: Turno<\/div><div><b>valeō, -ēs, -ēre, valuī<\/b>: estar bien (valē: adiós)<\/div><div><b>vulnus, -eris, n.<\/b>: herida<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>¿De qué habla Camila antes de morir: de sí misma o de la guerra? Leé el último verso y guardalo: va a volver.<\/div><div>↔ 12.952 (el último verso del poema); 11.836-867 (Opis venga a Camila: el «consuelo de la venganza», motivo trágico; prepara el <i>poenam… sumit<\/i> del final) (Horsfall)<\/div><ul><li><i>labitur… labuntur<\/i>: el mismo verbo en presente, singular y plural: cae Camila, se le caen los ojos.<\/li><li><i>potui<\/i>: perfecto de <i>possum<\/i>, «pude»; <i>linquebat<\/i>: imperfecto, «iba soltando»: una acción terminada y una que dura.<\/li><li><i>Effuge… perfer… vale<\/i>: tres imperativos: los últimos encargos de Camila a Aca.<\/li><li>Muere sin pensar en los despojos ni en su futuro: habla como comandante, preocupada por Turno; «la muerte más triste y significativa del libro» (Anderson).<\/li><li>El 831 traduce casi literalmente a Homero (Il. 16.856-857 = 22.362-363) (Horsfall).<\/li><\/ul>", "hl": {}, "fx": {"32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "51": "b", "57": "b", "58": "b"}, "ul": {"34": "b", "35": "g", "37": "b", "41": "b", "81": "g", "85": "r", "86": "r", "87": "r", "88": "r", "89": "r", "90": "r", "91": "r"}, "lk": {}}, {"id": "a12-1-9", "ref": "12.1-9", "lines": ["Turnus ut infractos adverso Marte Latinos", "defecisse videt, sua nunc promissa reposci,", "se signari oculis, ultro implacabilis ardet", "attollitque animos. Poenorum qualis in arvis", "saucius ille gravi venantum vulnere pectus", "tum demum movet arma leo gaudetque comantis", "excutiens cervice toros fixumque latronis", "inpavidus frangit telum et fremit ore cruento:", "haud secus adcenso gliscit violentia Turno."], "trans": "<div>Ve Turno a los latinos quebrantados por el adverso giro de la guerra, desfallecido su ánimo.<\/div><div>Claman porque les cumpla las promesas señalándole todos con los ojos.<\/div><div>A su vista arde más implacable todavía su coraje guerrero y se le yergue embravecida el alma.<\/div><div>Como en los campos púnicos el león, ¡ay!, herido por el hondo venablo que en su pecho han clavado los monteros, se apresta al cabo a la pelea y sacude ganoso en su erizado cuello la guedeja y hace trizas impávido el venablo traidor entre rugidos de sus sangrientas fauces, así también borbotea la cólera en el hirviente corazón de Turno.<\/div>", "gloss": "", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>El libro empieza con Turno herido sin que nadie lo haya tocado. ¿Qué lo hiere?<\/div><div>↔ 12.905-918 (el símil del sueño); 4.1-2 (<i>saucius… gravi… vulnere<\/i> repite <i>gravi… saucia cura / vulnus<\/i>: Turno herido como Dido, en «llanuras púnicas»; la herida es figurada) (Putnam); 1.294-296 y 9.341 (<i>fremit ore cruento<\/i>: el <i>Furor impius<\/i> encadenado y Niso) (Putnam)<\/div><ul><li><i>videt… ardet… attollit<\/i>: presentes.<\/li><li><i>defecisse, reposci, signari<\/i>: infinitivos que dependen de <i>videt<\/i>.<\/li><li><i>leo<\/i>, nominativo de 3.ª (<i>leo, leonis<\/i>); <i>Turno<\/i>, dativo de 2.ª.<\/li><\/ul>", "hl": {}, "fx": {}, "ul": {"24": "r", "25": "r", "26": "r", "27": "r", "28": "r", "29": "r", "34": "b", "38": "b", "41": "b", "46": "r", "47": "r", "48": "r"}, "lk": {}}, {"id": "a12-60-71", "ref": "12.60-71", "lines": ["unum oro: desiste manum committere Teucris.", "Qui te cumque manent isto certamine casus,", "et me, Turne, manent: simul haec invisa relinquam", "lumina nec generum Aenean captiva videbo.", "Accepit vocem lacrimis Lavinia matris", "flagrantis perfusa genas, quoi plurimus ignem", "subiecit rubor et calefacta per ora cucurrit.", "Indum sanguineo veluti violaverit ostro", "siquis ebur, aut mixta rubent ubi lilia multa", "alba rosa: talis virgo dabat ore colores.", "Illum turbat amor, figitque in virgine voltus:", "ardet in arma magis paucisque adfatur Amatam."], "trans": "<div>[…] esto sólo te pido: desiste de luchar contra los teucros; la suerte que te aguarda en esa lucha también a mí me aguarda, Turno; contigo dejaré esta odiosa luz, no voy a ver, cautiva, a Eneas convertido en yerno mío».<\/div><div>Lavinia oye las quejas de su madre inundadas de lágrimas las ardientes mejillas que un intenso rubor abrasa y se difunde al punto por su rostro encendido.<\/div><div>Como cuando se tiñe el índico marfil con el rojo de sangre de la púrpura o el albor de los lirios se arrebola entre la grana de abundantes rosas, así eran los colores que lucía la muchacha en el rostro.<\/div><div>Turno, agitada el alma de amor, clavando en la muchacha la mirada arde cada vez más en ansias de pelea.<\/div><div>Da esta breve respuesta a Amata:<\/div>", "gloss": "<div><b>adfor, adfāris, adfārī, adfātus sum<\/b>: hablarle a<\/div><div><b>Aenēās, -ae, m.<\/b>: Eneas<\/div><div><b>Amāta, -ae, f.<\/b>: Amata<\/div><div><b>amor, -ōris, m.<\/b>: amor<\/div><div><b>ardeō, -ēs, -ēre, arsī<\/b>: arder<\/div><div><b>arma, -ōrum, n. pl.<\/b>: armas<\/div><div><b>captīvus, -a, -um<\/b>: cautivo<\/div><div><b>committō, -is, -ere, commīsī, commissum<\/b>: entablar (manum committere: entrar en combate)<\/div><div><b>dēsistō, -is, -ere, dēstitī<\/b>: dejar de<\/div><div><b>fīgō, -is, -ere, fīxī, fīxum<\/b>: clavar, fijar<\/div><div><b>gener, -erī, m.<\/b>: yerno<\/div><div><b>hic, haec, hoc<\/b>: este, esta, esto<\/div><div><b>ille, illa, illud<\/b>: aquel, él<\/div><div><b>in (prep. + acus. / abl.)<\/b>: hacia / en<\/div><div><b>invīsus, -a, -um<\/b>: odioso<\/div><div><b>lūmen, -inis, n.<\/b>: luz (pl. ojos)<\/div><div><b>magis (adv.)<\/b>: más<\/div><div><b>manus, -ūs, f.<\/b>: mano<\/div><div><b>nec<\/b>: y no, ni<\/div><div><b>ōrō, -ās, -āre, -āvī, -ātum<\/b>: rogar, pedir<\/div><div><b>paucī, -ae, -a<\/b>: pocos<\/div><div><b>-que<\/b>: y<\/div><div><b>relinquō, -is, -ere, relīquī, relictum<\/b>: dejar, abandonar<\/div><div><b>simul (adv.)<\/b>: al mismo tiempo<\/div><div><b>Teucrī, -ōrum, m. pl.<\/b>: los teucros, los troyanos<\/div><div><b>turbō, -ās, -āre, -āvī, -ātum<\/b>: perturbar<\/div><div><b>ūnus, -a, -um<\/b>: uno, solo<\/div><div><b>videō, -ēs, -ēre, vīdī, vīsum<\/b>: ver<\/div><div><b>virgō, -inis, f.<\/b>: doncella, muchacha<\/div><div><b>vultus (voltus), -ūs, m.<\/b>: rostro, mirada<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>Lavinia no dice nada. ¿Qué hace su cuerpo y qué entiende Turno?<\/div><div>↔ 7.71-80 (Lavinia en llamas).<\/div><ul><li><i>desiste… committere<\/i>: imperativo + infinitivo.<\/li><li><i>manent<\/i>: presente; <i>relinquam, videbo<\/i>: futuros.<\/li><li><i>Illum turbat amor<\/i>: <i>illum<\/i>, demostrativo en acusativo; <i>amor<\/i>, nominativo de 3.ª.<\/li><li>El rojo sobre blanco del rubor repite el Tíber rojo y los campos blanqueados de huesos de Latino (12.35-36); <i>violaverit<\/i> resuena con la <i>violentia<\/i> de Turno (Putnam).<\/li><\/ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "65": "b", "66": "b", "67": "b", "68": "b", "69": "b", "70": "b", "71": "b", "72": "b", "73": "b", "74": "b", "75": "b", "76": "b", "77": "b", "78": "b"}, "ul": {"27": "g", "38": "g", "39": "b", "44": "g", "51": "b", "60": "r", "61": "r", "62": "r", "63": "r", "64": "r", "65": "r", "66": "r", "67": "r", "70": "b"}, "lk": {}}, {"id": "a12-92-106", "ref": "12.92-106", "lines": ["Exin quae mediis ingenti adnixa columnae", "aedibus adstabat, validam vi corripit hastam,", "Actoris Aurunci spolium, quassatque trementem", "vociferans: Nunc, O numquam frustrata vocatus", "hasta meos, nunc tempus adest: te maximus Actor", "te Turni nunc dextra gerit. Da sternere corpus", "loricamque manu valida lacerare revulsam", "semiviri Phrygis et foedare in pulvere crinis", "vibratos calido ferro murraque madentis.", "His agitur furiis; totoque ardentis ab ore", "scintillae absistunt, oculis micat acribus ignis:", "mugitus veluti cum prima in proelia taurus", "terrificos ciet atque irasci in cornua temptat,", "arboris obnixus trunco, ventosque lacessit", "ictibus aut sparsa ad pugnam proludit harena."], "trans": "<div>En seguida arrebata brioso la ponderosa lanza que se alzaba en el centro de la casa arrimada a un enorme pilar.<\/div><div>Era despojo de Áctor, el aurunco.<\/div><div>Y la blande vibrándola mientras prorrumpe en gritos: «Lanza mía, que no has faltado nunca a mi llamada, ya ha llegado el momento, ya ha llegado.<\/div><div>Un día fue el gran Áctor, hoy es Turno quien te blande en su diestra.<\/div><div>Dame abatir el cuerpo y desgarrar y descuajar con mano potente la loriga de ese eunuco de Frigia y mancillar de polvo esos cabellos que se riza a hierro ardiente, rezumantes de mirra».<\/div><div>Tal es el frenesí que acucia su alma.<\/div><div>Todo su rostro centellea de ira, brotan llamas de sus feroces ojos, como el toro cuando se está aprestando a la pelea lanza horrendos mugidos y tantea su furia con sus cuernos topando contra el tronco de algún árbol y acomete a los vientos a derrotes y preludia la lucha con la arena que esparcen sus pezuñas por el aire.<\/div>", "gloss": "<div><b>Actor, -oris, m.<\/b>: Áctor<\/div><div><b>adsum, ades, adesse, adfuī<\/b>: estar presente, llegar<\/div><div><b>corpus, -oris, n.<\/b>: cuerpo<\/div><div><b>dextra, -ae, f.<\/b>: mano derecha<\/div><div><b>dō, dās, dare, dedī, datum<\/b>: dar (dā + inf.: concedeme)<\/div><div><b>gerō, -is, -ere, gessī, gestum<\/b>: llevar<\/div><div><b>māximus, -a, -um<\/b>: muy grande<\/div><div><b>nunc (adv.)<\/b>: ahora<\/div><div><b>sternō, -is, -ere, strāvī, strātum<\/b>: derribar<\/div><div><b>tempus, -oris, n.<\/b>: tiempo, momento<\/div><div><b>Turnus, -ī, m.<\/b>: Turno<\/div><div><b>tū, tuī<\/b>: tú, vos<\/div>", "notes": "<div><b>¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>Turno le habla a una lanza. ¿Qué le pide y cómo insulta a Eneas?<\/div><div>↔ 4.215-217 (Yarbas) y 9.614-620 (Numano); 12.107 (Eneas <i>maternis saevus in armis<\/i>: los dos del lado de lo irracional) (Putnam)<\/div><ul><li><i>Da sternere… lacerare… foedare<\/i>: imperativo + infinitivos.<\/li><li><i>te… te… gerit<\/i>: pronombre repetido; <i>gerit<\/i>, presente.<\/li><li><i>semiviri Phrygis<\/i>: genitivo de 3.ª (<i>Phryx, Phrygis<\/i>).<\/li><\/ul>", "hl": {}, "fx": {"25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b"}, "ul": {"12": "b", "44": "r", "45": "r", "56": "r", "57": "r", "58": "r", "62": "b", "68": "b"}, "lk": {}}, {"id": "a12-183-194", "ref": "12.183-194", "lines": ["cesserit Ausonio si fors victoria Turno,", "convenit Evandri victos discedere ad urbem,", "cedet Iulus agris, nec post arma ulla rebelles", "Aeneadae referent ferrove haec regna lacessent,", "sin nostrum adnuerit nobis Victoria Martem", "(ut potius reor et potius di numine firment),", "non ego nec Teucris Italos parere iubebo", "nec mihi regna peto: paribus se legibus ambae", "invictae gentes aeterna in foedera mittant.", "Sacra deosque dabo; socer arma Latinus habeto,", "imperium sollemne socer; mihi moenia Teucri", "constituent, urbique dabit Lavinia nomen."], "trans": "<div>«[…] Si acaso la victoria pasa al ausonio Turno, queda acordado aquí que los vencidos se retiren a la ciudad de Evandro.<\/div><div>Julo renunciará a estos campos y los hombres de Eneas ya nunca en rebeldía volverán a emprender guerra ninguna ni a hostigar estos reinos con sus armas.<\/div><div>Pero si accede la victoria a concedernos el favor de Marte —como creo más bien y ojalá lo confirmen con su favor los dioses— no ordenaré a los ítalos someterse a los teucros ni busco para mí ningún reino; que en iguales condiciones cada pueblo no sometido se una en alianza que no termine nunca.<\/div><div>Yo les daré mis ritos y mis dioses.<\/div><div>Mi suegro Latino mantendrá el poder de su espada, mantendrá el mando acostumbrado.<\/div><div>Los teucros me alzarán mi murada ciudad y Lavinia dará el nombre a esa ciudad».<\/div>", "gloss": "<div><b>arma, -ōrum, n. pl.<\/b>: armas<\/div><div><b>cōnstituō, -is, -ere, cōnstituī, cōnstitūtum<\/b>: construir, establecer<\/div><div><b>deus, -ī, m.<\/b>: dios<\/div><div><b>dō, dās, dare, dedī, datum<\/b>: dar<\/div><div><b>ego, meī<\/b>: yo<\/div><div><b>habeō, -ēs, -ēre, habuī, habitum<\/b>: tener<\/div><div><b>imperium, -iī, n.<\/b>: mando, poder<\/div><div><b>Italus, -ī, m.<\/b>: ítalo<\/div><div><b>iubeō, -ēs, -ēre, iussī, iussum<\/b>: ordenar<\/div><div><b>Latīnus, -ī, m.<\/b>: Latino<\/div><div><b>Lāvīnia, -ae, f.<\/b>: Lavinia<\/div><div><b>moenia, -ium, n. pl.<\/b>: murallas<\/div><div><b>nec<\/b>: y no, ni<\/div><div><b>nōmen, -inis, n.<\/b>: nombre<\/div><div><b>nōn<\/b>: no<\/div><div><b>pāreō, -ēs, -ēre, pāruī<\/b>: obedecer (+ dat.)<\/div><div><b>petō, -is, -ere, petīvī, petītum<\/b>: pedir, buscar<\/div><div><b>-que<\/b>: y<\/div><div><b>rēgnum, -ī, n.<\/b>: reino<\/div><div><b>sacra, -ōrum, n. pl.<\/b>: ritos sagrados<\/div><div><b>socer, -erī, m.<\/b>: suegro<\/div><div><b>sollemnis, -e<\/b>: solemne<\/div><div><b>Teucrī, -ōrum, m. pl.<\/b>: los teucros, los troyanos<\/div><div><b>urbs, urbis, f.<\/b>: ciudad<\/div>", "notes": "<div><b>¿Qué queda de Troya?<\/b><\/div><div>¿Qué promete Eneas si gana? Hacé la lista de lo que se queda cada pueblo.<\/div><div>↔ 12.829-840 (lo que se pacta en el cielo); 12.296 (roto el pacto, Mesapo llama a Aulestes «mejor víctima»: la violencia vuelve de los animales a los hombres) (Putnam)<\/div><ul><li><i>non ego nec Teucris Italos parere iubebo<\/i>: <i>ego<\/i>, pronombre; <i>Teucris<\/i>, dativo plural; <i>parere<\/i>, infinitivo que depende de <i>iubebo<\/i>.<\/li><li><i>socer arma Latinus habeto<\/i>: imperativo («que tenga»); <i>socer<\/i>, nominativo de 2.ª en <i>-er<\/i>.<\/li><li><i>mihi moenia Teucri / constituent<\/i>: <i>mihi<\/i>, dativo: «me construirán».<\/li><\/ul>", "hl": {}, "fx": {"40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b", "49": "b", "50": "b", "61": "b", "62": "b", "63": "b", "64": "b", "65": "b", "66": "b", "67": "b", "68": "b", "69": "b", "70": "b", "71": "b", "72": "b", "73": "b", "74": "b", "75": "b", "76": "b", "77": "b", "78": "b"}, "ul": {"11": "b", "51": "r", "52": "r", "53": "r", "54": "r", "55": "r", "56": "r", "57": "r", "58": "r", "59": "r", "60": "r", "75": "b", "78": "b"}, "lk": {}}, {"id": "a12-311-323", "ref": "12.311-323", "lines": ["At pius Aeneas dextram tendebat inermem", "nudato capite atque suos clamore vocabat:", "Quo ruitis? Quaeve ista repens discordia surgit?", "O cohibete iras! Ictum iam foedus et omnes", "compositae leges; mihi ius concurrere soli;", "me sinite atque auferte metus; ego foedera faxo", "firma manu; Turnum debent haec iam mihi sacra.", "Has inter voces, media inter talia verba", "ecce viro stridens alis adlapsa sagitta est", "incertum qua pulsa manu, quo turbine adacta,", "quis tantam Rutulis laudem, casusne deusne,", "adtulerit: pressa est insignis gloria facti.", "nec sese Aeneae iactavit vulnere quisquam."], "trans": "<div>En tanto el fiel Eneas, desnuda la cabeza, extendía la mano desarmada llamando a grandes voces a los suyos: «¿Dónde os precipitáis?<\/div><div>¿Qué discordia es ésta que ha surgido de repente?<\/div><div>Refrenad vuestra cólera.<\/div><div>El pacto está sellado y las cláusulas todas concertadas.<\/div><div>Sólo a mí me toca combatir.<\/div><div>Dejadme, desechad vuestro temor.<\/div><div>Yo haré firme este pacto con mi espada.<\/div><div>Por estos ritos sólo yo tengo ya derecho a Turno».<\/div><div>Mientras iba diciendo estas palabras de pronto le alcanza una saeta que desliza su vuelo zumbadora y da en él.<\/div><div>¿Qué mano la arrojó?<\/div><div>¿Quién le imprimió su giro de turbión?<\/div><div>¿Quién deparó a los rútulos tanto honor?<\/div><div>¿El azar?<\/div><div>¿Algún dios?<\/div><div>No se ha sabido.<\/div><div>La gloria de tan alta proeza quedó en secreto.<\/div><div>No hubo quien se ufanara de haber herido a Eneas.<\/div>", "gloss": "<div><b>atque<\/b>: y<\/div><div><b>auferō, aufers, auferre, abstulī, ablātum<\/b>: quitar<\/div><div><b>cohibeō, -ēs, -ēre, cohibuī, cohibitum<\/b>: contener<\/div><div><b>dēbeō, -ēs, -ēre, dēbuī, dēbitum<\/b>: deber<\/div><div><b>ego, meī<\/b>: yo<\/div><div><b>faxō<\/b>: haré (forma arcaica de faciō)<\/div><div><b>firmus, -a, -um<\/b>: firme<\/div><div><b>foedus, -eris, n.<\/b>: pacto<\/div><div><b>hic, haec, hoc<\/b>: este, esta, esto<\/div><div><b>iam (adv.)<\/b>: ya<\/div><div><b>īra, -ae, f.<\/b>: ira<\/div><div><b>manus, -ūs, f.<\/b>: mano<\/div><div><b>metus, -ūs, m.<\/b>: miedo<\/div><div><b>ō<\/b>: ¡oh!<\/div><div><b>quō (adv.)<\/b>: ¿adónde?<\/div><div><b>ruō, -is, -ere, ruī<\/b>: precipitarse<\/div><div><b>sacra, -ōrum, n. pl.<\/b>: ritos sagrados<\/div><div><b>sinō, -is, -ere, sīvī, situm<\/b>: dejar, permitir<\/div><div><b>Turnus, -ī, m.<\/b>: Turno<\/div>", "notes": "<div><b>¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>Eneas sin casco ni armas. ¿Qué les pide a los suyos y en nombre de qué? ¿Se sabe quién tiró la flecha?<\/div><div>↔ 12.938-952 (de la mano vacía a la espada); 1.148-153 (Neptuno <i>pietate gravem<\/i> calmando la tempestad de Juno) (Putnam)<\/div><ul><li><i>tendebat… vocabat<\/i>: imperfectos: la escena, antes de que llegue la flecha.<\/li><li><i>cohibete… sinite… auferte<\/i>: imperativos plurales.<\/li><li><i>Turnum debent haec i
