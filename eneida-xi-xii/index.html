am mihi sacra<\/i>: <i>haec<\/i> (demostrativo) va con <i>sacra<\/i> y es el sujeto; <i>mihi<\/i>, dativo. El verbo de la deuda, otra vez.<\/li><li>Última vez que el poema llama <i>pius<\/i> a Eneas (311): la mano tendida es el gesto de Turno suplicante al final (Putnam).<\/li><li>Turno, <i>fervidus<\/i> en 12.325: el adjetivo que el último verso le da a Eneas (951) (Putnam).<\/li><\/ul>", "hl": {}, "fx": {"12": "b", "13": "b", "19": "b", "20": "b", "21": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "42": "b", "43": "b", "44": "b", "45": "b", "46": "b", "47": "b", "48": "b"}, "ul": {"0": "r", "1": "r", "2": "r", "3": "r", "4": "r", "5": "r", "7": "b", "10": "b", "19": "r", "20": "r", "21": "r", "24": "b", "51": "b"}, "lk": {}}, {"id": "a12-430-440", "ref": "12.430-440", "lines": ["Ille avidus pugnae suras incluserat auro", "hinc atque hinc oditque moras hastamque coruscat.", "Postquam habilis lateri clipeus loricaque tergo est,", "Ascanium fusis circum complectitur armis", "summaque per galeam delibans oscula fatur:", "Disce, puer, virtutem ex me verumque laborem,", "fortunam ex aliis. Nunc te mea dextera bello", "defensum dabit et magna inter praemia ducet.", "Tu facito, mox cum matura adoleverit aetas,", "sis memor, et te animo repetentem exempla tuorum", "et pater Aeneas et avunculus excitet Hector."], "trans": "<div>Él, ávido de lucha se había puesto ya las grebas de oro, la izquierda y la derecha —le enoja la demora—, y ya blande la lanza.<\/div><div>Cuando ya se ha ajustado al costado el pavés y a su espalda el coselete, estrecha a Ascanio rodeándole con sus armados brazos.<\/div><div>Y rozándole apenas con los labios, a través del almete le habla así: «Aprende, hijo, de mí el valor y el esfuerzo verdadero, de los otros la fortuna.<\/div><div>Mi brazo te va a defender ahora combatiendo y te va a conducir a donde obtengas las grandes recompensas.<\/div><div>Tú, cuando den los años madurez a tu vida, no lo olvides, y siempre que en tu mente evoques el ejemplo de los tuyos, que acucien tu alma Eneas, tu padre, y tu tío Héctor».<\/div>", "gloss": "<div><b>alius, -a, -ud<\/b>: otro<\/div><div><b>discō, -is, -ere, didicī<\/b>: aprender<\/div><div><b>ego, meī<\/b>: yo<\/div><div><b>ex (prep. + abl.)<\/b>: de, desde<\/div><div><b>fortūna, -ae, f.<\/b>: suerte, fortuna<\/div><div><b>labor, -ōris, m.<\/b>: esfuerzo, trabajo<\/div><div><b>puer, -ī, m.<\/b>: niño, muchacho<\/div><div><b>-que<\/b>: y<\/div><div><b>vērus, -a, -um<\/b>: verdadero<\/div><div><b>virtūs, -ūtis, f.<\/b>: valor, virtud<\/div>", "notes": "<div><b>¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>¿Qué le enseña Eneas a su hijo y qué le dice que aprenda de otros?<\/div><div>↔ 6.851-853 (lo que Anquises le enseñó a Eneas).<\/div><ul><li><i>Disce, puer<\/i>: imperativo + vocativo.<\/li><li><i>ex me… ex aliis<\/i>: pronombre personal en ablativo con <i>ex<\/i>; falta el verbo en el segundo miembro (<i>disce<\/i>).<\/li><li><i>mea dextera… dabit<\/i>: posesivo + sustantivo de 1.ª; <i>facito<\/i>, otro imperativo.<\/li><li>Las palabras repiten las de Áyax a su hijo antes del suicidio (Sófocles, Áyax 550-551) (Putnam).<\/li><\/ul>", "hl": {}, "fx": {"31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b", "39": "b", "40": "b"}, "ul": {"31": "r", "32": "r", "33": "r", "34": "r", "35": "r", "36": "r", "37": "r", "38": "r", "39": "r", "40": "r", "59": "b"}, "lk": {}}, {"id": "a12-500-508", "ref": "12.500-508", "lines": ["Quis mihi nunc tot acerba deus, quis carmine caedes", "diversas obitumque ducum, quos aequore toto", "inque vicem nunc Turnus agit, nunc Troius heros,", "expediat? Tanton placuit concurrere motu,", "Iuppiter, aeterna gentis in pace futuras?", "Aeneas Rutulum Sucronem, ea prima ruentis", "pugna loco statuit Teucros, haud multa morantem", "excipit in latus et, qua fata celerrima, crudum", "transadigit costas et cratis pectoris ensem."], "trans": "<div>¿Qué dios me ayudaría a revelar ahora tantos horrores?<\/div><div>¿Qué otro a cantar el duelo de tan diversas trazas de muertes, el estrago de aquellos capitanes a los que acosa Turno por toda la llanura y a los que acorre ahora el caudillo troyano?<\/div><div>Pero ¿es que tú quisiste, Júpiter, que unos pueblos que habían de vivir en paz perpetua chocasen entre sí con tan feroz violencia?<\/div><div>Eneas acomete al rútulo Sucrón —combate que clavó por vez primera en su puesto a los teucros que huían— y sin que oponga resistencia mayor le asesta un golpe en el costado y por donde penetra más rápida la muerte, por la cota del pecho, le hunde la fría espada en las costillas.<\/div>", "gloss": "", "notes": "<div><b>¿Qué queda de Troya? · ¿<i>Pietas<\/i> o <i>furor<\/i>?<\/b><\/div><div>El narrador interrumpe la batalla y le habla a Júpiter. ¿Qué le reprocha?<\/div><div>↔ 1.11 (<i>tantaene animis caelestibus irae?<\/i>); 12.497-499 (justo antes, Eneas desata una <i>saevam nullo discrimine caedem<\/i>) (Putnam)<\/div><ul><li><i>Quis mihi… deus… expediat?<\/i>: <i>mihi<\/i>, dativo; <i>deus<\/i>, nominativo.<\/li><li><i>Iuppiter<\/i>: vocativo de 3.ª declinación.<\/li><li><i>placuit… concurrere<\/i>: perfecto + infinitivo; <i>nunc Turnus agit, nunc Troius heros<\/i>: presente.<\/li><\/ul>", "hl": {}, "fx": {}, "ul": {"8": "b", "24": "r", "25": "r", "26": "r", "27": "r", "28": "r", "29": "r", "30": "r", "31": "r", "32": "r", "33": "r", "49": "b"}, "lk": {}}, {"id": "a12-593-603", "ref": "12.593-603", "lines": ["Accidit haec fessis etiam fortuna Latinis,", "quae totam luctu concussit funditus urbem.", "Regina ut tectis venientem prospicit hostem,", "incessi muros, ignis ad tecta volare,", "nusquam acies contra Rutulas, nulla agmina Turni:", "infelix pugnae iuvenem in certamine credit", "exstinctum et, subito mentem turbata dolore,", "se causam clamat crimenque caputque malorum,", "multaque per maestum demens effata furorem", "purpureos moritura manu discindit amictus", "et nodum informis leti trabe nectit ab alta."], "trans": "<div>Todavía se añade al agobio latino otro infortunio que desde sus cimientos cuartea la ciudad entera en duelo.<\/div><div>La reina, cuando ve desde palacio que avanza el enemigo y ve asaltar los muros y remontar las llamas los tejados y no ve aparecer por parte alguna las tropas de los rútulos ni escuadrones de Turno, cree la infortunada que el guerrero ha caído en combate y perturbada el alma de súbita congoja grita que ella es la causa, la culpable, el origen de los males y enloquecida rompe en voces y voces de furia, en el frenesí de su dolor.<\/div><div>Decidida a morir desgarra con sus manos los purpúreos vestidos y cuelga de alta viga el nudo del cordel de horrenda muerte.<\/div>", "gloss": "", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>Amata cree algo falso y actúa en consecuencia. ¿Qué cree y de dónde lo saca?<\/div><div>↔ 4.584 ss. (Dido mira desde lo alto y ve partir las naves).<\/div><ul><li><i>prospicit… credit… clamat… discindit… nectit<\/i>: presentes.<\/li><li><i>incessi, volare<\/i>: infinitivos que dependen de <i>prospicit<\/i>.<\/li><li><i>se causam clamat<\/i>: <i>se<\/i>, pronombre en acusativo; <i>Regina<\/i>, nominativo de 1.ª.<\/li><li>Con el suicidio de Amata empieza el aislamiento final de Turno (Putnam).<\/li><\/ul>", "hl": {}, "fx": {}, "ul": {"9": "g", "11": "b", "42": "b", "43": "r", "44": "r", "45": "r", "46": "r", "47": "r", "48": "r", "56": "r"}, "lk": {}}, {"id": "a12-637-649", "ref": "12.637-649", "lines": ["Nam quid ago? Aut quae iam spondet Fortuna salutem?", "Vidi oculos ante ipse meos me voce vocantem", "Murranum, quo non superat mihi carior alter,", "oppetere ingentem atque ingenti volnere victum.", "Occidit infelix nostrum ne dedecus Ufens", "adspiceret; Teucri potiuntur corpore et armis.", "Exscindine domos (id rebus defuit unum)", "perpetiar, dextra nec Drancis dicta refellam?", "Terga dabo et Turnum fugientem haec terra videbit?", "Usque adeone mori miserum est? Vos O mihi Manes", "este boni, quoniam superis aversa voluntas!", "Sancta ad vos anima atque istius nescia culpae", "descendam, magnorum haud umquam indignus avorum."], "trans": "<div>«[…] ¿Qué puedo hacer ahora?<\/div><div>¿Qué fortuna me puede asegurar que salvaré la vida?<\/div><div>Yo mismo he visto caer ante mis ojos llamándome en su ayuda a mi amigo Murrano —ningún otro mejor me queda ya—, alma ingente, abatida por una ingente herida.<\/div><div>También Ufente, desventurado de él, cayó para no ver nuestra ignominia.<\/div><div>Su cuerpo y su armadura están en poder de los teucros.<\/div><div>¿Y yo voy a sufrir —no me falta ya otro oprobio— que sean arrasadas nuestras casas y no va a darle réplica mi espada a la mofa de Drances?<\/div><div>¿He de volver la espada y ha de ver esta tierra huir a Turno?<\/div><div>¿Tan triste es el morir?<\/div><div>¡Manes, sedme vosotros favorables ya que me son contrarios los dioses de la altura!<\/div><div>Bajaré a vuestro lado, yo alma limpia de mancha, ajena a tal reproche, ni una vez indigna de mis altos ascendientes».<\/div>", "gloss": "<div><b>adeō (adv.)<\/b>: tanto (usque adeō: hasta tal punto)<\/div><div><b>arma, -ōrum, n. pl.<\/b>: armas<\/div><div><b>bonus, -a, -um<\/b>: bueno, propicio<\/div><div><b>corpus, -oris, n.<\/b>: cuerpo<\/div><div><b>dō, dās, dare, dedī, datum<\/b>: dar (terga dare: huir)<\/div><div><b>ego, meī<\/b>: yo<\/div><div><b>et<\/b>: y<\/div><div><b>fugiēns, -entis<\/b>: que huye<\/div><div><b>hic, haec, hoc<\/b>: este, esta, esto<\/div><div><b>Mānēs, -ium, m. pl.<\/b>: los Manes, almas de los muertos<\/div><div><b>miser, -era, -erum<\/b>: desdichado<\/div><div><b>morior, morī, mortuus sum<\/b>: morir<\/div><div><b>-ne<\/b>: partícula interrogativa<\/div><div><b>ō<\/b>: ¡oh!<\/div><div><b>potior, potīrī, potītus sum<\/b>: apoderarse de (+ abl.)<\/div><div><b>sum, es, esse, fuī<\/b>: ser<\/div><div><b>tergum, -ī, n.<\/b>: espalda<\/div><div><b>terra, -ae, f.<\/b>: tierra<\/div><div><b>Teucrī, -ōrum, m. pl.<\/b>: los teucros, los troyanos<\/div><div><b>Turnus, -ī, m.<\/b>: Turno<\/div><div><b>usque (adv.)<\/b>: hasta<\/div><div><b>videō, -ēs, -ēre, vīdī, vīsum<\/b>: ver<\/div><div><b>vōs, vestrī<\/b>: ustedes<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>Turno se hace preguntas a sí mismo. ¿Cuál es la última? ¿Qué responde con lo que hace después?<\/div><div>↔ 1.94-101 (Eneas en la tempestad, que envidia a los que murieron en Troya); 12.666-668 (<i>pudor<\/i>, <i>insania<\/i>, <i>luctu<\/i>, <i>amor<\/i>, <i>conscia virtus<\/i>: Turno como figura trágica, con ecos de Orestes, 3.331 y 4.471) (Putnam)<\/div><ul><li><i>Vidi… me… vocantem<\/i>: <i>vidi<\/i>, perfecto 1.ª sg.; <i>me<\/i>, pronombre personal en acusativo.<\/li><li><i>Occidit infelix… Ufens<\/i>: otra vez <i>occidit<\/i>, perfecto.<\/li><li><i>Usque adeone mori miserum est?<\/i>: <i>mori<\/i>, infinitivo como sujeto de <i>est<\/i>. <i>Vos… este boni<\/i>: <i>este<\/i>, imperativo plural de <i>sum<\/i>.<\/li><\/ul>", "hl": {}, "fx": {"37": "b", "38": "b", "39": "b", "40": "b", "41": "b", "54": "b", "55": "b", "56": "b", "57": "b", "58": "b", "59": "b", "60": "b", "61": "b", "62": "b", "63": "b", "64": "b", "65": "b", "66": "b", "67": "b", "68": "b", "69": "b", "70": "b", "71": "b", "72": "b"}, "ul": {"8": "b", "9": "g", "15": "b", "30": "g", "39": "b", "62": "r", "63": "r", "64": "r", "65": "r", "66": "r"}, "lk": {}}, {"id": "a12-678-691", "ref": "12.678-691", "lines": ["Stat conferre manum Aeneae, stat quidquid acerbi est", "morte pati; neque me indecorem, germana, videbis", "amplius. Hunc, oro, sine me furere ante furorem.", "Dixit et e curru saltum dedit ocius arvis", "perque hostis, per tela ruit maestamque sororem", "deserit ac rapido cursu media agmina rumpit.", "Ac veluti montis saxum de vertice praeceps", "cum ruit avulsum vento, seu turbidus imber", "proluit aut annis solvit sublapsa vetustas;", "fertur in abruptum magno mons improbus actu", "exsultatque solo, silvas armenta virosque", "involvens secum: disiecta per agmina Turnus", "sic urbis ruit ad muros, ubi plurima fuso", "sanguine terra madet striduntque hastilibus aurae,"], "trans": "<div>«[…] Estoy resuelto a luchar con Eneas, decidido a sufrir toda cuanta amargura hay en la muerte.<\/div><div>No vas a ver, hermana, mi deshonor ya más.<\/div><div>Déjame que desahogue este furor, te lo pido, antes que llegue el trance.»<\/div><div>Dice y salta veloz del carro a la campiña y se arroja entre los enemigos a través de los dardos sin cuidar de su hermana; a la que deja entristecida, y en su alada carrera va rompiendo las filas enemigas.<\/div><div>Y lo mismo que cuando de la cumbre de un monte se derrumba de cabeza un peñasco que el viento ha descuajado, o que descalza torrencial aguacero, o desata minándolo el lapso de los años y aquel trozo de monte destructor rueda como un alud al precipicio y rebota en el suelo y va arrastrando árboles y rebaños y hombres en su carrera, así se precipita Turno entre los dispersos batallones derecho hacia los muros de la ciudad, a allí donde la tierra está más empapada de la sangre vertida, donde zumban las brisas heridas por las lanzas.<\/div>", "gloss": "<div><b>acerbus, -a, -um<\/b>: amargo (quidquid acerbī: todo lo amargo)<\/div><div><b>Aenēās, -ae, m.<\/b>: Eneas<\/div><div><b>amplius (adv.)<\/b>: más, en adelante<\/div><div><b>ante (prep. + acus.)<\/b>: antes de<\/div><div><b>arvum, -ī, n.<\/b>: campo<\/div><div><b>cōnferō, cōnfers, cōnferre, contulī, collātum<\/b>: juntar (manum cōnferre: combatir cuerpo a cuerpo)<\/div><div><b>currus, -ūs, m.<\/b>: carro<\/div><div><b>dēserō, -is, -ere, dēseruī, dēsertum<\/b>: abandonar<\/div><div><b>dīcō, -is, -ere, dīxī, dictum<\/b>: decir<\/div><div><b>dō, dās, dare, dedī, datum<\/b>: dar<\/div><div><b>ē (prep. + abl.)<\/b>: de, desde<\/div><div><b>ego, meī<\/b>: yo<\/div><div><b>et<\/b>: y<\/div><div><b>furō, -is, -ere<\/b>: enfurecerse, delirar<\/div><div><b>furor, -ōris, m.<\/b>: furor, locura<\/div><div><b>germāna, -ae, f.<\/b>: hermana<\/div><div><b>hic, haec, hoc<\/b>: este, esta, esto<\/div><div><b>hostis, -is, m.<\/b>: enemigo<\/div><div><b>indecōrus, -a, -um<\/b>: deshonrado<\/div><div><b>maestus, -a, -um<\/b>: triste<\/div><div><b>manus, -ūs, f.<\/b>: mano<\/div><div><b>mors, mortis, f.<\/b>: muerte<\/div><div><b>neque<\/b>: y no, ni<\/div><div><b>ōcius (adv.)<\/b>: rápidamente<\/div><div><b>ōrō, -ās, -āre, -āvī, -ātum<\/b>: rogar, pedir<\/div><div><b>patior, patī, passus sum<\/b>: sufrir, soportar<\/div><div><b>per (prep. + acus.)<\/b>: a través de<\/div><div><b>-que<\/b>: y<\/div><div><b>quisquis, quidquid<\/b>: todo lo que<\/div><div><b>ruō, -is, -ere, ruī<\/b>: precipitarse<\/div><div><b>saltus, -ūs, m.<\/b>: salto<\/div><div><b>sinō, -is, -ere, sīvī, situm<\/b>: dejar, permitir<\/div><div><b>soror, -ōris, f.<\/b>: hermana<\/div><div><b>stat (de stō)<\/b>: está decidido<\/div><div><b>sum, es, esse, fuī<\/b>: ser<\/div><div><b>tēlum, -ī, n.<\/b>: dardo, arma<\/div><div><b>videō, -ēs, -ēre, vīdī, vīsum<\/b>: ver<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>Turno decide, y enseguida el símil lo convierte en una roca que cae sin voluntad. ¿Decide o cae?<\/div><div>↔ 12.1-9 (el león del comienzo); 12.701-703 (Turno roca arrancada, Eneas montaña: Atos, Érice, <i>pater Appenninus<\/i>) (Putnam); 12.666-668 (<i>aestuat ingens…<\/i>, antes de la decisión) (Putnam)<\/div><ul><li><i>Stat conferre… stat… pati<\/i>: «está decidido» + infinitivos.<\/li><li><i>sine me furere<\/i>: imperativo + pronombre + infinitivo.<\/li><li><i>dedit<\/i>, perfecto; <i>ruit, deserit, rumpit<\/i>: presentes.<\/li><\/ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b", "32": "b", "33": "b", "34": "b", "35": "b", "36": "b", "37": "b", "38": "b"}, "ul": {"8": "b", "18": "r", "19": "r", "20": "r", "21": "r", "22": "r", "23": "g", "28": "g", "32": "b", "37": "b", "50": "b"}, "lk": {}}, {"id": "a12-819-828", "ref": "12.819-828", "lines": ["Illud te, nulla fati quod lege tenetur,", "pro Latio obtestor, pro maiestate tuorum:", "cum iam conubis pacem felicibus, esto,", "component, cum iam leges et foedera iungent,", "ne vetus indigenas nomen mutare Latinos", "neu Troas fieri iubeas Teucrosque vocari", "aut vocem mutare viros aut vertere vestem.", "Sit Latium, sint Albani per saecula reges,", "sit Romana potens Itala virtute propago:", "occidit, occideritque sinas cum nomine Troia."], "trans": "<div>«[…] Un favor no prohibido por decreto ninguno del destino te pido en bien del Lacio y la grandeza de los tuyos, tu pueblo.<\/div><div>Cuando asienten la paz con unas bodas de feliz augurio, que así sea, cuando queden unidos por leyes y tratados no ordenes que los hijos de este pueblo, los latinos, pierdan su antiguo nombre y se tornen troyanos o se les llame teucros o que cambien de lengua ni de atuendo.<\/div><div>Siga existiendo el Lacio y unos reyes albanos a través de los tiempos, que la estirpe romana cobre poder por el valor de Italia.<\/div><div>Cayó Troya.<\/div><div>Consiente que con ella caiga también su nombre».<\/div>", "gloss": "", "notes": "<div><b>¿Qué queda de Troya?<\/b><\/div><div>Juno pide que los latinos no cambien tres cosas. ¿Cuáles? ¿Qué dice eso sobre qué hace que un pueblo sea un pueblo?<\/div><div>↔ 12.829-840 (la respuesta de Júpiter) y 1.6 (<i>genus unde Latinum<\/i>); 12.577-579 (Eneas como Pirro, <i>ipse inter primos<\/i> = 2.479; <i>primosque trucidant<\/i> = 2.494: lo que queda de Troya es el papel del destructor) (Putnam); 12.236-237 (Juturna: <i>nos patria amissa dominis parere superbis / cogemur<\/i>) (Putnam)<\/div><ul><li><i>ne… mutare… neu… fieri… vocari… aut vocem mutare… aut vertere vestem<\/i>: cinco infinitivos que dependen de <i>iubeas<\/i>: todo lo que Juno no quiere que pase.<\/li><li><i>Sit Latium, sint Albani… reges<\/i>: «que exista el Lacio, que existan los reyes albanos»: el verbo <i>sum<\/i> en singular y en plural.<\/li><li><i>occidit, occideritque sinas cum nomine Troia<\/i>: <i>occidit<\/i> es perfecto de <i>occĭdo<\/i> («cayó, murió»); la forma es igual a la del presente. <i>Troia<\/i>, nominativo de 1.ª declinación.<\/li><li>Antes de este pedido Júpiter declara a Eneas <i>indiges<\/i>: también el héroe se italianiza (Putnam).<\/li><\/ul>", "hl": {}, "fx": {"58": "b", "59": "b", "60": "b", "61": "b", "62": "b", "63": "b"}, "ul": {"29": "b", "38": "r", "39": "r", "40": "r", "41": "r", "42": "r", "43": "r", "44": "r", "56": "b", "58": "r", "59": "r", "60": "r", "61": "r", "62": "r", "63": "r"}, "lk": {}}, {"id": "a12-829-840", "ref": "12.829-840", "lines": ["Olli subridens hominum rerumque repertor", "Es germana Iovis Saturnique altera proles:", "irarum tantos volvis sub pectore fluctus.", "Verum age et inceptum frustra submitte furorem", "do quod vis, et me victusque volensque remitto.", "Sermonem Ausonii patrium moresque tenebunt,", "utque est nomen erit; commixti corpore tantum", "subsident Teucri. Morem ritusque sacrorum", "adiciam faciamque omnis uno ore Latinos.", "Hinc genus Ausonio mixtum quod sanguine surget,", "supra homines, supra ire deos pietate videbis,", "nec gens ulla tuos aeque celebrabit honores."], "trans": "<div>Sonriéndole replica el que creó los hombres y las cosas: «Tú, verdadera hermana de Júpiter, tú que eres también hija de Saturno, desatas en el fondo de tu pecho tamañas olas de ira.<\/div><div>Depón ya ese rencor que en vano has concebido.<\/div><div>Te doy lo que deseas y me rindo vencido de buen grado.<\/div><div>Los ausonios conservarán la lengua y las costumbres de sus padres.<\/div><div>El mismo que ahora tienen ése será su nombre.<\/div><div>Los teucros mezclándose con ellos quedarán absorbidos por su raza.<\/div><div>Añadiré las leyes y los ritos sagrados de los teucros y haré que todos sean latinos de una lengua.<\/div><div>Surgirá de esta unión una raza mezclada con la sangre de Italia que verás aventaja a los hombres y aventaja a los dioses en piedad y no habrá pueblo alguno que le iguale en honrarte».<\/div>", "gloss": "<div><b>agō, -is, -ere, ēgī, āctum<\/b>: hacer (age: ¡vamos!)<\/div><div><b>alter, -era, -erum<\/b>: otro, segundo<\/div><div><b>dō, dās, dare, dedī, datum<\/b>: dar<\/div><div><b>ego, meī<\/b>: yo<\/div><div><b>et<\/b>: y<\/div><div><b>fluctus, -ūs, m.<\/b>: ola<\/div><div><b>frūstrā (adv.)<\/b>: en vano<\/div><div><b>furor, -ōris, m.<\/b>: furor, locura<\/div><div><b>germāna, -ae, f.<\/b>: hermana<\/div><div><b>inceptus, -a, -um<\/b>: comenzado<\/div><div><b>īra, -ae, f.<\/b>: ira<\/div><div><b>Iuppiter, Iovis, m.<\/b>: Júpiter<\/div><div><b>pectus, -oris, n.<\/b>: pecho<\/div><div><b>prōlēs, -is, f.<\/b>: descendencia, hija<\/div><div><b>-que<\/b>: y<\/div><div><b>quī, quae, quod<\/b>: que, el cual<\/div><div><b>remittō, -is, -ere, remīsī, remissum<\/b>: ceder, entregarse<\/div><div><b>Sāturnus, -ī, m.<\/b>: Saturno<\/div><div><b>submittō, -is, -ere, submīsī, submissum<\/b>: deponer<\/div><div><b>sub (prep. + abl.)<\/b>: bajo<\/div><div><b>sum, es, esse, fuī<\/b>: ser<\/div><div><b>tantus, -a, -um<\/b>: tan grande<\/div><div><b>vērum (conj.)<\/b>: pero<\/div><div><b>victus, -a, -um<\/b>: vencido<\/div><div><b>volēns, -entis<\/b>: de buena gana<\/div><div><b>volō, vīs, velle, voluī<\/b>: querer<\/div><div><b>volvō, -is, -ere, volvī, volūtum<\/b>: hacer rodar, agitar<\/div>", "notes": "<div><b>¿Qué queda de Troya?<\/b><\/div><div>Juno pidió tres cosas. ¿Cuáles concede Júpiter? ¿Qué les queda a los troyanos? Una sola palabra latina lo dice.<\/div><div>El final hace exactamente lo contrario de lo que este diálogo prometía: Eneas mata con ira (Putnam).<\/div><div>↔ 12.183-194 (lo que había prometido Eneas: <i>paribus legibus<\/i>).<\/div><ul><li><i>do quod vis<\/i>: «doy lo que querés»: <i>do<\/i>, presente 1.ª sg.; <i>vis<\/i>, presente 2.ª sg. de <i>volo<\/i>.<\/li><li><i>age… submitte<\/i>: imperativos: Júpiter le da órdenes a Juno mientras le concede todo.<\/li><li><i>commixti corpore tantum / subsident Teucri<\/i>: los troyanos ponen solo el cuerpo (<i>corpore<\/i>, ablativo de <i>corpus, corporis<\/i>, 3.ª declinación).<\/li><li>El pacto pide dos renuncias a la vez: los troyanos al nombre, Juno a la ira y al <i>furor<\/i>; la nueva raza superará en <i>pietas<\/i> a hombres y dioses (Putnam).<\/li><li><i>Romana potens Itala virtute propago<\/i> (827): lo que crece es lo itálico (Putnam).<\/li><\/ul>", "hl": {}, "fx": {"5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "13": "b", "14": "b", "15": "b", "16": "b", "17": "b", "18": "b", "19": "b", "20": "b", "21": "b", "22": "b", "23": "b", "24": "b", "25": "b", "26": "b", "27": "b", "28": "b", "29": "b", "30": "b", "31": "b"}, "ul": {"15": "b", "23": "b", "32": "r", "33": "r", "34": "r", "35": "r", "36": "r", "37": "r", "38": "r", "39": "r", "40": "r", "41": "r", "42": "r", "43": "r", "44": "r", "45": "r", "46": "b", "52": "r", "53": "r", "54": "r", "62": "r", "63": "r", "64": "r", "65": "r", "66": "r", "67": "r", "68": "r"}, "lk": {}}, {"id": "a12-872-884", "ref": "12.872-884", "lines": ["Quid nunc te tua, Turne, potest germana iuvare?", "Aut quid iam durae superat mihi? Qua tibi lucem", "arte morer? Talin possum me opponere monstro?", "Iam iam linquo acies. Ne me terrete timentem,", "obscenae volucres: alarum verbera nosco", "letalemque sonum, nec fallunt iussa superba", "magnanimi Iovis. Haec pro virginitate reponit?", "Quo vitam dedit aeternam? Cur mortis ademptast", "condicio? Possem tantos finire dolores", "nunc certe et misero fratri comes ire per umbras!", "Immortalis ego? Aut quicquam mihi dulce meorum", "te sine, frater, erit? O quae satis ima dehiscet", "terra mihi Manisque deam demittet ad imos?"], "trans": "<div>«¿Qué puede hacer tu hermana por ti ahora, Turno mío?<\/div><div>¿Qué me queda ya a mí después de sufrir tanto?<\/div><div>¿Con qué trazas prolongarte la vida?<\/div><div>¿Puedo enfrentarme a señal tan horrenda?<\/div><div>Ya abandono, ya, el campo de batalla.<\/div><div>No tratéis de aterrar mi alma medrosa, aves de odioso agüero.<\/div><div>Reconozco el restallo de esas alas con su estridor de muerte.<\/div><div>Ni tampoco se me ocultan las imperiosas órdenes del magnánimo Júpiter.<\/div><div>¿Esa es la recompensa por mi virginidad?<\/div><div>¿A qué me ha dado vida imperecedera?<\/div><div>¿A qué eximirme de la ley de la muerte?<\/div><div>Podría ahora a lo menos poner fin al peso de esta angustia y hacerle compañía a mi hermano a través de las sombras.<\/div><div>¡Yo inmortal!<\/div><div>¿Es que algo de mi vida sin ti va a serme dulce, hermano mío?<\/div><div>¿Qué tierra puede abrirse lo bastante profunda para mí y mandarme a mí, diosa, hasta lo más hondo de las sombras?»<\/div>", "gloss": "<div><b>aciēs, -ēī, f.<\/b>: línea de batalla<\/div><div><b>aeternus, -a, -um<\/b>: eterno<\/div><div><b>dō, dās, dare, dedī, datum<\/b>: dar<\/div><div><b>ego, meī<\/b>: yo<\/div><div><b>germāna, -ae, f.<\/b>: hermana<\/div><div><b>iam (adv.)<\/b>: ya<\/div><div><b>immortālis, -e<\/b>: inmortal<\/div><div><b>iuvō, -ās, -āre, iūvī, iūtum<\/b>: ayudar<\/div><div><b>linquō, -is, -ere, līquī<\/b>: dejar, abandonar<\/div><div><b>nunc (adv.)<\/b>: ahora<\/div><div><b>possum, potes, posse, potuī<\/b>: poder<\/div><div><b>quis, quid<\/b>: ¿quién?, ¿qué?<\/div><div><b>quō (adv.)<\/b>: ¿para qué?<\/div><div><b>tū, tuī<\/b>: tú, vos<\/div><div><b>Turnus, -ī, m.<\/b>: Turno<\/div><div><b>tuus, -a, -um<\/b>: tuyo<\/div><div><b>vīta, -ae, f.<\/b>: vida<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>Juturna es diosa y no puede morir. ¿Por qué eso es un castigo?<\/div><div>↔ 12.829-840 (la reconciliación que acaba de ocurrir arriba).<\/div><ul><li><i>potest… iuvare<\/i>, <i>possum me opponere<\/i>: <i>possum<\/i> + infinitivo.<\/li><li><i>Ne me terrete<\/i>: imperativo plural con <i>ne<\/i>: Juturna les habla a las aves de Júpiter.<\/li><li><i>Immortalis ego?<\/i>: pronombre personal sin verbo. <i>dedit<\/i>, perfecto; <i>ademptast<\/i> = <i>adempta est<\/i>.<\/li><li>Aislamiento progresivo de Turno: sin Amata, sin Juturna, con Júpiter <i>hostis<\/i> (895) (Putnam).<\/li><\/ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b", "24": "b", "25": "b", "26": "b", "27": "b", "49": "b", "50": "b", "51": "b", "52": "b", "70": "b", "71": "b"}, "ul": {"23": "b", "51": "g", "56": "b", "60": "b", "70": "r", "71": "r"}, "lk": {}}, {"id": "a12-905-918", "ref": "12.905-918", "lines": ["genua labant, gelidus concrevit frigore sanguis.", "Tum lapis ipse viri, vacuum per inane volutus,", "nec spatium evasit totum neque pertulit ictum.", "Ac velut in somnis, oculos ubi languida pressit", "nocte quies, nequiquam avidos extendere cursus", "velle videmur et in mediis conatibus aegri", "succidimus, non lingua valet, non corpore notae", "sufficiunt vires, nec vox aut verba sequuntur:", "sic Turno, quacumque viam virtute petivit,", "successum dea dira negat. Tum pectore sensus", "vertuntur varii. Rutulos aspectat et urbem", "cunctaturque metu letumque instare tremescit;", "nec quo se eripiat, nec qua vi tendat in hostem,", "nec currus usquam videt aurigamve sororem."], "trans": "<div>Le vacilan las rodillas.<\/div><div>Se le cuaja la sangre helada de pavor.<\/div><div>Y el pedrejón del héroe va girando a través del espacio vacío, pero no llega a recorrerlo todo ni le alcanza su tiro.<\/div><div>Y lo mismo que en sueños cuando en la noche oprime nuestros párpados un lánguido reposo, nos parece queremos apresurar ansiosos en vano ¡ay! la carrera y a mitad del espacio caemos fatigados, la lengua desfallece, las fuerzas habituales no logran sostenernos ni acude a nuestros labios la voz ni las palabras, así por donde intenta abrirse paso el coraje de Turno, se le opone la horrenda diosa.<\/div><div>Giran imágenes diversas por su mente.<\/div><div>Y mira hacia los rútulos y vuelve la vista a la ciudad.<\/div><div>Amedrentado vacila.<\/div><div>Le estremece el acoso apremiante de la lanza.<\/div><div>Y no ve a dónde huir ni con qué fuerzas acometer a su enemigo, ni da por sitio alguno con su carro ni con su hermana que lo guía.<\/div>", "gloss": "<div><b>concrēscō, -is, -ere, concrēvī<\/b>: coagularse<\/div><div><b>frīgus, -oris, n.<\/b>: frío<\/div><div><b>gelidus, -a, -um<\/b>: helado<\/div><div><b>genū, -ūs, n.<\/b>: rodilla<\/div><div><b>labō, -ās, -āre<\/b>: vacilar<\/div><div><b>sanguis, -inis, m.<\/b>: sangre<\/div>", "notes": "<div><b>¿Desde dónde nos hace mirar el final?<\/b><\/div><div>¿Quién es «nosotros» en este símil? ¿Por qué el narrador nos mete en el cuerpo de Turno justo antes de que muera?<\/div><div>↔ 12.1-9 (el Turno león del comienzo del libro); 12.919-923 (Eneas como catapulta contra murallas: otra vez destructor de ciudades) (Putnam); 12.749-755 (Eneas perro de caza «umbro», Turno ciervo, como Aquiles y Héctor en Il. 22.189-192) (Putnam)<\/div><ul><li><i>videmur… succidimus<\/i>: presentes en 1.ª plural: el único «nosotros» de un símil en todo el poema.<\/li><li><i>velle<\/i>: infinitivo de <i>volo<\/i>; <i>extendere<\/i>, infinitivo que depende de <i>velle<\/i>.<\/li><li><i>sic Turno… dea dira negat<\/i>: <i>Turno<\/i>, dativo de 2.ª declinación; <i>petivit<\/i>, perfecto; <i>negat<\/i>, presente.<\/li><li>El modelo (Il. 22.199-200) tiene dos figuras, perseguidor y perseguido; Virgilio deja solo a Turno y usa la única 1.ª plural del poema: «somos Turno» (Putnam).<\/li><\/ul>", "hl": {}, "fx": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b"}, "ul": {"3": "g", "4": "b", "5": "b", "7": "b", "19": "g", "29": "b", "35": "r", "36": "r", "37": "r", "38": "r", "39": "r", "40": "r", "41": "r", "42": "r", "61": "g", "67": "b"}, "lk": {}}, {"id": "a12-938-952", "ref": "12.938-952", "lines": ["ulterius ne tende odiis. Stetit acer in armis", "Aeneas, volvens oculos, dextramque repressit;", "et iam iamque magis cunctantem flectere sermo", "coeperat, infelix umero cum apparuit alto", "balteus et notis fulserunt cingula bullis", "Pallantis pueri, victum quem volnere Turnus", "straverat atque umeris inimicum insigne gerebat.", "Ille, oculis postquam saevi monimenta doloris", "exuviasque hausit, furiis accensus et ira", "terribilis, Tune hinc spoliis indute meorum", "eripiare mihi? Pallas te hoc volnere, Pallas", "immolat et poenam scelerato ex sanguine sumit,", "hoc dicens ferrum adverso sub pectore condit", "fervidus. Ast illi solvuntur frigore membra", "vitaque cum gemitu fugit indignata sub umbras."], "trans": "<div>[…] No lleves más lejos tu rencor».<\/div><div>Feroz en su armadura, revolviendo los ojos, en pie, frena Eneas su diestra.<\/div><div>Y ya el ruego de Turno comenzaba a ablandar su ánimo cada vez más vacilante, cuando aparece a sus ojos en lo alto del hombro del caído el tahalí infortunado y refulge en su cinto el oro de las bolas que le eran conocidas.<\/div><div>Era el tahalí del joven Palante, al que Turno logró herir y vencido postró en tierra.<\/div><div>Él lo ostentaba por divisa fatal sobre sus hombros.<\/div><div>Cuando Eneas fue hundiendo la mirada en el trofeo, en aquel memorial de su acerbo dolor, ardiendo en furia, en arrebato aterrador: «¿Y tú, vistiendo los despojos de aquel a quien yo amaba, te me vas a escapar de las manos?<\/div><div>Es Palante, Palante el que con esta herida va a inmolarte y se venga en tu sangre de tu crimen».<\/div><div>Prorrumpe.<\/div><div>Hirviendo en ira le hunde toda la espada en pleno pecho.<\/div><div>El frío de la muerte le relaja los miembros y su vida gimiendo huye indignada a lo hondo de las sombras.<\/div>", "gloss": "<div><b>ācer, ācris, ācre<\/b>: feroz<\/div><div><b>Aenēās, -ae, m.<\/b>: Eneas<\/div><div><b>arma, -ōrum, n. pl.<\/b>: armas<\/div><div><b>cum (prep. + abl.)<\/b>: con<\/div><div><b>dextra, -ae, f.<\/b>: mano derecha<\/div><div><b>et<\/b>: y<\/div><div><b>ex (prep. + abl.)<\/b>: de, desde<\/div><div><b>fugiō, -is, -ere, fūgī, fugitum<\/b>: huir<\/div><div><b>gemitus, -ūs, m.<\/b>: gemido<\/div><div><b>hic, haec, hoc<\/b>: este, esta, esto<\/div><div><b>immolō, -ās, -āre, -āvī, -ātum<\/b>: sacrificar, inmolar<\/div><div><b>in (prep. + abl.)<\/b>: en<\/div><div><b>indignātus, -a, -um<\/b>: indignado<\/div><div><b>oculus, -ī, m.<\/b>: ojo<\/div><div><b>Pallas, -antis, m.<\/b>: Palante<\/div><div><b>poena, -ae, f.<\/b>: castigo (poenam sūmere: cobrarse venganza)<\/div><div><b>-que<\/b>: y<\/div><div><b>reprimō, -is, -ere, repressī, repressum<\/b>: contener<\/div><div><b>sanguis, -inis, m.<\/b>: sangre<\/div><div><b>scelerātus, -a, -um<\/b>: criminal<\/div><div><b>stō, stās, stāre, stetī, statum<\/b>: detenerse, quedarse de pie<\/div><div><b>sub (prep. + acus.)<\/b>: bajo, hacia abajo<\/div><div><b>sūmō, -is, -ere, sūmpsī, sūmptum<\/b>: tomar<\/div><div><b>tū, tuī<\/b>: tú, vos<\/div><div><b>umbra, -ae, f.<\/b>: sombra<\/div><div><b>vīta, -ae, f.<\/b>: vida<\/div><div><b>volvō, -is, -ere, volvī, volūtum<\/b>: hacer girar<\/div><div><b>vulnus (volnus), -eris, n.<\/b>: herida<\/div>", "notes": "<div><b>¿Qué queda de Troya? · ¿<i>Pietas<\/i> o <i>furor<\/i>? · ¿Desde dónde nos hace mirar el final?<\/b><\/div><div>¿Quién mata a Turno: Eneas o Palante? Mirá quién es el sujeto de <i>immolat<\/i>. ¿Con qué palabras se describe a Eneas: las de la <i>pietas<\/i> o las del <i>furor<\/i>?<\/div><div>Las últimas palabras del poema son para el vencido, no para el vencedor (Putnam).<\/div><div>↔ 6.853 (<i>parcere subiectis<\/i>), 11.831 (Camila) y 1.5 (<i>dum conderet urbem<\/i>); 7.392 (<i>furiis accensas<\/i>: las madres latinas enloquecidas por Alecto) (Putnam); 10.519, 541 (los únicos otros <i>immolare<\/i>: los cautivos de Eneas tras la muerte de Palante) (Putnam); 1.92 (<i>solvuntur frigore membra<\/i>: Eneas en la tempestad) (Putnam); 1.33 (<i>Romanam condere gentem<\/i>) (Putnam)<\/div><ul><li><i>Stetit… repressit… apparuit… fulserunt<\/i>: perfectos, acciones puntuales; <i>gerebat<\/i>: imperfecto, lo que Turno venía haciendo desde la muerte de Palante.<\/li><li><i>Pallas te hoc volnere, Pallas / immolat<\/i>: <i>Pallas<\/i>, nominativo (3.ª decl.); <i>te<\/i>, pronombre personal en acusativo; <i>hoc volnere<\/i>, demostrativo + sustantivo de 3.ª en ablativo.<\/li><li><i>condit<\/i>: presente de <i>condo<\/i>, el verbo de «fundar» en 1.5. ¿<i>fugit<\/i>, en el último verso, es presente o perfecto? Mirá también <i>occidit<\/i> en 12.828.<\/li><li><i>ulterius ne tende odiis<\/i>: Cicerón define <i>odium<\/i> como <i>ira inveterata<\/i>, ira que se volvió crónica (Tusc. 4.21) (Putnam).<\/li><li><i>volvens oculos<\/i>, <i>cunctantem<\/i>: Eneas hereda la vacilación de Turno (12.916, 919) (Putnam).<\/li><li>El tahalí muestra a las Danaides matando a sus primos en la noche de bodas: emblema de guerra civil (Putnam).<\/li><li><i>indignata<\/i> retoma al Araxes indignado del último verso del escudo (8.728); <i>umbras<\/i> es la última palabra de la Égloga 1 y <i>fugit<\/i> evoca el <i>fugimus<\/i> de Melibeo (Ecl. 1.4) (Putnam).<\/li><li>Final sin cierre: ni juegos fúnebres (Ilíada 24) ni dioses que frenen la venganza (Odisea) ni boda con Lavinia (Putnam).<\/li><\/ul>", "hl": {}, "fx": {"4": "b", "5": "b", "6": "b", "7": "b", "8": "b", "9": "b", "10": "b", "11": "b", "12": "b", "64": "b", "65": "b", "66": "b", "67": "b", "68": "b", "69": "b", "70": "b", "71": "b", "72": "b", "73": "b", "74": "b", "75": "b", "89": "b", "90": "b", "91": "b", "92": "b", "93": "b", "94": "b", "95": "b"}, "ul": {"4": "g", "12": "g", "24": "g", "29": "g", "52": "r", "53": "r", "54": "r", "55": "r", "56": "r", "64": "r", "65": "r", "66": "r", "67": "r", "68": "r", "69": "r", "74": "b", "81": "b", "82": "r", "87": "b", "89": "r", "90": "r", "91": "r"   (function walk(node){

        const cls = ch.tagName === 'MARK' && /^c-[yrbg]$/.test(ch.className) ? ch.className : '';
        const ulCls = ch.tagName === 'U' && /^u-[yrbgk]( us-(double|wavy|dotted))?$/.test(ch.className) ? ch.className : '';

        if(ch.tagName === 'A'){ if(href) ch.setAttribute('href', href); else ch.replaceWith(...ch.childNodes); }

      if(!tok) return ''; if(/^\s+$/.test(tok)) return tok;
      const i = wi++; return `<span class="${wClass(i, t)}" data-i="${i}">${esc(tok)}</span>`;
    }).join('');
    return `<div class="l"><span class="vn">${showN ? num : ''}</span><span class="lt">${words}</span></div>`;
  }).join('');
}
const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
function sortGloss(h){
  const d = document.createElement('div'); d.innerHTML = h;
  const key = el => fold(el.textContent);
  const kids = [...d.children];
  if(kids.length === 1 && /^(UL|OL)$/.test(kids[0].tagName)){
    const ul = kids[0]; [...ul.children].sort((a, b) => key(a).localeCompare(key(b), 'es')).forEach(li => ul.appendChild(li)); return d.innerHTML;
  }
  const lines = []; let cur = document.createElement('div');
  [...d.childNodes].forEach(nd => {
    if(nd.nodeName === 'BR'){ lines.push(cur); cur = document.createElement('div'); }
    else if(/^(DIV|P)$/.test(nd.nodeName)){ if(cur.childNodes.length){ lines.push(cur); cur = document.createElement('div'); } const x = document.createElement('div'); x.append(...nd.childNodes); lines.push(x); }
    else cur.appendChild(nd);
  });
  if(cur.childNodes.length) lines.push(cur);
  const ok = lines.filter(l => key(l));
  if(ok.length < 2 || ok.some(l => l.querySelector('ul,ol,li'))) return h;
  ok.sort((a, b) => key(a).localeCompare(key(b), 'es'));
  return ok.map(l => `<div class="rg">${l.innerHTML}</div>`).join('');
}
function qLabel(h){
  const d = document.createElement('div'); d.innerHTML = h;
  const first = d.firstElementChild, el = first && /^(UL|OL)$/.test(first.tagName) ? first.querySelector('li') : first;
  const s = (el ? el.textContent : d.textContent).trim();
  const qs = s.match(/¿[^?]*\?/g) || [];
  if(qs.length > 1) return 'Preguntas';
  const q = qs[0] || (/\?$/.test(s) ? s : '');
  if(!q) return 'Para pensar';
  return q.length > 40 ? q.slice(0, 38) + '…?' : q;
}
/* datos */
const P = DATA.pasajes.map(t => Object.assign({}, t, {trans: clean(t.trans), gloss: clean(t.gloss), notes: clean(t.notes),
  hl: t.hl || {}, fx: t.fx || {}, ul: t.ul || {}, lk: Object.fromEntries(Object.entries(t.lk || {}).map(([k, v]) => [k, safeUrl(v)]).filter(x => x[1]))}));
let idx = Math.max(0, P.findIndex(t => t.id === store.get('pid', '')));
let fs = Math.max(16, Math.min(30, +store.get('fs', 21) || 21));
let tabSel = store.get('tab', 'gloss');
function applyPrefs(){
  const th = store.get('theme', '');
  if(th) document.body.dataset.rtheme = th; else delete document.body.dataset.rtheme;
  rq('rLat').style.setProperty('--rfs', fs + 'px');
}
function render(){
  const t = P[idx];
  rq('rClase').textContent = DATA.clase;
  rq('rRef').textContent = t.ref + ' ▾';
  rq('rRef').setAttribute('aria-label', `Pasaje ${t.ref}. Ver la lista de pasajes`);
  rq('rPos').textContent = (idx + 1) + '/' + P.length;
  rq('rPrev').disabled = idx === 0; rq('rNext').disabled = idx === P.length - 1;
  rq('rLat').innerHTML = latHtml(t);
  const tabs = [];
  if(hasText(t.gloss)) tabs.push(['gloss', 'Glosario']);
  if(hasText(t.trans)) tabs.push(['trans', 'Traducción']);
  if(hasText(t.notes)) tabs.push(['notes', qLabel(t.notes)]);
  rq('rPanel').hidden = !tabs.length;
  const k = tabs.some(x => x[0] === tabSel) ? tabSel : (tabs[0] || [])[0];
  rq('rTabs').innerHTML = tabs.map(([key, lbl]) => `<button role="tab" data-k="${key}" aria-selected="${key === k}" title="${esc(lbl)}">${esc(lbl)}</button>`).join('');
  rq('rTab').innerHTML = !k ? '' : k === 'gloss' ? sortGloss(t.gloss) : t[k];
}
function go(i){ i = Math.max(0, Math.min(P.length - 1, i)); if(i === idx) return; idx = i; store.set('pid', P[idx].id); render(); window.scrollTo(0, 0); }
function openSheet(){
  rq('rSheetLbl').textContent = DATA.clase + ' · ' + P.length + ' pasajes';
  rq('rList').innerHTML = P.map((t, j) => `<li><button data-j="${j}"${j === idx ? ' aria-current="true"' : ''}><span class="rr">${esc(t.ref)}</span><span class="rw" lang="la">${esc((t.lines[0] || '').split(/\s+/).slice(0, 6).join(' '))}</span></button></li>`).join('');
  rq('rSheet').hidden = false;
  const c = rq('rList').querySelector('[aria-current]'); if(c) c.scrollIntoView({block:'center'});
}
rq('rSel').remove();
rq('rPrev').onclick = () => go(idx - 1);
rq('rNext').onclick = () => go(idx + 1);
rq('rRef').onclick = openSheet;
rq('rSheetClose').onclick = () => { rq('rSheet').hidden = true; };
rq('rSheet').addEventListener('click', e => {
  if(e.target === e.currentTarget){ rq('rSheet').hidden = true; return; }
  const b = e.target.closest('[data-j]'); if(b){ rq('rSheet').hidden = true; go(+b.dataset.j); }
});
rq('rTabs').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if(!b) return; tabSel = b.dataset.k; store.set('tab', tabSel); render(); });
rq('rMinus').onclick = () => { fs = Math.max(16, fs - 2); store.set('fs', fs); applyPrefs(); };
rq('rPlus').onclick = () => { fs = Math.min(30, fs + 2); store.set('fs', fs); applyPrefs(); };
rq('rThemeBtn').onclick = () => { const dark = getComputedStyle(document.body).colorScheme.includes('dark'); store.set('theme', dark ? 'light' : 'dark'); applyPrefs(); };
const openUrl = u => { u = safeUrl(u); if(u){ try { window.open(u, '_blank', 'noopener'); } catch(e){} } };
rq('rTab').addEventListener('click', e => { const a = e.target.closest('a'); if(a){ e.preventDefault(); openUrl(a.getAttribute('href')); } });
rq('rLat').addEventListener('click', e => { const w = e.target.closest('.w.lk'); if(w && getSelection().isCollapsed) openUrl(P[idx].lk[w.dataset.i]); });
let sw = null;
rq('rLat').addEventListener('touchstart', e => { if(e.touches.length === 1) sw = {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()}; }, {passive:true});
rq('rLat').addEventListener('touchend', e => {
  if(!sw) return; const s = sw; sw = null; const p = e.changedTouches[0], dx = p.clientX - s.x, dy = p.clientY - s.y;
  if(Date.now() - s.t > 700 || Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) / 2 || !getSelection().isCollapsed) return;
  go(idx + (dx < 0 ? 1 : -1));
}, {passive:true});
window.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ rq('rSheet').hidden = true; return; }
  if(!rq('rSheet').hidden) return;
  if(e.key === 'ArrowRight') go(idx + 1); else if(e.key === 'ArrowLeft') go(idx - 1);
});
applyPrefs(); render();
</script>
